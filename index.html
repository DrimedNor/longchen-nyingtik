。给别人讲的时候头头是道， 到自己头上就忘光了。特别敏感、小气， 这也是人品问题。</p>\n<p>为什么这么讲呢？ 第一， 你懂戒律； 第二， 你是上师的弟子， 知道上师是如何在乎弟子们团结的。就一句话的事儿， 不就是空气嘛， 又没有伤害到你一丝一毫。对你的生活和前途， 也没有什么危害。因为一句话，就可以闹翻天，这也是人品问题。</p>\n<p>你们皈依的时候， 跟上师承诺要学佛， 功课也一一地请了， 但有的人回去以后就当成空气， 什么都不做。一遇到麻烦， 就回来了。得病了，医生没办法， 或者遇到其他难以解决的事情， 就出现了。其余的时候，上师求你，你都不来。这不是人品问题吗？</p>\n<p>这种只为自己活着， 不考虑别人的行为， 根本就不是修行。我们修行的宗旨是什么？ 就是利益他人， 要有利他菩提心。有一点点麻烦， 有一点点病痛的时候就来了， 健康、安逸的时候， 一切又都忘了。跟以前相比， 只是多了一个皈依的名义， 贪嗔痴慢疑一点都没有减弱， 什么改变都没有。这不是人品问题是什么呢？ 不做功课， 不在乎杀生， 不在乎因果， 什么都不在乎。只有别人问他“你有信仰吗？” 他才会取出个念珠来给别人亮一下说“噢， 我皈依过了。”仅此而已。这些都是人品问题。</p>\n<p>师兄们， 进入佛门以后， 要调整好自己的思维， 控制好自己的身口意，要有规矩地活着。不要像摆地摊一样， 什么都是乱七八糟的， 这样不太好。我并不是说在座各位都这样， 只是担心， 万一有这样的人怎么办？ 我们首先要把人做好，至少得说话算数，做事踏实，不要做没有信仰的人。</p>"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/修行人的行为规则", "title": "修行人的行为规则", "rel": "上师开示/4.如何修行/4.2 做一个靠谱的人/修行人的行为规则.md", "dir": "上师开示/4.如何修行/4.2 做一个靠谱的人", "is_index": false, "meta": {}, "html": "<p>2012 年 09 月开示</p>\n<p>今天我们讲一下修行人的礼仪， 就是如何做一个修行人 , 修行人的行为规则。</p>\n<p>行为规则， 有出家人的， 也有在家居士和密咒士的。有时候， 师兄们只要看到穿僧衣的人， 就以出家人的标准来衡量他的行为， 但人家未必是比丘。有时候呢， 用密咒士的行为规则来要求出家人， 也许他根本不是密咒士。密咒士是什么样的修行人呢？ 他们有妻子、有家室， 百分之六十的时间投入到修行中， 百分之四十用于寻找生活来源。密咒士不一定很有成就， 是比较低层的一种修行方法， 但他们也可以穿跟僧人差不多的衣服。区别在于， 僧人的衣服， 裙子上是有格子的， 密咒士的没有。</p>\n<p>出家人有三样东西不能离开， 就是他的上衣、戒裙， 还有比丘的袈裟， 这三样晚上不能离开住所。密咒士， 则没有什么不允许离开的， 因为没有这条戒律。本来按规矩来讲， 密咒士的衣服、裙子应该是白色的，披单也是， 因为白色是在家人的颜色。但到了藏地以后， 很多寺院都统一穿出家人的颜色，这样比较好看。</p>\n<h5>在家居士的行为要求</h5>\n<p>那么，在家居士有什么样的行为要求呢？</p>\n<p>首先， 态度必须很温和， 不能傲慢。如果摆出傲慢的姿态， 周围的人看到就会想， 你怎么修成这样啊！ 这样你的外在就会引起很多人对佛教不满意。所以， 要特别温和。性情温和、做事低调是咱们居士的主要特点。</p>\n<p>然后， 要把自己放在最低， 不能放在高处， 每时每刻都要把自己看成是最差的。一定要想， 别的修行人都比我好， 不能认为我比他们好，</p>\n<p>否则你的想法可能有一点点问题。特别是修行刚开始的时候， 这种发心 可能有一点错误。有的上师观察弟子的时候， 会听他说什么， 听他的真 心话。如果他说：“上师， 我很差， 但是在这群弟子里面我还是比较好的。”听到这句话， 这位上师永远都不会接受他。要真心， 不能虚伪， 自己认为很好， 却说我不好， 这样也不行。确实觉得我比别人差， 我要努力，</p>\n<p>以这种心态去说：“上师， 我可能是最差的！”如果这样， 这位上师有可能发现了一颗优秀修行人的苗子。</p>\n<p>再者， 不能大声吵闹， 不能说一些上不了台面的话， 比如： 讽刺人。还有， 思维要向上。是什么意思呢？ 必须得看优点， 看所有人的优点， 不要看缺点。为什么呢？ 你看别人的缺点， 相当于你也有了这个缺点。因为你想过它， 在思想上也经历了一次， 相当于他做的事情你也做了，划不来。你把对方想得多么坏， 必须把他的坏处想一遍。你说他怎么怎么坏， 其实等于你也做了这些。他是想了以后才有行动的， 而你是想了以后就说出来， 这也是行动。所以， 别人犯戒的时候， 去说别人的同时自己也造业了， 这样真的很划不来。有时候他是在没有办法的情况下，或者对自己有一点利益的情况下犯了个戒， 这是真的没办法， 但你却是在对自己没有任何好处的情况下造口业，真的没有必要！以上讲的是在家修行人的行为规则。</p>\n<h5>不要诋毁成就者</h5>\n<p>大家肯定想知道： 什么是最大的业？ 在这个地球上杀人、偷东西、打父母， 等等， 无恶不作， 这里面最严重的业是什么？ 最大的业就是诽谤成就者！ 同时杀掉全世界的、整个地球的生命和说一句成就者坏话相比， 后者的罪业要严重得多！ 普通人不知道哪一个是成就者， 哪一个不是， 也许人家表面上是疯疯癫癫的， 你看他的行为不太好， 但却是真正的修行人。所以， 释迦牟尼佛说过， 只有他和像他一样的弟子才有资格说别人的过失， 其他人没有这样的权利。只要想当他的弟子就不要说别人， 因为你看到的、听到的不一定是真实的情况。所以要注意， 一个小的事情就很容易造业， 而且是造很大的业。比如上师说某某大德不太好，他怎么怎么样， 上师讲， 你听就行了， 你不要跟着上师去说： “上师说过，他肯定是坏人！”不要这样讲。上师说这个也许有他的目的。</p>\n<p>给你们举几个例子。曾经有一个叫玉科喇嘛的成就者， 他是当时最好的大圆满上师， 是很多上师的上师， 也是咱们第四世多智钦仁波切的根本上师。他天天骂塔洛活佛的爸爸根桑尼玛， 天天骂：“什么上师， 这强盗， 遇到他的人都会下地狱的……”骂了以后， 一些跟随他的弟子，就到根桑尼玛住的地方， 把他赶走了。他们觉得他是魔， 赶走他是做了件好事儿。然后向上师禀报： “上师， 今天我们做了件好事儿。”上师问： “什么好事儿？”弟子答： “那个魔被我们赶走了。”上师接着问： “什么魔？”弟子说： “那个根桑尼玛。”上师听到这里， 一下子就东摸西摸，摸到什么就拿什么， 给那些弟子砸过去：“你们这些笨蛋， 谁让你们把他赶走的， 他走了我也没地方待了。”弟子们这下可害怕了， 赶紧跑过去把他请了回来。而根桑尼玛呢， 天天问： “今天玉科喇嘛骂我了吗？”一听说骂了就很高兴：“啊，好，这骂了我就没什么障碍了。”</p>\n<p>还有一个就是蒋扬钦哲和多钦哲的故事， 他们两位每次遇到都会吵架， 有时候甚至发生枪战。每次讲法的时候， 两位都一样， 蒋扬钦哲在接受弟子的时候会问：“你接触过那个多钦哲没有？”如果回答“接触了”， 那他就会说：“唉， 不要来不要来， 我救不了你。”然后多钦哲  也会问： “你接触过蒋扬钦哲没有？”如果回答“接触了”， 他就会说：  “唉， 我救不了你， 你已经下定地狱了， 不要来了， 你已经沾上那个魔了。”他们一直这样相互诋毁， 直到有一天早上， 蒋扬钦哲讲课的时候，在法 台上说： “师兄们， 我今天是不是更加庄严了？”大家都问： “为什么呢，上师？”他说： “那个多钦哲融入到我的心间了。”大家一听都紧张了，“啊， 那个魔怎么会融入到您的心间了？上师您是不是生病了？”他说：“不是， 他是我的化身， 现在化身融入到我的心间了， 其实我们俩是一个人。”这一说大家都后悔了， 上师说过多钦哲很多坏话， 他们也跟着讲了很多 坏话。接着他们问： “上师， 我们该怎么办呢？我们造下很多口业了。”蒋扬钦哲斥责道：“我什么时候让你们说的？ 我说是我自己有把握， 你有吗？什么时候让你们说的？活该！”</p>\n<p>所以， 大德们的这种游戏啊， 我们众生是看不明白的， 很团结的不一定团结， 很糟糕的也不一定不好。我们该做的是什么呢？ 就是普遍地尊重他们， 只要是个出家人， 只要是个修行人， 都要恭敬， 应该这样做。</p>\n<p>但是， 如果你要去求法， 就必须选择了， 这是释迦牟尼佛给我们的权利。你要跟随他， 要当他的弟子， 就必须得观察。成为弟子之前叫“观察”， 成为弟子之后不叫“观察”， 叫“邪见”！所以， 之前你要观察好，他的人品怎么样， 闻思怎么样， 修行怎么样， 口碑怎么样， 一定要看好，看好以后你再跟他学，不要盲目去学。这是我们需要做到的。</p>\n<h5>少沾那些坏习惯</h5>\n<p>还有， 只要是个修行人， 少沾烟、酒这些对修行不利的东西。少沾啊， 不能说完全不沾， 你还要生活、吃饭， 还要养孩子， 但是有办法的情况下尽量不要去沾。烟养活不了你， 酒也养活不了你， 但是对你的孩子、后代和你自己的身体都没有好处， 既然没有好处就尽量少沾。有时候在单位， 领导逼你， 必须得敬一杯， 不喝就是不给面子， 面临着下课，这种情况我也不说什么，没办法，但是除此之外呢，少沾。</p>\n<p>还有一些小的细节， 比如嗑瓜子， 瓜子可以吃， 但不要天天吃， 吃了耽误你的修行。吃瓜子好还是念咒好呢？ 你有吃瓜子的时间， 拿来念咒不是很好吗？ 搓麻将， 娱乐性的可以搓一下， 但不要天天泡在上面，泡在上面不是浪费你的人生吗？ 打麻将对你有好处吗？ 肯定没有！ 赌几个钱， 也许今天你赢了， 但明天又输回去了。也许你赌来赌去， 最后倾家荡产， 还培养出一些仇恨和执着。所以， 这些对修行没有意义的事情少沾。偶尔过节的时候， 为了大家开心， 亲戚们在一块儿， 搓搓麻将打个牌也没什么， 星期六、星期天出去看看电影也没什么， 但是如果天天泡在电影院里， 或者天天在麻将桌上， 你像个修行人吗？人家会说： “哎，这是龙洋活佛的弟子， 他修行呢， 他在麻将桌上修行， 二十四小时在那儿修行。”还有的天天泡在网上， 只要一动键盘他就来了， 就和中阴间的生命一样， 我怀疑他到底修行没有， 他有那么长的时间泡在网上， 晚上十二点到一点， 只要动个键盘他就来， 白天什么时候动键盘他都来。我们要维护我们的网站， 宣传自己上师的有些事迹， 这也是你的功德，但是我觉得应该适度一点。不要宣传来宣传去， 到最后不知道自己在说什么。全世界的文章下载下来贴在上面， 一直在那儿转帖别人的文章，转来转去， 这对你有什么用啊？ 也许他贴上去的那些东西自己都不知道是什么意思，似懂非懂的，就贴上去了。这些我觉得也是修行的障碍。</p>\n<p>反而上师让你们做什么的时候你们又不去做， 上师带你们去看电视，二十四小时让你看个够， 你们也许不看， 会觉得烦， 如果上师说长期打麻将， 这是修行的一部分， 你反而产生邪见不打， 人就这样成为了自己念头的傀儡，继续堕落，这些是像我一样的修行人应该注意的地方。</p>\n<h5>瑜伽士的境界</h5>\n<p>别的呢， 出家人该做什么？ 出家人事少， 对出家人有一点点研究是最好的。出家人是什么？ 他放弃了这个人间世俗的东西， 完全过另外的一种生活， 这叫出家人。根本不知道、不看、不听、不想这个世界， 放弃了世俗， 这个叫出家， 而不是说你没有女人， 穿一件有格子的衣服，但天天挣钱， 天天泡在武侯祠， 就叫出家人。真正的出家人是放下了一切的。但行为上的出家人呢， 就是穿有格子衣服的， 具有外在出家形象的出家人。他不能唱歌， 不能跳舞， 不能跟女人单独在一个地方说四句话，更不要说肢体接触了； 他不能摸金银财宝， 不能睡高档的床， 不能有高档的住宿； 他不能化妆， 不能用香水， 不能穿颜色很鲜艳的衣服； 走路不能蹦蹦跳跳， 不能哈哈大笑， 不能大声说话， 包括打喷嚏都得这样（上师示范动作） , 用手遮挡一下。这就是出家人的行为规则中的一小部分。</p>\n<p>除了这些以外， 所有的修行人都要遵守佛法的制度， 不能骗人， 不能杀人， 不能偷东西， 不能邪淫， 还有不能喝酒， 按道理来说是这样的。所有的修行人， 不管是密咒士， 还是出家人都应该遵守， 唯独瑜伽士例外。</p>\n<p>成就的瑜伽士， 他的身心随意自如， 可以自由控制身口意。这种人呢，什么戒律都超越了， 他在显现上会出现常人眼里觉得不符合佛规的一些行为， 但实际上他没做过。这个我们现在还搞不懂， 离我们很远， 只有到了那个境界才知道是怎么回事。</p>\n<p>关于这种修行人， 我给你们讲几个故事。我亲眼见过色达县的色拉阳智活佛， 他抽鼻烟， 烟吸进去以后全部从手指“吐”出来了。还有的人喝酒， 喝了很多， 最后手这么一放， 全部从手指滴出去了。这些就叫作成就者、瑜伽士， 所有世间的东西是障碍不了他们的。他们来去自如，不需要门， 也不需要窗户， 走就走了， 来就来了， 有点像神话， 但确实有。这种人才是什么都可以做的。但现在呢， 很多人模仿这种人， 他以为谁都不知道他是不是这种人。他为了娶老婆， 就以此为借口， 宣称： “我就是这种人！”然后就娶了老婆， 生了一大群的孩子。其实双运法里面讲了： “你是不是成就人， 看女人的肚子； 你是不是拙火定的成就者， 看你冬天穿的什么衣服。”成就者根本就没有人的那种感觉， 所以什么都障碍不了他。就像济公一样， 喝酒抽烟样样来， 我们看着他喝了，其实他没有喝。别的修行人都要注意因果， 唯独这种人是超越了因果的，其他没有超越的人， 自己很清楚自己是什么样的， 在清楚的情况下， 必须得敬畏因果，尊重因果。</p>\n<h5>实在一点，不要演戏</h5>\n<p>归根结底来讲， 就是不要伪装， 真实一点， 你是什么就是什么， 伪装只能哄自己， 没用！ 伪装的现象在我们一般的修行人当中还不太多，但在“上师们”里面太多了！ 举几个例子，有的“上师”， 每次吃饭的时候， 就在几百人当中去吃，就吃个馒头， 喝点水， 什么都不吃了。然后大家都问：“上师，你吃那么一点行吗？”他说： “我已经习惯了。”其实晚上他吃得饱饱的。他为什么要在几百人当中去吃呢？ 他没有房间吗？ 但是他硬要在人群当中去吃一下。还有的呢， 故意带着很多弟子， 晚上不睡觉， 然后很多人就宣传出去了：“哎呀， 我们的上师永远不睡觉！”你信吗？肉体投胎的人不睡觉行吗？你走了以后他睡得比谁都香。还有的人， 为了大家知道他在放生， 走过场， 讲排场， 就像演戏一样。需要这样吗？ 我们刚才说了， 修行人要实在一点， 不要太虚伪了。有些人演得太假了。但人就是这样， 众生福报小， 偏偏相信这种人。法王如意宝讲过，众生太可怜了，他们只能看表面。</p>\n<p>所以我刚才说了， 修行人不能不实在， 要实事求是， 你喜欢什么就喜欢什么， 你现在还没有断除念头就没有断除， 这个不可怕， 但是你没有断除却要装成断除的样子：“啊， 我没有什么执着了， 我没有什么贪念了。”其实有！那就不好了。</p>\n<p>所以师兄们，你们得冷静一点，实在一点，再实在一点！</p>"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/如何反观与自省", "title": "如何反观与自省", "rel": "上师开示/4.如何修行/4.2 做一个靠谱的人/如何反观与自省🔊.md", "dir": "上师开示/4.如何修行/4.2 做一个靠谱的人", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<p><span class=\"audio-name\">如何反观与自省</span><button class=\"play-btn\" data-audio=\"如何反观与自省.mp3\">▶ 播放</button></p>\n<p>师兄们， 我所讲到的六道的痛苦， 不是听了以后就像看电影一样，看完了就完了。大家回去后要思考： 如果自己到了那儿（地狱、饿鬼道、阿修罗道） 怎么办？ 自己的心态， 有没有去那里的危险？ 如果有的话，该怎么办？</p>\n<p><strong>晚上睡觉前， 你要反复地想： 今天做的一些事情， 有多少是对修行有利的， 有多少是对修行没有利的； 有多少是尊重因果的， 有多少是不尊重因果的。</strong></p>\n<p>如果今天想修行的方面多一些， 你应该为自己高兴， 可以给自己一个赞叹：“龙洋活佛， 你今天做得不错， 明天再接再厉（ 提醒自己）！”</p>\n<p>如果发现今天一天做的事情， 都让自己恶心， 那你得忏悔： “龙洋活佛， 你不应该这样做。作为一个人， 作为一个佛弟子， 口口声声说自己是有信仰的人， 不能不尊重因果， 不能没有道德的底线。明天开始，你要重新做人， 再也不犯这些错误， 甚至一些错误的念头也不要生起。”</p>\n<p>每天晚上，大家好好想一想，这就叫修行。</p>\n<p>生气的时候， 你要告诉自己：“龙洋活佛， 你错了！ 因为你跟别人不一样。没有信仰的人生气是正常的， 你生气是不应该的， 是丢人的。山着火了， 有灭火器； 心着火了， 有佛法啊！”要这样去想。心里生起特别大的贪念时， 你可以这样想：“我明明知道它不好的， 为什么要明知故犯呢？”这样想，这才叫修行。</p>\n<p>不然的话， 盲目地混日子， 过一天算一天。用自己的念头， 把死亡推得很遥远， 把金钱、地位、名声抓得很牢固。如果这样， 那你的修行就走偏了。口口声声说修行，但做的不是，这叫走火入魔。<strong>每天没有用的念头，没有价值的念头，堕入地狱的念头显现得太多，是修偏了。</strong></p>\n<p>师兄们修行的主要任务是什么？ 修行就是调整自己的心， 看自己<strong>。修行是为了修自己的心， 不是为了挑别人的毛病。</strong>不要说： 这个有毛病，那个有毛病……不要这样讲。自己有多少毛病， 自己怎么改， 这才是修行最需要做的。</p>\n<p>我们要祈祷上师， <strong>祈祷三宝： 让我有一颗清净的心， 总有一天， 我会生起一个对佛、对三宝永不退转的信心。现在可能还有一点差距， 但是将来我一定会做到。</strong></p>"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/新年第一天的发心", "title": "新年第一天的发心", "rel": "上师开示/4.如何修行/4.2 做一个靠谱的人/新年第一天的发心.md", "dir": "上师开示/4.如何修行/4.2 做一个靠谱的人", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<p>新年， 对修行人来讲是一个比较恐惧的时间。我们又少了一年， 离死神又近了一步。</p>\n<p>回顾过去的一年里， 作为一个修行人， 我们该做什么， 不该做什么，总结一下。如果我们不该做的事做多了， 新的一年一定要改正。多做应该做的事，这是我们修行人的过年方式。</p>\n<p>新年的第一天，大家要好好发心。</p>\n<p>只要发心正了，吃饭、睡觉、走路都是修行。发心不正，你坐在山洞里，闭关九年也没用。所以， 大家好好地发心。发心正， 我们所有的事情就有方向， 有目标。没有发心的行为和思维就没有方向， 到最后自己都不知道干的是什么，为谁干的。</p>\n<p>刚开始， 大家都认为是为了生存： 吃个饭， 穿件衣服， 找一栋房子。</p>\n<p>就为了这么简单的一个发心， 在这个世界上挣扎。最后， 吃的也有了，穿的也有了， 用的也有了， 什么都有了， 再进一步做些事， 就不知道是为谁干的了。</p>\n<p>但是我们有发心就不一样了。我们是为天下的父母去做事， 为天下的父母解脱去修行， 哪怕念一个咒， 动一个善念， 就是为了他们。有这样发心，我们活得就有价值。</p>\n<p>要是不会发心， 就想： 上师怎么发心， 我就这样发心； 十方菩萨怎么发心，我就这样发心；文殊菩萨怎么发心，我就这样发心。</p>"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/为什么要团结", "title": "为什么要团结", "rel": "上师开示/4.如何修行/4.3 戒律，决定你的成败/为什么要团结.md", "dir": "上师开示/4.如何修行/4.3 戒律，决定你的成败", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<p>一位上师给一个女弟子讲课。有一天， 他讲了修行的功德， 她听了很开心。又有一天他讲了不小心的话产生的罪业，她听了痛苦得要命。</p>\n<p>然后，上师问：“你有什么感觉啊？”</p>\n<p>她说：“上师我能说吗？”</p>\n<p>上师说：“可以说。”</p>\n<p>“你讲修行功德的时候， 上师你当然去净土啦！ 感觉连我都没问题去净土， 但是你讲罪业严重性的时候， 我是肯定去地狱， 但我怀疑上师你也有危险。”（注： 如果一个弟子破了三昧耶戒， 整个坛城都会被污染，会连累上师一起下地狱。）</p>\n<p>有条狗追一头猪， 要咬它。那个狗怕得要命， 然后它就绕着白塔跑啊跑啊。尾巴上有一个白灰， 一边跑一边摇尾巴， 尾巴上的白灰就打到了白塔上去了。因为这个福报， 它死后就到了天界当天人去了。它没有什么发心，也没有做什么。</p>\n<p>但是如果你诽谤一个成就人， 即使你修了一千年， 你的修行功德一刹那就会没了。</p>\n<p>我们在座的这些师兄， 肯定有去净土的。我们又不知道是哪一个，要是你得罪的这个师兄恰好是去净土的，怎么办？</p>\n<p>（ 众师兄： 所以要团结！） 对了！ 最要紧的是在座的各位都是金刚师兄弟，如果不团结，犯了戒，后果就更严重了。</p>\n<p>你们认为上师是去净土的， 因为他是我们的上师， 不一定哦！ 也许在座的里面， 你想不到的某个人， 他已经成佛了！你修行到一定的境界，你就知道了， 哪个修行好， 哪个修行不好， 哪个的罪业很重， 哪个罪业不太重， 有感觉的， 肯定有。我不是说我有这方面的感觉， 我没有， 但是优秀的修行人讲过他们有这方面的感觉。</p>\n<p>有一次法王如意宝见很多僧众， 就是那些修行人。他们排着队一个个走（ 过去拜见法王如意宝）。法王天天念那个加持的念诵仪轨， 但是当法王的手一放到一个人的头上， 念诵停止了， 一下子忘了一样， 一切都消失了。后来法王如意宝说： 那个僧人的修行相当不错。我经常念的仪轨都让我停顿了。</p>\n<p>你到山上去修， 修一阵子， 修的时间比较长一点， 不接触人。你一到人群里，你就会觉得人的味道太臭了，不要说业障的味道了！</p>\n<p>现在可能我到的城市太多了， 麻木了。以前根本不用别人说， 我们开车走到一个地方的时候， 我马上就知道附近有一个大城市。为什么？人的味道太猛了，真的！</p>\n<p>听他们说， 一生当中杀过很多孩子（ 指堕胎） 的人， 在上师的手下过的时候，就会有一种整个心灵的系统都要紊乱的感觉。</p>\n<p>很多人聚在一起， 如果说这种人多， 这个时候就会有一种乌云一样的东西， 在上空飘。这是优秀的修行人的感觉， 是他们讲出来的。我不喜欢听这些。</p>"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/入门的学处你做到了吗", "title": "入门的学处你做到了吗", "rel": "上师开示/4.如何修行/4.3 戒律，决定你的成败/入门的学处你做到了吗.md", "dir": "上师开示/4.如何修行/4.3 戒律，决定你的成败", "is_index": false, "meta": {}, "html": "<p>2012 年 11 月开示</p>\n<p>今天晚上我们讲一下皈依的戒律。其实皈依戒的细节有很多， 现在只是粗略地讲一下。在场的都是皈依弟子了，大概知道一下最好。</p>\n<p>最主要的三条要求</p>\n<p>第一条， 不杀生， 不能故意杀害生命。第一条， 不杀生， 不能故意杀害生命。有计划和行动的杀害行为， 才叫杀生， 无意当中杀死的不算。</p>\n<p>六、戒律，决定你的成败</p>\n<p>比丘戒所说的杀生， 对象是指人， 而皈依戒所说的杀生， 对象包括一切有生命的动物。因此， 吃饭、走路、坐车的时候， 都要注意。比如， 吃饭的时候就很容易造成杀生。为了吃一顿好的， 就点一些鲜活的动物，使它们因你而被杀， 这是千万不能做的！ 你们想想， 自己的生命有多么尊贵，如果别人要把你杀来吃，你的心情会怎么样？虽然动物的大小不同，但感受是一样的。它们也会痛苦， 也会恐惧， 也会生气。它们会想很多，前因后果都会想：“我什么时候得罪他了？ 我做错了什么？ 这个地球是大家共同的家园， 我没有占过他的地盘， 也没有用过他的任何财产， 他为什么仗着实力来杀我？”就这样， 仇恨在它心里产生了。杀了它以后，你会产生一个很大的业障， 同时这个动物也会堕入地狱， 因为它是在仇恨中断气的。所有在仇恨中断气的生命都会堕入地狱。这一切都是你造成的，要注意！</p>\n<p>第二条， 遇到生命危险也不能放弃信仰。你的信仰是什么？ 佛教。 粗略地想， 大家都会认为：“遇到生命危险也不会放弃自己的信仰。”但有时候很难做到， 不要说生命危险， 就是出现一个利益上的冲突， 你 都会放弃。举个例子， 你的上师是龙洋活佛， 你的信仰是佛教， 在单位上，假如一个不信佛的领导来问你： “你信佛吗？”你肯定会说： “我不信！”这就是放弃了自己的信仰， 就这么简单。再比如， 你去一个比较隆重的 场合， 受到大家关注的时候， 你知道他们对你信佛有负面看法， 当他们 问你： “你信佛吗？”你有可能说： “我不信！”这就是利益导致的问题。所以， 师兄们要仔细想想， 你真的能做到吗？ 每一次皈依的时候， 我都会很认真地问：“你能做到吗？ ”你也会很干脆地回答：“我能， 我能做到。”说这句话之前， 你考虑过你的回答没有？ 如果有一天， 一群人 要杀你， 比如说外道， 对你说： “如果你放弃佛教， 加入我们， 就不杀你。</p>\n<p>如果不放弃， 就杀了你。”真的要杀你的话， 你会怎么选择？ 你有可能说：“好好好。”不仅舍弃了佛教， 还会加入别的宗教。像我这样的就有可能这么做， 我很了解自己。如果生在战争年代， 我肯定是个叛徒，因为我很胆小。所以， 每时每刻都要提醒自己： 必须有一个坚定的信心，我绝对不做这种事情！就像汽车要加油一样， 我的信心每一天都要加油。上师问你会不会放弃自己信仰的时候， 你说过“我不会”， 你也想过“我不会”， 但如果从此以后就忘了， 那就没用了。每天都要想到： 我是向上师宣誓过的， 我不会放弃自己的信仰， 这一点我一定要做到！ 不过是死一次嘛， 人反正是要死的， 死的方法不同而已。当然， 并不是每个弟子都会遇到这样的情况，但随时都要有准备。</p>\n<p>第三条， 恭敬僧众。你既然皈依了僧宝， 那么所有穿僧衣的， 不管是汉传、南传， 还是藏传的僧人， 见到了都要恭敬。你不一定要去供养他、伺候他， 但是心里要恭敬他。不要以不太好的感觉去看这些僧人， 这对你自己不好。也不要用不太好的语言去说他们， 这样会折损你的福报。</p>\n<p>他们穿上这身衣服， 就代表了三宝。他们的内心怎么样， 是他们自己的问题， 但外在就是佛的形象。我们至少得尊重这身衣服。所以， 不能骂他们， 不能打他们， 也不能坐在他们的前面， 应该恭敬他们， 这是我们皈依的戒律。恭敬佛，就要恭敬经书，包括黄颜色都要恭敬，这是佛的颜色，不能随意去踩， 也不能随意去坐。文字是佛的化身， 只要有文字的东西，不管是汉字还是藏文， 都不能用在不干净的地方。因为这些文字， 我们懂得了佛学知识，没有文字，我们无法知道这一切。</p>\n<p>我们的“助伴”是谁？ 是僧众。皈依的那一天， 你说过：“我不会信外道。”外道， 我们不评论他好与不好， 这个跟我们没有关系。但是，我们的戒律是什么？ 最好不要和外道的人接触， 不在一起吃饭， 不住一个房间， 不和他们多说话。戒律是这样规定的， 但现在要做到真的很难，谁知道哪个是外道？ 其实除了佛教以外， 都是外道， 我们的周围， 全是外道， 没办法不跟他们说话。只要我们不去信仰， 不相信他们的话， 就行了。千万不能有一点点觉得：“哦， 他说的有道理。”这么一想， 就犯戒了。</p>\n<p>当你去一个地方， 路过经堂， 或者看见佛像时， 至少得作个恭敬的姿势， 因为它们是佛的代表。你皈依了佛， 如果不恭敬他的代表， 等于不恭敬佛。所以， 至少心里要恭敬， 要低个头， 这是佛弟子须要做到的。</p>\n<p>有的人理解得很片面：“信佛的人不是讲平等吗？ 应该全都一样恭敬， 不能有分别念嘛！”因此到处跑， 见到穿僧衣的人就拜， 见到穿僧衣的人就供养， 见到穿僧衣的人就皈依。其实他理解错了， 恭敬不等于必须当他的弟子， 你得考虑自己的容量。每一位大德都很好， 每一种法门也都很好， 但是你自己的容量、时间和实力够不够？ 要考虑好， 算个账， 不要漫无边际、像疯狗一样到处乱跑。很多弟子认为， 有一百位上师， 很了不得。但你有没有想过， 这一百位上师是怎么皈依的？ 藏传佛教的皈依是四皈依， 把皈依上师放在第一位。想一想， 皈依第一位上师的时候， 你有没有说过“我把身口意供养给你”， 也就是送给你， 靠你了。说了这个话， 你再去皈依第二位上师的时候， 是舍弃了前面的， 还是欺骗了后面的？ 两种都不对吧？ 上师再多， 如果舍弃了一位， 就相当于把所有的上师都舍弃了。舍弃一位上师， 还会有第二位上师吗？ 欺骗下一位上师对你有好处吗？ 只会给你带来业障！ 简单分析就知道不对， 为什么还要找那么多上师呢？ 你是不是有点不信任前面的上师？ 你可能下意识有一点点想法， 认为： 我还需要一个上师， 可能这个上师比那个还要好。这个时候，你就放弃了上师，甚至有可能放弃了信仰。</p>\n<p>藏传佛教中， 有的大德有多位上师， 这是为什么呢？ 有可能是在自己没有想到的情况下， 上师让他们这样做的。比如， 我推荐哪个弟子去皈依某位上师， 他本身没有这个想法， 但是为了尊重我， 为了听上师的话而去皈依。还有一种情况， 因为要研究佛学， 所以每位上师的教言都得了解， 如果没皈依， 上师不会传， 不会全部告诉我。带着这种发心去皈依的， 和你一样吗？ 你研究了什么？ 你研究佛学， 有什么著作， 别人听说过没有？ 那些有一百五十位上师的汉族弟子， 没听说他写过一本对佛教有用的书。这种弟子， 从来没有听说过他请示了前一位上师：“我要去哪里？ ”大德们是怎么做的？ 是得到开许以后才去的。我们用常理来分析一下， 就算在一所一般的学校， 你要换学校， 需不需要跟学校的领导和老师说一声？ 如果不说就换， 你的行为算什么？ 你上学的时候，同时上一百个学校， 行吗？ 有的人说：“上师越多越好。”在学校里，专心跟着一位对我们有帮助的老师学习好， 还是跟一百位老师， 今天听一位讲， 明天听另一位讲， 这样好吗？ 每位老师的思维方法不同， 角度也不一样， 会把你搞得晕头转向。这些他们为什么不考虑呢？ 只有一个原因， 就是他们没有把修行当成一回事儿。就是做一个样子， 搞得懂也可以， 搞不懂也可以。但他上学的时候， 因为直接牵涉到后面的饭碗问题， 他会很认真。现在很多人目光短浅， 只看这一世， 不管下一世去哪儿。就像现在的生态环境一样， 所有的矿产全部被挖光。这一世吃饱就行，下一代怎么样我不管，千万不要这样！</p>\n<p>皈依的这些戒律， 小的细节也一定要注意。比如， 你不听上师的话可能就会破戒。上师的语言代表法， 你放弃了上师的语言， 就等于放弃了佛法。我们经常想：“哎呀， 我修了两年、三年、四年， 但仍然没有进步， 还是跟以前一样， 为什么呢？”就是因为这些。你根本就没有做好，能有进步吗？ 你一边烧火， 一边倒水， 当然不可能有进步。所以， 这些戒律千万要注意。</p>\n<p>烟和酒的危害</p>\n<p>再说说关于酒的问题。无论在什么戒律下， 酒都是不能喝的。为什么呢？ 释迦牟尼佛亲口说过：“只要哪一个佛弟子喝一滴酒， 我不是他的上师， 他不是我的弟子。”你喝酒， 那你根本就不是佛门弟子。你自己认为是， 但其实不是， 佛陀早就把你开除了。唯独在密法坛城里， 需要用一些特殊原料的情况下， 你才可以喝。比如， 接受荟供品时， 不是为了喝酒而喝， 是为了成就； 而你自己喝酒时， 是为了满足欲望， 两者的发心完全不一样。有一些师兄会说： “为了工作， 没办法不喝酒呀。”这样的理由说了很多。这个时候我心里想：“你不是说过， 付出生命代价也不会放弃信仰吗， 怎么因为一 口酒， 就放弃了？ ”但他似乎觉得是</p>\n<p>很大的理由， 跟我说： “上师， 我要工作呀， 领导叫我喝酒， 我没办法！”这个不是放弃信仰吗？ 释迦牟尼佛的话都放弃了， 还有什么不能放弃的 呢？ 但是我也不好说什么， 只能说：“哎呀， 这个确实有点困难， 你要生存的嘛。”其实按道理来讲， 进入了佛门， 哪怕你的头掉下来也不能 喝酒。在汉族弟子中， 这类说法很多的。如果“没办法”的时候， 什么 都可以做的话，那还守什么戒呢？</p>\n<p>还有， 不要抽烟。烟是魔加持过的东西， 不仅会污染坛城， 还会污染气脉。烟抽多了， 你的所有气脉都堵塞了， 到时候上师想超度都超度不了。烟熏过的地方， 你自己也许看不见， 不知道污染了多少尊佛， 罪过是不可想象的。据一些大德用神通观察， 抽一支烟， 等于杀死了十八个人。对于密法弟子而言， 你的整个身体就是一个密宗的坛城， 文武百尊就在里面，你却用烟来熏他们，这是非常不应该的！</p>\n<p>皈依戒里面没有突出地讲烟和酒， 可能是觉得没有必要专门讲。烟不能抽、酒不能喝都不懂， 那算什么佛弟子？ 师兄们要细心地考虑， 如果没有做到的话， 要忏悔！ 念百字明， 以悔改的心去忏悔。皈依以后，就不能像骗人那样， 今天说“我错了， 我错了”， 第二天又犯， 然后又说“我错了， 我错了”， 第三天又犯了。这不是跟小孩做游戏一样吗？其实， 真正守戒律的弟子不会有什么外道朋友， 但我怀疑， 有些佛弟子，只要外道的弟子能给他带来一些利润， 就会成为朋友。不用很多， 一个月一万块钱， 很可能就成为朋友了。仔细想想啊， 师兄们， 我们对得起佛吗？ 我们口口声声说自己是佛的弟子， 皈依了佛， 宣誓过， 但是做到了吗？</p>"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/如何看待      他人的 “缺点 ”", "title": "如何看待      他人的 “缺点 ”", "rel": "上师开示/4.如何修行/4.3 戒律，决定你的成败/如何看待      他人的 “缺点 ”.md", "dir": "上师开示/4.如何修行/4.3 戒律，决定你的成败", "is_index": false, "meta": {}, "html": "<p>2010 年 11 月开示</p>\n<p>我们生活在人间， 没有一个人是没有缺点的， 如果没有缺点， 那就是佛， 不会在人间。要是在人间的话， 就是为了度化众生而来的。只要是众生， 肯定就有缺点， 缺点重重才会在六道中轮回。即便他有一点点优点， 也值得我们学习， 值得我们惊叹： “作为众生， 他们竟然有优点！”哪怕只有一两个优点，也要看成是了不起的事情。</p>\n<p>有缺点是正常的， 不要觉得“太吓人了， 咋会这样呢？”不能这样去看， 这是在人间。释迦牟尼佛说过， 在人间连针尖那么大的幸福都没有。众生都是在痛苦中挣扎。如果没有缺点，又怎么会有痛苦呢？</p>\n<p>所以多想想师兄们的优点， 比如他哪一天做了一些出色的事， 讲了一些动人的话， 哪个地方师兄弟们团结搞得好， 如何关心自己的师兄弟，如何恭敬上师， 如何努力地做功课。发现他有优点， 要觉得这才是真正稀有难得的：“太了不起了，怎么这么好？”</p>\n<p>末法时代， 优点多的人很少， 缺点肯定谁都有。要是众生没有缺点，我这种装出来的活佛不算， 那些真正的活佛到这里来干什么呢？ 正因为众生有缺点，他们才来纠正，引导众生慢慢修行成佛。</p>\n<p>所以， 有缺点不奇怪， 不要把它当成一个大事去宣扬：“哎呀， 昨天又出了什么事， 前天谁又做了什么， 大前天又怎么怎么样了。”不要这样去讲。众生有缺点是理所当然的， 没有什么大不了。如果这样去想，我们的队伍就会成为一个很优秀的修行队伍， 而且是一个很团结、很温暖的大家庭。修行要开心、要温暖、要包容、要团结， 没有这个基础根本就修不下去。所以， 大家好好地去修， 要多想想金刚师兄的优点， 不要去想缺点。</p>\n<p>我们的修行团体是以虹身命名的。虹身是什么概念？ 名字很伟大，我们要对得起这个名字。即使今生成不了虹身， 来世接着修， 总有一天我要修成虹身！ 要有这样的决心。为什么要虹身成就？ 因为你们的上师是持明虹身金刚， 他培养出来的汉人也是大迁转虹身成就者， 你们为什么不是呢？ 我用这个缘起来命名， 我的弟子千万不要破坏这个缘起。我希望我的弟子里面， 至少有二十五个人成就虹身， 那不是很好吗？真的！</p>"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/戒律，修行人最大的要害", "title": "戒律，修行人最大的要害", "rel": "上师开示/4.如何修行/4.3 戒律，决定你的成败/戒律，修行人最大的要害.md", "dir": "上师开示/4.如何修行/4.3 戒律，决定你的成败", "is_index": false, "meta": {}, "html": "<p>2012 年 09 月开示</p>\n<p>没有戒律，根本无法修行</p>\n<p>今天我们讲一下师兄们的戒律， 我讲了很多次， 有的人认为讲这些对修行没什么帮助，但是没有这些根本就无法修行。</p>\n<p>有的人认为， 虽然我不会打枪、不会开车，也不会开飞机， 但我能当军人， 似乎有这种感觉， 这可能吗？同理， 没有修行人的规则和制度，你根本就不称其为修行人。有的“上师”， 动不动就讲个大圆满或者什么菩提心， 再讲一些什么法的核心， 却忽略了一些最基本的程序。所以，不要以为天天讲的戒律， 只是一些做人的道理， 对修行有用吗？ 不要这样想。首先， 人都做不好， 根本不可能成佛。人都做不好， 怎么能成佛呢？</p>\n<p>比如， 我们经常吃的大蒜， 它的气味就算用各种香料掩盖， 也是盖不住的。人的本质跟这个一样，如果人品不好，什么都做不成。</p>\n<p>所以， 修行人最大的要害就是“戒律”。谁的人品好， 他的戒律就会守得严严的， 不会破犯， 因为他说话算数， 说到做到。他不是骗子，不会撒谎， 所以能成为一个很优秀的修行人。如果你的人品不好， 说得再好听， 在上师面前表演得再好看， 充其量就是个演员而已， 根本就不是什么修行人。所以，首先我们得把刚才说的戒律把持好。</p>\n<p>戒律是什么？戒律是修行人的生命， 没有戒律就像一个没有命的人，那是什么？是尸体， 不是人。从没有戒律的那一天开始， 你就不是修行人，只有一个修行人的壳子， 所做的一切都是给别人看的， 不是自己修的。别说自己成就， 也许你的所作所为， 还会影响别人成就。所以， 整个修行的来源、根本和命脉就是戒律。</p>\n<p>最重要的两条誓言</p>\n<p>出家人有出家人的戒律， 密咒士有密咒士的戒律， 我们居士有居士的戒律。作为一个修行人， 要清清楚楚地知道自己该做什么， 不该做什么， 什么允许， 什么做了对自己不好。其实， 密乘戒律有十万多条， 让我们一一接触是不太可能的， 特别是现在末法时代， 人心这么浮躁的时候， 不可能去了解那么多的东西。不过， 整个戒律中的最要害， 简单来说就两条。这两条戒律做好了， 你就是一个很好的修行人。这两条做不好， 你就算把整个《大藏经》____《甘珠尔》《丹珠尔》全部背下来，也没有用。鹦鹉也会说人话， 但是它不知道它在说什么， 道理跟这个一样。</p>\n<p>这两条戒律是什么呢？“拉米莫方喇嘛格， 华登拉米土增巴利杂威东喔荣增巴德。”这句藏语是什么意思呢？ 就是： 让上师不高兴的事，我绝对不做， 这是第一条。第二条， 我的师兄弟们， 就要像对待自己的眼珠子一样去爱护团结。这就是戒律！</p>\n<p>如果有了这两条， 你大摇大摆地到哪儿都可以说： “我就是修行人！”如果没有这个， 你得好好想一想， 修了十年、二十年、三十年， 都没什么进步， 到底是为什么？ 就像用竹篮打水， 能打得起来吗？ 没有戒律的修行就像竹篮子打水， 天天打， 打完就没了。很多人不明白， 修了那么 多年咋会这样呢？ 那他们得考虑一下自己有没有戒律？ 没有戒律， 当然 不会有进步了。</p>\n<p>五条根本的律仪</p>\n<p>详细来讲， 再展开一点， 我们龙钦心髓的弟子是密乘弟子， 而密乘的根本戒律有五条：</p>\n<p>第一条， 我绝对不会诽谤密法， 死也不会。这是一条， 不对密法产生邪见。</p>\n<p>第二条， 恭敬上师， 孝顺上师。孝顺不是孝敬， 两者是有区别的，孝敬是你要尊重他，但是觉得不对的时候，也可以不用听； 孝顺是什么呢？</p>\n<p>就是要顺从上师， 听上师的话， 哪怕失去生命也可以， 要有这样的决心。</p>\n<p>这条戒律要做到有点难！每一个弟子都认为： “我肯定听上师的话，</p>\n<p>不可能不听。别的话我可以不听， 但上师的话不听， 我算什么？肯定听！”他会这样说。但是仔细一想， 他绝对没听上师的。举个例子， 你从皈依 的那一天开始， 要念金刚七句七遍， 莲师心咒二百遍， 不要间断。这是 上师亲口说的， 你听了吗？ 如果你间断了， 这叫听上师的话吗？ 还有，</p>\n<p>最麻烦的是什么？ 上师说的话符合他的口味， 相应他的思维的时候， 他觉得很好：“哎呀， 上师今天说得太好了！ ”但是， 稍微有一点点不符合他的思维逻辑， 有一点点超出他自己画下的框架的时候， 他就不听。这叫听上师的话还是听自己的话？ 我觉得这不叫听上师的话， 这就叫作让上师听你的话， 颠倒了。从来都走不出自己的框架， 这能成就吗？ 不接受自己框架以外的东西，你找一个上师做什么呢？</p>\n<p>所以，这一条是比较难做到的。它的要求很高，比如，上师指着东，说： “这是西。”你必须认为这就是西， 不允许有一点点的思维： “这是东，上师说错了。”不能这样想。听上师话的精确度要达到这样。如果没有听上师的话， 对于这位上师来讲可能没有什么损失， 但是对自己的修行来讲， 是最大的损失。就如同把银行卡里的钱一次性刷完一样， 不听上师的话， 你的福报就一次性刷完了， 所以得注意。不要总认为自己是完全听了上师的话， 其实没听的地方太多了。那应该怎么做呢？ 就是要细心地去想， 细心地去改进， 纠正和挽救自己的这种行为。我们如同病人，上师如同医生， 想要治病， 却不听医生的， 能治好吗？ 所以， 好好地想一下， 如果做错了， 需不需要忏悔？ 如果为了自己的面子问题不忏悔，那你根本就不适合当修行人。修行都要看面子， 那一点点执着都放不下，还修什么呢？所以，要好好听上师的话。</p>\n<p>第三条， 如心如目般去爱护自己的金刚兄弟。 同一个上师和同一个坛城的师兄弟， 要像对待自己的眼睛和心脏一样去爱护。自己的眼珠子，你平时是怎么爱护的？ 如心如目般去爱护自己的师兄弟， 你做到了吗？ 如果做不到， 就得改正和忏悔！ 有的人不但做不到， 甚至几个月、几年都不跟自己的师兄说话， 心里已经产生了很大的一个裂=, 还若无其事得意扬扬地去修行。我觉得这种人， 有点顽固不化。上师再三再四地提醒， 他听不进去， 始终认为自己是对的。像这种人， 真正让他去辩论、谈判， 他又说不出来什么， 但在自己最亲的、生生世世都离不开的师兄弟面前， 他倒装得很顽固。其实站在师兄弟团结的立场上， 没有什么“我对”， 只有“我错了”， 不允许有“我对”， 要记住这句话！ 这个不需要到法官面前去仲裁。师兄弟不团结的那一天， 没有任何理由可讲， 双方马上赔礼道歉， 双方念百字明或者《无垢忏悔续》， 去协调各自不对的地方， 协调完了， 就跟以前一样风平浪静。但并不是说你念一个： “嗡班匝萨捶萨玛雅， 玛呢巴拉雅， 班匝萨捶得诺巴， 迪叉哲卓美巴瓦……”我给你忏悔了， 之后转过背却说：“呸！”这样行吗？ 嘴里不说， 心里这样想， 行不行？这叫忏悔吗？忏悔完了以后仍然没有变， 这叫忏悔吗？ 这叫演戏！ 所以大家得好好想一下。我说过， 没有原因， 不能讲条件， 你只要对师兄弟们讲条件的那一天， 你就不是好的修行人， 你连这一点点忍辱都修不了， 对自己的师兄弟都放不过， 那你对别人怎么修忍辱呢？你自己修行的“命”都保不住， 你还修什么行？ 所以今天又说了一次， 师兄弟们一定要团结。</p>\n<p>第四条， 本尊心咒的念诵和观想每天不间断。 比如，莲师心咒一天不少于二百遍， 不能间断。此外， 每一天观想莲师的形象三次， 或者想上师三次。简单地讲， 你好好地、完整地， 以清净的心态去想上师三次，这也叫观想。佛的形象观不出来， 那每天想上师一次， 这个能做到吧？观想时可以念一下“上师知……上师知！”这个观想也是不能间断的。这条再延伸一点， 念什么经该做什么手势， 也是一种修行。这个我们现在还不懂， 所以我以前给你们讲过， 铃和杵不要离身， 它们代表着所有的手势、手印。念珠的这个计数器上面有一个铃和一个杵是为什么， 就是为了这个。如果你自己会观想， 会做手印， 就不用带了； 如果你不会，为了安全起见，要随身携带一个铃和杵，最好是上师加持过的。</p>\n<p>第五条， 上师交代的秘密， 不能说出去。有的人心态是扭曲的， 上师让他不要说， 他硬要说出去， 其实上师是为了他好。尤其是当上师给他传一些特殊的法， 并且交代：“不要讲给别人听啊。”他似乎为了显示懂得比别人多一点， 偏要去讲。比如， 上师嘱咐他：“你到什么地方去念经、修行， 在哪儿闭关， 什么时间闭关， 什么时候出关， 修什么样的法， 用什么样的原料， 灌什么样的顶， 以什么样的程序灌顶……不能告诉别人。”可他一转身， 就告诉别人： “上师安排我到哪里去修行了，闭关了， 我在什么地方多少天， 我修的是观音法门。”回来后还要到网上发一个帖子： “我闭了多少多少次关。”说真的， 你们可以上网去看，只要哪个人说我闭了多少年的关， 他就是在犯戒。说这个目的是什么呢？让大家觉得：“哎哟， 你了不起， 你闭关了好长时间的。”他以这种不良动机去宣传的话， 是不会在乎自己戒律的。哪一位大德会说“我闭了多久的关”？ 我们的师公说过吗？ 所以， 这些一定要保密！ 为什么叫密法呢？ 就是需要保密的地方就要保密， 不然的话， 本来很好的加持力就从你的嘴里漏出去，什么都没了。</p>\n<p>深信因果，牢记承诺</p>\n<p>师兄们， 这五条戒律， 要牢牢记在自己的心里。我讲这个的时候，有的人当时觉得是有这么个说法， 就有一点点放逸， 但真的落在自己身上的时候， 谁都受不了。有的人说：“没事， 大不了去一趟地狱。”这种话真是太不靠谱了！ 手指头被火柴点一下你都会痛得“哎呀”一声跳起来， 怎能忍受得了地狱的痛苦呢！ 所以， 这些不切实际的话， 尽量不</p>\n<p>要说。一旦你不害怕因果了， 从那一天开始， 你可能就要堕入魔道了。你看看， 现在每天的新闻都能报出一个问题， 什么毒粉条啊， 什么染色馒头啊， 什么问题奶粉啦， 好像所有的食品都有问题。为什么会这样的道德败坏？ 就是因为没有信仰。我们是有信仰的， 不畏惧因果报应还算有信仰吗？所以，大家一定要深信因果，牢记戒律。</p>\n<p>这些戒律， 师兄们回去后慢慢思考下：“我做到了吗？”也许有的人认为， 我念了很多很多的咒， 几百万几千万遍， 上师布置的功课我也都做了， 好像很了不得。但是， 做这些的同时， 你的戒律守好了吗？ 没有戒律的话， 就像刚才说的竹篮子打水一样， 念了多少都没用， 还影响他人的修行， 影响整个道场的清净， 甚至影响上师的寿命。特别影响上师寿命的是什么呢？ 就是师兄弟们不团结。为什么呢？ 上师的生命线是跟弟子们连在一块儿的， 生生世世连在一块儿的， 因为你一个弟子而间断的话， 不就等于你杀了上师吗？ 很多人认为， 我不喜欢上师就不喜欢上师， 没什么， 我不喜欢我的师兄弟就不喜欢， 怎么啦！ 不喜欢就是不喜欢， 很坦率的， 好像很有胆量似的。其实是“愚蠢”！那不是有胆量，是太愚蠢了！ 因为他不懂得其中的厉害。很多人觉得自己很“坦率”，觉得胆量很大， 什么都敢说敢做， 这并非是什么好事， 是一种很不好的行为，这只能说明他一点都不懂佛法。</p>\n<p>想一想， 我们都是修行人， 都听闻过米拉日巴和玛尔巴译师的故事，你们真的认为米拉日巴胆子那么小， 不敢得罪自己的上师吗？当然不是，他是害怕因果， 他怕的是戒律。所有的大德， 为什么见了自己的上师就跟老鼠见了猫一样， 不是怕这个人， 是怕他的戒律。说一句不该说的话，比如说， 一个八十多岁的老上师， 一个二十岁的年轻小伙子打不过他吗？当然打得过。但是他怕什么呢？ 一句话都不敢说， 而且百分之百服从，这又是为了什么呢？当然是为了自己，不是为了这个上师。我们想要成就，就要学好佛法， 既然想学好法， 就要有戒律。戒律就像土地一样， 没有良好的土地你怎么种粮食？ 蔬菜、水果， 怎么种？ 在空中能种吗？ 不可能！戒律的重要性就是如此，师兄们千万不要小看它。</p>\n<p>选择你们，心情没那么轻松</p>\n<p>“我修我的，虽然跟师兄弟们不太团结，但是我自己修得好啊！”一一简直是个笑话！ 跟生物链一样， 一个缺了， 就会影响另一个人、另一样东西。我们的道场里， 哪一个人的修行退步了， 对我们都有影响， 因为我们是生生世世连在一块儿的。我从小到大， 最不喜欢听到的就是金刚师兄弟的坏话， 我的耳边要是听到一个人说别的师兄弟不好，从那一天起，我就把他归属为戒律很差的那种， 真的。也许他说的是事实， 但是我心里对他的印象已经打折扣了。</p>\n<p>上师决定选择你们的时候， 他的心情没那么轻松。“这个弟子会好好学吗？ 他最后会不会背叛佛教， 背叛上师呢？ 他会不会在师兄弟里面挑拨离间？”但是， 不接纳他又会觉得他可怜， 既然有这么个缘分， 想到信佛， 多么不容易啊！那是几生几世修来的缘分，不是你想修就能修的。所以， 我不想让他错过这样的机会。但是， 我接受弟子的过程， 就跟吃我最不喜欢吃的印度咖喱一样， 每接收一个心情都很繁重， 特别不舒服。看到有的弟子不太争气的时候， 他自己可能没感觉， 但是我自己就像在</p>\n<p>油锅里炸一样。我好话跟他说过， 表扬过、骂过、指点过， 也说过心里话，传过法， 该做的都做尽了， 他好像还是无动于衷， 那该怎么办呢？ 你们将来也许有的会当上师， 在遇到这种弟子的时候， 也肯定会有这种感觉。</p>\n<p>你们的上师表面上是嘻嘻哈哈的， 但是内心很脆弱。每一个弟子的处境和修行我都会去考虑， 甚至别的上师不想的方面我也会想。包括我的弟子会有钱吗？ 他现在工作状况怎么样呢？ 工作状况不好， 没钱的话会不会影响他的修行呢？ 包括我自己， 有时候手头特别紧的时候， 也会从自己腰包里掏出钱来资助弟子，就一个目的， 为了他的修行不出现障碍，没有别的。那有的上师呢， 传法是我的责任， 除此之外你是什么样我不管。但我做不到， 可能是每个人的心不一样吧， 思维也不一样， 像我这种人就想得特别多。包括一些细枝末节， 比如， 弟子们夫妻感情如何， 将来会怎么样， 这些上师原本不该管的事， 我都插手过。插手后弟子却说： “这是我们夫妻之间的事， 跟你没关系。”这一句话敲醒了我， 我怎么会去管这些呢？所以， 连这些小的方面我都会考虑， 甚至你们没注意的细节，我都留意了。比如师兄们进来了， 看见哪一个气色不太好， 我就在想是不是生病了， 他最近状态是不是不太好， 等等。这些师徒之间的关系啊，真的无法用语言表达。甚至我现在养成了什么样的习惯， 你们都可能不知道， 只要离开你们时间稍微长一点， 我就过不下去， 真的， 说的是实话，这就叫作师徒关系。好长时间不见面， 一见就很开心。所以这些小的方面我们是不是也需要注意一下呢？ 有了这个基础才有动力去学佛， 动力都没有找出来， 我们学什么佛呢？ 如果这个圈子天天吵架， 天天这个说不好，那个也说不好，让人不想来了，这样就不好了。</p>\n<p>你们上师的行为是什么风格呢？ 不会对着你们说：“你哪痛了？ 你是不是病了？”好像什么都不说， 但是不说并不代表我没想你们。有的人呢， 会拉着你的手： “你怎么样了？ 你今天怎么样了？”但这不代表他很想你。打个比方， 跟自己最亲的人， 天天在一块儿的亲人、最关心的人， 你会天天问“你怎么样了， 你怎么样了”吗？ 当然不会， 但你会在不知不觉中就会想起他， 要有这种感觉。为什么今天讲上师的感受呢？我是希望你们师兄弟之间也有这样的感觉。跟上师有， 这个我知道， 跟师兄弟也要有。发现师兄弟有不对的地方， 要坦诚地说， 但不能起嗔恨心。你要像对待自己的兄弟或儿女一样去劝说。他有毛病不说那也不是个事儿， 但是心态要掌握好。听到别人给自己提意见时千万不要想： “他为什么要这样说我？ 他是什么目的呢？”不要这样认为。有什么不对，他当然要跟你说， 因为他是你的金刚兄弟， 他关心你。所以， 师兄弟们要记住上师的话， 上师帮不了你们什么， 但是上师百分之百会对你们好，上师说出来的话肯定是为了咱们大家好，不要嫌烦。</p>"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/供养  需要注意这些", "title": "供养  需要注意这些", "rel": "上师开示/4.如何修行/4.4 处处离不开福报/供养  需要注意这些.md", "dir": "上师开示/4.如何修行/4.4 处处离不开福报", "is_index": false, "meta": {}, "html": "<p>功德的关键在于发心</p>\n<p>供养的功德不在于钱的数目， 而在于发心。有时候， 供养两块钱就能为自己带来很大的福报。而有的时候， 供养几千万， 甚至付出了自己的一切却白费了。所以，学佛的人应该了解一下供养的程序。</p>\n<p>首先， 不能认为“不需要做供养”， 也不能这样讲， 否则可能会断掉别人福报的来源， 但佛教讲的“供养”， 完全是自愿、自发的。现在这个时代有很多供养的方法， 比如有的上师讲法、灌顶的时候， 或者做各种形式的火供、荟供的时候， 可能会让弟子掏一万块钱， 或者多少多少，但这样的供养有可能白费， 因为这种供养不是出于自愿，他自己没有发心。</p>\n<p>也许是上师、师兄们说了很多， 他不得不听， 碍于面子才去供养， 这种供养就不能称为真正的供养。</p>\n<p>还有， 现在很多朝山拜佛的地方， 门票多少钱， 进去烧一个高香多少万， 第一炷香多少万， 这种肯定是迷信。在佛的心态里， 没有这样的概念： 你给我点了很大的香我就理你， 小小的一炷香就不理你。不可能！佛的境界是什么样的？就像太阳一样。太阳自然散发热量传递到地球上，照射每一个角落。但太阳不会想：“我一定要把万物养育起来。”它没有这种心态， 没有这种念头， 但是它自然会有这样的能量发出来， 从而办成很多事情。佛的这种状态跟太阳差不多是一样的。所以， 用这样的方法去捐钱不太好。</p>\n<p>什么人有资格接受供养</p>\n<p>今后你们还要注意， 哪一位上师主动去掏你们的腰包， 那肯定是违背佛法的， 肯定是不符合规矩的。释迦牟尼佛很清楚地讲过， 修行人里面，谁能接受众生的供养， 谁不能接受众生的供养。第一种， 达到了像虚空一样的境界不动摇的时候， 如果别人自愿， 就算供养一座金山， 他也容</p>\n<p>纳得了， 对自己没有任何的害处， 对别人也不会有； 第二种， 是清净的比丘， 至少没有破坏过比丘的十七条戒律， 这样的比丘， 拿当天的供养完全没有问题， 也就是今天的供养今天拿、明天的供养明天拿。除了这两种人以外， 谁拿了众生的供养， 谁就得下地狱。所以， 你们想供养的话， 必须要找准目标： 第一是成就者， 他有这个能力去接受供养； 第二，戒律清净的比丘，也可以接受你的供养。其他的人是不行的。</p>\n<p>怎么去观察一个人是不是真正的成就者？ 他内在的境界你是看不到的， 但是有个标准：“希索索塔洛里他东塔巴”， 是说从外在来看， 他很注重戒律、很在乎戒律；“朗香秋森会森给哟”， 随时随地都有不造作的菩提心；“桑吉若阿朗朗旺杰”， 这说的是内在， 我们看不清楚，是说圆满次第和生起次第就像他的筷子一样可以运用自如， 这就叫作大成就者。那我们怎么去判断他有没有真正的、不造作的菩提心呢？比如，有人摔倒了， 他跑过去扶起来。如果这么做是为了得到别人的称赞， 说他是个好修行人， 那就不是真正的菩提心。一个人有没有慈悲心， 跟他相处时间长了就能看得出来。如果他对谁都像对待自己的亲戚朋友一样，那这种人有可能有菩提心。相反， 谁对他好， 他对谁就像亲人一样， 谁对他不好， 他对谁又像敌人一样， 态度反差很大的话， 我觉得值得怀疑。</p>\n<p>然而， 即使像我刚才说的这种大成就者， 也不能要求“供养、供养”。供不供养取决于你们自己。上师可能会讲， 如何做有功德， 如何做对你不好， 把道理讲清楚， 至于如何选择是你自己的事。千万不要信那些天天化缘的： “今天我要修塔， 你们想不想做有福报的事？ 明天我要建经堂了， 你们做不做有福报的事情， 这个对你很好……”信这些话， 还不如把钱拿去吃得饱饱的、穿得暖暖的好呢。</p>\n<p>一后悔，功德就没有了</p>\n<p>还有一种情况， 有时候一冲动，“我什么都不要了， 我要学佛， 要把所有的一切供养给上师。”把所有的财产供养完以后， 过一两个月，他就后悔了， “哎呀， 我也需要钱啊， 当时为什么这样做呢？”他一后悔，供养的功德就都没有了。所以，这种一时冲动的供养千万要小心。</p>\n<p>还有的人，供养以后还放不下他供养的东西，像间谍一样去跟踪追查： “我的东西现在在哪儿？ 又到哪儿了？ 又到哪儿了？ ”你有什么权利追查呢？你一追， 你的功德就没了。你的东西已经供养了， 就不属于你了，你有什么权利说这个话呢？ 但有的人会这样做。有的人供养了一件东西后， 就会说：“上师， 我供养给你了， 但是不允许给别人用， 不允许用到别的地方， 只能用在你的身上。”上师可能会说：“好好好， 我不会的。”就算上师答应了也是假的。上师也是无常的， 就算他不想给别人，等他圆寂了，这东西不也是别人的吗？他带得走吗？</p>\n<p>所以大家要好好想想。供养本身是很好的， 如果因为自己的某些做法把功德毁了， 那就不好了。比如说， 今天我有一百块钱， 想给上师供养一块钱， 对我来说不多， 对我的吃穿也没影响， 但如果供养给上师，福报就不一样了。这样供养出去后， 你也不会后悔。所以要考虑好， 我能不能做这个供养？我有没有这样的实力去供养？这是最关键的。</p>\n<p>我的这些弟子供养后从来都没有后悔过。但我看到过别的上师的弟 子， 供养了以后， 说过很多这样的话：“哎呀， 我当时供养了很多， 可惜了， 我不应该那样。”“哎呀，我供养了多少多少钱，最后我发现他拿去买车了。”你供养上师的时候， 也没说过不能买车啊。“哎呀， 我给上师供养了多</p>\n<p>少多少钱， 结果他拿去跟好多弟子吃饭去了。”最后后悔了， 那真的不好，还不如不供养。</p>\n<p>供养的种类与方法</p>\n<p>供养其实有很多种， 最好的供养是什么？ 是法的供养。法的供养是什么？ 就是好好去修行， 你的境界达到了一定的层次， 这就是上师最满意的事。法的供养是最最高的供养。第二是身体的供养， 就是把你的身口意供养给上师， 这一生由上师来做主。第三才是财产的供养。所以我觉得只要是一位好的上师，他到一个地方去弘法，发心肯定不是为了赚钱。他最主要的目的是让大家好好学佛， 学佛的人越多越好， 成就的人越多越好， 这才是他主要的工作， 不可能是为了钱。如果一位上师的言行举止、所作所为都是为了钱，那作为弟子真的需要考虑考虑。你可以从头想一下：我跟了上师多少年， 他亲口向我要过钱吗？ 如果有， 要么这位上师特别信任你，要么就不是一个好现象。所以，供养的时候千万要注意。</p>\n<p>还有很多人会问， 加持最大的供养是什么？ 供养到哪儿最好？ 我们整个宇宙里，福报最大的供养，第一是供养给上师，第二是修建佛塔、经堂，第三是供养僧众， 供养他们能够马上用得上的东西。这些供养的福报，当场就可以实现。</p>\n<p>还有的上师， 为了试探弟子、调教弟子， 会拿弟子很多钱。但这种上师你能看得出来，他到底有多爱钱，家里有什么东西，对钱的执着大吗？</p>\n<p>如果他根本就不喜欢钱，要你的钱干什么？</p>\n<p>比如我的一个姨妈， 她有很多钱， 牛羊也很多， 又是单身， 但她抠门得要命。吃饭的时候， 必须得去别人家里吃， 舍不得吃自己的， 真的。藏族人是很好客的， 到别人家里去， 谁都会让吃。“干吗不去吃呢， 我又不用花钱。”今天吃完这家， 晚上又想明天去哪里吃。让她供养一下，肯定不答应。只要听到哪里不用供养， 她就跑到那里去接受佛法。一旦听到哪位上师接受了弟子多少多少供养， 她就不去了， 因为舍不得供养。</p>\n<p>我的舅舅一直劝她说：“这么多财产你一个人能用多少呢？ 你又没有后代， 死了以后， 这些财产能干什么？ 你应该供养给自己最有信心的上师。”但她不想供养， 说：“我有信心的上师都死了， 现在活着的都没信心。”嘿嘿嘿（上师大笑） 。我的舅舅看她这么吝啬也很痛苦： “她</p>\n<p>这样下去， 可能会堕入饿鬼道。”然后就去问法王如意宝：“我们该怎么办呢？ 我们怎么劝， 别的上师怎么给她讲， 都没用。她对待财产， 简直像自己的命一样。”她有三百多头牛， 就算死了一头小的， 都会哭个不停，“哎呀，我今天损失了一头牛啊。”</p>\n<p>法王如意宝就说：“好， 这个问题我来解决， 按我说的做： 她不在家的时候， 你们把她家里所有的东西、所有的牛羊弄到五明佛学院来，我来接收。”舅舅就趁她不在家， 把她的财产全部拿到五明佛学院供养了。她一回来， 发现什么都没有了。当时我真的很担心：“她会不会自杀呢？”结果没想到， 她一下子就冷静了下来， 最后还特别感谢我舅舅，说：“谢谢你！ 是你帮我解脱了。”从那天开始， 她过得特别轻松， 再也没啥可担心的了， 开始了真正的修行， 成为了一个很好的修行人。所以，是有这种方怯的， 你们不要搞错了， 法王如意宝需要她的牛吗？不可能，就是为了救她。除此以外， 天天化缘、天天要钱、天天想着怎么从弟子手里忽悠钱，这些不是一个上师该做的事。</p>\n<p>所以， 你们想要供养的话， 一定要找好供养的渠道， 我觉得这在当今世界是很重要的。</p>\n<p>还有的人， 供养了上师一辆车， 他当时很开心地供养了， 但看到上师车里搭了几个人就不高兴了：“停！ 你有什么资格坐我的车？”他还在说坐的是“他的车”。你说， 这样的供养有用吗？ 再打个比方， 比如说供养了一个房子， 名字是你的， 但钥匙在他手上。供养完了以后， 他高兴了你才可以来， 不高兴了你就不能来， 不给你开门。有这种供养吗？明明已经供养给别人了， 却抓着不放操很多心， 真的是很累。还不如不供养，房子就是自己的，想怎么待就怎么待，不用怕别人来。</p>\n<p>所以，我的弟子们千万不要糊涂，要学聪明一点。</p>"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/坚固的信心从哪里来", "title": "坚固的信心从哪里来", "rel": "上师开示/4.如何修行/4.4 处处离不开福报/坚固的信心从哪里来.md", "dir": "上师开示/4.如何修行/4.4 处处离不开福报", "is_index": false, "meta": {}, "html": "<p>2017 年 01 月开示</p>\n<p>信心来自于福报</p>\n<p>修行说复杂很复杂， 说简单也很简单。复杂就是学闻思， 这个要学很久。说简单也简单， 上师的一句话、一个眼神、一个动作， 就可能让你成就。</p>\n<p>为什么有那么大的差距呢？ 这取决于信心和个人的根器。所以， 我希望所有的师兄都成为后者， 上师的一个眼神、一个动作就能让你成佛。我不希望师兄们学了三四十年， 甚至五十年以后， 还只是一个佛学的研究者， 这个我不希望啊。所以， 师兄们要记住， 信心是最重要的。信心来自于哪里？ 来自于福报。所以， 要积累福报， 充实自己的信心， 这是最重要的。</p>\n<p>其实佛教修行的道理， 从玛尔巴洛扎和米拉日巴这两位祖师的历史就可以看到。不一定上师的所作所为很如法， 弟子才能成就， 也不一定弟子的行为很如法才能成就。你们可以去看他们的事迹， 这方面的内容有很多。米拉日巴和玛尔巴洛扎第一次见面的时候， 玛尔巴洛扎正在田里种地。玛尔巴问他： “你对我有信心吗？”米拉日巴说他有绝对的信心。 “如果你有信心， 就把这壶酒给我喝掉。”酒壶是牛角做的那种， 里面的酒大概有两斤。米拉日巴毫不含糊， 一下就喝完了。喝了以后， 稍微有点晕。这个时候， 玛尔巴跟米拉日巴说：“你现在的第二个任务， 是把我该种的这些田地全部种完。”米拉日巴二话没说就去把地都种完了。</p>\n<p>其实你想一想， 按照佛教的闻思来讲， 喝酒符不符合佛法？ 显然是不符合的， 种田就更不用说了。但正是因为这样的缘起， 才产生了那么伟大的利益众生的弟子。因为第一次见面有这样好的缘起， 就有了噶举法脉这么好的一个传承。其实你看， 一个缘起，很简单的。</p>\n<p>我这一次去了果洛州， 一路上都是雪， 天气非常寒冷， 达到零下23℃。但在这么冷的天气里， 很多藏族人， 骑着摩托， 很开心地往一个方向赶。刚开始， 我觉得这些人真的是太厉害了， 怎么不怕冷啊？ 后来我发现， 原来是他们寺院在开法会。是信仰的力量让他不觉得冷， 觉得开心。如果师兄们到现场去试一试， 就知道天气有多寒冷。但是， 寒冷的痛苦被自己的信心掩盖了。就这么一个举动， 让我都觉得：“啊， 信仰真的很伟大！”只要有了信仰和信心， 什么都能做得到。这是我这一次的发现。</p>\n<p>积累福报的主要方法</p>\n<p>总而言之， 再说一次， 修行人需要的是坚固的信心！ 坚固的信心来源于哪里？ 来自福报！ 我们有各种各样的方法可以积累福报： 第一个是放生， 第二个是做荟供， 第三个可以服务师兄， 第四个可以用文艺表演来供养师兄， 让他们开心。可以拜见上师， 也可以承侍上师， 还有很多法会可以参加。总之， 积累福报的方法有很多。这些修行程序都是我们做得到的，没有一样是各位做不到的，只是你愿不愿意去做而已。</p>\n<p>师兄们一定要努力为自己积累福报。我们已经进入了佛门， 已经发誓成为三宝的弟子， 也发过愿将来一定要成为利益众生的机器人。所以，一定要坚固信心啊， 师兄们！ 我也看见过有些师兄， 今年像个佛一样，明年像个鬼一样， 不要成为这种人。这样对自己不好， 对上师没有什么，对别的师兄也没什么影响。但是， 你的行为造成了自己的堕落， 这个不是太好。</p>\n<p>所以， 对各位再强调一次， 信心， 信心， 信心是最重要的！ 和上师成为一体， 上师在想什么， 上师在做什么， 你也能想得出来， 你也能做得出来的时候，大概你就已经快要成佛了。</p>"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/如何提高供养回报率", "title": "如何提高供养回报率", "rel": "上师开示/4.如何修行/4.4 处处离不开福报/如何提高供养回报率.md", "dir": "上师开示/4.如何修行/4.4 处处离不开福报", "is_index": false, "meta": {}, "html": "<p>2013 年 11 月开示</p>\n<p>供养，其实是给你们机会</p>\n<p>每一次宣传功德的时候， 很多人就会认为：“哎呀， 太烦了！ 天天说钱、钱、钱”，“这里又要捐钱， 那里又要捐钱”，“这里又要做什么事， 那里又要做什么事”。多听几次就烦了， 好像都快背叛佛教了： “我受不了了，不要在我耳边讲什么功德不功德了！”有些人会有这样的心态。其实有这种想法的人不会做什么了不得的功德， 最多为了 50 块钱就会说这些。</p>\n<p>这些宣传功德的师兄们为什么不顾一切地去宣传这些呢？ 是为了大家能够有一个积累福报的机会。所以， 才“不要脸”地说很多次。</p>\n<p>对于还不太了解佛法的人来说是有点“不要脸”， 但是当我们对修行有了正确的认识， 了解了佛教的一些观念以后， 就会知道他们所做的一切是为了一项很伟大的使命，没有什么“不要脸”的。</p>\n<p>但对有些人， 根本就不敢提“功德”这两个字， 也不敢提“供养”这两个字。在他们的心目当中， 除了自己以外， 其他人， 包括他的上师，越穷越好， 穿得越破越好， 住得越烂越好， 哪怕在山洞里饿死了， 他也觉得很伟大。这种心态的人太多了。这么没有福报的弟子， 能修得出来成果吗？</p>\n<p>修行起码要修圆满， 身、语、意、功德、事业， 这五个不齐， 怎么能成佛呢？有的人说什么“我要成就，但是不要跟我提供养”。就像一个人，五脏六腑不全， 只能叫残疾人。“我要做人， 但是我不要眼睛”， 或者， “我要做人，但是我不要脚”，行吗？供养，其实是给你们的机会。</p>\n<p>有好吃的，我第一个想到的是师父</p>\n<p>我给你们讲几个自己的例子， 不带水分的。不知道为什么， 我从小很喜欢机械， 比如说车、手表、收音机、录音机、摄像机这一类的。但光喜欢没用， 那个时候买不起， 只是想想而已。我的一位上师叫色拉阳智活佛， 他可能有神通。我曾经特别想要一只手表， 有一天去了他那里，他把那块手表拿了出来， 问我：“活佛， 你喜欢这个表吗？”我很不客气地说： “很喜欢。”他一下就把手表取下来， “来， 喜欢就送给你。”</p>\n<p>我当时不太懂。表上有三个角， 表里有三个圆圈， 都是黄色的。当时还不知道是黄金做的。我高兴极了， 就好像一刹那得到了全世界的财富一样， 高兴得不得了。回到五明佛学院， 我天天看， 晚上睡觉的时候在被窝里搭帐篷都要看， 它还是夜光的。每次大家一起修行、吃饭的时候，我总是第一个到， 因为要晒一晒手表……反正， 我从头到尾的财产里面，最喜欢的东西就是它。</p>\n<p>有一天， 法王如意宝讲了做功德的一些伟大之处。其实我这个人是很不容易感动的， 但不知道为什么， 突然感动生起一个清净的信心， 有想哭的感觉。我就觉得，“哎呀， 法王如意宝对我们太慈悲了， 但我们却没为他做什么。”在这种感动的状态下， 我把手表摘下来，“嗒”一下子甩了上去。然后赶紧做了回向， 以免过会儿心态反悔。就这样供养给上师了。供养给上师没几天， 一直到现在， 我的手里都没有断过名表。</p>\n<p>这是事实！我从来没有向别人要过， “给我买个好表嘛， 我很喜欢表的。</p>\n<p>真的没说过这样的话。但时不时就有人会说： “上师， 我送您块好表吧。”现在也不想这些东西了， 不知道是生理疲劳了， 还是太多了。但是表仍然不断有人送来，没办法，已经有这个福报了，挡都挡不住，真的。</p>\n<p>第二个例子。我从小经济条件不太好， 但是， 有了好吃的， 我第一个想到的是给上师。上师吃了以后， 要是送给我， 我才自己吃。后来，不知不觉地想吃什么就来什么， 本人的战斗力也超强， 结果一度吃成了270 斤的身体， 不过， 也是为了满愿供养者吃成这样， 算是工伤， 我喜欢。还有就是在那个时候， 羊羔皮是很稀少的， 对藏族人来说， 能够穿上羊羔皮衣服的话， 就是贵族了。当时阿克益西他们那边羊最多， 送了我一件羊羔皮的衣服，很漂亮！我当场就供养给了法王如意宝。那一年的冬天，法王如意宝穿的就是我供养的这件羊羔皮衣服， 很多照片上都有， 虽然我自己在寒冷的冬天没有保暖的衣服， 但是再冷心里都是暖暖的。从那以后我各种样怯的衣服堆成山了， 不要说穿， 送都送不完。伺候过我的弟子有目共睹。</p>\n<p>我自己家里的一些佛像， 或者好一点的东西， 可能没有多值钱， 但是我都供养了。我裸供了五六次。现在的我， 有了这样的福报， 真的是不愁吃、不愁穿不愁花， 没有很辛苦地去找什么钱。在大德当中， 我不算超有钱， 但是都传： “龙洋活佛最有钱。”虽然现今不太适合这样的传言，但这个口碑也是福报得来的吧。在师兄们清净圆满的发心协助下， 恩师历代多智钦的驻锡地， 龙钦心髓的祖庭多智钦寺得以恢复和重建， 这个伟大而机会难得的使命降临在我的肩上陆陆续续得以完成。这些都是当时我的发心和实际行动得来的。</p>\n<p>以前几次师公回来， 我心里想给师公订一个好的酒店， 但那时没有这么好的条件。当然， 师公也不喜欢住什么总统套房、五星级酒店。在他的心态里面， 安逸 158 和总统套房都是一样的。但是在我的心态当中不一样。所以后来我有条件的时候， 我觉得， 师兄们给我的供养， 我自己也没有什么能力来享用。如果这些钱花在师公身上， 也算对得起大家。所以， 上一次师公回来， 我就在富豪首座酒店订了三天左右的总统套房。我确实有这个发心，但资金是很多师兄帮助提供的。</p>\n<p>你们的师公入住的时候， 一进来就说： “这么大的房间， 干什么呢？”我说：“上师， 见客人要大一点的房间， 地方小的话没办法见呐。”然 后师公问我： “多少钱一晚上？”我就说了。他一听就说： “马上退掉，</p>\n<p>不住了， 浪费钱， 不住了！”为了珍惜这个机会我很迫切， 所以我就跟上师撒谎了， 其实这是不应该的， 我说：“我已经把钱全部打进去了，你现在走了钱也拿不回来。”师公就说： “啊？有这个道理吗？”我说：</p>\n<p>“有。”每一次客人来的时候， 师公都说：“其实我是不愿意住的， 但是钱已经打进去了。”</p>\n<p>我就这么给师公安排了总统套房。从此以后， 去很多地方， 师兄们都请我住总统套房。当然了， 这是师兄们对我孝顺。在这之前， 我从来没住过总统套房。有很多次， 无缘无故有人请我吃饭， 还让我必须住一夜，不知怎么就开了个总统套房， 当时还不是我们的弟子。别的地方也有很多次， 莫名其妙就开了总统套房。我就想：“为什么会这样呢？”转念一想： “哦！ 是那个功德！ 给自己的上师安排了总统套房， 可能就有这样的效果。”这是我自己的亲身体会。</p>\n<p>供养时，别夹杂太多复杂因素</p>\n<p>师兄们， 因果不虚啊！只要发心正了， 没有任何附加条件地做供养，回报率就会这么高。但是你供养的时候， 如果夹杂了很多复杂的因素，钱可能就白费了。什么样的复杂因素呢？</p>\n<p>第一个， 其实你自己是不愿意的， 因为觉得不好意思， 才供养了很多。这样可能对你没有什么好处。</p>\n<p>第二个， 你是为了办一些自己特殊的事情， 出于一个自私的想法去供养。这样的供养不能说没有好处。有，但是没有那么快。</p>\n<p>第三个， 有的人供养时既没有什么信心， 也不了解佛法， 但是“有点喜欢你”， 就给了很多钱。这种供养不要说有功德， 可能后果还很严重。为什么？ 因为刚开始你是以喜悦的心态去供养， 到最后满足不了你的要求的时候，又会有嗔恨心。那不是毁掉了自己吗？</p>\n<p>所以， 供养要在自己力所能及的范围以内， 供养过后不要后悔， 不</p>\n<p>是为了别人说你好， 也不是临时抱佛脚， 解决自己的急事。不能是为了这些。如果你想解决的那些事情不吉祥、不太好、不如法， 可能不会那么顺利。所以干干净净的、没有附加条件的供养， 才叫作供养。这样的供养回报率很高。</p>\n<p>但有的师兄呢， 供养以后会反悔。把供养的钱、供过的东西要回来。这会导致什么呢？ 据我看过的闻思说法， 这样会导致自己几世几世堕入饿鬼道， 有做人的机会也代代变成穷人， 千万不要做这样的傻事。因为你供养出去的东西， 已经不属于你了， 也不归他所有， 而是三宝的财产了。你要是拿回去， 就是在抢三宝的东西， 这是抢劫！ 这样你多生累世好不容易积累起来的一点点福报， 快速地归零， 马上福报就开始负增长了。所以供养之前大家都要好好地考虑一下：我能做这个吗？做了以后会不会反悔呀？这些都要想好。想清楚了再做供养， 这是做功德不可缺少的。</p>\n<p>不要关上福报的大门</p>\n<p>有的上师不敢提“供养”两个字。我的有些师兄弟也跟我讲：“龙  洋活佛， 有时候你的性格是大大咧咧的， 千万不要给汉人讲做功德， 不 要讲供养， 他们接受不了。你委婉一点， 不要太俗了。给汉人说供养供养、功德功德，他们听不进去的。哎，不如用另外一种方法，把钱拿走就行了。”</p>\n<p>但是我想了一下，“供养”就是“供养”， 释迦牟尼佛怎么讲的，我就怎么说。你听不进去那是你的缘分， 我没有犯错误。用别的方法去拿你的钱财， 那就叫“敛财”。我是为了你好， 不是为我自己。宣讲供养的功德，那不叫“敛财”，那叫“利他”，性质是完全不一样的。</p>\n<p>有些上师会直接说：“明天给我拿个三千啊”“后天给我拿个五千啊”。弟子要是问： “上师， 你要那么多钱干什么？”上师会说： “关你屁事！”这样的上师是有的。这个应不应该？ 其实按道理来讲， 上师是有权利这 样说的。为什么呢？ 因为皈依的那一天， 你就已经把身口意都交给了上 师， 还有什么财产可以保留的呢？要不然你就是在撒谎， 在佛面前撒谎， 你连自己都交给我了， 还有什么舍不得的呢？ 但是， 这么暴力的方法我 有点做不出来，因为你们的上师总是心太软。</p>\n<p>所以，师兄们不要想错了，觉得“那些负责功德的师兄天天说什么供养，讨厌得很。”其实，这个时候你在犯错误，知道吗？你在犯一个修行上的特大错误。如果给不了，你可以不给嘛，可以悄悄地随喜别人的供养一一随喜别人有这个供养的能力，希望自己将来也有这样的能力。供养是自愿的， 你可以心里随喜， 又不是说必须得给。如果你不但不给， 还产生一个邪见，这对你有好处吗？这不就关了自己增长福报的大门了吗？</p>"}, {"slug": "上师开示/4.如何修行/4.5 修行也要有规划/做 一个真正的修行人", "title": "做 一个真正的修行人", "rel": "上师开示/4.如何修行/4.5 修行也要有规划/做 一个真正的修行人.md", "dir": "上师开示/4.如何修行/4.5 修行也要有规划", "is_index": false, "meta": {}, "html": "<p>2013 年 10 月开示</p>\n<p>修行也要有规划</p>\n<p>师兄们， 你们做功课要精进一点才好啊！ 到现在很多年了， 完成功课的师兄好像很少。你们的上师心很软， 给你们布置的功课比较少， 但是直到现在， 功课让我满意的， 最多只有十个人， 这方面我不会冤枉你们，甚至还有师兄从来没有向我交代过功课的情况。很多师兄没有向上师汇报过修行中的心态变化情况， 也没有告诉过上师自己将来怎么打算， 也没有告诉上师会以什么样的发心去修行， 也没有在上师面前许过愿： “我一定要做一个，起码得这样的修行人。”没有！</p>\n<p>每一个修行人起码得有一个自己的规划： 进入佛门后， 最低限度应</p>\n<p>八、修行也要有规划</p>\n<p>该做到什么样。建房子也要有规划： 房子建成什么样？ 何年何月完成？完成的时候质量怎么样？ 都要有规划。上学也是如此： 上多少年？ 上什么样的学校？ 毕业以后想做什么？ 当飞行员、当兵， 还是当官等等， 都要有自己的目标。那么我们这些修行人呢？成佛可能是大家共同的目标，这个目标对我们来说比较遥远， 但不能因为遥远就不做， 中间还有很多不同层次的修行程序， 也应该有自己的目标。比如，“作为佛教弟子，我起码得做到不撒谎”， 或者“我起码得做一个不喝酒的弟子”，“我起码得做到不杀生， 这辈子， 就算遇到生命危险也不杀！”这些只是打比方啊，对佛弟子来说，这些都是小事，必须做到。</p>\n<p>“这一生当中， 我起码得帮三个人”，“这一生当中， 我可能不能让一个人成佛， 但起码能让一个人高兴”。还有， “其他我可能做不了，但起码我这一辈子要让上师开心”。有没有这样的决心？ 师兄们可能在心里已经默默地说了， 只是我没有发现。上师没有神通啊， 只能当面说了才记得住。有时候记性不好，当面说了还会忘呢！</p>\n<p>大家都要准备一下， 不然的话， 可能我们在“佛教学校”上了一辈子学， 毕业的时候却交不出答卷， 没有毕业证， 哪个净土都不收你， 因为你没有“文凭”啊！ 所以， 师兄们想要取得好的修行成绩， 必须要有自己的规划。比如阿克益西， 他跟了我二十年， 起码能做到念一个亿的心咒。别的事情他可能做不了， 比如修行很高、慈悲心很大， 这些很难。但是他能做到念一个亿的心咒， 这是他的发心。再比如阿克瑞秋，“别</p>\n<p>的我做不了， 但是上师， 我起码一天至少得念一万遍护法。除非我生病了或者死了， 那没办法念， 但是除此之外我是会做到的。”这样就比较好， 就是要为自己定目标， 养成这样的习惯。如果你实在什么都做不了，</p>\n<p>也可以发愿： “上师， 我什么都做不了， 但是我发誓永远不会背叛佛教。”这也是让上师开心的一件大事。我们无法预知将来会有什么降临到自己 的头上， 开心、痛苦、恐惧、饥饿等等， 喜怒哀乐什么都可能会发生，</p>\n<p>都是无常的。但不管处于什么状态， 遇到什么不开心、纠结的事， 都不会放弃自己的信仰。有这么个坚定的信心， 也不错。我相信在座的弟子们会有这样的准备。</p>\n<p>上师自己在佛教团体混了几十年， 什么都没做到， 只能说是混。闻思没学好， 实修也不太好。但是我发过愿， 即使做不了什么， 但我一定要让上师开心。到现在来说， 还算及格， 不敢说百分之百让上师开心了，那也做不到， 但如果打分的话， 应该能及格。如果问法王如意宝：“你的弟子龙洋怎么样？”他会说：“还是很可爱的， 嗯， 对对对。”问师公第四世多智钦：“你的弟子龙洋怎么样？”他也会说：“还可以， 还比较可爱。”会这样说。他们不会说 “很伟大、修行很高、不得了”之类的， 但是可能会说是很可爱的。所以， 师兄们也要成为这种弟子。有人问你的上师：“龙洋活佛，你的某某弟子怎么样啊？”“嗯，很可爱的。”（上师大笑） 能做到这样就不错了。师兄们要努力地去做， 不要让上师烦心，也不要让你的师兄烦心。要是师兄看到你的时候心想“哎呀， 他又来了！他怎么又出现了呢？ 讨厌！”这样的话， 你的修行是比较失败的。要是每一个师兄弟看到你的时候很开心， “啊！你来啦！大家一起去喝个茶、嗑个瓜子嘛！”能做到这样，就说明你修得还不错。</p>\n<p>要有“一根筋”的精神</p>\n<p>师兄们要向这个方向发展。从今天开始， 自己就要发心。其实应该发大心、发大愿， 但如果最后做不到， 也是个麻烦事。所以， 你要想一想，什么是自己能做到的。“这个我可能做得到，我一定要做到！”发了愿以后，就再也不要反悔了。我们有一个毛病是什么？就是热情一来，什么都能做，但过几天， 情绪低落的时候热情就没了。再加上上师十天不理你， 那就更没了。那是不行的。不管上师把你踩在脚下一年， 两年， 三年， 你仍然坚持， 那才是真正的修行人。不然的话， 上师天天哄着你： 渴了， 给你倒杯水； 饿了， 喂你吃口饭； 不高兴了， 上师给你说说笑笑； 你辛苦了，上师得背着你……在这种状态下你才开心， 这不是修行， 这像谈恋爱。要成为弟子， 什么样的风浪都要经得起， 什么样的坎坎坷坷都要受得住。</p>\n<p>我讲过很多次， 以前那些老一辈的修行人， 他们经历过很多不同的考验， 很多。比如， 把一位比丘跟一个美女关在一个房间里， 美女的衣服全部脱光， 关在一起一个晚上、两个晚上。一般人肯定想，“啊， 我要还俗！ 马上还俗！”确实有这种事情。但人家想都不会想， 这就叫作信念坚定。</p>\n<p>还有， 把一只羊捆在那儿， 有人掏出枪来指着你的头， 说： “你把那只羊杀了， 不然我就杀了你。”这不是开玩笑， 真的有过这样的事，你要是不杀的话， 就一枪把你打死。但那些修行人宁愿选择自己死， 也不杀羊，这就是坚定的信念。</p>\n<p>以前， 我爸爸还给我讲过一件事情。他的一位弟子， 被人吊起来，手捆着， 背后还塞了很多很重的石头， 然后在他下面点火。烟熏火燎，</p>\n<p>痛得要命， 他快要受不了。人家说“你只要说一句‘我不信佛’，就把你放下来。”但是他坚决不说。后来又吊了他两次， 第三次吊上去之前，我爸爸就对他说：“你心里不放弃就可以了， 嘴里不要这么硬撑了， 不然太痛了， 你受不了。”但是他说：“上师， 你不能这样说啊， 你教我的呀， 嘴上都不能放弃佛法。”为了这个， 他一句都不说， 最后被吊了整整三天。这就叫作信念，坚定的信念，这就叫作信仰！</p>\n<p>开心的时候， 吃饱穿暖的时候就有信仰， 一旦遇到麻烦的时候就怪罪信仰， 这不叫信仰， 这是逃避责任， 为自己找个借口而已。很多人所谓的“修行”是什么呢？ 像那些明星， 我不是说明星不好， 明星里面可能也有很好的。但有一些明星是什么样的呢？ 他皈依了佛门以后， 跟上师一起拍个照， 挂在那儿， 告诉别人“嘿嘿， 我信佛的”。他需要的是这个，而不是真的去信、去修行。因为有了这个证明以后，大家会认为：“哦，你是信佛的， 可能是尊重因果的， 起码你不会骗人。”他需要这个包装。商人也是这样， 有个大老板跟一位比较出名的活佛一起拍个照， 就说：“我皈依过， 这是我的上师， 我是信佛的。”人家听了就觉得“你是信佛的，起码你不会骗人”， 但也许他骗得比别人还厉害。这种不叫信仰。所以，你信了佛以后，起码得有跟不修行的人不一样的地方，才叫作修行人。</p>\n<p>有的人修行， 我们都觉得他疯了。人家说他疯了， 他还不高兴， 但说没疯呢， 又觉得不像人样。修成这样也麻烦， 真的。坐在那里做些奇怪的动作。“你在干什么？”“佛陀给我传法呀！ 二十四小时传法！”然后还经常换， 今天是阿弥陀佛传法， 明天又换观音来传法， 但传的法都是一个系统的。这就有点不正常了。</p>\n<p>修行人是什么样子的？ 应该是很可爱、很有素质、让人很有安全感的， 而不是疯疯癫癫， 让人看了都烦的那种。修行人肯定是一个人见人爱的群体， 不会让人觉得“这个修行团体咋回事？ 都是疯疯癫癫的， 我都不想进入他们的圈子！”所以， 师兄们要想好， 要做一个稳定的， 比较单纯的、简单的， 一根筋的修行人。修行就是要一根筋， 不要太狡猾了。那些没用的、被污染了的脑筋， 不要用在修行上。就要一根筋地修，才能修得出来，没有一根筋的精神，是修不出来的。</p>\n<p>至少做一件师父满意的事</p>\n<p>师兄们要早做准备， 想一想“我成了龙洋上师的弟子， 我要回报三宝，我要回报众生， 起码也要回报自己的上师。我一定要做一件事情， 让上师高兴，让上师满意，让三宝满意。”</p>\n<p>只要一件事情， 上师的要求不过分吧？ 一件事情又不是很多。有的上师会说： “把你的车给我， 好看的手表给我。你的存款， 拿个一百万、五十万给我。不然的话， 你有寿障， 要是死了， 我怎么帮你？ 你花钱我就救你的命！”用这样的方法调整弟子， 弟子都很高兴， 很开心。这些话，上师没有说过吧！ 在座的各位， 我们在一起， 有的已经十几年了， 有的七八年。上师没有跟你们伸过手：“来， 给钱！”没有吧！上师不会这样做。不是不需要， 但是上师知道， 所有的人跟自己一样， 在这个世界上都活得不容易， 不能给大家增加太多负担。但是， 上师肯定会对弟子有要求。弟子也对上师有要求啊： “上师， 我修行要好啊！我要跟着你成佛啊！”你有这样的要求。我当然也有要求了。要求是什么呢？ 就是要你成为一个真正的修行人。我的希望就是， 最起码你要做到一件跟不修行的人不一样的事情。这是上师伸出双手跟你要的，给不给由你。</p>"}, {"slug": "上师开示/4.如何修行/4.5 修行也要有规划/如何做好自己的功课", "title": "如何做好自己的功课", "rel": "上师开示/4.如何修行/4.5 修行也要有规划/如何做好自己的功课.md", "dir": "上师开示/4.如何修行/4.5 修行也要有规划", "is_index": false, "meta": {}, "html": "<p>2013 年 10 月开示</p>\n<p>我们念的功课， 应该以什么样的方法去念？ 有什么样的功效？ 今天晚上，我给大家大概地讲一讲。</p>\n<p>最好的修行方法</p>\n<p>修行的方法有很多种。释迦牟尼佛开取了八万四千法门。他视每一个人的缘分， 每一个人的根基， 每一个人的福报的不一样， 开取了这么多的法门。你是哪一类的根基， 适合哪一种类型的法， 是由上师来决定</p>\n<p>八、修行也要有规划</p>\n<p>的， 你自己可能还不知道。你的上师是一个成就者， 有比较高境界的话，他有一个直觉， 能够直觉得到你是什么类型。所以， 因为这么多因素，我们要找一个好的上师。</p>\n<p>然后， 刚才我说过了， 有很多种的修行方法。是什么呢？有的人呢，一辈子念咒， 只念一个阿弥陀佛就成就了。有的人呢， 念一个六字大明咒，别的什么都不做，他也成就了。有的人呢，一辈子闻思，闻思以后就成就了。有的人呢， 一辈子实修， 成就了。有的人呢， 一辈子观想， 成就了。有的人呢， 可能一辈子疯疯癫癫就成就了。真的， 这是说的实话！ 有的人呢， 可能卖淫就成就了。有的人呢， 杀人就成就了， 绝对有这种人！所以，修行的路是五花八门的。</p>\n<p>那现在， 我们需要做的是什么呢？ 就是做功课！ 做功课呢， 首先，你要懂得这个功课的一些道理。懂当然好， 即使你不懂， 只要对上师有信心， 对自己的信仰有信心， 就可以去做上师布置的功课。其实， 功课里面的意思很多， 不要说你们， 我都不懂。不懂的状态下念， 还会有功效吗？我给你们举个例子， 大家都知道有一个咒语叫“瓦啊哈夏萨玛”。它的意思是什么， 我们也许不懂。但短短这几个字， 你只要念上七遍，你吃一顿肉， 哪怕是杀生的肉， 它的罪业也会消掉。你想一想， 这还是在什么都不懂的情况下，都有这个威力！</p>\n<p>再给你们讲一个小故事： 曾经有一个小偷， 溜进一个和尚的屋子，当时和尚正在念四皈依：“喇嘛拉加色切哦， 桑吉拉加色切哦， 秋拉加色切哦， 根登拉加色切哦。”他已经念习惯了， 有时候说话的时候也会冒出几句。这个时候， 突然发现有小偷进入他的房间， 他举起拐杖， 朝小偷头部敲了过去， 边敲边念四皈依， 一共敲了三下。小偷疼得要命，逃走了， 躲在一个桥下。头疼的时候就会想起“喇嘛拉加色切哦， 桑吉拉加色切哦， 秋拉加色切哦， 根登拉加色切哦。”其实他不信， 也没有念，只是因为被打痛了， 所以和尚念咒的声音一直在脑海中回响。这时来了一群很强大的魔， 正准备从这个桥上过。听声音， 就好像来了一大群人。接着， 小偷听见一个声音说：“哎哟， 这个桥下有一个皈依佛的人， 我们不能接近他， 绕着走吧。”你想想， 他不是故意去念经， 无意中脑海里声音都救了他一命。</p>\n<p>佛意的精华</p>\n<p>我们课诵集里所有的经文， 都是大德们用成就的思维和成就的语言写出来的。换句话说， 就是他们取的伏藏。成就者的语言是什么？ 就是语成就， 说什么就会成就什么。你念一遍， 念两遍， 念三遍， 反复地念，那个功德像我这样笨嘴笨脑的人是说不出来的，太多了！</p>\n<p>成就者的语言是个什么样子？跟你们讲一个例子。藏区有一位大德，他特别擅长治眼病。怎么治呢？ 他用一张纸， 里面写点东西， 卷起来，吐一泡口水， 用布裹好， 然后让病人戴上， 戴在脖子上。病人一戴就好，</p>\n<p>一戴就好。因此他在那一带就出名了。他的侍者想知道是怎么治的， 就 悄悄地看了看， 纸条上到底写的是什么？ 可是没有看清楚。有一天， 又 一个人被治好了，侍者就对那个人说：“喂，能不能打开你的纸条看一下？”因为他是上师的侍者嘛， 那个人就同意了。打开一看， 里面写的是： “我希望你的眼睛好！”没有别的。这就是语成就的功能、效用！</p>\n<p>我们刚才所说的课诵集， 是晋美林巴大师、第一世多智钦他们， 这么伟大的大德加持出来的经书。是释迦牟尼佛意的精华， 以他们的思维呈现出来的， 也可以说是取出的伏藏。我们现在念诵的课诵集， 后面的很多小字可能被简化或省略了。但是完整版的你们去看看， 念一遍会成为什么样， 念三遍会成为什么样， 念多少遍会成为什么样， 写得很清楚，那是佛的意愿。只要你是佛弟子， 不能不相信他。只要你一想：“会吗？”，那么对于你来说就“不会了”。如果你觉得一定“会”， 那就肯定会实现！所以， 为什么要念这个功课？ 我一再地说要念念念， 是因为我们， 一没![](file:///C:\\Users\\Drime\\AppData\\Local\\Temp\\ksohtml46168\\wps1.jpg)有高深的境界， 二不会很好地、完整地观想佛的形象， 也没有更多闻思条件。对我们这样的人来说， 念课诵集是最安全的路， 一定会有收获，是最好的一个方法！</p>\n<p>我很不喜欢说什么大话、空话和套话， 对于这些， 我真的很反感。但事实是怎么样呢？ 只要你成为龙钦心髓的弟子， 从那一天开始你只有两个去处， 一个是地狱， 一个是净土。没有饿鬼道、畜生道、阿修罗道等别的去处。这个不是我说的， 是佛说的。两个去处的条件是什么？ 在不破三昧耶戒的情况下， 你就会上， 没有更高的要求； 如果破了三昧耶戒， 那就下， 没有什么别的条件了， 很简单的。我们是很简单的一个群体。我们有机会念一些这么好的经文， 可以祈祷这么伟大的修行人， 成为他们的追随者、他们的眷属， 我觉得找不出第二条路线， 肯定是上！ 嗯，肯定是上！除非你对佛教、对自己的信仰没有信心， 除非你破了三昧耶戒，这个谁都没有办法，其余的都应该是好的。</p>\n<p>师兄们， 不要太悲观！ 很多人认为： “唉， 我什么时候能成就呢？我好像越修越差呀？ 我可能成就不了。”其实并不差！ 但是说了这个话以后你们不能偷懒， 不能因为上师说过， 只要是龙钦心髓的弟子， 不破戒就会成就， 你们就不努力了。修为和成就是有高低的。按我们这个修行程序来说， 第一地到十六地， 要一步一步往上走。你们不能觉得一步、一地就够了。别的可以不执着， 但是这个我们不能不执着。所以， 我们要努力， 要用功去念自己的功课。最起码， 得把功课的心咒念好。别的，可能有时太忙了什么的，但起码得把心咒念好。</p>\n<p>有的人觉得：“啊， 我懂了一些修行的核心， 就不用念咒了。”这可能对他来说， 是个特大的失误！ 以前玉科喇嘛说过， 他们正在修行的时候， 对面有一个女人对着他们唱歌， 内容大致如下：“小的、简单的</p>\n<p>做一个真正的修行人</p>\n<p>修行方面， 这些僧人瞧不起， 大的道理呢， 他们不懂， 到真正离开人间的时候， 这几个僧人都是两手空空的。”听到这里， 玉科喇嘛立刻就向那个女人磕头了。他说：“这对修行人来说是一个很好的授记。”</p>\n<p>把高攀的心态去掉</p>\n<p>现在很多人都指望大的：“我要修大圆满， 我要怎么怎么样。”对于一开始的四皈依、五加行这些修法， 他觉得太简单了， 喜欢去寻找一些云里雾里的东西。他找到了自认为的大圆满状态， 但其实不是！ 他修的是什么呢？ 天天在那儿傻呆， 修的是一些变成兔子和冬眠动物的因。真的！ 我不是说全部是这样， 有些可能不是， 但有些肯定是！ 没有大德的指点， 没有很好的窍诀， 没有从小到大积累的福报的推动， 在什么都没有的情况下， 甚至有的人前几十年还是以杀生为业的， 无恶不作， 然后突然说自己找到了大圆满的状态。谁都不用说什么， 自己发现的， 那肯定是魔！稍微懂一点闻思的人都能推理出来， 这是不应该、不可能的。</p>\n<p>所以， 大家得小心， 要把这种高攀的心态去掉。当有这样的机会，有这样的福报的时候， 你不用太傲慢， 也不用去高攀， 自然会得到的。但是这些条件都不具备的情况下， 你要去跑， 可能会伤到自己！ 法王如意宝讲课的时候说到过：“老虎跳得再远， 青蛙不要去学它， 学了以后也许会掉入悬崖， 只有灭亡！”所以一定要看清自己的状况。你小的时候做过什么？ 你的思想是个什么状态？ 你对佛的虔诚度？ 你对众生的善</p>\n<p>良程度？ 你上供下施的魄力有多大？ 你把自己的东西看得有多重？ 相比别人， 是怎么对待的？ 一年四季、从早到晚， 你的思想念头里面， 恶念多还是善念多？ 你的身体行为当中， 做的好事多， 还是坏事多？ 这些就决定了你会不会是一个最殊胜法的法器！</p>\n<p>放下自我，多为别人着想</p>\n<p>所以， 不要自己骗自己！ 很多人骗来骗去， 刚开始的时候， 还知道自己是故意骗人的， 说多了以后， 最后他自己都认为是真的了！ 和这个一样， 自己太相信自己以后， 会认为什么都是自己说得对， 别人说的不对。这个成了什么呢？就是修自己， 不是修佛法。所以， 师兄们， 要尽量放下！这个很难， 但是还是要尽量放下我执， 多为别人着想。把自己的位置定低一点， 定低一点， 把别人的位置放高一点。在这种状况下， 你的修行可能会有收获。否则， 你口口声声说是修行， 但是每一次， 算个卦是为了自己， 念个经也是为了自己， 请个客也是为了自己， 认识一个人也是为了自己。就是念四句经文， 也是为了自己生个孩子， 或者为了自己不得病，自己长寿，自己发财，自己怎么样怎么样。那就乱套了！那不是修行，真的不是！ 即使你成就了， 最多也就是个自生罗汉。自生罗汉是个什么样子？ 就是在一个状态待着， 几千年或者几亿年都在一个地方。人家早就成佛了， 他还在那儿待着。最后， 身体都变成化石了， 还在那儿待着，自己感觉很好！ 以前， 他瞧不起的人都成佛了， 但是他呢？ 还待在那个</p>\n<p>状态。所以，不要太自私了，要好好地去修行。</p>\n<p>现在对于我们来说， 没有误差的、最安全的、收获最大的修行方法是什么呢？就是念功课， 念心咒。不是为自己， 要为天下曾经做过你父亲、母亲的所有众生解脱痛苦而念。我的成就是为了帮助三界的苦难众生，</p>\n<p>至少得这样去发心。有的人说：“发心大很好， 但是， 后面能不能提一下我自己呢？”我心里想：“三界里面你都不在啊？”这就是有点点太在乎自己了。这也难怪， 我们长时间以来， 把自己裹得太紧了， 触碰不得。无论做什么都是为了我好， 为了我不疼， 为了我舒服， 为了我怎么怎么，把自己裹得像如意宝一样！ 太敏感了！ 这么多年养成的习性， 一下就把它剥掉也很难， 但是慢慢地， 像剥菜皮一样， 一点一点去剥。什么习惯都是养成的， 有的人在眼睛里面倒辣椒都习惯了， 这个有什么不能习惯的呢？</p>\n<p>要简单，不要胡思乱想</p>\n<p>所以， 师兄们， 今天在这里再说一次： 修行人要简单， 思维不要太多， 不要胡思乱想。你的思想不要成了社会上各种不好信息的“场”，一定要成为接受正能量、好信息的“场”。简单一点， 实在一点， 说话做事看得见、摸得着。上师看见你们， 很信任你们， 你们看见上师， 也很信任上师， 这种感觉是真正的修行。踏踏实实地去做。不要让上师看见你就觉得： “唉， 这个人现在在这里磕头， 也许在别的地方也磕头呢，明天后天可能又叛变了。我也难得跟你说很多真心话， 给你传一些好的法，因为你要是变了， 我白辛苦啊！ 如果给你传了一些比较要害的法， 你叛变了， 我怎么办呢？这样会把我也拖累了， 我可不想下地狱啊！”所以，你如果给上师一个这样的感觉就不太好了。那你自己呢？ 除了自己， 谁都不相信，你痛不痛苦？肯定会痛苦的。</p>\n<p>所以， 活得简单一点最好， 世界塌不下来。再复杂， 再不好， 你还</p>\n<p>是得继续生活， 那一点点气没有断之前， 必须得生活。生活差是活着，不差也是活着， 其实没有什么两样， 真的。只是有时感觉上可能不太对而已。以前的那些大德们， 在监狱里也待过， 荣华富贵的生活也经历过。我问他们是个什么样的感觉？他们说， 有时候监狱里还轻松一点。所以，不是环境的问题， 而是自己心态的问题， 关键是怎么去定调。如果你认为生活就应该是荣华富贵的， 我应该过得很好很舒服， 定了这个调， 那么你一天得不到满足的话， 天天都会觉得痛苦。如果觉得一天吃一顿饭也可以， 喝一 口水、吃一 口红薯也可以， 在这种状态下生活， 还不是过得很幸福。</p>\n<p>所以， 大家不要想得太复杂了， 要求不要太高。要求高有用吗？ 人身大小就三尺多一点， 寿命就只有几万天， 这么短暂、渺小的东西， 看得那么重要做什么呢？就像云一样， 说没就没了。你们看， 空中的云彩，有时像一座城市飘过来了， 什么山啦、水啊、牛羊等形状都有， 可是一转眼就不见了。跟这个有什么区别呢？ 打开电视的时候， 里面有战争、打杀， 有结婚、生孩子什么的，“啪”地一关， 就什么都没有了。跟这个有什么区别呢？ 睡觉的时候， 梦到自己成为一个勇士， 打下天地的时候也有， 但一醒过来什么都没有了。跟这个有什么区别呢？ 你们可以去看一看， 有些高官， 他想统治天下， 想要如何如何， 为这个付出很多努力，把摊子铺得很大， 但一夜之间啥都没了， 连自己说了算的权利都没了，失去了自由， 连上个厕所都要请示别人。这么不靠谱， 这么没有谱的人生，为什么要铺这么大的一个摊子呢？</p>\n<p>所以， 师兄们， 装也要装得像一个修行人。即便你现在还不是， 也要装成那个样子。不天天去习惯， 想一下成为好修行人是不行的。比如，打坐， 大多数人没打过的都会觉得盘腿不舒服， 但是打着打着就很舒服了。以前我小的时候很喜欢盘腿， 因为我是打着盘腿出生的， 觉得很舒服。但现在呢， 天天坐这个凳子， 就有点不习惯盘腿了， 所以习惯是很简单的。所以， 刚开始没有修行， 心态还没成熟， 还没有成为修行人的时候，得先做个样子，装成这样，慢慢就成了。</p>\n<p>所以， 大家得注意自己的行为规则， 每时每刻要记住自己是个修行人。别人做什么、别人怎么样， 和我们没有关系。但是我们不一样， 我们是佛的弟子， 身口意都已经供养了三宝。不管别人怎么说， 时代怎么变，历史怎么改， 经文怎么宣传， 都没关系！记住我们是佛的弟子， 就行了。</p>"}, {"slug": "书籍/index", "title": "书籍", "rel": "书籍/index.md", "dir": "书籍", "is_index": true, "meta": {"title": "书籍"}, "html": "<h2 id=\"toc-恩师推荐书目\">恩师推荐书目</h2>\n<h3>《大圆满龙钦宁提传承祖师传》(东珠仁波切撰著　土登华丹译中)</h3>\n<p>作者是东珠仁波切，是龙钦宁提传承的重要上师，后来在美国圆寂。</p>\n<p>http://www.duozhiqin.com/#/article/details?articleCode=AT2024010512063190&columnNo=</p>\n<h3>《大圆满前行引导文》</h3>\n<p>作者是华智仁波切，中文有三个版本：巴珠仁波切、索达吉堪布、嘎玛仁波切都翻译过。</p>\n<p><img src=\"assets/Pasted image 20260818113031.png\" width=\"201\" alt=\"Pasted image 20260818113031.png\" loading=\"lazy\"><img src=\"assets/Pasted image 20260818113108.png\" width=\"208\" alt=\"Pasted image 20260818113108.png\" loading=\"lazy\"><img src=\"assets/Pasted image 20260818113010.png\" width=\"206\" alt=\"Pasted image 20260818113010.png\" loading=\"lazy\"></p>\n<p>巴珠仁波切其实就是这一世的华智仁波切，属于是本尊自己来翻译了~</p>\n<p>索达吉堪布翻译的这个版本是流传最广的</p>\n<p>嘎玛仁波切翻译的这个是在原版的基础上丰富了很多，加入了大量比较具体的指导内容，讲得比较细。</p>\n<p><strong>恩师说过，至少要读7遍以上。</strong></p>\n<h3>《释迦牟尼佛广传·白莲花论》</h3>\n<h3>《莲花生大师传》</h3>\n<h2 id=\"toc-其他相关书籍推荐\">其他相关书籍推荐</h2>\n<h3>《大圆满传承源流蓝宝石》(辽西堪布蒋扬多杰 撰著)</h3>\n<p>这个网站上有很多珍贵资料，可以自行搜索下载</p>\n<p>https://www.buli.page/zh-hans/view/lessons/by/search/</p>\n<p><a class=\"wikilink\" data-page=\"关于本站/index\">← 返回首页</a></p>"}, {"slug": "关于本站/index", "title": "龙的传人｜Longchen Nyingtik", "rel": "关于本站/index.md", "dir": "关于本站", "is_index": true, "meta": {"title": "龙的传人｜Longchen Nyingtik", "homepage": "true", "author": "Drimed", "tags": []}, "html": "<blockquote><strong>龙钦宁提资料库</strong></blockquote>\n<p><strong>这是个人学习的资料库。</strong></p>\n<p>本站所整理的内容，主要是基于一名龙钦宁提传承修行人的个人学习角度，特别是以<strong>多智钦寺及其传承</strong>这一坐标出发，对自己阅读和接触到的资料——上师开示、历史资料、祖师传记、经典文献等——进行整理、记录与思考。</p>\n<p>如果这些整理也恰好能够对别人有所帮助，便是额外的欢喜。:)</p>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"龙钦宁提传承/龙的传人：龙钦宁提祖师“家谱”\">龙的传人：龙钦宁提祖师“家谱”</a></li><li><a class=\"wikilink\" data-page=\"龙钦宁提传承/龙钦宁提相关网站与数字资源\">龙钦宁提相关网站与数字资源</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会\">不可错过的机会</a></li><li><a class=\"wikilink\" data-page=\"书籍/书单\">书单</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/死亡是最公平的\">死亡是最公平的</a></li></ul>"}, {"slug": "关于本站/更新日志", "title": "更新日志", "rel": "关于本站/更新日志.md", "dir": "关于本站", "is_index": false, "meta": {"title": "更新日志"}, "html": "<p>「龙的传人」网站历次推送的关键变更，按时间由新到旧排列。</p>\n<p>标签：<code>新增</code> 新内容/功能 · <code>优化</code> 体验/视觉 · <code>修复</code> 问题纠正 · <code>结构</code> 目录/导航</p>\n<hr>\n<h2 id=\"toc-2026-09-02-上师法音详情页批量上线-新增-优化\">2026-09-02 · 上师法音详情页批量上线 · [新增] [优化]</h2>\n<ul><li><code>新增</code> 从多智钦寺官网批量获取 19 张经咒海报，为 29 个有海报的经咒自动生成独立详情页（标题→播放器→诵者→海报，点击海报可查看大图）。</li><li><code>优化</code> 法音列表页：有海报的经咒显示缩略图，点击进入详情页；无海报的保持原样式点击直接播放。</li><li><code>优化</code> 海报自动压缩为 WebP 格式（宽度 500-800px），加载速度提升约 80%。</li></ul>\n<h2 id=\"toc-2026-09-02-新音频-开发工具-新增-优化\">2026-09-02 · 新音频 + 开发工具 · [新增] [优化]</h2>\n<ul><li><code>新增</code> 上师开示 AI 朗读音频 2 篇：千万不要滞留在中阴间、如何反观与自省。</li><li><code>新增</code> 热更新预览模式（<code>python build_site.py --watch</code>），文件修改自动重建+浏览器自动刷新。</li><li><code>新增</code> draft 草稿机制：文章 front matter 加 <code>draft: true</code> 即不发布。</li><li><code>优化</code> 集成 GoatCounter 跨用户访问统计。</li><li><code>优化</code> 文章目录（TOC）、音频播放记忆、返回顶部按钮、404 页面。</li></ul>\n<h2 id=\"toc-2026-09-02-体验优化合集-新增-优化-修复\">2026-09-02 · 体验优化合集 · [新增] [优化] [修复]</h2>\n<ul><li><code>新增</code> 文章目录（TOC）：长文章顶部显示可折叠目录，点击跳转对应章节。</li><li><code>新增</code> 音频播放记忆：记住上次播放的音频和进度，下次打开可继续播放。</li><li><code>新增</code> 返回顶部按钮：页面滚动时出现，点击快速回到顶部。</li><li><code>新增</code> 404 页面：访问不存在的链接时显示友好提示。</li><li><code>优化</code> 法音详情页样式（参照多智钦寺）：标题→原生播放器→诵者→海报。</li><li><code>优化</code> 海报图片 WebP 压缩（加载速度提升 92%）。</li><li><code>优化</code> 音频资料折叠样式（飞书风格三角+提示）。</li><li><code>优化</code> 首页文字大小统一，音频按文章目录顺序排列。</li><li><code>新增</code> 每页访问次数统计（本设备计数）。</li><li><code>修复</code> 法音详情页点击跳转问题。</li></ul>\n<h2 id=\"toc-2026-09-02-法音详情页-音频折叠-访问统计-新增-优化-结构\">2026-09-02 · 法音详情页 + 音频折叠 + 访问统计 · [新增] [优化] [结构]</h2>\n<ul><li><code>新增</code> 上师法音独立详情页（百字明试点），参照多智钦寺样式：标题 → 原生播放器 → 诵者 → 海报，支持在线播放与下载。</li><li><code>优化</code> 海报图片 WebP 压缩（原图 4.98MB → 383KB，加载速度提升 92%）。</li><li><code>结构</code> 上师开示（AI朗读）音频按文章目录顺序排列，与文字版保持一致。</li><li><code>优化</code> 首页文字大小统一：同级标题、同级正文字号一致。</li><li><code>新增</code> 音频资料折叠样式（飞书风格）：分组标题带三角，点击展开/收起，附提示文字。</li><li><code>新增</code> 每个页面访问次数统计（本设备计数），顶部导航栏显示。</li></ul>\n<h2 id=\"toc-2026-08-31-AI-问答-划线分享-新增-优化\">2026-08-31 · AI 问答 + 划线分享 · [新增] [优化]</h2>\n<ul><li><code>新增</code> AI 问答入口（首页卡片 / 导航栏 / 文章页浮动按钮），链接至 ima 知识库。</li><li><code>新增</code> 划线与分享系统：选中文字可划线 / 复制 / 分享，分享生成卡片图片（含文章链接二维码），每篇文章有独立可分享 URL。</li><li><code>优化</code> 点击已划线文字弹出操作菜单（取消划线 / 复制 / 分享）；阅读进度自动记忆与恢复。</li><li><code>新增</code> 2 篇上师开示 AI 朗读音频：修行程序拒绝 DIY、成就的必由之路。</li></ul>\n<h2 id=\"toc-2026-08-27-导航简化-SEO-锁屏播放-优化-新增-修复-结构\">2026-08-27 · 导航简化 + SEO + 锁屏播放 · [优化] [新增] [修复] [结构]</h2>\n<ul><li><code>结构</code> 导航简化为 5 个一级菜单，点击直接进入各分类 Index 页（完整目录树）。</li><li><code>新增</code> 手机端面包屑目录弹层：点击上一级目录弹出子目录 + 文章列表。</li><li><code>优化</code> 学的关键问题</span><button class=\"play-btn\" data-audio=\"求学的关键问题.mp3\">▶ 播放</button></li></ul>"}, {"slug": "音频资源/3. 上师赞歌/index", "title": "上师赞歌", "rel": "音频资源/3. 上师赞歌/index.md", "dir": "音频资源/3. 上师赞歌", "is_index": true, "meta": {"title": "上师赞歌"}, "html": "<h1>上师赞歌（音频）</h1>\n<p>本文件夹收录赞颂上师的赞歌音频，可直接在下方收听，也可用底部播放器连播。</p>"}, {"slug": "龙钦宁提传承/index", "title": "龙钦宁提传承", "rel": "龙钦宁提传承/index.md", "dir": "龙钦宁提传承", "is_index": true, "meta": {"title": "龙钦宁提传承"}, "html": "<h1>龙钦宁提传承</h1>\n<p>龙钦宁提（Longchen Nyingthik）是大圆满教法的核心传承之一。本栏目整理该传承的相关资料与祖师传记，便于系统学习与查阅。</p>"}, {"slug": "龙钦宁提传承/龙的传人：龙钦宁提祖师“家谱”", "title": "龙的传人：龙钦宁提祖师“家谱”", "rel": "龙钦宁提传承/龙的传人：龙钦宁提祖师“家谱”.md", "dir": "龙钦宁提传承", "is_index": false, "meta": {}, "html": "<h2 id=\"toc-从晋美林巴到第五世多智钦\">——从晋美林巴到第五世多智钦</h2>\n<p>看《大圆满龙钦宁提祖师传》，对我来说比较困难的点主要有两个：</p>\n<p>一是复杂的传承转世关系。人物一多，我就经常搞不清谁是谁，尤其是师徒关系、转世关系的时候脑子直接变浆糊。</p>\n<p>更难上加难的是，有的传承祖师有两个甚至三个名字......</p>\n<p>于是，记忆人物关系对我来说就变成了指数级增长的困难。</p>\n<p>但作为龙的传人，怎能不了解清楚自己的“家谱”呢？</p>\n<p>于是，我特意搜集整理了祖师大德们的名字，按照传承先后顺序分别列举。</p>\n<p>不过，整理以后我才发现：</p>\n<p><strong>龙钦宁提的“家谱”，其实并不是一棵简单的家谱树。</strong></p>\n<p>它同时包含了“远传承”“近传承”“师徒传承”“法脉传承”和“转世传承”等不同关系。</p>\n<p>如果把这些关系全部挤在一条线上，反而会越看越乱。</p>\n<p>所以，在正式开始之前，先把这张“家谱”的读法说清楚。</p>\n<hr>\n<h1>一、先搞清楚：传承不是一条直线</h1>\n<p>龙钦宁提（Longchen Nyingtik）的源流，通常可以追溯到大圆满的甚深传承，经由印度诸位祖师传入西藏，经过莲花生大士、无垢友、毗卢遮那、益西措嘉等传承人物，最终由大圆满全知龙钦巴尊者进一步汇集、阐释。</p>\n<p>到了十八世纪，晋美林巴在修行过程中得到龙钦巴的三次清净显现，并由此发现、整理出后来被称为“龙钦宁提”的伏藏教法体系。</p>\n<p>Nyingtik Project 对这一历史过程的概括是：晋美林巴受到龙钦巴的启示，于1759年开始闭关，经过一系列清净显现，于1764年首次向弟子传授这一伏藏循环；这一体系后来由他的弟子传播到藏地各地乃至不丹、蒙古等地。</p>\n<p>因此，可以先把最基本的源流记成：</p>\n<blockquote><strong>普贤王如来 → 金刚萨埵 → 嘎绕多杰 → 文殊友 → 诗利辛哈 → 益西宁波 → 无垢友 → 莲花生大士等 → 龙钦巴 → 晋美林巴</strong></blockquote>\n<p>当然，这只是“远传承”的骨架。</p>\n<p>真正让我们今天能够看到一个完整的龙钦宁提传承体系的，是<strong>晋美林巴之后的弟子和后世传承者</strong>。</p>\n<hr>\n<h1>二、晋美林巴：龙钦宁提传承的关键人物</h1>\n<h2 id=\"toc-晋美林巴\">晋美林巴</h2>\n<p><strong>藏文：</strong> འཇིགས་མེད་གླིང་པ།</p>\n<p><strong>Wylie：</strong> 'Jigs med gling pa</p>\n<p><strong>英文：</strong> Jigme Lingpa</p>\n<p>晋美林巴（1730–1798）是龙钦宁提教法的伏藏师。</p>\n<p>他受到龙钦巴三次清净显现的启发，将所得伏藏整理为一个完整的修行体系，其中包括前行、上师瑜伽、本尊、圆满次第以及大圆满等不同层次的修持。</p>\n<p>1764年，他首次向十五位弟子传授龙钦宁提教法。</p>\n<p>因此，如果要给龙钦宁提寻找一个历史上的“开创性人物”，那么晋美林巴是绕不开的核心人物。</p>\n<p>但需要特别注意：</p>\n<p><strong>晋美林巴不是凭一己之力把龙钦宁提传到今天。</strong></p>\n<p>真正使这一教法广泛传播的，是他的弟子们。</p>\n<p>其中最重要的，是后来被称为“晋美四兄弟”或“四位晋美”的几位弟子：</p>\n<p>|序号|中文名|Wylie / 英文常见写法|主要传承意义|</p>\n<p>|---|---|---|---|</p>\n<p>|1|第一世多智钦·晋美赤列沃瑟|Dodrupchen Jigme Trinlé Özer|多智钦传承的主要持有者|</p>\n<p>|2|晋美嘉威纽古|Jigme Gyalwé Nyugu|后来形成巴珠、恰扎等重要传承支系|</p>\n<p>|3|晋美诺察|Jigme Ngotsar|龙钦宁提重要传承持有者|</p>\n<p>|4|晋美贡卓南嘉|Jigme Künzang? / Kundröl Namgyal|不丹等地的重要传播支系|</p>\n<p>不同资料对于“晋美四兄弟”的具体名单并不完全一致。例如 Nyingtik Project 提到一个常见的“四晋美”名单，同时指出另有版本会以晋美果察等人替代其中一位，因此这里不宜把不同传承祈请文中的名单简单视为唯一固定名单。</p>\n<p>这也正是后来龙钦宁提出现多条法脉的原因。</p>\n<hr>\n<h1>三、第一世多智钦：多智钦传承真正的起点</h1>\n<h2 id=\"toc-第一世多智钦\">第一世多智钦</h2>\n<p><strong>藏文名：</strong> རྡོ་གྲུབ་ཆེན་འཇིགས་མེད་ཕྲིན་ལས་འོད་ཟེར</p>\n<p><strong>常见英文：</strong> Dodrupchen Jigme Trinle Özer / Jigme Trinlé Özer</p>\n<p><strong>中文常见名：</strong> 晋美赤列沃瑟、晋美赤列欧瑟、晋美丹增沃瑟等不同译写</p>\n<p><strong>身份：</strong> 第一世多智钦仁波切</p>\n<p>第一世多智钦晋美赤列沃瑟，是晋美林巴最重要的弟子之一，也是后来多智钦传承的核心持有者。</p>\n<p>他被晋美林巴认定为龙钦宁提教法的重要未来持有者，并承担了弘扬这一教法的重任。(<a href=\"https://encyclopediaofbuddhism.org/wiki/Dodrupchen_Jigme_Trinle_Ozer\" target=\"_blank\" rel=\"noopener\">Encyclopedia of Buddhism</a>)</p>\n<p>Nyingtik Project 所整理的龙钦宁提多智钦传承祈请文，也把：</p>\n<blockquote>龙钦巴 → 晋美林巴 → 第一世多智钦</blockquote>\n<p>列为多智钦支系的核心传承序列。</p>\n<p>第一世多智钦后来在安多地区弘扬龙钦宁提，并建立了多智钦寺，使这里逐渐成为龙钦宁提的重要传承中心。</p>\n<p>所以：</p>\n<blockquote>**晋美林巴是龙钦宁提的伏藏师与教法源头；<br>第一世多智钦，则是多智钦传承最重要的奠基者。**</blockquote>\n<hr>\n<h1>四、第一世多智钦之后：这里开始出现“树枝”</h1>\n<p>这一部分特别容易把人看晕。</p>\n<p>因为第一世多智钦的传承，并不是简单地：</p>\n<blockquote>第一世 → 第二世 → 第三世 → 第四世</blockquote>\n<p>然后一直传下来。</p>\n<p>事实上，第一世多智钦把龙钦宁提传给了许多重要弟子。</p>\n<p>例如：</p>\n<ul><li>晋美嘉威纽古；</li></ul>\n<ul><li>第四世佐钦仁波切敏珠南凯多杰；</li></ul>\n<ul><li>多钦则益西多杰；</li></ul>\n<ul><li>嘉色贤彭塔耶；</li></ul>\n<ul><li>其他重要祖师。</li></ul>\n<p>Lotsawa House 所收录的《传承教授记录》中，就明确列出了第一世多智钦之后的一条重要传承：</p>\n<blockquote>第一世多智钦晋美赤列沃瑟<br>→ 第四世佐钦仁波切敏珠南凯多杰<br>→ 多钦则益西多杰<br>→ 嘉色贤彭塔耶<br>→ 堪钦贝玛瓦<br>→ 蒋扬钦哲旺波<br>→ 阿宗珠巴等后世祖师</blockquote>\n<p>同时，第一世多智钦的另一条重要传承则经由晋美嘉威纽古、巴珠仁波切等人继续流传。</p>\n<p>因此，<strong>“多智钦转世系统”和“龙钦宁提法脉传承”一定要分开来看。</strong></p>\n<hr>\n<h1>五、多智钦活佛的五世转世谱</h1>\n<p>现在终于到了最容易混淆、但也最容易整理的一部分。</p>\n<h3 id=\"toc-五世多智钦的-转世序列-是\">五世多智钦的“转世序列”是：</h3>\n<blockquote><strong>第一世多智钦·晋美赤列沃瑟</strong><br>↓<br><strong>第二世多智钦·晋美彭措炯乃</strong><br>↓<br><strong>第三世多智钦·晋美丹贝尼玛</strong><br>↓<br><strong>第四世多智钦·土登赤列巴扎</strong><br>↓<br><strong>第五世多智钦·土登龙洋仁增嘉措</strong></blockquote>\n<p>需要特别强调：</p>\n<p><strong>这五位是同一多智钦活佛系统的五代转世，并不意味着他们之间是一代一代的师徒关系。</strong></p>\n<p>这一点是读《大圆满龙钦宁提祖师传》时最容易混淆的地方。</p>\n<hr>\n<h1>六、五世多智钦名字对照表</h1>\n<p>下面这张表，是我自己整理这套“家谱”时最需要的一张表。</p>\n<p>|转世序号|中文常见称呼|英文常见写法|名号 / 法名|</p>\n<p>|---|---|---|---|</p>\n<p>|第一世|第一世多智钦|First Dodrupchen Rinpoche|晋美赤列沃瑟 / Jigme Trinlé Özer|</p>\n<p>|第二世|第二世多智钦|Second Dodrupchen Rinpoche|晋美彭措炯乃 / Jigme Puntsok Jungné|</p>\n<p>|第三世|第三世多智钦|Third Dodrupchen Rinpoche|晋美丹贝尼玛 / Jigme Tenpé Nyima|</p>\n<p>|第四世|第四世多智钦|Fourth Dodrupchen Rinpoche|土登赤列巴扎 / Tupten Trinlé Palzangpo|</p>\n<p>|第五世|第五世多智钦|Fifth Dodrupchen Rinpoche|土登龙洋仁增嘉措 / Tupten Long-yang Rinzen Gyatso|</p>\n<p>其中第五世多智钦的资料目前可以相互印证：Lotsawa House 的人物页面列名为 <strong>Tupten Long-yang</strong>，并收录了“土登龙洋仁增嘉措”的长久住世祈祷文；Nyingtik Project 则使用 <strong>Jigme Long-yang</strong> 的写法。</p>\n<p>因此，<strong>“龙洋”“土登龙洋”“土登龙洋仁增嘉措”“Tupten Long-yang”“Jigme Long-yang”在资料检索时都值得保留为关键词，但不能不加说明地把它们全部当成完全相同的“本名”。</strong></p>\n<hr>\n<h1>七、第二世多智钦：晋美彭措炯乃</h1>\n<h2 id=\"toc-第二世多智钦\">第二世多智钦</h2>\n<p><strong>中文：</strong> 晋美彭措炯乃</p>\n<p><strong>英文：</strong> Jigme Puntsok Jungné</p>\n<p><strong>身份：</strong> 第二世多智钦仁波切</p>\n<p>第二世多智钦是第一世多智钦的转世。</p>\n<p>需要注意的是，在龙钦宁提的实际传承中，他并不是简单地“接替前一世的位置”就结束了。</p>\n<p>他自身也是重要的教法持有者，并与其他重要祖师之间形成了复杂的师承关系。</p>\n<p>在多智钦传承祈请文中，第二世多智钦与蒋扬钦哲旺波、第三世多智钦等人物同时出现，这说明实际传承是通过不同祖师之间的互相传授而延续下来的。</p>\n<hr>\n<h1>八、第三世多智钦：晋美丹贝尼玛</h1>\n<h2 id=\"toc-第三世多智钦\">第三世多智钦</h2>\n<p><strong>中文：</strong> 晋美丹贝尼玛</p>\n<p><strong>英文：</strong> Jigme Tenpé Nyima</p>\n<p><strong>常见称呼：</strong> Third Dodrupchen Rinpoche</p>\n<p>第三世多智钦是十九世纪后期至二十世纪初的重要龙钦宁提传承持有者。</p>\n<p>他不仅属于多智钦活佛转世系统，也是龙钦宁提重要法本和仪轨的作者、整理者之一。</p>\n<p>例如，Nyingtik Project 在介绍 Rigdzin Düpa 相关资料时，就列出了第三世多智钦所作的传承祈请文《Rain of Siddhis》等作品。</p>\n<p>第三世多智钦的一个重要特点是：</p>\n<blockquote><strong>他既是“多智钦第三世”，又是龙钦宁提后期文献与实践传统的重要贡献者。</strong></blockquote>\n<p>这就是为什么在研究龙钦宁提的时候，第三世多智钦的名字会反复出现。</p>\n<hr>\n<h1>九、第三世之后：为什么会出现两个“第四世”？</h1>\n<p>这里是整个家谱里最需要特别说明的地方。</p>\n<p>第三世多智钦圆寂后，关于第四世多智钦的认定曾出现复杂情况。</p>\n<p>相关资料记载，有两位活佛分别被认定为第三世多智钦的转世，并一同被迎请回多智钦寺学习和生活。</p>\n<p>后来其中一位留在藏地，而另一位前往锡金，并在那里建立了自己的道场。</p>\n<p>多智钦寺相关中文资料对此有较详细的记载。</p>\n<p>因此，如果你以后在不同资料中看到不同的“第四世多智钦”名字，<strong>千万不要马上判断其中一个是错的</strong>。</p>\n<p>这正是需要进一步研究“认定传统”和“传承座次”的地方。</p>\n<hr>\n<h1>十、第四世多智钦：土登赤列巴扎</h1>\n<p><strong>藏文：</strong> ཐུབ་བསྟན་ཕྲིན་ལས་དཔལ་བཟང་པོ</p>\n<p><strong>英文常见写法：</strong> Tupten Trinlé Palzangpo</p>\n<p><strong>中文常见写法：</strong></p>\n<ul><li>土登赤列巴扎</li></ul>\n<ul><li>土登成利华桑波</li></ul>\n<ul><li>土登成利巴桑</li></ul>\n<ul><li>土登赤列巴桑</li></ul>\n<ul><li>晋美土登赤列巴扎等</li></ul>\n<p>由于藏文姓名在不同语言中的音译方式不同，所以中文资料中的写法会有较大差异。</p>\n<p>Nyingtik Project 明确将第四世多智钦列为：</p>\n<blockquote><strong>Tubten Trinlé Pal Zangpo aka Jikmé Trinlé Palbar</strong></blockquote>\n<p>即“土登赤列巴桑/巴扎”以及“晋美赤列巴巴”等不同名称。</p>\n<p>他是二十世纪极为重要的龙钦宁提传承持有者，也是多智钦寺传承在现代世界继续传播的重要人物。</p>\n<hr>\n<h1>十一、第四世多智钦真正重要的“师承关系”</h1>\n<p>这里又要把“转世关系”和“师徒关系”分开。</p>\n<p>第四世多智钦虽然是第三世多智钦的转世，但他获得龙钦宁提完整传承的重要老师之一，是：</p>\n<h2 id=\"toc-堪布贡秋扎巴-贡巴-堪布贡钦巴-Khenpo-Kunpal\">堪布贡秋扎巴·贡巴 / 堪布贡钦巴（Khenpo Kunpal）</h2>\n<p>相关资料记载，第四世多智钦年幼时从堪布昆巴（Khenpo Kunpal）获得了《宁提雅希》和龙钦宁提的灌顶、口传和教授。</p>\n<p>而 Khenpo Kunpal 本身又是第三世多智钦和巴珠仁波切的弟子。</p>\n<p>于是出现了一条非常有意思的关系：</p>\n<blockquote><strong>巴珠仁波切 / 第三世多智钦</strong><br>↓<br><strong>Khenpo Kunpal</strong><br>↓<br><strong>第四世多智钦</strong></blockquote>\n<p>这就是为什么不能简单地把：</p>\n<blockquote>第三世 → 第四世</blockquote>\n<p>理解成全部的法脉关系。</p>\n<p><strong>转世关系和教法传承，在这里交织在了一起。</strong></p>\n<hr>\n<h1>十二、第四世多智钦与彻扎仁波切</h1>\n<p>第四世多智钦还从许多当代大德处获得过完整的教法。</p>\n<p>其中非常重要的是：</p>\n<p><strong>玉霍彻扎瓦·却英让卓（Yukhok Chatralwa Chöying Rangdrol）</strong></p>\n<p>第四世多智钦曾从他那里接受大圆满彻却、脱噶以及相关口诀教授。</p>\n<p>相关传记资料甚至记载，玉霍彻扎瓦称赞第四世多智钦为其众多大圆满弟子中非常杰出的弟子。</p>\n<p>此外，他还曾从：</p>\n<ul><li>阿鹏伏藏师；</li></ul>\n<ul><li>蒋扬钦哲确吉罗卓；</li></ul>\n<ul><li>第六世佐钦仁波切；</li></ul>\n<ul><li>彻钦贡珠；</li></ul>\n<ul><li>佐钦堪布贡波等</li></ul>\n<p>诸多上师处获得教法。</p>\n<p>因此，第四世多智钦既继承了多智钦自身的龙钦宁提传统，又通过当时诸多大德进一步完善了自己的闻思修持。</p>\n<hr>\n<h1>十三、第五世多智钦：土登龙洋仁增嘉措</h1>\n<h2 id=\"toc-第五世多智钦\">第五世多智钦</h2>\n<p><strong>中文常见名：</strong></p>\n<blockquote>土登龙洋<br>土登龙洋仁波切<br>土登龙洋仁增嘉措</blockquote>\n<p><strong>英文：</strong></p>\n<blockquote>Tupten Long-yang<br>Fifth Dodrupchen Rinpoche<br>Jigme Long-yang</blockquote>\n<p>第五世多智钦是第四世多智钦的转世。</p>\n<p>他在第四世多智钦圆寂之后被认定为第五世多智钦，并继续承担多智钦寺及其传承的延续。</p>\n<p>Lotsawa House 目前已经建立了第五世多智钦的独立资料页面，并明确列出其名称为 <strong>Tupten Long-yang</strong>。</p>\n<p>Nyingtik Project 在2025年的项目报告中则称其为：</p>\n<blockquote><strong>Fifth Dodrupchen Rinpoche, Jigme Long-yang</strong></blockquote>\n<p>并记载了其圆寂的消息。</p>\n<p>因此，如果以后检索英文资料：</p>\n<blockquote><strong>Tupten Long-yang</strong></blockquote>\n<p>和</p>\n<blockquote><strong>Jigme Long-yang</strong></blockquote>\n<p>都值得搜索。</p>\n<hr>\n<h1>十四、五世多智钦：名字到底应该怎么记？</h1>\n<p>为了以后自己查资料方便，我建议直接保存下面这张表。</p>\n<p>|转世|中文核心名|英文核心名|其他常见名称|最好记住什么|</p>\n<p>|---|---|---|---|---|</p>\n<p>|第一世|晋美赤列沃瑟|Jigme Trinlé Özer|Dodrupchen I|<strong>龙钦宁提早期核心持有者</strong>|</p>\n<p>|第二世|晋美彭措炯乃|Jigme Puntsok Jungné|Dodrupchen II|<strong>第一世转世</strong>|</p>\n<p>|第三世|晋美丹贝尼玛|Jigme Tenpé Nyima|Dodrupchen III|<strong>重要文献、仪轨传承者</strong>|</p>\n<p>|第四世|土登赤列巴扎|Tupten Trinlé Palzangpo|Jikmé Trinlé Palbar 等|<strong>现代多智钦传承核心持有者</strong>|</p>\n<p>|第五世|土登龙洋仁增嘉措|Tupten Long-yang / Jigme Long-yang|Fifth Dodrupchen|<strong>第四世转世</strong>|</p>\n<hr>\n<h1>十五、如果只记一条“多智钦家谱”，记这一条</h1>\n<p>如果我只是为了帮助自己读《大圆满龙钦宁提祖师传》，其实没必要一开始就把所有人物全部背下来。</p>\n<p>先记住这一条：</p>\n<blockquote>### 晋美林巴<br><br>↓<br><br>### 第一世多智钦·晋美赤列沃瑟<br><br>↓<br><br>### 第二世多智钦·晋美彭措炯乃<br><br>↓<br><br>### 第三世多智钦·晋美丹贝尼玛<br><br>↓<br><br>### 第四世多智钦·土登赤列巴扎<br><br>↓<br><br>### 第五世多智钦·土登龙洋仁增嘉措</blockquote>\n<p><strong>这是一条“转世家谱”。</strong></p>\n<p>然后再记另一条：</p>\n<blockquote>### 晋美林巴<br><br>↓<br><br>### 第一世多智钦<br><br>↓<br><br>### 众多弟子与传承持有者<br><br>↓<br><br>### 巴珠、蒋扬钦哲、阿宗珠巴等不同支流<br><br>↓<br><br>### 现代各地龙钦宁提传承</blockquote>\n<p><strong>这是一张“法脉地图”。</strong></p>\n<p>两张图不要混在一起。</p>\n<hr>\n<h1>十六、真正完整的龙钦宁提“家谱”，其实应该这样看</h1>\n<p>如果把目前这些资料综合起来，可以先画出一个非常简化的骨架：</p>\n<p>```text</p>\n<p>普贤王如来</p>\n<p>↓</p>\n<p>金刚萨埵</p>\n<p>↓</p>\n<p>嘎绕多杰</p>\n<p>↓</p>\n<p>文殊友</p>\n<p>↓</p>\n<p>诗利辛哈</p>\n<p>↓</p>\n<p>益西宁波</p>\n<p>↓</p>\n<p>无垢友</p>\n<p>↓</p>\n<p>莲花生大士等</p>\n<p>↓</p>\n<p>龙钦巴</p>\n<p>↓</p>\n<p>晋美林巴</p>\n<p>│</p>\n<p>├───────────────┐</p>\n<p>↓               ↓</p>\n<p>第一世多智钦       晋美嘉威纽古</p>\n<p>│               │</p>\n<p>│               ├── 巴珠仁波切</p>\n<p>│               │      ↓</p>\n<p>│               │   龙钦宁提诸多支流</p>\n<p>│               │</p>\n<p>│               └── 其他传承</p>\n<p>│</p>\n<p>├── 诸重要弟子</p>\n<p>│</p>\n<p>↓</p>\n<p>第二世多智钦</p>\n<p>↓</p>\n<p>第三世多智钦</p>\n<p>↓</p>\n<p>第四世多智钦</p>\n<p>↓</p>\n<p>第五世多智钦</p>\n<p>```</p>\n<p>而在第一世多智钦这一支中，又存在：</p>\n<blockquote>第一世多智钦<br>→ 第四世佐钦仁波切敏珠南凯多杰<br>→ 多钦则益西多杰<br>→ 嘉色贤彭塔耶<br>→ 堪钦贝玛瓦<br>→ 蒋扬钦哲旺波<br>→ 后世诸传承</blockquote>\n<p>以及：</p>\n<blockquote>第一世多智钦<br>→ 晋美嘉威纽古<br>→ 巴珠仁波切<br>→ 纽修隆多<br>→ 堪布阿旺班智达<br>→ 彻扎仁波切</blockquote>\n<p>等不同支流。</p>\n<p>因此，<strong>“龙钦宁提传承”不是一棵只有一根树干的树，而更像是一棵从晋美林巴时代开始迅速分枝、又彼此交叉授受的大树。</strong></p>\n<p>Nyingtik Project 也特别提醒，现存龙钦宁提传承有很多不同支流，今天较为广泛的包括多智钦、恰扎、南卓林、阿宗加和雪谦等传统。</p>\n<hr>\n<h1>十七、最后：给自己留一个“查名字”的办法</h1>\n<p>经过这次整理，我发现：</p>\n<p><strong>真正困难的可能不是记住祖师，而是记住“同一个祖师为什么会有这么多名字”。</strong></p>\n<p>所以以后遇到一个陌生人物，我准备先问自己四个问题：</p>\n<h3 id=\"toc-①-这是他的什么名字\">① 这是他的什么名字？</h3>\n<p>是：</p>\n<ul><li>本名？</li></ul>\n<ul><li>法名？</li></ul>\n<ul><li>尊号？</li></ul>\n<ul><li>活佛序号？</li></ul>\n<ul><li>密名？</li></ul>\n<ul><li>俗名？</li></ul>\n<ul><li>藏文名？</li></ul>\n<ul><li>英文转写？</li></ul>\n<h3 id=\"toc-②-他属于哪一代\">② 他属于哪一代？</h3>\n<p>例如：</p>\n<blockquote>Third Dodrupchen</blockquote>\n<p>首先意味着：</p>\n<blockquote><strong>第三世多智钦</strong></blockquote>\n<p>而不是某一种法名。</p>\n<h3 id=\"toc-③-他和前后人物是什么关系\">③ 他和前后人物是什么关系？</h3>\n<p>是：</p>\n<blockquote>师徒？</blockquote>\n<p>还是：</p>\n<blockquote>转世？</blockquote>\n<p>还是：</p>\n<blockquote>同一传承中的法脉关系？</blockquote>\n<p>还是：</p>\n<blockquote>只是互相授过某个法？</blockquote>\n<h3 id=\"toc-④-这条关系属于哪一条法脉\">④ 这条关系属于哪一条法脉？</h3>\n<p>这是最关键的。</p>\n<p>因为一个祖师完全可能：</p>\n<blockquote>从 A 上师那里得到龙钦宁提；<br>从 B 上师那里得到大圆满；<br>从 C 上师那里得到其他伏藏；<br>自己又把某一支传给 D。</blockquote>\n<p>所以：</p>\n<blockquote><strong>一个人可以同时出现在多条传承线上。</strong></blockquote>\n<p>这也是为什么单纯按照“师父—徒弟”画一条线，永远无法完整描述龙钦宁提的历史。</p>\n<hr>\n<h2 id=\"toc-写在最后\">写在最后</h2>\n<p>整理这份“家谱”的目的，并不是想把一个庞大的传承压缩成几张表格。</p>\n<p>恰恰相反。</p>\n<p>是因为人物越来越多、名字越来越复杂，我才更想先把这些名字一个个认清楚。</p>\n<p>**先知道谁是谁，才能慢慢知道他们之间发生过什么；</p>\n<p>先知道法脉从哪里来，才知道自己正在学习的东西从哪里来。**</p>\n<p>对我而言，这大概就是“做一个龙的传人”最朴素的一件事：</p>\n<p><strong>至少，先把自己的家谱认认清楚。</strong></p>\n<blockquote>_资料整理仍在进行中。本文中的藏文转写、中文译名及部分师承关系，因不同文献、不同传承及不同译者的处理方式而存在差异。对于尚未充分核实的内容，本站将尽量标明来源，并在后续研究中继续修订。_</blockquote>"}, {"slug": "龙钦宁提传承/龙钦宁提相关网站与数字资源", "title": "龙钦宁提相关网站与数字资源", "rel": "龙钦宁提传承/龙钦宁提相关网站与数字资源.md", "dir": "龙钦宁提传承", "is_index": false, "meta": {}, "html": "<p>龙钦宁提（Longchen Nyingtik，ཀློང་ཆེན་སྙིང་ཐིག）自十八世纪由晋美林巴（Jigme Lingpa）发掘以来，经过历代祖师和众多传承持有者的弘扬，已经在藏地及世界各地形成了广泛的传播。</p>\n<p>今天，在网络上可以找到大量与龙钦宁提相关的资料：有以经典翻译为主的，有保存藏文原典的，有研究祖师和历史人物的，有整理传承谱系的，也有以图像、唐卡和仪轨传统为重点的。</p>\n<p>这些网站各有侧重，没有一个能够囊括所有资料的“总网站”。</p>\n<p>因此，本网站并不打算做一个搬运工，把网络上已有的资料重新大量复制过来，而更愿意做一个<strong>入口和索引</strong>：把值得关注的相关网站做梳理整理，并说明它们各自擅长什么。</p>\n<p>本站的一切内容，都是基于一个龙钦宁提修行人的视角，且是从<strong>多智钦寺及其传承</strong>这一观察角度出发，对自己阅读和研究过程中接触到的资料进行整理、记录和思考。</p>\n<p>这里推荐的网站所包含的内容非常广博，且因为龙钦宁提传承遍及非常多的教派和国家，可能它们之间对于同一内容的表述存在差异。对于不同传统、不同版本和不同解释，最好回到原始文献和具体传承背景中去理解。</p>\n<hr>\n<h2 id=\"toc-一-龙钦宁提专项研究-Nyingtik-Project\">一、龙钦宁提专项研究：Nyingtik Project</h2>\n<p><strong>网站：</strong> <a href=\"https://www.longchennyingtik.org/\" target=\"_blank\" rel=\"noopener\">Nyingtik Project</a></p>\n<p>这是目前网络上非常值得关注的龙钦宁提专项研究项目之一。</p>\n<p>它的核心目标，是对龙钦宁提的核心文献（Nyingtik Tsapö）进行系统研究、整理和英译。项目从2017年前后开始筹备，2020年正式启动，并持续与相关传承和文献机构合作。项目网站目前仍在持续更新，2026年也有新的研究和翻译进展。</p>\n<p>它尤其值得关注的地方，是并不满足于简单介绍“龙钦宁提是什么”，而是进一步研究：</p>\n<ul><li>核心文献究竟包括哪些文本；</li></ul>\n<ul><li>不同文本之间是什么关系；</li></ul>\n<ul><li>哪些文本已经翻译；</li></ul>\n<ul><li>哪些仍在进行中；</li></ul>\n<ul><li>不同传承中的仪轨和实践传统有什么差异；</li></ul>\n<ul><li>文献在不同寺院中是怎样保存和流传的。</li></ul>\n<p>项目网站还特别介绍了与<strong>多智钦寺（Dodrupchen Monastery）</strong>及 BDRC 的合作，以及多智钦寺相关出版物的数字化工作。多智钦寺保存和出版的大量龙钦宁提相关资料，因此具有特别重要的文献价值。</p>\n<p><strong>推荐理由：★★★★★</strong></p>\n<p>如果想比较系统地了解龙钦宁提的核心文献，这是非常值得从这里开始的网站。</p>\n<hr>\n<h2 id=\"toc-二-Lotsawa-House-最实用的在线翻译资料库之一\">二、Lotsawa House：最实用的在线翻译资料库之一</h2>\n<p><strong>网站：</strong> <a href=\"https://www.lotsawahouse.org/\" target=\"_blank\" rel=\"noopener\">Lotsawa House</a></p>\n<p>Lotsawa House 并不是专门为龙钦宁提建立的网站，而是一个规模很大的佛教文献翻译与阅读平台。</p>\n<p>它的特点，是把大量已经完成的佛教经典、祈愿文、传记、开示和注释，以主题的方式整理出来。</p>\n<p>其中专门有：</p>\n<p><strong>Longchen Nyingtik Series</strong></p>\n<p>目前可以按英语、德语、西班牙语、法语、葡萄牙语、意大利语、中文和藏文等语言查看相关资料。龙钦宁提主题下又继续分为祈愿文、注释、Rigdzin Düpa、Palchen Düpa、Takhyung Barwa、Tiklé Gyachen、Yumka Dechen Gyalmo、前行等不同类别。</p>\n<p>Lotsawa House 还与 Nyingtik Project 有直接联系。Nyingtik Project 已完成或正在推进的许多英文翻译，会陆续通过 Lotsawa House 提供给读者。</p>\n<p><strong>推荐理由：★★★★★</strong></p>\n<p>如果你已经知道某一位祖师、某一篇祈愿文或某一部龙钦宁提相关文本，Lotsawa House 往往是非常方便的在线阅读入口。</p>\n<hr>\n<h2 id=\"toc-三-BDRC-寻找藏文原典的重要入口\">三、BDRC：寻找藏文原典的重要入口</h2>\n<p><strong>网站：</strong> <a href=\"https://www.bdrc.io/\" target=\"_blank\" rel=\"noopener\">Buddhist Digital Resource Center</a></p>\n<p>如果说 Lotsawa House 更像一个“方便人阅读的翻译图书馆”，那么 BDRC 更接近一个大型的<strong>佛教文献数字档案馆</strong>。</p>\n<p>BDRC 的使命是寻找、保存、编目和传播佛教文献。其在线档案目前保存了数千万页佛教文献，是藏学、佛教文献研究和文本检索的重要资源。</p>\n<p>对于研究龙钦宁提而言，BDRC 特别重要的一点，是它所保存的不仅仅是现代网页文章，还有大量藏文书籍、文集和寺院出版物。</p>\n<p>例如，Nyingtik Project 曾介绍，<strong>多智钦寺出版的许多与龙钦宁提仪轨及其他相关传统有关的藏文资料，已经通过多智钦寺、BDRC 与 Nyingtik Project 的合作实现数字化。</strong></p>\n<p>因此，当一篇中文或英文文章无法满足你的研究需要时，BDRC 往往是进一步寻找原始文献的重要方向。</p>\n<p><strong>推荐理由：★★★★★</strong></p>\n<p>如果想从“二手介绍”进一步回到藏文原典，BDRC 是非常重要的入口。</p>\n<hr>\n<h2 id=\"toc-四-Rigpa-Wiki-适合建立人物与知识之间的联系\">四、Rigpa Wiki：适合建立人物与知识之间的联系</h2>\n<p><strong>网站：</strong> <a href=\"https://www.rigpawiki.org/\" target=\"_blank\" rel=\"noopener\">Rigpa Wiki</a></p>\n<p>Rigpa Wiki 是一个大型藏传佛教知识百科。</p>\n<p>它并非龙钦宁提专站，但已经建立了比较完整的龙钦宁提相关分类。目前“Longchen Nyingtik”分类下有专门的核心文本、前行、Rigdzin Düpa、Palchen Düpa、Yumka 等页面，同时还有独立的“Longchen Nyingtik Masters”和“Longchen Nyingtik Teachers”分类。</p>\n<p>它很值得借鉴的地方，是把：</p>\n<p><strong>人物、教法、文本、传承和历史</strong></p>\n<p>连接起来。</p>\n<p>例如，从“龙钦宁提”进入某部核心文本，再进入它的作者、传承祖师和相关教法，可以不断向前追溯。</p>\n<p>这种结构对于理解一个庞大的传统非常有帮助。</p>\n<p><strong>推荐理由：★★★★★</strong></p>\n<p>特别适合用来查人物、术语、教法以及它们之间的关联。</p>\n<hr>\n<h2 id=\"toc-五-Himalayan-Art-Resources-从图像中认识龙钦宁提\">五、Himalayan Art Resources：从图像中认识龙钦宁提</h2>\n<p><strong>网站：</strong> <a href=\"https://www.himalayanart.org/\" target=\"_blank\" rel=\"noopener\">Himalayan Art Resources</a></p>\n<p>这是一个以喜马拉雅地区佛教艺术和图像资料为核心的大型数据库。</p>\n<p>网站专门设置了 <strong>Longchen Nyingtig Main Page</strong>，并整理了：</p>\n<ul><li>龙钦宁提相关上师；</li></ul>\n<ul><li>晋美林巴；</li></ul>\n<ul><li>龙钦巴；</li></ul>\n<ul><li>多智钦相关祖师；</li></ul>\n<ul><li>传承组画；</li></ul>\n<ul><li>本尊；</li></ul>\n<ul><li>皈依境；</li></ul>\n<ul><li>资粮田；</li></ul>\n<ul><li>唐卡；</li></ul>\n<ul><li>图像学资料。</li></ul>\n<p>对于很多初学者来说，一幅唐卡只是一幅佛像图；但对于研究传承的人来说，画面中的每一位祖师、本尊和排列方式，都可能承载着重要的传承信息。</p>\n<p>因此，这个网站特别适合从<strong>视觉与艺术史</strong>的角度补充对龙钦宁提的认识。</p>\n<p><strong>推荐理由：★★★★☆</strong></p>\n<p>当你想了解“龙钦宁提在唐卡、皈依境和传承图像中是怎样呈现的”，这里非常值得参考。</p>\n<hr>\n<h2 id=\"toc-六-Treasury-of-Lives-从人物传记进入历史\">六、Treasury of Lives：从人物传记进入历史</h2>\n<p><strong>网站：</strong> <a href=\"https://treasuryoflives.org/\" target=\"_blank\" rel=\"noopener\">Treasury of Lives</a></p>\n<p>Treasury of Lives 是一个专门收录西藏、内亚和喜马拉雅地区历史人物传记的大型资料库。</p>\n<p>它的价值不在于单独介绍“龙钦宁提是什么”，而在于帮助我们了解：</p>\n<blockquote><strong>哪些人在历史上参与了龙钦宁提的传播？他们师从谁？又把 teachings 传给了谁？</strong></blockquote>\n<p>例如，网站对<strong>多智钦活佛传承</strong>有专门的条目，指出第一世多智钦晋美赤列沃瑟（Jigme Trinle Wozer）是晋美林巴的重要弟子，也是多智钦寺的创建者；其后这一传承线成为龙钦宁提传统的重要传播者。</p>\n<p>对于研究历史人物，还可以从一位祖师继续追踪他的上师、弟子、寺院和相关人物。</p>\n<p><strong>推荐理由：★★★★☆</strong></p>\n<p>特别适合研究龙钦宁提的历史人物网络和传承传播史。</p>\n<hr>\n<h2 id=\"toc-七-Amnyi-Trulchung-Rinpoche-从一条传承线了解龙钦宁提\">七、Amnyi Trulchung Rinpoche：从一条传承线了解龙钦宁提</h2>\n<p><strong>网站：</strong> <a href=\"https://www.amnyitrulchung.org/lineage/\" target=\"_blank\" rel=\"noopener\">Amnyi Trulchung Rinpoche</a></p>\n<p>这是一个以具体传承和上师为核心的网站。</p>\n<p>它把内容分成：</p>\n<ul><li>Nyingma Tradition；</li></ul>\n<ul><li>Lineage Masters；</li></ul>\n<ul><li>Root Teachers。</li></ul>\n<p>其中“Lineage Masters”专门介绍龙钦宁提传承中的历代祖师。</p>\n<p>这种网站的价值，不在于资料规模，而在于它提供了一个很好的观察方式：</p>\n<blockquote><strong>一个具体的修学传统，是怎样通过一代一代的上师传承下来的。</strong></blockquote>\n<p>对于研究龙钦宁提的传播过程，这种“从一条传承线看整体”的方式很值得参考。</p>\n<p><strong>推荐理由：★★★★☆</strong></p>\n<p>适合作为理解“活的传承”的补充入口。</p>\n<hr>\n<h2 id=\"toc-八-Patrul-Rinpoche-网站-观察龙钦宁提在现代世界的传播\">八、Patrul Rinpoche 网站：观察龙钦宁提在现代世界的传播</h2>\n<p><strong>网站：</strong> <a href=\"https://www.patrulrinpoche.net/\" target=\"_blank\" rel=\"noopener\">Patrul Rinpoche</a></p>\n<p>这个网站的一个特点，是把一个具体的现代传承持有者、他的根本上师、传承、活动、文化与出版工作等内容放在一起。</p>\n<p>网站明确介绍其 Longchen Nyingthik lineage，并设有 Biography、Incarnations、Root Teachers、Culture & Heritage、Writer、Longchen Nyingthik Lineage 等栏目。</p>\n<p>它所呈现的，是龙钦宁提已经进入现代国际社会之后的一个侧面：</p>\n<blockquote>传承不仅存在于经典和寺院，也通过现代上师、教学中心、出版机构和跨文化传播继续发展。</blockquote>\n<p>因此，如果想了解龙钦宁提从藏地传统走向世界之后的一些现代表现，这类网站也值得参考。</p>\n<p><strong>推荐理由：★★★☆☆</strong></p>\n<p>更适合作为“现代传播史”的补充资料。</p>\n<hr>\n<h1>九、这些网站应该怎样使用？</h1>\n<p>这些网站各自承担的功能其实很不一样。</p>\n<p>可以简单地理解为：</p>\n<p>|想了解什么|优先参考|</p>\n<p>|---|---|</p>\n<p>|龙钦宁提核心文献|Nyingtik Project|</p>\n<p>|英文/中文译文|Lotsawa House|</p>\n<p>|藏文原典|BDRC|</p>\n<p>|人物、术语、知识关联|Rigpa Wiki|</p>\n<p>|唐卡、皈依境、传承图像|Himalayan Art|</p>\n<p>|历史人物与师徒关系|Treasury of Lives|</p>\n<p>|一条具体传承线|Amnyi Trulchung|</p>\n<p>|现代传播|Patrul Rinpoche 等传承网站|</p>\n<p>因此，面对龙钦宁提如此庞杂的网络资料，与其试图把所有内容都收集到一个网站里，不如学会找到<strong>正确的资料源</strong>。</p>\n<hr>\n<h1>十、本站为什么还要存在？</h1>\n<p>既然已经有这么多优秀的网站，为什么还要再做一个？</p>\n<p>这是我在建立本站时一直在思考的问题。</p>\n<p>我的答案是：</p>\n<p><strong>本站并不准备与这些网站竞争。</strong></p>\n<p>它们已经在各自擅长的领域做了非常大量的工作。</p>\n<p>本站更希望做的是另外一件事情：</p>\n<blockquote><strong>从多智钦寺及其传承这个具体的观察角度，去认识龙钦宁提。</strong></blockquote>\n<p>龙钦宁提如今已经在世界许多地区广泛传播，也进入了不同的寺院、教育机构和现代修学环境。</p>\n<p>越是如此，我们越容易面对一个问题：</p>\n<blockquote>我们看到的究竟是“龙钦宁提整体”，还是某一个传承、某一部法本、某一位上师、某一种现代解释？</blockquote>\n<p>因此，本站希望保留一个相对明确的坐标：</p>\n<p><strong>多智钦寺及其传承。</strong></p>\n<p>在这个坐标下，尝试整理：</p>\n<ul><li>多智钦寺的历史；</li></ul>\n<ul><li>历代多智钦祖师；</li></ul>\n<ul><li>与多智钦寺有关的龙钦宁提文献；</li></ul>\n<ul><li>相关祖师与人物；</li></ul>\n<ul><li>传承的发展与传播；</li></ul>\n<ul><li>自己阅读过的文章和书籍；</li></ul>\n<ul><li>对资料来源的考证；</li></ul>\n<ul><li>以及个人学习过程中的思考和疑问。</li></ul>\n<p>这不是说“多智钦寺的视角就是唯一正确的视角”。</p>\n<p>恰恰相反。</p>\n<p><strong>一个明确的视角，可以让我们更清楚地看到不同传统之间的差异。</strong></p>\n<hr>\n<h1>十一、一个小小的原则：尽量回到资料本身</h1>\n<p>网络时代，资料越来越容易获得，但“获得资料”并不等于“了解资料”。</p>\n<p>尤其是传承历史、人物生平和经典内容，网络转载过程中很容易出现：</p>\n<blockquote>二手引用 → 三手引用 → 不明来源的再次转载</blockquote>\n<p>最后大家都在引用一句已经找不到出处的话。</p>\n<p>因此，本站会尽可能区分：</p>\n<p><strong>原始文献、传统记载、现代研究、网络资料与个人理解。</strong></p>\n<p>对于尚未能够确认的内容，也会尽量注明“待考”或“有待进一步核实”。</p>\n<p>在资料整理中，我更希望做到：</p>\n<blockquote><strong>宁可暂时不知道，也不要把未经核实的内容当成确定事实。</strong></blockquote>\n<hr>\n<h2 id=\"toc-十二-最后\">十二、最后</h2>\n<p>龙钦宁提的网络资料已经非常丰富。</p>\n<p>这里列出的几个网站，也只是整个网络世界的一部分。</p>\n<p>它们分别像不同的窗口：</p>\n<p><strong>Nyingtik Project</strong> 让我们看到文献研究；</p>\n<p><strong>Lotsawa House</strong> 让我们看到翻译与阅读；</p>\n<p><strong>BDRC</strong> 让我们接近藏文原典；</p>\n<p><strong>Rigpa Wiki</strong> 让我们看到知识之间的关联；</p>\n<p><strong>Himalayan Art</strong> 让我们从图像理解传统；</p>\n<p><strong>Treasury of Lives</strong> 让我们沿着人物进入历史；</p>\n<p>而一个个具体的传承网站，则让我们看到龙钦宁提在现实世界中如何被一代代传承下来。</p>\n<p>本站所做的，只是站在自己的位置上，慢慢阅读、整理、核对和记录。</p>\n<p><strong>不是把所有资料都搬到这里，而是帮助自己，也帮助后来者找到资料应该去哪里找。</strong></p>\n<p>希望这个页面能够成为一个小小的入口。</p>\n<blockquote>**从一处传承出发，认识一个广大的传统；<br>从一部文献出发，回到它真实的历史；<br>从一次阅读出发，慢慢走近龙钦宁提。**</blockquote>\n<h3 id=\"toc-相关网站\">相关网站</h3>\n<ul><li><a href=\"https://www.longchennyingtik.org/\" target=\"_blank\" rel=\"noopener\">Nyingtik Project</a></li></ul>\n<ul><li><a href=\"https://www.lotsawahouse.org/\" target=\"_blank\" rel=\"noopener\">Lotsawa House</a></li></ul>\n<ul><li><a href=\"https://www.bdrc.io/\" target=\"_blank\" rel=\"noopener\">Buddhist Digital Resource Center（BDRC）</a></li></ul>\n<ul><li><a href=\"https://www.rigpawiki.org/\" target=\"_blank\" rel=\"noopener\">Rigpa Wiki</a></li></ul>\n<ul><li><a href=\"https://www.himalayanart.org/\" target=\"_blank\" rel=\"noopener\">Himalayan Art Resources</a></li></ul>\n<ul><li><a href=\"https://treasuryoflives.org/\" target=\"_blank\" rel=\"noopener\">Treasury of Lives</a></li></ul>\n<ul><li><a href=\"https://www.amnyitrulchung.org/lineage/\" target=\"_blank\" rel=\"noopener\">Amnyi Trulchung Rinpoche</a></li></ul>\n<ul><li><a href=\"https://www.patrulrinpoche.net/\" target=\"_blank\" rel=\"noopener\">Patrul Rinpoche</a></li></ul>"}, {"slug": "音频资源/2. 上师法音/index", "title": "上师法音", "rel": "音频资源/2. 上师法音/index.md", "dir": "音频资源/2. 上师法音", "is_index": true, "meta": {}, "html": ""}, {"slug": "音频资源/2. 上师法音/2.1 仪轨与经文/index", "title": "仪轨与经文", "rel": "音频资源/2. 上师法音/2.1 仪轨与经文/index.md", "dir": "音频资源/2. 上师法音/2.1 仪轨与经文", "is_index": true, "meta": {}, "html": ""}, {"slug": "音频资源/2. 上师法音/2.2 圣号与明咒/index", "title": "圣号与明咒", "rel": "音频资源/2. 上师法音/2.2 圣号与明咒/index.md", "dir": "音频资源/2. 上师法音/2.2 圣号与明咒", "is_index": true, "meta": {}, "html": ""}, {"slug": "法音详情/佛子行三十七颂", "title": "佛子行三十七颂", "rel": "法音详情/佛子行三十七颂.md", "dir": "法音详情", "is_index": false, "is_audio_detail": true, "audio_idx": 19, "meta": {}, "html": "<div class=\"mantra-detail\"><h1 class=\"mantra-detail-title\">佛子行三十七颂</h1><div class=\"mantra-detail-player\"><audio controls preload=\"none\" src=\"audio/%E4%BD%9B%E5%AD%90%E8%A1%8C%E4%B8%89%E5%8D%81%E4%B8%83%E9%A2%82.mp3\"></audio><a class=\"mantra-detail-download\" href=\"audio/%E4%BD%9B%E5%AD%90%E8%A1%8C%E4%B8%89%E5%8D%81%E4%B8%83%E9%A2%82.mp3\" download=\"佛子行三十七颂.mp3\" title=\"下载音频\">⬇</a></div><p class=\"mantra-detail-author\">- 第五世多智钦·龙洋仁波切亲诵 -</p><div class=\"mantra-detail-poster\"><img src=\"assets/法音海报/佛子行三十七颂.jpg\" alt=\"佛子行三十七颂\" loading=\"lazy\" onclick=\"showPosterBig(this.src, th var KNOWLEDGE_BASE = [{"slug": "上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠", "title": "万事无常，唯有佛法是依靠", "content": "2010年11月开示 万事无常，唯有佛法是依靠 ▶ 播放 修行，才能彻底帮助到众生。 死亡，可能是每一个人最害怕的事情。 无论你地位再高、名声再响，也不管你有多少钱，都没有办法不死。谁都想逃过这一劫，可谁也没有办法。如果必须得死，很多人可能希望死亡时没有恐惧，不要太痛苦。 那么我们来细心研究一下自己的死亡——死得安详还是死得痛苦？每个人的寿命有多长？在你的人生当中，有多少日子是属于自己的？如果能有一点点自己的时间，该做哪些事情？ 细心研究一下，我觉得一个人的生命，长的也就是三万天。这三万天，减去睡觉的时间，也就两万天了。这两万天里，真正属于自己的时间有多少？小的时候，父母管着，由不得你；中年的时候，家人缠着，也由不得你；稍微老一点了，又被儿女管着，也没有多少自己的时间。在这么有限的时间里，要找出一点点时间去修行，是很难得的。 比如说，今天我们到这里来，都是想来修行，哪怕只是一刹那想修行的念头，都是很有福报的。我们必须利用好，不要浪费这个时间。 那怎么用呢？我们可以分析一下，在这个人间，有多少事情是有用的，多少事情是没有用的？你再挣扎，能带走哪一样东西？ 很多人认为，有很多钱会对自己有帮助。其实，有几个亿的人，和兜里连几十块钱都没有的人比起来，也许钱少的人活得还自在一些。钱多了，也许只是带来很多繁杂的痛苦，不会延长你的寿命，也不能给你带来幸福。 有的人认为权力对自己有帮助。可是你想，有的最有权力的人，为了实现自己的愿望，想延长几个月的生命，请了全世界最好的医生治病，也没有实现。 还有的人认为自己有名声，可是名声能做什么呢？去年有个明星，碰了一下鱼缸就被扎死了。名声对她有用吗？延长她的寿命了吗？让她开心了吗？让她得到幸福了吗？ 那么最有用的是什么？肯定是最真实的，没有一点点虚假的。 在我看来，这个世界上，很多东西都是假的。你可以回想一下，从小的时候到现在，多少以前的朋友现在对你怎么样？很多已经不再是朋友，可能不成为敌人都算好的了。小时候关系不好的，现在可能反而在身边帮你。这种情况有多少？ 再比如，你的家人能靠得住吗？汶川地震发生的时候，某医院有三十几个女人在生孩子，男人们一下子就跑得没了踪影，是护士把她们抬出来的。你说关键时刻家人靠得住吗？ 也不能怪他们，这是人的一种本能反应。我们可以这样理解，他没有这种“软件”来帮你，因为他是假的。假的能帮好真的吗？假的又怎么能帮假的呢？这是不可能的。 没有一个真实的东西——梦幻和泡影能做什么呢？做不了什么事。世间还有很多这样无常和虚假的例子，不一一说了。 唯一能帮到我们这些众生的，就是释迦牟尼佛的教法。为什么这么讲呢？因为佛说的都是真话，佛讲的都是真理。 比如，两千多年前，释迦牟尼佛就知道女人怀胎的真实情况。一个月、两个月什么样子……九个月，直到生下来什么样子，佛陀让一个画家都画了下来。据说这些画的珍藏版还在布达拉宫里，你们可以去看。那时候没有任何仪器，但现在用仪器一检测，百分之九十都是相同的。你没有办法不相信他！ 再举一个例子。释迦牟尼佛早在两千多年以前就讲过，胎教是很重要的，母亲怀胎时听经，对孩子的心态和前程很有帮助。早年间的时候，经常有人批判说：“孩子刚生下来话都不会说，在母亲的肚子里怎么能听得懂呢？你们真迷信啊！”可是，现在科学家不也很主张胎教吗？两千多年以后的今天，世间的智慧才证实了佛陀所说的冰山一角。 还有，释迦牟尼佛说，众生有很多空间层次的存在，比如说十八层地狱。当时的那些科学家不承认这样的存在。现在的科学证明了，至少三层空间形式的众生是存在的。 为什么讲科学？其实我也不完全相信它，因为它还在探索，只信它不也属于迷信吗？ 但是，很多人喜欢科学，觉得是科学就是真理。其实科学是这样的，比如，今天说“喝奶对身体有多大多大的益处”，人们就疯狂地去喝。过一两年，又说“奶不能喝，里面有对人体有害的物质”。有时候说肉是人体不可缺少的东西，应该吃。有时候又说肉不能吃，里面有很多的细菌，吃了会怎么怎么样，等等。 其实，科学的很多观点，我觉得也是很好的。作为凡夫做出来的事情，已经很了不起了。但跟佛法不一样，它是以人的眼光去看问题，还只是众生的念头，所以我们不能完全依靠它。 我有一次亲身经历。我弟弟到医院去检查，他的脸很黑，医生一看他就说：“你的肝脏不好，去检查一下。” 仪器检测结果出来的时候，医生问他：“你的家属是谁？”我一听就感觉情况不太妙，赶紧说：“是我。” 医生说：“你弟弟的病情不太好，赶快住院！”听到这话，我很伤心。当时真的很惭愧，我没有想到祈祷三宝加持，却想：“哎哟，这么年轻，咋会这样？我怎么跟他说呢？” 之后我们去吃饭，弟弟很开心，但我却很痛苦。当我准备告诉他医生的话时，他说：“你不用说，我知道。” 我说：“怎么啦？知道什么呀？”我弟弟说：“医生肯定说了我病情很严重。不止一次了，你不用伤心。” 我说：“你为什么这样讲呢？” 他说：“反正不用担心，我绝对不住院，保证没有问题。” 我劝他住院，但他坚持不住。当时医生说他很可能得了肝癌，可是到现在大概有十七年了，他还是好好的。你说这个仪器能完全相信吗？ 还有一个小孩，有一次，他的舌头肿得连嘴巴都装不下了，乌黑乌黑的。去某医院检查，血象什么的都检查了，然后医生跟他家人说：“完了，孩子真可怜，这是舌癌，要从喉咙里把舌头切掉，不然的话会扩散。准备几万块钱。” 他家人很痛苦，没有舌头的人是个什么样子？就问我：“上师，怎么办呢？” 于是我祈祷三宝，算了卦，卦情却很好。如果是马上要死的人，卦情不会这样。我就说：“等一等吧，过两三天看看症状再说。”但医生说：“再慢一点就晚了……”劝了n次。 他们听了我的话。第二天早上，孩子舌头里流出了很多脓，才发现是吃野酸果的时候，刺扎进了舌头，感染了。脓一出来就慢慢好了。要不是等了两天，孩子的舌头就没有了。 还有一个《走近科学》的栏目里，有个老头的私密处在没有任何原因的情况下变色了，去医院检查动手术切除了相关部位，最后发现是裤子掉色引起的。 还有一次，我去医院检查，医生跟我说：“血象很高，一般人是几百，你都一千多了。反正你是修行人，可以跟你直说。”他还比较了解我！又说：“得癌症的概率很大，你马上去做核磁共振。” 我就害怕了，马上从头到尾检查了一遍，结果什么事都没有。我拿着检查结果去问医生：“你这是什么意思？让我白花了一万多块钱。”医生说：“哎，买个放心嘛。” 释迦牟尼佛说：“人是有轮回的。”很多人会问：“真的有轮回吗？人死了不就没有了吗？”修行人当然不会这样想，但是很多人会。他们真的没有考虑过，没有详细地研究过自己的来源。 通过一件小小的事情就能发现自己的来历：躺在床上睡觉时，会做很多的梦。在梦中，你会去一些没去过的地方。当你真到了那个地方，就会有种感觉：哎哟，我到过这里。但你以前并没有去过，只是在梦里去过。可是你的身体在床上躺着，根本没动！谁去了呢？那不是你的灵魂是什么？ 还有，有的人你第一次见到就有好感、有亲切感，可他并没有为你做过什么好事。有的人一见到就特别反感。为什么？这就是前一世的因果，还记着呢。不然的话，为什么会有那些感觉？ 还有一件我听到的事：云南有个人，只要在他耳边提到佛教，马上就会发火：“不要说了，我不听，这些都是假的，鬼迷心窍！” 有一天他生病住院，情况很危险，后"}, {"slug": "上师开示/1. 为何修行？/1.1 诸行无常/死亡是最公平的", "title": "死亡是最公平的", "content": "2012 年 10 月开示 死亡是最公平的 ▶ 播放 生命就在呼吸之间 修行第一步，要观好无常。 人生是比较短暂的，也是无常、多变的。这个我不说，师兄们也都了解。我们在人世间生活了很多年， 所以对无常和多变的因素， 都比较清楚。但提醒一下师兄们， 有的人认为他会活很长时间， 起码再活个二十年， 二十年以后再来修行、出家什么的， 给人生制定一个漫长的计划。这种做法其实是错误的， 这些根本由不得你去安排。 打个比方，玉树地震，这是大家都有目共睹的。这里面有很多做生意的人，也有很多当官的，有很多年轻人，也有很多小孩子，还有很多乞丐。 特别是有些生意人， 从能办事的时候开始， 一辈子卖狗赚钱。他给狗打一些针，这样狗一年就会长很大，形状也变得有点像人们所说的藏獒，其实不是。他就这样去骗人， 计划用骗到的钱， 盖一个很大的房子，底层是很多铺面， 上面自己住， 再上面做宾馆， 来赚四面八方客人的钱。然后， 再把第四层做佛堂， 这么去安排。正在计划的时候， 半分钟都不到，眼前一黑全都没了， 他几十年挣的钱没了， 连自己的生命都没了。这个时候他带不走一分钱， 拿不走一样东西， 也牵不走一个亲戚朋友， 一个人孤零零地“享受”自己的果报，很快就会去往黑暗的世界。 我们有很多僧人到那里去救人，看到有的人抱着一个很大的牛皮袋，里面装着钱，抱得紧紧地死了，他没有用上。所以说， 你计划一个很长的时间去挣钱，对你没有什么用。这是一个例子。 寿命就是这么短暂。晚上吃完饭的时候，大家都还好好的，天一亮，有可能百分之七十的人都没了。只是一个呼吸之间，一口气呼出去，吸进来的时候就没了。 还有我认识的一个上海的老总，他有四十亿人民币，名下有四个上市公司。他每一次遇到我都会说：“活佛，我要信佛，等我把事情安排好以后就皈依。我一定要信佛！我不能这样混下去了，再等我五年，我就会好好修行的。这五年之内，我有很多事情要处理。” 结果不到半年， 我听说他就跳楼自杀了。这是事实啊！ 四十个亿给他带来了什么？ 带来了自杀的痛苦。他肯定不知道会出现这样的状况，所谓五年以后的修行计划简直就是空谈！ 最后他的四十个亿怎么样了呢？ 他的家人、兄弟， 还有他公司的经理， 为这个争夺了一年多。听说这笔钱最后落到他最不喜欢的女人手里。他努力的成果，到头来反而被他最不喜欢的人享用。这是第二个例子。 第三个例子。去年在北京， 大家坐在我的面前， 一个弟子问我： “上师， 明年是 2012 年， 听说会有世界末日， 我们该怎么办？ 我好害怕。”当时我想， 明年才是 2012 年， 还有这么长时间， 你怎么知道那个时候你还在呢？有没有世界末日不知道， 但到那时你还在不在， 却没什么定数。现在这个师兄已经没了。他觉得和世界末日相比， 他的寿命可能更长，还在担心世界末日。人的心态就是这样的。 还有，我们认识的人里面，明天有个得肺癌的，后天有个得肝癌的，大后天有一个死了的，再后天有一个跳楼自杀了的。这种信息你们那里少一点，但我这里很多。可能是因为大家都知道我。哪里死了个人，只要是信佛的，他们都会告诉我。我们听到这些消息的时候，为什么想不到自己也会有这一天，而且有可能很快。有可能现在我们坐在这儿，等会儿出去就死一个，谁都说不清楚。死的人是谁，谁也说不清楚。有的人认为，自己病多、年龄大，可能死得早一些。有的人认为自己很年轻，时间还多。但也许这个病人还活着的时候，很多年轻人已经死了。 死神不会考虑你的年龄， 也不会考虑你的地位， 不会考虑你的财产和能力， 也不会考虑你的长相， 不管你的关系有多硬， 长得有多漂亮，也不管你有多高的地位，该死的时候就死了。他是最公平的。 死亡因素与存活条件 可以想一想，我们有什么把握一定能活得久呢？ 首先， 我们的思想往往是很矛盾、很急躁的， 这种状态对健康是很有影响的，对寿命也很有影响。 第二， 我们哪一位师兄生活有规律？该睡的时候睡，该吃的时候吃，该起来的时候起来过吗？很少吧。 要么工作太忙， 起得很早； 要么太清闲了， 睡一天； 要么想睡就睡， 想起来就起来。这样也对身体这部机器的运转很有影响。 第三， 除了生活不规律， 吃的又是些什么东西呢？ 反季节的、转基因的、有毒的、有灰尘的。现在， 一个人一年起码能吃半斤灰和半斤农药，这是科学家计算出来的数字。这样的一个人能活多长时间呢？ 第四， 我们的呼吸， 吸进来的全是废气。汽车的尾气、空气中的杂质、人群聚集产生的病菌， 我们吸的都是这些， 哪能呼吸到什么新鲜空气啊？要是我们能看得见，就知道一口气能吸进去多少对身体有害的东西。 第五， 我们平时听到的声音， 也没有一样是对人体有益处的。飞机的声音、汽车的声音、建筑施工的噪音、人的嘈杂声音……也许你们不相信，光是一个杂音都可以听死人。 再想一想，你想过一个安静的日子，而你的对境是老公或者老婆，他们会让你过上一个小时的安稳日子吗？ 徘徊、怀疑和仇恨充满了整个生活。 接下来是你的孩子， 你对他有很不一样的感觉， 但是他让你省心过吗？他病了， 痛了， 不听话了， 都直接牵扯着你的心， 没一样让你开心。有的母亲， 孩子再坏都觉得好， 但是孩子绝对不会对她做多好的事。你想想， 现在的孩子都是皇帝， 父母都是佣人，这样下去会好吗？ 最后培养出一个很自私的孩子来， 他不管你的死活，但他的一切都要你来照管。他要热的， 要冷的， 半分钟就得拿给他， 但要他陪你半个小时都做不到。父母的要求其实并不高，希望陪着吃个饭，他都没时间。人生这么不如意，能有多长久呢？ 被一个要好的朋友骂一下，有的人就会说：“我受不了了！”这一点都受不了， 这么多负面因素压在你身上， 你能受得了吗？ 这只不过是大海中的一颗石头而已，很小的。不利于人类存活的因素实在太多了！ 利于我们存活的条件有多少呢？ 去医院会被骗， 难得有一张真实的面孔。找工作， 也容易上当， 找不到一个真正的环境。接触一个朋友，很难交到知心的， 也可能会被骗。门对门住三年， 对面的人死在屋子里都不知道。这样的人间， 哪有什么存活的空间呢？比如我想关心一下他： “你住在这儿啊？ ”马上就会来一句：“你干什么？！”不让你说话。社会已经成了这样了， 人人都蜷在一个很小的空间， 都很冷漠， 就像缩在洞里的老鼠一样生活。 我们修行人随时随地都要有死亡的准备， 不要认为你不会死。人是很脆弱的， 很容易倒下， 闪电间就没了。不要认为有钱， 就可以挽救，不可能的。也不要认为有地位，就能挽救哪怕一丁点， 可能吗？ 有的人权力很大、钱也很多， 为了一个愿望， 想多活两三个月， 都没办法做到。所以不要太天真了， 凭什么你能再活二十年、三十年？ 谁给的你这个批文？没有吧？如果没有， 不要把自己给骗了。“我还要活很多很多年”，那是自欺欺人！ 相关主题文章推荐 计划赶不上无常 人生中最重要 …也许你们不相信，光是一个杂音都可以听死人。 再想一想，你想过一个安静的日子，而你的对境是老公或者老婆，他们会让你过上一个小时的安稳日子吗？徘徊、怀疑和仇恨充满了整个生活。 接下来是你的孩子，你对他有很不一样的感觉，但是他让你省心过吗？他病了，痛了，不听话了，都直接牵扯着你的心，没一样让你开心。有的母亲，孩子再坏都觉得好，但是孩子绝对不会对她做多好的事。你想想，现在的孩子都是“皇帝”，父母都是“佣人”，这样下去会好吗？最后培养出一个很自私的孩子来。他不管你的死活，但他的一切都要你来照管：他要热的，要冷的，半分钟就得拿给他。但要他陪你半个小时，都做不到。父母的要求其实并不高，希望陪着吃个饭，他都没时间。人生这么不如意，能有多长久呢？ 被一个要好的朋友骂一下，有的人就会说：“我受不了了！”这一点都受不了，这么多负面因素压在你身上，你能受得了吗？这只不过是大海中的一颗石头而已，很小的。不利于人类存活的因素实在太多了！ 利于我们存活的条件有多少呢？去医院会被骗，难得有一张真实的面孔。找工作，也容易上当，找不到一个真正的环境。接触一个朋友，很难交到知心的，也可能会被骗。门对门住三年，对面的人死在屋子里都不知道。这样的人间，哪有什么存活的空间呢？比如我想关心一下他：“你住在这儿啊？”马上就会来一句：“你干什么？！”不让你说话。社会已经成了这样了，人人都蜷在一个很小的空间，都很冷漠，就像缩在洞里的老鼠一样生活。 我们修行人随时随地都要有死亡的准备，不要认为你不会死。人是很脆弱的，很容易倒下，闪电间就没了。不要认为有钱，就可以挽救，不可能的。也不要认为有地位，就能挽救哪怕一丁点，可能吗？有的人权力很大、钱也很多，为了一个愿望，想多活两三个月，都没办法做到。所以不要太天真了，凭什么你能再活二十年、三十年？谁给的你这个批文？没有吧？如果没有，不要把自己给骗了。“我还要活很多很多年”，那是自欺欺人！ 2012年10月开示 利他明思小家整理 相关主题文章推荐 死亡是最公平的 人生中最重要的事情 龙的传人｜Longchen Nyingtik 万事无常，唯有佛法是依靠 不可错过的机会"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/“羡慕嫉妒恨”的结果", "title": "“羡慕嫉妒恨”的结果", "content": "2013 年 01 月开示 羡慕嫉妒恨的结果 ▶ 播放 阿修罗道的因是怎么种的？有时候我们开玩笑会说“羡慕嫉妒恨”。这个“嫉妒恨”种下的业， 结的果是什么？ 就是“仇恨”和“战争”。 我们今生在人间， 跟师兄们不和， 跟家人不和， 跟朋友不和， 跟自己的父母不和。天天生气， 天天吵架， 天天过着地狱般的生活， 这使我们很容易去阿修罗道。 去了阿修罗道，没有半秒钟是消停的，是不可以“我不仇恨”的， “仇恨”会一直存在。这个“仇恨”， 不像人间的仇恨， 有百倍、千倍、万倍的痛苦， 有地狱的感觉。仇恨时， 身体会四分五裂， 快要炸了。这个只有自己去感受才能知道。用人的语言，只能说个大概而已。 阿修罗为什么要仇恨呢？ 因为他们的念头， 看见有一棵如意树， 是从他们的土地上长上去的。长上去以后，果实结在天界，所有好的果实都被天人吃了，他们得不到，但这棵树是他们的。他们天天想方设法去争夺这些果实，天天去战争。但是他们怎么去打，也打不赢天人；怎么去争，也得不到那些最好的果实，仍然是天人全部拥有。 这些天人都是死不了的。他们有一种长寿甘露，受一点点伤，一喝就恢复了，马上就恢复了，一点痛苦都没有。就像我们在电影里看到的神话故事一样，“pia”，杀了；“pia”，活了，就是这样。很简单的，像玩游戏一样，他们那种的死亡，像玩游戏一样一点痛苦都没有。 阿修罗的生命就像人的生命一样，他们为了这些战争，一天会死六次、七次，然后还要复活。死的时候，就跟我们现在的死亡一样，一样的痛苦，一样的恐惧。即使这样，阿修罗还是要天天争啊争，这是他们的命！是他们自己的因果！ 你去想一下，如果你生在战争年代，你家天天死人，没有一刻钟不死人，你的心态是什么样子，阿修罗道众生的心态就是什么样子。他们从小就开始仇恨、吵架、打架，就是这么度过他们的一生。他们寿命的期限， 是人间的一万年， 也就是要折腾一万年， 才能洗清他们以前的业。 我们人间谁要去阿修罗道，是很容易发现的。比如，脾气很古怪的，稍微说一个：“哦，你在这里啊？”“怎么？我在这里干什么？你问我干什么？”什么事都没有，只说了个“你在这里啊？”他就生气了。然后，另外两个人自己说点事，嘿嘿一笑，没说他，但是，他很敏感地说：“笑个屁！”这个人就是快要去阿修罗道了。这样的人，有时候突然发脾气，自己都控制不了自己，这就说明他们种下的去阿修罗道的因，快要成熟了。 所以， 师兄们要克制自己的脾气， 学会克制， 学会吃
