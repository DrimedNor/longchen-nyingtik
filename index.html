<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转...</title>
    <meta http-equiv="refresh" content="0; url=https://longchen-nyingtik.wiki/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .redirect-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .redirect-box h1 {
            color: #8a1f1c;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .redirect-box p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .redirect-box a {
            color: #8a1f1c;
            text-decoration: none;
            font-weight: bold;
        }
        .redirect-box a:hover {
            text-decoration: underline;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8a1f1c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h1>网站已迁移</h1>
        <p>本网站已迁移至新地址，正在为您跳转...</p>
        <p>如果没有自动跳转，请点击<a href="https://longchen-nyingtik.wiki/" id="redirectLink">这里</a></p>
    </div>
    <script>
        // 保留原始URL的hash部分（SPA路由）
        var targetUrl = 'https://longchen-nyingtik.wiki/';
        if (window.location.hash) {
            targetUrl += window.location.hash;
        }
        // JavaScript重定向（比meta refresh更快）
        window.location.replace(targetUrl);
        // 更新链接
        document.getElementById('redirectLink').href = targetUrl;
    </script>
</body>
</html>
