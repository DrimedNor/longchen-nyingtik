水， 但它一跑， 脚下全是烧红了的铁。它光着脚板， 一踏上去脚就被烧烂了。它怎么都跑不到那儿， 其实没有东西，只是它的幻觉。就这么一辈子，跑啊跑啊去追水，追一辈子，饥渴得要命，想喝得要命，但是喝不了。到最后下半身都烧烂了， 快烧到腰了， 还要跑。</p>\n<p>有的饿鬼， 为了得到别人吐的一 口痰， 就要等五百年。为什么呢？需要的饿鬼太多了，而吐痰的人太少了，它得不到。它只能盼啊盼啊盼，盼五百年，就为了得到一 口痰。它还不能自己吃， 它有五百个孩子， 要分给这些孩子们吃， 它自己什么都吃不了。它们就这么盼啊盼啊盼， 什么都吃不了。这是佛经里面写的， 只要我们相信佛陀，那么这些是的的确确存在的。我们现在看不见，但是看不见不等于没有。</p>\n<p>人间也能稍微看到一些饿鬼道生命。海洋中有些鸟类，为了养活孩子，得飞一个月， 飞到很远很远的地方找到一点食物。返回来把食物给孩子的时候，妈妈就已经累昏在那儿了。</p>\n<p>有的呢， 看到很多想吃的东西， 但一吃下去， 食物就变成火， 把它的肠肠肚肚全部烧烂， 烧完就昏过去了。等它醒过来又好了， 又想吃，又吞下去。</p>\n<p>这是什么因果造成的？ 比如刚才说的吞了又活、活了又吞的例子，这是什么因果呢？ 就是吃了信徒的供养， 但第一没有戒律， 第二没有闻思， 第三没有实修， 在这种状态下， 随便接受信徒的供养， 果报就是这样。受一次供养，就要还五百次。就这么吞一次烧一次，直到五百次。</p>\n<p>刚才讲的那种吞不下食物的饿鬼， 原因就是存了很多财物， 舍不得给父母吃， 也不给孩子用， 也不供养三宝， 也不布施给可怜的人， 一直存啊存，自己连一顿像样的饭都没吃过。这种人， 就会变成这样一种生命。</p>\n<p>所以， 师兄们， 钱财这些东西， 在人间没有它不行， 但也不能完全靠它活着。差不多就行了，欲望不要太高。“我要做很多很多事情， 要怎么怎么……”长远的打算， 其实是实现不了的。做来做去， 有一天自己还没用就死了， 堕入饿鬼道了。财产都被不应该用的人用上了， 还不如在自己有权力、有能力的时候，用这些财产多做一些好事。</p>\n<p>比如山区里那些真正需要帮助的人，他们没有吃的，没有穿的，你给他们一点，你也缺少不了什么，但是对他们来说帮助很大。医院里面有的人交不起医药费， 就缺这么一点点钱， 你有能力的话， 可以给他补助一点钱， 那会救他一命。要饭的、要东西的， 不管怎么样， 他把所有的名声、架子、脸面全部拉下， 跟你说：“给我点钱。”这个时候他绝对是有难处的， 不然的话他不会这样， 所以你力所能及地给点， 不要骂他，不要推他。这些都是为了自己积累一点福报，不是为了别人。</p>\n<p>一个老人拉车拉不动了， 你从他身边路过， 无动于衷地走了， 作为一个修行人， 真的有点不好意思。你就帮他推一推， 哪怕是几步也可以。有的老人看不见路， 需要带路的时候， 你在旁边看见了， 你就把他带过去。<strong>那也是为了你自己，不是为了他，所以师兄们要注意。</strong></p>\n<p>遇到一些大德，听到一些做善事的机会，比如建经堂、建佛塔这些。</p>\n<p>可以根据自己的经济状况，供养一块钱、两块钱，参与一下，这样对你很好。如果供养很多， 然后就后悔了， 那我觉得就浪费了。不用这样。<strong>你能够舍得的， 供出去了以后不会后悔， 也不会指望得到什么， 没有附加条件的供养和布施， 这对你的修行、对你的福报很好。</strong></p>\n<p>为了我们自己不堕入那样的饿鬼道， 为了天下做过我父母的众生不堕入饿鬼道， 多做一点，放生啊、荟供啊等等。为了让上师开心、让一些穷人满意、让父母高兴，如果有能力，这些事情多做一些。</p>\n<p>这里我要讲一个我爸爸的妹妹， 也就是我姨妈的故事。我有一个姨妈（注：此处的姨妈，是指上师的姑姑。在上师家乡一带，姑姑也可以叫姨妈），生来就很抠，抠得不得了。她有很多财产，牛羊、粮食、银子、珊瑚。但她只有自己一个人。每一次吃饭的时候，她就想：这一次我到谁家里去吃？她觉得吃自己的， 吃一顿就少一顿， 这样不行， 要到哪个家里去吃。考虑好了，就到那边家里去吃，吃得很多。实在没有地方去，自己吃的时候，就吃得很少。真的，我一点都没夸张。有时候她生病了，叫我们去给她念经。念完了她说： “看着我干什么？回家吃饭啊！”她害怕给我们做一顿饭，就是这么抠门的一个人。</p>\n<p>我爸爸特别担心她堕入饿鬼道， 经常教育她。说的时候她都听， 但做的时候照旧。她自己有三百多头牛，就死了一头小牛，都要哭一天。不是觉得牛可怜，而是觉得“我少了一头牛啊，怎么办呢？”。真的是这样，变态了。</p>\n<p>最后实在没有办法，我的一个舅舅就去找法王如意宝，说明这个情况，问法王如意宝怎么办。法王如意宝说：“有一个很好的办法。你让她到色达县去买个什么东西， 不要让她掏钱， 你给她钱让她去， 等她去的时候，把她所有的财产都搬到五明佛学院来。”</p>\n<p>我舅舅很听法王如意宝的话，等她去色达后，把她所有的财产、牛羊等一个不剩都拉走，供养五明佛学院了。她一回来什么都没有了，看了一会儿，坐了一会儿，问：“真的吗？”跟她说了整个情况，她又坐了一会儿，说：“谢谢啊！我轻松多了。”从此以后，她性格变了，她整个人的状态也变了，变成很开朗、很开心、让人很舒服的一个人了。不然的话， 她天天都瞅着自己那一点点东西、财产。人就是有这样的情况，真的。</p>\n<p>拉卜楞寺有一个僧人， 他很爱财，想发财， 但就是发不了财。他有一百块银元，只有这么多。每天晚上就在那儿“一块、两块……”倒来倒去地数啊数啊，听银元的声音，数一晚上。有个强盗在外面听见了， 心想“哎呀，他有这么多钱啊！”就跑进去把他杀了，结果整个屋子里只有一百块钱。</p>\n<p>别的地方的上师来给他超度，超度了三四次，还在反复地念。他家人很奇怪，就问：“上师，你为什么要反复念呢？”“哎呀，我有点超度不了他。”“为什么呢？”“他已经粘连在一个银元上面了。”真的有这种人。</p>\n<p>所以师兄们，不能没有钱，但是不能爱好钱，太爱它了，它会要你的命。不是要一点点东西啊， 是要你的命！ 钱是我们需要的一种东西， 但不是依靠。没有钱的情况下能做到的事情太多了。真正的感情， 真正的上师，真正的朋友， 用钱是绝对买不来的。用钱买得来的， 那有点悬， 真的。其实现在的人都在麻木地生活着， 有钱就成了朋友了， 花钱成了上师了，花钱成了男朋友了。这种关系是很脆弱的。</p>\n<p>所以， 人不要成为钱的奴隶， 一定要让钱成为我们的奴隶， 不然的话，就离饿鬼道不远了，真的不远了。你们慢慢去看，有的人抠得要命，一直抠，他的头就慢慢慢慢有点变大， 肚子也会变大， 手脚有点萎缩， 还没有死的时候饿鬼的形象就显现出来了。你看有些当官的， 贪很多钱， 不敢用，也用不了，但是他对钱的执着很大。</p>\n<p>所以， 大家得注意， 修行人一定要做到对钱不执着， 我们为了生存要用它，但是不要让它成为爱好和依靠。</p>\n<hr>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会\">不可错过的机会</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠\">万事无常，唯有佛法是依靠</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情\">人生中最重要的事情</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/地狱里大概的情形\">地狱里大概的情形</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不同状态的生命形态\">不同状态的生命形态</a></li></ul>"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/享乐的尽头，是堕落", "title": "享乐的尽头，是堕落", "rel": "上师开示/1. 为何修行？/1.2 轮回过患/享乐的尽头，是堕落🔊.md", "dir": "上师开示/1. 为何修行？/1.2 轮回过患", "is_index": false, "meta": {}, "html": "<p>2013年1月开示</p>\n<p><span class=\"audio-name\">享乐的尽头，是堕落</span><button class=\"play-btn\" data-audio=\"享乐的尽头，是堕落.mp3\">▶ 播放</button></p>\n<p>在我们人间，成为神仙的因素是有很多的。第一种：他没有信仰，也不做什么坏事，只是跳舞、唱歌这样去消磨时间，多半就有可能成为神仙。第二种： 他没有信仰， 没有发心， 没有目标， 也没有修行的程序，他就是用一颗爱心去捐助东西， 为人间做了一些什么事， 就会成为神仙。第三种， 性格就像我这样的人， 喜欢笑， 喜欢开玩笑。开的玩笑不带刺激的语言，就是好玩儿，这种性格也很容易去天人道。下一次你们的上师，有可能出现在天人道。</p>\n<p>神仙有很多界，有三十三界，每一界的神仙感觉都不太一样，寿命也不太一样。比较好的神仙寿命长一点， 长相也漂亮一点。神仙的寿命是比较长的，寿命好像是地狱的一半，大概可能是一万多年吧，地狱更长。阿修罗的寿命和神仙的寿命比， 还是神仙的寿命长一点。这一万多年太开心了， 所以他觉得好像只过了一天一样， 不知道时间是怎么过去的。刚开始觉得那里很舒服，但是后来就不太好过了。</p>\n<p>到了天人道就感觉自己好像快没时间了， 有这样一种感觉。我们在人间有时也会有这种感觉， 心情特别愉悦的时候， 这个日子真的是不知道怎么过去的。别人问我们在这里待了多少天，感觉好像一天、两天吧，其实已经过去了 15 天。但是痛苦的日子， 过一天觉得就像是过了一年。神仙的快乐比我们多， 所以他们不知道日子是怎么过去的， 反正就是感觉很快过去了。</p>\n<p>快乐的日子过去以后，这时他身上的光慢慢消失了，漂亮的长相也慢慢衰老了， 身上的香味也慢慢变淡了。以前在一起玩的朋友也慢慢地远离他，他恳求他的朋友：“带着我去吧！”但是他的朋友觉得， 这个时候他身上有臭味， 长相也配不上， 带着他一起玩的话， 人家会笑话，所以不能带他去。就像我们人间的美女， 快要老的时候很痛苦， 很恐惧。虽然我还没做过美女， 但是我大概知道， 人间美女衰老的感觉是比较痛苦的，比男人衰老还要痛苦。神仙衰老的痛苦是她的一万倍。</p>\n<p>然后他就坐在一个地方， 没有朋友， 没有人跟他说话。这个时候的日子是特别的漫长。吃不好， 睡不着。只能喝一点点甘露， 有时候连甘露也喝不下去。到了一定的时候他会看： “我走了以后去哪里？”一看，有可能是畜生道，有可能是地狱。他能看到地狱痛苦的样子，把他吓得想尽一切办法去救自己，但是救不了。在天人道， 是无法用修行的办法来补救的。这就有点像眼看着自己快要进监狱了，进去以后，可能是枪毙，所以很恐惧啊！就这样他一直在痛苦中等到呼吸停止。呼吸停止后，多半是下地狱的，这就是天人的结局。</p>\n<p>所以师兄们， <strong>在世的时候心情要愉悦、要开心，但是必须得开心得有价值、有目标、有发心、有信仰</strong>，不然的话，没有目的傻乎乎的开心，有可能成为去神仙道的一个因。不念咒，不念功课，不发心，天天就在歌舞厅里面蹦啊蹦，要不然就泡在网络上天天聊天，家里来个客人他连个招呼都不会打，这样的人多半真的会去神仙道。他是没有时间去做坏事，但是就这样白白消耗了时间。</p>"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情", "title": "人生中最重要的事情", "rel": "上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情🔊.md", "dir": "上师开示/1. 为何修行？/1.2 轮回过患", "is_index": false, "meta": {"author": "龙洋仁波切", "tags": []}, "html": "<p><a class=\"wikilink\" data-page=\"人生中最重要的事情\">人生中最重要的事情</a></p>\n<p>2013 年 01 月开示</p>\n<p>人间， 我觉得不用多讲， 都知道是个什么样子， 但每一个人的感受不一样。</p>\n<p>有的觉得人间太痛苦了， 有的觉得人间太恐怖了， 有的觉得人间太肮脏了， 有的觉得人间过得去。有“过得去”这种想法， 可能还年轻，还没有遇到什么挫折。等到年过半百的时候， 就知道过不去了。这个时候不是过不过得去，是过不去也得过！</p>\n<p>人间唯一的优点， 跟别的道不一样的就是可以修行。</p>\n<p>我们就要利用人间的这个优点， 能够抓住， 就是我们的福报， 抓不住， 就什么意思也没有了。就是吃个饭， 睡个觉， 然后再撒泡尿。第二天起来了， 又吃个饭，睡个觉……没啥意思。</p>\n<p>但是有了信仰， 就有了文化的灵魂， 你的状态也不再是有障碍的状态了。什么是“有障碍的状态”？就是对佛教没有信心、有邪见。</p>\n<p>我们的人身是暇满的，感谢三宝，感谢自己的前因后果给我们安排了这么好的人生。所以， 我们要对得起这个安排， 尽心尽力地去修行。</p>\n<p>师兄们， <strong>只要有一口气，把修行放第一位，生活放在第二位。</strong></p>\n<p>“生活放在第二位我怎么活？”不要这样想！生活放在第二位，也许你活得更轻松；修行放在第二位，也许你活得更糟糕。</p>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠\">万事无常，唯有佛法是依靠</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会\">不可错过的机会</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不能太爱钱，它会要你命\">不能太爱钱，它会要你命</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/地狱里大概的情形\">地狱里大概的情形</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/死亡是最公平的\">死亡是最公平的</a></li></ul>"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/千万不要滞留在中阴间", "title": "千万不要滞留在中阴间", "rel": "上师开示/1. 为何修行？/1.2 轮回过患/千万不要滞留在中阴间🔊.md", "dir": "上师开示/1. 为何修行？/1.2 轮回过患", "is_index": false, "meta": {}, "html": "<p>2012 年 10 月开示</p>\n<p><span class=\"audio-name\">千万不要滞留在中阴间</span><button class=\"play-btn\" data-audio=\"千万不要滞留在中阴间.mp3\">▶ 播放</button></p>\n<p>今天晚上我们讲一下中阴间的地狱， 就是断气之后还没有去往六道，在中阴间还有个地狱。这种地狱跟其他地狱的痛苦相同， 只是受苦的时间可能稍微短一点。</p>\n<p>这种地狱是怎样形成的呢？比如，一个人死的时候，不知道自己死了，这种情况下他很快就会流转到中阴间。他以为自己还活着， 但有时候也会觉得自己跟活人不太一样， 然后就在这当中徘徊， 很痛苦。不像我们人间的痛苦， 在任何地狱，痛苦都是加倍的，是很刺心、让人承受不了的那种痛苦。</p>\n<p>举个例子，感情很好的夫妻两人里，男的一方死了，却不知道，觉得自己还活着，还在家里走来走去。他看见大家吃饭的时候不给他放碗筷，就上去说话，但别人却听不到，好像都不知道他的存在，而他却能很清楚地看见其他人。然后， 他想证明自己还活着，就到雪地里去走路，看见踩下去没有脚印时，才发现自己已经死了，就被吓昏过去了。但醒过来以后， 一切又都忘了。就像我们一样， 前一世做过很多事情， 但是这一世一出生就全部都忘了。他又跑回到自己的家里，想跟亲戚朋友说个话，干点什么， 但似乎所有人都不理他。他很痛苦， 会想：“我好像没有得罪他们， 怎么都不理我呢？”这时， 要是发现自己的女人有了别的男人，痛苦和仇恨会使他的业力增加十倍。他想去阻止这种关系， 但他既发不出声音， 也弄不出动静， 什么也做不了。可能有的师兄在睡眠中有这种状态， 想干什么却干不了， 很痛苦， 有时候被很恐怖的东西追赶， 想跑却无能为力， 类似这种感觉， 一直这样， 很痛苦。他有一点小神通， 当他发现自己最信任的“上师”是假的， 或者自己最信任的家人背叛了自己，就会很愤怒，并且会因为这种仇恨而堕入地狱。</p>\n<p>有的人生前爱好唱歌跳舞， 死了还爱去那些歌厅舞厅， 但每次去都发现好像没人理他。其实我们在人间也能感觉得到，在人群当中不被在乎、融不进去的那种痛苦， 谁都有过。但他的感觉比这个严重多了， 会很伤心，想方设法想融入群体，却没有一点办法。他跟大家一起跳舞， 却没有人夸他跳得好，没有观众能看见他。他会在这种痛苦中徘徊很长时间。</p>\n<p>这种情况有些师兄是亲眼目睹过的， 比如说曹原师兄。以前我们两个在春熙路， 有天晚上十一点半左右， 我在房间里待着的时候， 觉得有点想出去玩， 就带上他到春熙路步行街去散步。那一天是圣诞节， 我们走在街上， 就听到一阵阵呼喊声传过来， 好像前面有几千个人在闹。我们以为有很多人在那边聚会，但怎么往前走都看不见人，其实根本就没人。</p>\n<p>快要走完整条街了，声音还在前面。这个时候我想了一下：“这个声音不对劲啊， 可能不是人的声音。”然后， 我重新整理了一下自己的思路， 再去听， 发现那个声音很刺心， 很可怜， 穿透力很强， 不是我们平常的那种声音。这个声音一过来，“呜……”好像传到很远的地方。我知道这不是人的声音， 就对曹原说：“这可能不是人的声音。”然后， 我们就回酒店了。回来以后， 他觉得那里不可能没有人吧， 就想回去再看看。后来他去问附近卖烧烤的那些人：“这里刚才有聚会吗？有多少人？”“今天晚上没有聚会， 因为是圣诞节， 警察戒严了， 这个地方是不允许聚会的。”“没有人。”但我们的的确确听到了几千号人在那儿狂欢的声音。你们看，中阴间就有这么多的人。</p>\n<p>还有一次， 也是我亲眼所见， 是在西宁的一个歌厅里， 就是那种迪吧，一般人不怎么去的地方。一个老板请我去玩， 刚开始我也不知道这是个跳舞的地方， 进去以后， 他给我准备很多吃的喝的， 前面有很多灯在转， “瞪瞪瞪瞪”大家都在那儿跳。那个老板自己去点歌了， 然后很多人在那儿跳呀跳的。我在那儿看他们跳舞的时候， 虽然灯是闪着的， 但我的的确确看见了一个骷髅也在里面跳舞， 就是一个人的骨头架子， 没有肉。当时我真的觉得他很可怜， 都成骨架了还不知道自己已经死了， 还在那儿跳。我觉得他特别可怜， 差点眼泪都掉下来了， 就念了一些心咒和佛号，给他吹气，然后骷髅就消失了。这种情况就是中阴间的地狱。</p>\n<p>还有一种，是在门缝里、锅和锅盖中间，还有碗里，所有东西的边缘上，甚至人的指头缝里都会有这种地狱。有一天在寺院里，有一个和尚坐在那儿僵住不动了， 我让他起来， 他说：“我不能起来， 上师， 你看看我的身上有个大城市， 现在已经居住了很多生命， 我一起来就像地震一样， 全部都会倒塌的， 会杀害很多的生命。我该怎么办呢？”我没看见， 这是他说的，他看见了。在佛经里确实讲到有这些地狱。</p>\n<p>比如， 你用的碗， 早上最好要念观音心咒或者比较有加持力的心咒往里面吹一下， 否则倒个开水都会烫死无数这种生命。然后， 门随便“嚓”地一关， 也不知道会压死多少生命。可能我们觉得没什么， 但是我们的一个喷嚏， 对他们来说简直就是阵飓风， 我们一碗茶倒下去， 对他们来说可能是一场洪水。这种生命在地球上占百分之七十， 但是我们看不见。</p>\n<p>所以， 人类其实只是所有生命当中很小的一部分， 还不到百分之十。从科学角度来讲，这些众生可能是微观世界的一些生物，但是在佛教来看，就是中阴间的生命， 有很多很多。就像我们的身体， 实际上也是由很多生命堆聚成的，虽然我们看不见。</p>\n<p>再比如， 吃一口白菜，你这么卷进去一咬， 不知道压死了多少众生。喝口茶， 也不知道喝死了多少众生。这种情况的的确确是存在的， 有神通的人就能看见。有人觉得谈恋爱是最幸福的， 大家拥抱一下吻一下，好像觉得很舒服是吧？ 但就在这个舒服的时候，在两张嘴中间要压死多少众生？ 一个亿的生命！他们不开心我们开心，真的。</p>\n<p>但这个没有办法， 只是讲讲而已。你不可能不吃饭，也不可能不走路。但是我们的办法是什么呢？ 就是要信佛， 要发心， 所有的这些众生都曾经当过我们的父母， 跟现在的父母一样对待过我们。现在他们没有能力救度自己，也没有能力帮自己，但是我们有能力超度他们，为什么呢？<strong>我们有佛法！ 最靠得住的， 别人永远抢不走的， 生生世世跟你在一块儿离不开的， 就是你的信仰。这个信仰， 要靠上师一步一步地去教。</strong></p>\n<p>比如，刚才我说了， 早上还没有喝茶之前， 要用一个很好的发心去念一个心咒，因为心咒的加持力，也许度了碗里的众生，也许对他们来说就没有痛苦了。再进一步说， 如果你有一个禅定的境界， 哪怕是看这个世界一眼， 都会让所有的众生得到安乐。这个功德有多大呢？ 地球上爬得最快的虫子， 从额头爬到鼻尖的时间里， 你在禅定中观想一遍， 就有十八亿观音心咒的功德， 相当于亲口念了十八个亿的观音心咒。<strong>其实我们有这样的条件，只是没有去做而已， 只要想去做， 完全能做到。所以， 我们要学好佛法，要达到这样的境界去救度这些众生。</strong></p>\n<p>现在很多人认为不能吃肉， 因为这是众生的肉， 是我们父母的肉，不能吃。但是， 这种眼光太单一了。蔬菜、米饭、所有的食物， 花草树木里面都有生命， 一样的。你不能说生命小吃了就没有罪过，生命大了，像看得见的牛、羊、鱼，吃了就有业障，不可能的，生命就是生命。很多人会问：“那怎么办呢？”我们能做到的就是努力地去念佛、持咒、修行， 以此来帮助他们。你们可能知道， 为什么有的人一定要请上师到一个地方去， 想方设法、拼命地请， 哪怕上师只在那待上半个小时， 甚至五分钟都行， 只要去就行， 这是为什么呢？ 就是因为<strong>上师有境界， 只要他在那待一会儿，就会救度很多这类众生。</strong></p>\n<p><strong>如果一个城市里有一位大德， 那整座城市都会受益很多， 只是我们看不见。</strong></p>\n<p>现在有的人， 你跟他说很多， 但是他自己看不见， 就不承认。其实看不见不等于没有， 现在我们在这儿也看不见美国， 但美国是存在的； 此时此刻我们也看不见脑子里的脑浆， 但不能说没有脑浆吧？所以，看不见不等于没有。我们这里所有的人都是信佛的， 是到这里来学法的，一定要相信佛陀， 佛陀是在这个世界上独一无二不撒谎的人， 他从来没有撒过谎。</p>\n<p>佛陀两千年前预言的一些东西现在成为了现实， 在我们看来太了不起了， 但是对佛陀来讲没什么，只是他的位置不一样而已。站在大楼的楼下看到的东西，和二十层楼上看到的是不一样的。所以，为了救这些众生，我们要努力地学佛，他们都曾经做过我们的父母，跟现在的父母一样，伺候我们，给我们吃好的、穿好的、上好的学校。特别是现在的这些孩子，根本就不像孩子，全是皇帝。你前世的父亲母亲，换了个皮你就不认他了吗？对我们修行人来说，明明知道这些是我们的父母，却不认他，是不是有点不孝顺呢？现在的父母在受罪，你会不会想方设法去救他们呢？那以前的父母和现在的父母有什么区别呢？如果时间隔长一点就有区别，父母到八十岁的时候，因为时间间隔太长了，你是不是就不认他们了呢？所以，天下的父母，我们都要尽自己的力去帮助。</p>\n<p>我们不知道前世修了什么福报， 诞生在地球上，诞生在这个人间，诞生在有佛法的地方，还遇到了佛法的精华——龙钦心髓。能够听到这么好的法， 有这么好的机会， 一定要好好利用。比如你有一把很好的刀， 天天藏在那里， 不去用， 那有什么意义呢？你用所有的积蓄买了一把好枪，不去使，摆在那又有什么用呢？ 一样的道理， 有这么好的机会但不珍惜，不去利用， 是没有意义的， 下一次不会再有这样的机会！ 刚才说了， 我们这样的生命在地球上占的比例百分之十都不到。为什么会诞生在这么好的有修行空间的地方呢？ 以后还有这样的机会吗？不可能有很多。所以千万不要成为中阴间的众生。</p>\n<p>有的上师绝对有一些神通， 一看：“哎呀， 龙洋上师的某某弟子在中阴间”， 那我是很丢人的。有的上师的弟子一群一群地下地狱，那这个上师不是很丢人吗？你们每个人都会说：“我爱上师，我尊重上师，我听上师的话，我为了上师可以付出自己的生命！”真的能付出的话，为了上师得好好学习。就算想不到自己、想不到父母，为了上师也要好好学习，要为上师争光。如果有一天你们听到上师在地狱，那是我给你们丢人；但是有一天我听到你们在地狱，那就是你们给我丢人，真的！</p>\n<p>所以， 我们至少必须做到不能去地狱。人间、天道、阿修罗道、畜生道、饿鬼道， 都有可能去， 但我们要坚信自己不会去地狱， 因为我们是龙洋活佛的弟子，应该有这样的想法。</p>\n<p>修行人没有一点性格是修不出什么来的。有的人软绵绵的，什么想法都没有，别人在人群当中天天说他的上师不好，说他的上师怎么样，甚至吐口水，他都坐在那儿无动于衷。他并不是真的达到那种不在乎的地步了，其实他根本就没修好，没有这种概念去反驳“不是你说的那么回事”，而是认为“他说他的，对我来说没有多大的关系。只要不说我不好、不说我的老公不好、不说我的孩子不好就行了”。这种修行的态度可能是不太认真的。</p>\n<p>有时候说修行人不能有分别念，但是初学者必须有什么东西来推动自己的修行，不然的话成不了佛。刚开始进入佛门谁是佛？不可能是佛，所以这些分别念还是需要的。否则， 我作为你们的上师是很丢人的。要是谁说龙洋活佛的哪个弟子不好，我马上就会生气：“哪点不好？你说说。”</p>\n<p>我觉得修行一开始就要有这样一种气魄，否则根本就修不出来。比如，上师今天叫你过来， 你觉得来也行， 不来也行， 无所谓， 上师也不会说什么。明天上师让你做什么，你觉得做好也可以，不做也可以，没什么。上师让你念莲师心咒一百二十万遍， 那就念吧， 念一辈子， 念不完也可以。这种状态去修行肯定是不行的！会像墙头草一样， 很快就倒向右边， 或者左边。很多人认为：“我死了算了，没什么，死了就解脱了。”如果你死后到了这种中阴间的地狱，或者畜生道、饿鬼道，怎么办呢？你有什么把握解脱呢？活着的时候那一点点痛苦你都承受不了，死亡的痛苦和恶道的痛苦你承受得了吗？成就的人可以说“死了算了，无所谓”，因为他去哪儿都是净土，真的无所谓。可我们不是，我们肯定要祈祷：“千万不要死啊，我在修行当中千万不要得病啊，我真的需要时间去学佛啊。”怎么可能“死了就算了”呢？“死了算了，哎呀，我不害怕。”很多说这种话的人到真正死的时候比谁都害怕，因为他没有把握，没有什么不怕死亡的理由。</p>\n<p>有的上师是有天眼通、他心通的。如果我是这样的成就者，我可以看见在这里有多少个你们已经死去的亲戚在跟着你们，多少个你打掉的胎儿在跟着你们，你难道不可怜他们吗？ 我只是打比方。他们充满怨恨地跟着你：“妈妈为什么要杀我？我又没有对她做过什么，难道我的出生是我的错吗？妈妈为什么会杀了我呢？她什么时候会给我一个幸福呢？”他们原本对你充满期待，但是你没有满足他们。他们怀着细小的仇恨，吐出来的气息会导致你得子宫癌，或者类似的很多妇科病。<strong>所以师兄们要忏悔自己所做的一切。</strong></p>\n<p>男的也是一样。有的男人真的很不负责， 让女孩怀了孕， 然后就说：“你要打掉， 不打的话我就不跟你怎么怎么。”对待自己的孩子就像对待一只蚂蚁，做这样的事情可能不太好。</p>\n<p>以前，我小的时候常在活佛群里玩，那些活佛们都能看到很多一般人看不见的东西，看到以后就会发生，很真实的。后来， 在五明佛学院的时候， 法王如意宝批评我们， 说：“你们这些算什么啊？ 江湖卖艺吗？ 光靠神通生存吗？不允许说！这些说多了， 不但帮不了别人，反而害了自己。”从此以后， 五明佛学院没人说这些话了。但在这之前， 我见过很多活佛能看到这些东西。说实话， 我是看不见的， 但是我能闻到一些气味， 这是事实。哪一个女人杀了多少胎儿， 哪一个男人伤害了多少生命， 我大概都能闻出来。你们修到一定的时候， 也能闻得出来， 他们有一种怪味。不信你可以去屠宰场闻闻，那里的生命死得太多了， 有很浓厚的这种味道。经过汶川地震灾区时， 尸体埋得多一点的地方， 我大概都能闻得出来，“这里可能有很多的尸体”。后来据我了解，确实埋了很多。如果这种气味太浓了， 是在我们道场的话， 就会污染大家， 搞得大家心慌、不安定、头痛、眼花，对佛教产生反感， 对上师没有信心。这些业的气味可能会产生这样的影响。<strong>佛教里面没有谁专门这样讲气味，这是我自己独特的感受。</strong></p>\n<p>所以， 如果你今年气味很重，明年来的时候气味变轻了， 上师不是很开心吗？ 上师不能说你的气味很浓， 那会伤害你的自尊。但是你自己要注意啊， 要想到： “可能上师是闻得出来的， 我要忏悔，明年见上师的时候我的气味要稍微淡一点。”</p>\n<p>还有， 我们很多人的心太浮躁了， 否则，<strong>静下心来，很多细节的东西都会赤裸裸地出现在你面前。</strong></p>\n<p>你们一直在城市里待着，可能没有这种感觉。我在西藏、青海那些地方待久一点，快要回到城市的时候，就会闻到很浓的人的气味， 不是汽车或者别的什么气味。只要你们的心稍微静下来， 也能闻得到。除此之外， 上师什么神通都没有。第六感谁都有， 这不是神通， 只是有的人敏感一些，有的人不敏感，这可能是心细不细的问题。心静了，第六感可能就敏感一点， 太浮躁了就发现不了， 其实你们有， 只是没有发现。往往有人把这种感觉说成是神通，可能不是， 这是第六感， 谁都有。今天会来一个什么特殊的人， 然后有可能发生什么样的情况， 这种感觉不要说人，狗都有，我觉得并不奇怪。</p>\n<p>我刚才为什么讲这些呢？</p>\n<p><strong>就是为了让师兄们努力地去忏悔自己以前所造的业，知道的和不知道的都要用功去忏悔。</strong></p>\n<p>其实修行的路上千万不能执着什么气味不气味，或者看见看不见的， 这些对修行来说是个障碍。我们种果树需要的是最后结的果， 而不是叶子。一个人只在乎叶子，天天看那些叶子，却不知道水果长到哪里去了，那不是很傻吗？</p>\n<p>还有， <strong>师兄们可能会有各种各样心里的显现和梦中的显现， 每个人脉路不一样， 各种显现都有可能出现， 但是不能太在乎了。这些显现只不过是过路的客人，对我们来说是无所谓的。</strong></p>\n<p>今天我们简单地讲了一下中阴间的生命， 其实关于这个方面我还有很多恐怖的事情可以说， 但是这些好像有时候不适合讲。所以， 今晚上就讲到这里吧，谢谢。</p>"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/地狱里大概的情形", "title": "地狱里大概的情形", "rel": "上师开示/1. 为何修行？/1.2 轮回过患/地狱里大概的情形🔊.md", "dir": "上师开示/1. 为何修行？/1.2 轮回过患", "is_index": false, "meta": {"title": "地狱里大概的情形", "author": "龙洋仁波切", "category": "上师开示", "subcategory": "多智钦寺网站文章", "source": "网页", "source_url": "http://www.duozhiqin.com/#/article/details?articleCode=AT2023111514500288", "status": "素材", "tags": []}, "html": "<p><span class=\"audio-name\">地狱里大概的情形</span><button class=\"play-btn\" data-audio=\"地狱里大概的情形.mp3\">▶ 播放</button></p>\n<h1>地狱里大概的情形</h1>\n<blockquote>死了以后，六道里是没有什么好的地方可去的。唯一好的去处，是你修行好了，可以去净土。</blockquote>\n<p>今天讲一下地狱。</p>\n<p>地狱有十八种，一一去讲的话，要讲十八天。这里大概地讲一下地狱的种类，以及什么因素导致去什么样的地狱。</p>\n<p>首先讲一下夫妻之间不忠诚会去什么样的地狱。结为了夫妻，相互之间就有了承诺。你们汉人有没有我不知道，藏人就有这种誓言，发誓两个人要一辈子在一起，等等。</p>\n<p>光是说：“我可能跟你在一起，我们要结婚。”这个还不算数，要在三宝或者德高望重的人面前，说“我决定嫁给你”或者“我决定要娶你”，在这样的前提下结婚。结了婚以后，如果对对方不太忠诚，有了外遇，就会因此下地狱。这种情况下到的地狱是什么样子呢？</p>\n<p>那个地方没有太阳，没有月亮，没有光明，地和天都是乌红色的，到处都好像快要着火了一样。还有很大的声音，就像天上有一千条龙在一起不断地大声吼叫。走一步都感觉整个天地快要倒塌，咳嗽一声都好像整座山要爆炸，所有的感觉都放大了。</p>\n<p>进去以后，就会看见一棵树，看起来还比较漂亮。在树下，会听到自己最爱的人在树上喊他：“上来！”他控制不了自己，很开心地向上爬，但是树叶都是刀，双面都是利刃，爬到树顶的时候，肠肠肚肚全都刮烂了。这种刮肠刮肚的痛苦，是人间的一万倍，他就痛得昏倒了。</p>\n<p>醒过来以后，刚才树上有什么刀，他都忘了，又觉得最爱的人在树下喊他，就又往下走，然后肠肠肚肚又全部被绞烂。在人间做过多少次对不起对方的事，就会千倍地偿还给因果。</p>\n<p>比如在人间做过一次，就要这样上上下下爬一千次，但却死不了，那是命!爬啊爬啊，最后实在没有力气的时候，听到上面的人喊他，他虽然还是有那个心想去，但是去不了，就躺在树下。</p>\n<p>这时，树上滴下烧红的铜水，滴到男（女）人的生殖器官里面，全部烧烂之后，他就昏倒了。醒来以后又好像什么都忘了一样。只要想一下，就有铜水滴下来，想一下就滴几滴。如果是男的，就把男人的阳具烧掉，是女的，就把阴道烧掉，就这样很多次很多次。</p>\n<p>不是一年、两年，按照我们人间的时间来算，至少得呆一千年，这样的痛苦要承受一千年。不需要吃饭，也不需要睡觉，没有这个概念。下这种地狱就是出轨的果报。</p>\n<p>还有一种地狱是对父母不恭敬感召的。</p>\n<p>父母天生就是对子女有恩的，如果子女不恭敬父母，说一些特别激烈、特别伤父母心的话，让父母失望，产生了“唉哟，这个孩子死了算了”的想法，对父母做过这样的事情，就会去到一种地狱。</p>\n<p>这种地狱，进去的时候是一个很好的经堂，他感觉父母在里面叫他。那时的感觉和在人间不一样，特别渴望父爱、母爱，很想进去。进去之后，经堂里面没有人，有一个大型的经轮在转。</p>\n<p>空中一个声音说：“把经轮抬上去！”就听见“特”一声巨响，就是刚才说的那种轰鸣，经轮就被抬了起来。经轮上去以后，他会不由自主地坐到刚才经轮转的地方。</p>\n<p>那个声音又说：“按照因果把经轮放下来，放到这里。”那个经轮就往下压，经轮的转轴就会压在他的脑袋上转，把他的脑浆绞得像下雪一样，他就痛得昏倒了。</p>\n<p>醒来后又会回到门外，听到里面父母在喊他，就又进去重复受罪一次。在地狱的感觉就是这样，反反复复受苦很多次却死不了。我讲的只是大概，细节的话还有很多。</p>\n<p>撒谎，特别是向自己的上师和父母撒谎，这种人会去到一种地狱。在那里舌头被抽出来，有一块田那么大，然后被在上面种地。</p>\n<p>整个舌头上面被划来划去，犁得稀巴烂，又出血又化脓。舌头上面又要种地又要被踩，那种痛苦是没有办法用语言来形容的。</p>\n<p>这些只是地狱的很小的一个角落。师兄们要记住，死了以后，六道里是没有什么好的地方可去的。唯一好的去处，是你修行好了，可以去净土。去不了净土的话，就只能去六道了。</p>\n<p>今天大概讲一下地狱，以后还会讲神仙道、阿修罗道和人间道。去了这些地方，同样也是痛苦，哪怕针尖那么大的幸福都没有。</p>\n<p>2012年10月开示</p>\n<p>利他明思小家校对整理</p>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不同状态的生命形态\">不同状态的生命形态</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不能太爱钱，它会要你命\">不能太爱钱，它会要你命</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情\">人生中最重要的事情</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/计划赶不上无常\">计划赶不上无常</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠\">万事无常，唯有佛法是依靠</a></li></ul>"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/饿鬼道", "title": "饿鬼道", "rel": "上师开示/1. 为何修行？/1.2 轮回过患/饿鬼道🔊.md", "dir": "上师开示/1. 为何修行？/1.2 轮回过患", "is_index": false, "meta": {"title": "\"饿鬼道\"", "source": "\"《师尊龙洋仁波切开示集》\"", "type": "上师开示", "status": "素材", "author": "龙洋仁波切", "tags": []}, "html": "<p><span class=\"audio-name\">饿鬼道</span><button class=\"play-btn\" data-audio=\"饿鬼道.mp3\">▶ 播放</button></p>\n<h1>饿鬼道</h1>\n<p>六道里面的饿鬼道，因为各种原因，各种念头，会出现各种形象，这都是他们自己的业力造成的。佛经里面对饿鬼道的形容是比较多，我们很多的修行人也看到过，听到过。其实我们身边就有饿鬼道的人存在，我的姨妈就是这样的人。</p>\n<p>我姨妈性情固执，虽说她对佛教大概是相信的，但是可能是她自己前一世的福报问题，有些概念就是转换不过来。我爸爸是一个佛学博士，我的家庭就是一个佛教家庭，我们生下来第一个听到的就是佛教圣号，或者是心咒。即使有这样好的环境，也很难改变姨妈的习气。她已经去世了，我为什么要讲她，是为了帮助你们，而不是不尊重她。</p>\n<p>她特别喜欢世间的东西，她没有老公，没有儿女，唯一的亲戚就是我们。她有很多的财产，她有很多的古董，也有很多很多的牛羊。她一个人要是吃，吃一百年都吃不完，穿一百年都穿不完，但是她的心情一直都是活在地獄里，很痛苦。为什么呢？她害怕她的东西被别人抢走、偷走，骗走。</p>\n<p>她上锁的时候，都是同时上几道锁，上一道锁，她不放心。晚上，整夜整夜地睡不着觉，只要有一点点动静，她就怕：“是不是有人来抢我的东西？”</p>\n<p>她一个人就有三百多头牛，但是只要死一头小牛，她都会哭一天，不是为了可怜它，而是觉得自己少了一头牛。</p>\n<p>吃饭呢，80% 是在别人家里吃的，她很少在自己家里吃，因为自己家里的钱要省，吃饭也是个开销，实在没地方去的时候，她只能在自己家吃饭，她就吃得很少。但是，如果是到别人家里去吃，那吃得太多了。我们去给她念经，她是需要念经的，念了一天的经，到吃饭的时间，她说：“快呀，回家吃饭啊！吃好了，再过来念经啊！”</p>\n<p>她哥哥，也就是我爸爸，天天跟她讲：“人身是难得的，人生是无常的，你要这么多的财产干什么呢？你死的时候一根针都拿不走的。你死了以后，要是运气好，这些财产属于我的。你为什么不处理一下这些财产呢？” 她说：“你过来看我可以，但是不要动我财产的念头。”</p>\n<p>慢慢、慢慢地她变成手脚很细，肚子很大，头很大，脖子很细的样子，真的，就有点像饿鬼道的众生的形象。那个时候，我爸爸又劝她：“你能不能照照镜子啊，你不用听我的，你得看看你自己，你是不是应该转换一下你的思维？” 她还是不信，不肯转换。</p>\n<p>有一天，我的一个表弟到尊者法王如意宝那里去。他很担心我们的姨妈会堕入饿鬼道，我们所有的人都很担心她会活生生地堕入饿鬼道。</p>\n<p>他对尊者法王如意宝说：“有没有一点办法救救她？她周围所有的亲戚说的话，她都不听，您的名气大，你说一下也许会有用。”</p>\n<p>尊者法王如意宝说：“我说了也没用，但是有一个办法，有时候得下狠手。你找一个她去别的地方的时候，不在家的时候，把她所有的财产都捐献给五明佛学院。”</p>\n<p>表弟说：“这样行吗？”</p>\n<p>尊者说：“行，我做主！”</p>\n<p>有一天，我们的姨妈到色达县去了。表弟把她的全部财产都捐献给了五明佛学院，只给她留下了一个碗。捐了以后，她回来一看，什么都没有了，她什么都不说，就坐在那儿。</p>\n<p>表弟说：“姨妈，你可以骂我可以打我，但是我的出发点是好的，我不能让你活生生地堕入饿鬼道。我把你的财产全部捐给五明佛学院了！”</p>\n<p>“啊！五明佛学院啊，没有给哥哥留一点儿啊！” 她这样讲。</p>\n<p>“没有。”</p>\n<p>“哦。”</p>\n<p>然后，姨妈啥都没说，也没哭，很奇怪，真的。</p>\n<p>第二天，我们就想，她会不会想不通啊，就一直看着她。第二天一早，她很开心地来了，跟大家说：“谢谢你们，我已经轻松了，我觉得好像在监狱里待了二十年，刚从监狱里越狱出来一样。” 然后，从此她就很好了。</p>\n<p>真的有这种人，不知道是什么 “愿力”。</p>\n<p>2013 年 1 月 3 日开示</p>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠\">万事无常，唯有佛法是依靠</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不同状态的生命形态\">不同状态的生命形态</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会\">不可错过的机会</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情\">人生中最重要的事情</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/死亡是最公平的\">死亡是最公平的</a></li></ul>"}, {"slug": "上师开示/2. 找到智慧的指引/什么样的老师适合你", "title": "什么样的老师适合你", "rel": "上师开示/2. 找到智慧的指引/什么样的老师适合你🔊.md", "dir": "上师开示/2. 找到智慧的指引", "is_index": false, "meta": {}, "html": "<p>2013 年 09 月开示</p>\n<p>如何选择上师， 是师兄们比较关心的问题， 这也是修行过程中比较棘手的一个问题。前后可能有二十位师兄问过我：“找一个什么样的上师最好？ 找一个什么年龄段的上师最好？ 找堪布好还是活佛好？”当时我没有回答。现在我把我知道的、了解到的情况告诉师兄们。我说的不一定都对，也不一定全面，仅供师兄们参考。</p>\n<p>当上师的那种感觉有点像当老师。通俗点来说， 一个人要到学校当老师， 刚开始自己要学习， 达到一定的文化层次， 具备一定的素质， 还要有认证机构颁发的证明， 才能上岗。活佛和堪布们， 如果要当上师，也应该具备这些条件。</p>\n<p>要做上师， 首先要完成自己的学业， 经过自己上师或者佛教团体的考核， 合格以后， 得到了大家的公认， 才有资格做上师。从年龄段来讲，二十岁以下不大可能成为上师，因为学习的过程是比较漫长的。</p>\n<p>第一， 对一个修行人来讲， 至少得闭关六到七年， 完成好自己的功课。起码该念的三根本心咒要念完， 该观想的次第要过完。在这之前， 要学闻思， 必须得先了解佛教的理论知识， 然后再走实修程序， 闭关、念咒等等。<strong>这个程序， 不见得能一次性通过， 要由自己的上师来看合不合格。</strong></p>\n<p>有的人反复做了很多遍， 做了很多功课才成功。做完了以后， 最好是上师亲口对你讲：“你现在可以度人了， 你可以去弘法了。”这种人才可以当上师。堪布也好，活佛也好，都可以。</p>\n<p>所以， 你们问的关于年龄段的问题， 除了极个别的情况以外， 其余的， 二十岁以下当上师不大可能， 因为他自己还在上学。有的也许还是逃学出来的呢。为什么说极个别除外呢？ 像第三世多智钦那样， 八岁就可以讲《入菩萨行论》， 这种人就不在其中了， 他生来就具备这样的条件。别的，可能就值得研究了。</p>\n<p>活佛或堪布， 找哪一个当上师好？ 这得你们自己选择。堪布， 大多是普通人这一生学出来的， 是学者。他们理论知识学得很好， 也许今生修得也很好。那活佛呢？ 是古佛再来。他们在过去世就已经修行成就，成了佛或者菩萨了， 到了净土以后， 专门来到人间度化众生。两者的概念是不一样的。但是， 找活佛当上师的风险比较大。为什么这么讲呢？冒充活佛的人太多了， 冒充堪布的则不太多。为什么呢？ 道理很明显，越是好的东西越有人冒充， 因为它们越有冒充的价值。像茅台酒、五粮液，这些东西冒充的就很多， 假货很多。江津白酒就不会有假冒的。虽然堪布里面也有很优秀的， 但总体而言冒充堪布的很少。冒充活佛的， 也就是假冒的活佛， 很多。所以， 找活佛当上师， 这方面风险很大， 值得你们去思考。要精心地研究和观察，看看到底是不是真的活佛？</p>\n<p>众生的思维是比较狭隘的， 往往看不大清楚对方是不是活佛。但是你们可以仔细观察： 大德们认可他吗？ 信众认可他吗？ 他所在地区的统战部、宗教局认可他吗？ 其实统战部和宗教局是专门管理活佛和堪布的机构， 对他们各方面的情况掌握得很全面。他有没有什么不良影响？ 他有没有影响力？ 影响力有多大？ 他们虽然不信仰这个， 但这是他们的职责所在， 所以他们了解得很清楚。现在交通又不闭塞， 信息这么发达，你去问一下很简单。如果统战部说他是在册的活佛， 那可能还可以。对于我们没有神通的人来说，这也不失为一种观察的方法。</p>\n<p>第二， 可以观察他的各方面言行。首先， 要看他是不是一个好人，这个我们应该能看得出来吧？ 第一是不骗人， 第二是不撒谎， 第三， 至少得不打架。然后呢， 做事比较认真， 比较实在， 不是那种捉摸不透的人。说话也说的都是人话， 不是那些云里雾里的。在这种基础上， 才值得进一步去考虑。</p>\n<p>很多人问我：“藏传佛教可以皈依多位上师吗？ 可以在多位上师那里学法吗？ 著作里提到不少大德都是学过很多法的， 这样好吗？”佛法有八万四千法门， 是为不同众生开取的。每个人的性格、状态、福报、年龄和身体状况都不太一样， 所以开取了这么多的法门。你学什么法，要看你适合哪一种。适合显宗、密宗， 还是南传佛教？都可以自己去看。</p>\n<p>不过据我所知， 跑的地方太多了不太好。最好认准一个法， 认准一个上师， 跟着他完整地学下去， 这种修行方法比较好。否则， 跑来跑去，今天修一个禅宗的什么禅定， 明天修一个密宗的什么法， 后天又修一个什么什么， 最后自己都搞不清楚自己在做什么。你可以结很多缘， 可以见很多上师， 也可以皈依很多上师， 但是真正学法的时候， 也就是说依止上师的时候， 你应该认准一个自己的根本上师。就好像你可以有很多干爹， 但是只能有一个亲爹。亲爹太多的话可能有问题。修行也是一样的道理。好好去修行， 要认真一点， 不然的话对自己不负责任， 对自己的灵魂不好交代。</p>\n<p>笼统地说， 修行方法是这样的： 共同部分的修法， 是可以共同去修的。这个上师可以讲， 那个上师也可以讲， 这是共同的。但是<strong>不共的部分，你和他可能不一样， 他和她可能也不一样， 不专一依止上师没有办法修。</strong></p>\n<p>我今天讲的法， 有的对你可能很适合， 但有的也许不太适合。举一个简单的例子， 刚才这个录音， 有的师兄录了， 我跟他说别录， 因为这对他来说不太适合，但对曹原师兄来说是很适合的。一个上师说出来的话，对哪个人适合， 哪个人不适合， 道理跟这个一样。你去餐馆吃饭， 有的人吃辣很适应， 可有的人就不适应。佛法的修行方法跟这个也是一样的，要看对你适不适合？ 找上师也差不多一样的道理。比如， 这位上师跟你适合吗？他的性格，爱好，他的喜怒哀乐，跟你像吗？是你喜欢的风格吗？</p>\n<p>肯定有的喜欢，也有的根本就不喜欢。</p>\n<p>我给大家举几个师徒之间没有缘分的例子。比如说，我很喜欢开玩笑，喜欢说笑，不喜欢很多弟子很沉闷的那种感觉，好像明天就要地震了似的，我是不太喜欢的。但是有的上师， 因为众生的苦显得比较沉闷， 觉得大家都很痛苦，这种情况不一样。</p>\n<p>讲笑话的时候， 有的弟子很开心，“上师的笑话我喜欢听， 我乐意听。”但有的弟子产生邪见就走了。就是不一样。上师也应该理解他，“他可能和我没缘分。”他自己也应该能够理解上师， 因为上师没有办法度他。</p>\n<p>大家都只用修一个法就可以的话， 释迦牟尼佛那么辛苦， 开取这么多的法门干什么？念一个阿弥陀佛阿弥陀佛， 全都念阿弥陀佛就行了呗。很多人认为只要念好阿弥陀佛就会去极乐世界。不一定，不是那么简单的。</p>\n<p>要修阿弥陀佛法门的话， 首先需要得到阿弥陀佛法门的灌顶。你需要找到一个合格的上师， 才能给你灌顶。第二， 需要阿弥陀佛法门的传承，而且传承必须得比较清净。如果找一个杂七杂八的传承， 也许你都得不到真正的传承。第三， 需要有完整的修法仪轨， 不然你只是想一下的话，没有那么简单。要修阿弥陀佛法门， 就需要知道整套阿弥陀佛的观想法。另外，还有三种情况会障碍你去净土，没有了这些障碍，才可以往生。所以，阿弥陀佛净土也不是那么容易去的。</p>\n<p>每一种修行方法都是这样的。比如说， 有的人， 遇到了好的上师和清净的传承， 看起来他做得很简单， 但实际上他修得很快。这是为什么？他真的得到了真传！</p>\n<p><strong>有的人， 一年四季就看闻思， 看了三十年， 书都翻破了， 还在那儿看。旁边有人问他：“你在干什么呢？”多问几句， 他就会生气：“你干什么！”火气一点都没消下去，这样是没用的。</strong></p>\n<p>以前不是说过嘛， 有一个老和尚， 说自己要去修忍辱， 上师就跟他说： “你修忍辱的话， 就去大家转玛尼石的那个路边， 坐在那里修。”他坐在那里， 一个小和尚跑过去转一圈玛尼石就问他： “老和尚你在干什么？”他说： “我在修忍辱。”那个小和尚转了一圈又回来问他： “老和尚你在干什么？”“我在修忍辱。”然后小和尚又去转一圈过来跟他说： “老和尚你在干什么？”“刚才不是跟你说了吗？修忍辱！”（众笑）这就是他没有弄懂忍辱是什么。</p>\n<p>所以， 要搞懂修行的窍门。不然的话， 修行真的有点难。为什么要寻找一个特别优秀而且特别有加持力的上师呢？ 因为<strong>他的手里就有这个巧妙的东西</strong>。所以大家得找好自己的上师。</p>\n<p>刚才我开示的主题是什么呢？ 就是怎么去寻找上师。师兄们有这样的要求， 我就讲一讲， 希望对大家有一点帮助。在寻找上师的过程中，有的人可能会遇到一些障碍。有的人可能遇到了我就再也不找了：“龙洋活佛就是我的上师， 我不去找别的了， 也没有必要去找别的， 哪怕他是一条狗我也跟着他！”有的人可能会觉得：“比他好的可能多得是，你看他这个人疯疯癫癫的， 也许不是什么好东西呢。我得去别的地方再看看，哪个上师好一点。”有这种想法，我也理解。</p>\n<p>刚才讲了怎么去寻找上师， 什么年龄段的合适， 大家可以去对照。还有一点， 如果你找的上师太老了， 虽然可能他很好， 但说一句不中听的话，害怕他圆寂，如果你连头都没磕几个他就圆寂了，那你还修什么呢？这个有点麻烦。所以，大家得认真考虑好这些因素。</p>"}, {"slug": "上师开示/2. 找到智慧的指引/认真对待自己的选择", "title": "认真对待自己的选择", "rel": "上师开示/2. 找到智慧的指引/认真对待自己的选择🔊.md", "dir": "上师开示/2. 找到智慧的指引", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<p>现在很多修行人， 没有一种踏实的感觉。虽说他是修行人， 但是他没有那种找到了依靠的感觉。</p>\n<p>佛教带给他好的感觉的时候， 他从来都发现不了， 认为那是自己的本领。但是一旦出现障碍， 全部算在佛教的头上。家里死一头猪，“那是我信仰造成的！”孩子哭了， “怎么我信仰了以后， 孩子都哭了呢 ？”全都算在信仰的头上。他不想一想， 没有信仰之前不会出现这些事吗？ 也不想一想，如果没有信仰，会不会比现在这种情况更严重呢 ?</p>\n<p>遇到一些危险和痛苦的时候， 很着急地出现在上师面前， 说： “上师，我是你的弟子， 你认识我吗 ？”那个时候， 我确定他遇到了麻烦。当我解决了他的麻烦后， 他就消失了， 消失得无影无踪。还有的弟子碰到困难来找我， 我给了他一个解决的方案， 也许效果不太好， 他又到别的上师那里去换“配方”，就这样跑来跑去。</p>\n<p>遇到危险的时候， 所有上师的名字都会祈祷； 所有知道的念经方法都去念。这个还是一个比较有一点点信心的人。没有信心的人， 关键时候想不起来去祈祷上师。他会去找一个领导， 或者是去找一个医生解决问题。即使他能想起来，也是一种比较不稳定的东西。</p>\n<p>念经的时候， 这里念一点， 那里念一点， 到处去念， 最后结果是什么样子，也不知道。就是这种心态造成的。</p>\n<p>供佛像也是一样。释迦牟尼佛、莲师、观音（ 菩萨）、文殊菩萨、地藏王菩萨、弥勒菩萨、金刚手菩萨，供了许多的佛像。</p>\n<p>我的一个弟子， 我去他的佛堂一看， 上面摆了不认识的很多像。他说： “这是伊斯兰教的， 这是基督教的， 这是什么什么教的……”我说： “你 摆那么多， 干什么 ？”他说： “一个教派救不了我， 总有一个教派能救我。”这是事实啊，好多师兄都有这样心态。</p>\n<p><strong>其实全球转一遍， 除了他的上师以外， 没有别的佛。</strong>他得罪了他的上师，其实就是得罪了整个他所说的佛，他都不知道。所以，心态要调整好。</p>\n<p>有时候你想去接另一个上师的法， 你去请示自己的上师开许。也许你的上师会装成不开心的样子， 不同意你去。其实上师这样安排是有密意的。这时， 你可以停一会儿， 心里默默祈祷：“将来我能成为这位上师的弟子”，就行了。</p>\n<p>诸如此类的这些事， 我们都要仔细地考虑清楚， 不然的话， 修行就会出现很多障碍。<strong>修行没有进展， 原地踏步， 都是因为之前我们没有考虑清楚的决定和行为带来的障碍。</strong></p>\n<p>本来你是个清净的弟子， 你的修行不可能没有进展。但是， <strong>只要在任何一个方面有点不清净， 就会影响你的修行。不但影响你，还会影响集体的修行。</strong></p>\n<p>所以，师兄们在做一些决定之前，要好好考虑一下。</p>\n<p>你对一件事情不认真的话， 其实对所有的事都不会认真。你一旦认真一件事情， 有可能对所有的事情都认真。所以， 不要养成这个坏习惯，什么事情都不认真， 那不太好。师兄们， 修行要认认真真地去修。信仰是自己选择的，不是哪一个人逼迫的。</p>\n<p>我很开心， 看到你们有这样一个发心去学佛， 有这样的福报和根器，这是值得随喜的。但是这个学佛的机会， 就像比较危险的胎儿一样， 很容易会流产， 而且<strong>到最后， 情况就会更加严重。所以每时每刻你们都要祈祷三宝： “我的这个发心不要变， 永远成为一个根深蒂固、坚不可摧的修行人。”</strong></p>\n<p>刚开始， 共同修行部分， 请起来也很简单， 修起来也很有信心。修着修着，有些人可能就对自己没信心了。</p>\n<p>要对自己有信心。有的修行人说：“我可能不行哦， 上师， 我很差劲的。”你以这种状态去修可能不太好。“<strong>我一定行！不管我遇到什么困难，我保证在什么时候， 修出我自己需要的境界来。”要有这样的决心才能修得出来。修行人就需要有这种精神。</strong></p>"}, {"slug": "上师开示/2. 找到智慧的指引/选好你的“救命稻草”", "title": "选好你的“救命稻草”", "rel": "上师开示/2. 找到智慧的指引/选好你的“救命稻草”🔊.md", "dir": "上师开示/2. 找到智慧的指引", "is_index": false, "meta": {}, "html": "<p>2012 年 09 月开示</p>\n<p><span class=\"audio-name\">选好你的救命稻草</span><button class=\"play-btn\" data-audio=\"选好你的救命稻草.mp3\">▶ 播放</button></p>\n<p>今天晚上我们讲一下怎么入佛门。其实我对老弟子已经讲了很多了，有的弟子甚至可以背诵下来了， 但是执行了没有？ 这是另外一回事了。有的弟子刚来， 还不太懂， 只是对佛教有兴趣， 去过很多地方， 但是真正的修行是个什么程序， 还没有搞清楚的人比较多。所以这个多说几次没有坏处，只有好处。</p>\n<p>佛教有三大语系： 南传佛教、汉传佛教和藏传佛教。而我们属于藏传佛教。藏传佛教也有很多教派， 每一个上师和每一个教派的修行方法和修行程序， 以及上师调整弟子心态的模式不太一样。我今天是按照我们龙钦心髓调整弟子心态和调整弟子修行的程序去讲的。</p>\n<h5>入门的先决条件</h5>\n<p>入门是什么呢？ 你是不是一个佛教徒， 取决于有没有皈依， 别的什么都不算。你没有一个正规的皈依， 光有丰富的佛学知识， 你只是个学者，还不算是修行人； 你见过一千位上师， 只能说你对佛教有兴趣， 还不算是佛教徒。别人说你是什么佛的转世啊， 罗汉的转世啊， 怎么说你都没用，你还不是佛教徒。是不是佛教徒取决于皈依。皈依是什么呢？ 就是皈依三宝：佛、法、僧。藏传佛教还有一个皈依上师，是四皈依。</p>\n<p>对于皈依的程序， 一定要清清楚楚， 明明白白， 不能盲目地去皈依。现在我们有一句话叫“跟风”。比如说， 一个大德来了， 你搞不清楚他的来历， 也不知道他是什么教派， 也不知道他在哪里学过佛法， 也不知道他有多大的成就，“哎呀，很多人在皈依，管他的，我都皈依了。”</p>\n<p>皈依以后该做什么？ 很多人都不知道。皈依完了回来， 照样杀生，照样去拜一些不该拜的宗教。倒不是明知故犯， 是他不懂。所以皈依的时候， 一定要了解得清清楚楚、明明白白： 你皈依的是哪一位上师？ 这一位上师的教派是什么？ 他在哪一位上师那里学过佛法？ 他的佛学知识怎么样？ 他的上师对他的评价怎么样？ 他在师兄弟当中的口碑怎么样？我们没有神通， 只能通过这些人的行为来观察。除此之外， 还可以去当地的政府机关了解一下。虽然他们不信佛， 但是哪一位是大德， 哪一位在老百姓当中有威信，他们调查得很清楚。</p>\n<h5>选择适合自己的传承</h5>\n<p>皈依之前， 第一个要选择的是教派。比如， 你是属于哪一个教派的缘分？汉传佛教、南传佛教、藏传佛教？这里我大概说一下。</p>\n<p>汉传佛教大部分是显宗。显宗的很多法门都是靠自己去悟， 比如念一个阿弥陀佛， 有一天悟到一个道理， 认为自己成佛了， 但这是不是佛的果位还很难说。现在是末法时代， 能修出这样的果位也很不错。如果你是这种缘分， 要什么样的条件才能达到这种果位？ 第一个， 你前一世的根基很好； 第二个， 现在你对佛教很有信心； 第三个， 你持续修行的忍耐力很好。这种人才有点适合去修显宗。这种修行方法， 一万个人去修，有可能有两三个人悟到道理，但其他的九千九百九十几个人怎么办呢？</p>\n<p>南传佛教属于小乘佛教， 修行的方法以苦行居多。比如， 吃得很差，穿得很破， 什么都不要， 在没有干扰的地方打坐， 等等。他们在修一个静心的基础。能够把心静下来也是很不错的， 但是你能吃得了这个苦吗？要好好想一下，自己去想。</p>\n<p>藏传佛教， 有的人说是贵族血统的佛法， 有的人说是一个快速成就的法，有的人说是很危险的法，我觉得这三种都说对了。</p>\n<p>为什么说是贵族的佛法？在过去， 藏传佛教只能在汉地的皇宫里传，老百姓是不允许接受的，可能有这样的因素，才被说成是贵族的佛法。</p>\n<p>它也是个快速成就的佛法， 有很多方便， 有多种方案， 能很巧妙地抓住修行人的心态。有的上师有对症下药的能力， 而不是采取“一刀切”的方法。“一刀切”是什么呢？ 就是不管怎么样， 你们都得修一个法， 大家一起修， 都是一个规格。藏传佛教不是这样。每一个弟子的心态，每一个弟子的智慧， 每一个弟子的根器， 每一个弟子的寿命和福报不一样， 所以上师给你给的功课到最后都不一样， 这个要取决于上师。如果选择的上师不合格， 就像选择了一个很差的医生， 他找不到你的病根， 再怎么给你治疗都没用。如果选择了好的上师， 那就是选择了一个很好的医生， 他会对症下药，对你的修行很有帮助。</p>\n<p>就这三大传承， 要自己去选，选一种适合自己的。我的建议是学藏传佛教， 为什么呢？现在是末法时代， 人类生存的条件很少， 死亡的因素很多。今天哪怕是吃一 口饭， 里面也有很多因素可能会让你短命； 你吸一口空气， 可能就有很多因素让你死亡； 一个念头也可能会让你很快地衰老， 这是末法时期的特征。在这种状态下， 我们有没有时间去修一些很漫长的法呢？我觉得不太可能。</p>\n<p>现在我们汉地的修行人、居士， 按比丘的规格去修行的很多。</p>\n<p>比丘的规格是什么呢？ 要学完从菩提道次第广论到后面的五明功课， 学完了以后， 再学大幻化网， 再学中观， 再学大圆满， 再学一个脱嘎。他们会制定这样的计划， 而且完全按这样的规格去修行。这个规格不是不好， 但是要看适不适合你。出家人是怎么修行的？ 除了吃饭睡觉以外，他的职业就是修行， 没有别的事情。早上六点到晚上十二点， 吃睡以外，都在专修。他花的时间和你花的时间， 你要算一算。你还要生存， 你还要赚钱， 你还要养孩子， 你还要伺候老公， 你还要看单位的脸色， 你还要看领导的批文。我讲过很多次了， 像我们这样的修行人， 生存时间，你们去分析一下， 长的大约也就是三万多天， 除开睡觉的时间， 大概也就两万多天； 除去小时候不懂事的时间， 稍微懂事一点上学的时间， 然后谈恋爱、结婚生子、工作， 你的孩子生了孩子你当保姆的时间， 算起来你有多少时间拿出来修行呢？ 这些时间和出家修行人的时间对比一下，你觉得按比丘的规格修行现实吗？这点账谁都会算。现不现实？不现实。</p>\n<h5>选择与你契合的老师</h5>\n<p>那不现实怎么办？ 只有一根救命稻草一一靠上师， 你要选择一个好的上师。</p>\n<p><strong>只要选择好了上师， 你不要用商业的头脑， 不要用世间混杂的心态去想他， 他绝对有能力度你到极乐世界。</strong></p>\n<p>选好了上师， 哪怕他让你喝酒、抽烟、杀生都不用害怕。为什么这么说？ 那诺巴和帝洛巴的传记你们是看过的。那诺巴跟随帝洛巴三年， 这三年当中他没看到过帝洛巴一次“上师”的行为， 他为什么成就了？是弟子的信心和上师的加持力。让他干什么？ 钓鱼、偷东西、骂人。还有米拉日巴和玛尔巴， 你们也看过这个光碟， 看过他的历史。第一次师徒相见的时候， 玛尔巴在那儿种田。像我们这种众生， 可能一看见就没有信心了， 你一个上师种什么田呢？ 一边放着一个很大的酒坛， 一边在种田， 一见到米拉日巴：“哦，你来找我是吧？ 想让我当你的上师， 你把这个酒喝了。”米拉日巴毫不犹豫地喝下去了。喝完了以后， 玛尔巴说：“这个该我种的田， 你帮我种完再说， 我可以收你做弟子。”他种完田一回去， 玛尔巴全部不认账了 : “什么时候说过收你做弟子？我还有一个要求。”什么要求呢？ “我有很多仇人， 我听说你的咒法很好， 去把我的仇人杀了， 杀完了我收你做弟子。”他很开心地去施放咒术， 咒死七个人， 回来后很开心地说： “上师， 我能当你的弟子吗？”“杀人魔王， 我怎么敢收你这个杀人魔王呢？ 你有这么大的罪过， 我什么时候让你去杀生了？”诸如此类， 很多很多。你说这些不是修行吗？所以， 我刚才说了， 只要你选对了上师，他让你念咒你就念咒， 他让你磕头你就磕头， 他让你天天唱歌你就唱歌，他让你天天看电视你就看电视……我刚才说了， 不要用商业的头脑去看，我们是修行人， 不是商人。修行的心态和我们世俗人的心态是两个角度，不能从世俗人的角度来看。只要你从世俗人的角度来看， 不对头的事情太多了。所以要选好上师。</p>\n<p>怎么选呢？ 第一个， 我刚才说了， 上师起码得学过闻思， 修行过。如果谁都不知道他在哪里修行过， 在哪里学习过闻思， 也许他很好， 但是我们没有必要去冒这个风险。起码他得学过。学过是什么概念？ 起码得十年八年。一年不算什么， 三年也不算学。我们都当过学生， 你三年能学成什么东西啊？学不出来什么东西。</p>\n<p>第二个， 特别重要的是， 他的上师对他怎么样？ 闻思再好， 别人说他修行再高， 只要上师跟他关系不好， 那你完全可以否决这个人。他不适合当上师， 因为他没有戒律。没有戒律的修行人， 就像在空中种田一样。如果有人说我可以在空中种田， 行吗？ 不可能。所以主要得看上师对他的评价。上师和弟子之间的关系怎么样， 不用神通， 我们肉眼都能看得出来。</p>\n<p>第三个， 要看看他的人品。我们要跟随他多年， 人品太差的话， 跟着他修行真的有点难。藏地有的上师， 修行很好， 但是人品不怎么样，说话不算数， 因此很多弟子坚持不下去了。比如今天跟你很好， 明天就翻脸了， 也许是密意， 但是我们众生的福报太小了， 这种密意有时候猜不出来。所以人品要好一点， 起码得像个男人。我说过， 所有修行的基础是什么？ 是人品。人都做不好怎么去做佛呢？ 所以要看看上师的人品怎么样。大家都说这个人好，就值得去追随他。</p>\n<p>第四个， 要看看他的脾气。脾气太糟了、太暴躁了， 也有点不好相处。天天骂， 天天打， 可能弟子们忍受不了。像米拉日巴这样的弟子很好，但是能像他这样的没有几个，所以要看看上师的脾气。</p>\n<p>第五个， 你们汉人还需要观察的是什么呢？ 他的语言能力， 他能不能说汉语。修行再好， 说不出来汉语也是没有办法的。我在北京见过一群弟子， 他们的上师很好， 但是他一句汉语也不懂， 他们跟随了他三年，什么都没学到。上师只能说个“你好， 你好”， 别的什么都不会说。所以我觉得这方面也得观察一下。</p>\n<p>第六个， 还要观察一下上师的年龄， 不要太小了。你五六十岁，你的上师十二岁， 有点不太适合。我不能说十二岁没有成就者， 可能有，但是你对他生起信心的概率不太大。用人的眼光来看， 天天在那儿玩，十二岁几乎学不出来什么。有的上师生来就是全知， 但是我们能不能遇到这种全知的上师？ 我们有这么好的福报吗？ 我说了， 没有必要冒险。所以不要选择太小的活佛， 也不要选择太老的。为什么这么讲呢？ 年龄太大， 虽然有加持力， 但是有可能表达不清楚。还有呢， 因为身体的因素，他可能没有太多的时间来陪弟子说话。这些是我自己的经验，送给师兄们。观察上师要观察这些，当然，还要经常观察他有没有慈悲心。</p>\n<p>观察上师， 释迦牟尼佛给我们的时间是三年。没有皈依不要慌， 观察三年再决定也可以， 你觉得一个月够了也可以， 你一天能掌握好也可以（ 现在的信息很发达的， 一下子就可以掌握到） 。</p>\n<p>只要你自己觉得已经掌握好了， 决定成为哪一位上师的弟子的那一刻， 就不能再观察了。<strong>你皈依了他以后再观察， 那叫邪见， 性质就变了。邪见有什么后果呢？邪见是堕入地狱的一个重要因素， 毁掉慧根的一个重要因素。</strong></p>\n<p>所以要懂得皈依，先要做什么？就是要选择好上师。</p>\n<h5>说话算数，说到做到</h5>\n<p>然后再做什么？ 皈依的时候，你在上师面前发誓“我不杀生”。你老大不小了， 发了誓还要杀生，那你是什么， 你是疯子吗？我觉得在这个人间你至少得有一个不骗的人， 你还算是个修行人。连上师都骗， 父母也骗， 爱人也骗， 在这个地球上没有你不骗的人， 那你算什么呢？ 一个不骗的也没有， 那你得好好想一想， 你做人是怎么做的。</p>\n<p>皈依的那一天，上师问你：“皈依佛门不能杀生， 你能做到吗？”</p>\n<p>你说：“我能做到！”</p>\n<p>“皈依佛门遇到生命危险也不能放弃佛法。”</p>\n<p>“我能做到！”</p>\n<p>“皈依佛门不能信外道。”</p>\n<p>“我能做到！”</p>\n<p>说了要算数！如果没有做到的， 要从心底里去忏悔。你要是不忏悔，害不了上师， 但是会害了你的后代和你的生生世世。你的孩子是无辜的，用你的行为伤害他们， 没有必要。作为父母， 谁都不愿意伤害自己的儿女，但是如果你对佛法做了一些不该做的事情，它就会影响到你的血脉。</p>\n<p>所以我刚才说了， 皈依的时候要慎重， 不要把自己当成玩具。现在很多修行人是怎么做的？打个比方， 有很多好玩的地方， 我天天买门票，但就是不进去， 这样有什么意思呢？ 这个上师我见了， 我接受灌顶了，那个上师我也见了， 也接受灌顶了， 但是我不修， 我也不去了解怎么修，就这样把自己的人生浪费了。所以第一步不要错了， 第一步没错的话步步都不会错，第一步错了步步都会错的。</p>\n<p>有的修行人认为： “哦，这个皈依谁都懂，上师讲那么多干什么呢？”但是，<strong>从菩提道次第广论到大圆满， 我没有见过除了皈依以外的修行。</strong></p>\n<p>我为什么这么讲呢？华智仁波切的著作里面讲，没有上师的空间里没有佛， 没有佛经， 没有修行。如果你把上师都欺骗了， 什么都不会有的。这个师兄弟们要牢牢记住，牢牢记住。</p>\n<p>当你皈依完了， 可以说是做了一件大事。刚才你们也许会想： “哎哟，</p>\n<p>这个皈依要观察那么长时间， 有那么多的问题， 咋这么复杂呢？”你选一个老公， 都要考虑多少个月， 或者是一年、两年。选老公是一世的事情， 也许只是几个月， 也许是一年两年， 也许一辈子， 一辈子的太少了。这么短暂的事情， 你都花那么多的时间去研究， 那你生生世世的大事怎么不好好研究呢？</p>\n<p>修行是生生世世的事情， 不仅是这一世， 所以师兄们要认真地对待皈依， 严肃地对待入门， 这是我的希望。希望我说的这些对师兄们的修行稍微有一点点帮助！</p>"}, {"slug": "上师开示/3. 心态决定命运/一切从心开始", "title": "一切从心开始", "rel": "上师开示/3. 心态决定命运/一切从心开始.md", "dir": "上师开示/3. 心态决定命运", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<h5>心的力量不可思议</h5>\n<p>轻松一下啊，讲个故事。</p>\n<p>以前有几个强盗， 到处去抢东西杀人。其中一个强盗看见有一个和尚在山洞里闭关， 就跟他说话。和尚不回答强盗的问话， 只是乐呵呵地坐在那儿。强盗想：“你这个和尚怎么回事？到底死了没死？跟你说话也没反应， 我倒要看看你有没有反应！”于是， 强盗一刀把和尚的头割了， 头掉到了地上。然后强盗就走了， 继续到处抢劫。</p>\n<p>一年后， 这个强盗听说附近一个村庄里有人在传法。他就过去看看传法是怎么回事。一看，“哎哟！”当初那个被他用刀砍下头的和尚正在那儿讲课。“不可思议啊！ 这个和尚真是功夫不浅啊！”强盗想：“虽然我不信佛，但是我得学学他这种本事。”</p>\n<p>于是他就跪在那个和尚的面前：“上师，对不起！我得罪过你。” “什么时候啊？”</p>\n<p>“去年你在什么什么山洞闭关的时候， 我一刀把你的头砍下了， 现在你居然还可以传法，太厉害了！”</p>\n<p>和尚说：“真的吗？”</p>\n<p>“真的！”强盗说。</p>\n<p>只听到“嗙”的一声，头掉下来了，和尚圆寂了。</p>\n<p>之前和尚还不知道别人砍过他的头。在当时那种境界下， 他是感觉不到被砍头的，要是不说的话，他可以继续活下去。</p>\n<p>这就是念头，什么都是念头造成的！</p>\n<p>还有一个故事。</p>\n<p>一个人被绑架了， 他们吓唬他， 用黑布蒙住他的眼睛， 什么都看不见，捆在椅子上。然后用一个东西在他的动脉上擦了一下， 身边再放一个茶壶， 里面的水往地上一滴一滴地流。过了一段时间， 他们故意在他边上说： “血要流尽了。”他一听就觉得： “我完了！”再过一会儿， 就没动静了。他们把蒙眼睛的黑布去掉， 一看，他已经死了。其实他们什么都没做。</p>\n<p>四川省骨科医院的一个主任医生（ 现在还在四川）， 他有一个病人粉碎性骨折， 去他那里开刀做治疗。开刀的时候， 护士跟这个医生说： “骨头碎成这样， 可能永远好不了了。”手术很成功， 可一段时间后病人一直好不起来， 比他严重的病人早就好了， 他还是好不了。医生觉得郁闷啊：“为什么？ 什么原因呢？”他就在自己的办公室里走来走去， 冥思苦想。走着走着， 他想看看理论方面的书， 于是随手在书架上拿了一本，是我们东珠仁波切写的《西藏医心术》， 这可能是缘分啊！他一看： “哦，什么都是心灵造成的， 心灵可以治病。”其实那时候他一点都不信佛，但是他看到这一点就想：“我得看看这个有没有道理。”然后他想起了手术台上护士说过的那句话， 啊！ 那天可能是护士的那句话说错了。于是他对这个病人说：“重新做手术， 重新治疗。”然后把病人重新推进了手术室做手术， 其实做手术是假的。到了手术台上， 他就假装给病人开刀， 其实什么都没做。然后医生故意在病人的耳边说：“这次太成功了！肯定会恢复得很快！”之后这个病人一下子就好得很快， 恢复得相当好。从此以后，这个医生就信佛了。</p>\n<p>全世界的医生能治好疾病的概率是多少？ 最好的医生能医治百分之</p>\n<p>三十、 百分之七十是靠自己的心理状态去治疗的。按真正的医学来讲，连一个感冒都治不好的。你们的上师学过兽医，生命都是一样的嘛。</p>\n<p>其实， 所有的问题都是自找的， 不是外在的东西， 外在是没有东西的。你所谓的外在， 山山水水啊、房屋啊， 你看看， 用一面镜子就可以把它们都装进去。这么小的一面镜子都可以装整个上海， 你说它实实在在有的话，能装下吗？装不下的！没有，才能装得下！</p>\n<p>我们有各种各样的显现， 整个地球都可以装在我们的心里， 这就证明外在的东西是没有的， 有了， 你装不下。如果实实在在有的话， 不要说地球， 就是我的手都装不下， 知道吧？只是这么讲， 我自己还没感觉到。</p>\n<p>科学是什么？ 科学研究的成果是什么？ 其实都是想出来的。对一个东西专注的时间太长了， 自然会出现一个结果。包括气功， 他观想一个气体，观观观观，最后来了。</p>\n<p>（ 一师兄问： 那上师我们坚定信念会成佛， 那就一定会？） 当然啦！一定会！</p>\n<h5>师生之间的信任</h5>\n<p>现在我们坚定信心是比较困难的， 就要从这个上面去下功夫， 慢慢去做。</p>\n<p>比如说， 我是你的朋友， 我信任你， 你得珍惜这个信任， 你不能浪费它， 你学会珍惜我对你的信任， 你也会成为一个说话比较算数的人。如果你连这点都没有， 你想成就那是很遥远的， 真的。我信任你， 借了你一千万， 第二天你就跑了， 这种人是修不出来的。我信任你， 借了你一万块钱， 你如实地把一万块钱还给我， 第二次你再想借就很容易了。</p>\n<p>但是你这一万块钱不还， 第二次你就没有这个机会了， 你的机会就是这样慢慢慢慢减少的。现在我们很多人没有朋友， 没有信得过的人， 其实都是自己造成的，不是别人。</p>\n<p>信仰也是一样， 从小事情去做。不管别人怎么样， 你得信任别人，别人信不信任你， 那是另外一回事。现代人就是不珍惜对方的信任。我们师徒关系还不是一样？ 我信任你（ 弟子）， 你信任我（ 上师）。我信任你了， 你不信任我， 那不就浪费了嘛。弟子再虔诚， 上师对弟子不好，弟子也得不到什么加持。</p>\n<p>我们之间的一股力量是什么？ 就是信任！ 哪怕伤害自己， 我也绝对不会伤害我的弟子， 作为上师就要有这种想法； 作为弟子， 你应该想：哪怕失去我的生命， 我也不会伤害我自己的上师。这就叫“信任”， 也可以叫“信心”。</p>\n<h5>学会忍让与奉献</h5>\n<p>“信心”长大了以后就会有菩提心， 利他， 最后找不到自己。你常常想到利益别人，这才是真正的菩提心。</p>\n<p>比如说， 那天我要算卦， 算卦的时候有师兄递上来一串念珠， 我说： “不要， 用我自己的念珠更好一些。”那位师兄的脸色就变得很难看。这么一点小事就能看得出来，你的信心没有培养出来。如果有更大的事情，你是不会去照顾别人的，只会为自己考虑。</p>\n<p>又比如说， 一个女孩坐在你身边， 如果你为了自己开心， 用语言和动作去骚扰她，只顾自己的感觉，不顾别人的感受，这就是自私。</p>\n<p>刚开始谁都有“我执”，不可能没有“我”，但是要学会一点点淡化自己。其实你对别人好就是对自己好， 你对自己好过头了就是对自己不好， 到最后一个朋友都没有了。凡事要学会忍让， 不要事事都考虑自己。吃顿饭也考虑自己，看个电影也考虑自己。这些小细节都有修行的状态啊！</p>\n<p>对于法也是这样。我没试探过， 也许要试探一下， 我就说：“在场的有十个人能得到最珍贵的法， 别的人得不到， 谁来？”那肯定哪一个人就第一个跳出来了：“我！ 走一万个人我都不在意， 只要我在成就人的名单里面！”其实你这种行为在上师心里， 你才是第一个该走的人。上师不太喜欢这种人，真的。</p>\n<p>师兄们学会奉献， 学会吃亏， 学会忍让， 把自己变得低一些、把别人举得高一些， 这样的弟子才是优秀的。我们修行要从人品做起， 没有人品的基础做不了事。我那天都说过， 人品不好就跟大蒜一样， 什么样的原料都盖不住那股臭味道。人品不好，修什么样的法都很难调整。</p>\n<p>你看我们的师公， 今年八十八岁了， 他从来都没有考虑过自己的亲戚朋友。他是不是没有感情？ 不是， 肯定有！ 但是他优先考虑别人。每一次我都看到他的亲戚朋友就在那里等候， 在草滩上等候， 晒得流汗。从来都没见过他的亲戚朋友有谁可以优先进去拜见的， 没有， 跟一般的信徒一样。</p>\n<p>师公从来都没有说过： “今天我休息一下， 我要看一下家人。”没有！我从来都没有听见他说：“我没鞋了， 我要穿一双好的鞋。”“我今天生病了， 师兄们等一等， 我要去医院。”我从来都没有听他说过这样的话。</p>\n<p>有时候我特意安排个医生，让他去检查身体，“不不不！你看，他们（信徒们） 在等着我呢！”然后师公又说：“吃饭的时候， 一边检查一边吃饭也行啊。上厕所的时候也可以借点空间检查。不要占用我的弟子们见我的时间。”“他们有他们的事儿啊，他们抽出时间来不容易啊！”</p>\n<p>这就叫作“利他”。</p>\n<p>不知道多少个大德， 为了众生错过最佳治疗的机会。他们不在乎！生病， 是因果； 死亡， 是正常的。他们最害怕的就是没有价值地去死。他们从来都不会怨天尤人：“哦……我是为了你们， 错过了最好的治疗机会。”不会！</p>"}, {"slug": "上师开示/3. 心态决定命运/发一颗无私的心", "title": "发一颗无私的心", "rel": "上师开示/3. 心态决定命运/发一颗无私的心.md", "dir": "上师开示/3. 心态决定命运", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<h5>来自师公的教诲</h5>\n<p>有那么一段时间， 我想远离智钦寺院， 回五明佛学院待着， 什么都不想管了。</p>\n<p>当时， 第四世多智钦已经成了我的上师， 他对我说： “你为众生做事， 你为寺院做事， 你为了自己的上师高兴而做事， 这全都是修行！ 如果你连这一点点的觉悟都没有， 我不知道你在五明佛学院待了六年半，是为了什么？ 难道是为了你自己的解脱？ 为了一种比较轻松的感觉而待在那里吗？ 如果你是这样一个修行人，（ 修行） 实在是没什么意义！ 你能不能想宽一些， 为了别人； 你能不能再想一下， 为了对你有期望的人；再想一想， 为了对你的名字（多智钦） 付出的这些人， 做一点贡献呢？”</p>\n<p>听了上师（ 第四世多智钦） 的话， 我又继续在智钦寺院待了下去。虽然我在智钦寺、“活佛界”干得不太好，但这是上师的意愿，我必须得听！</p>\n<p>藏传佛教中， 你的“悉地”的来源， 你的一切的一切的来源， 都来自于你的上师！ 你要是不听上师的话， 你说你是个修行人， 那就是一句空话！</p>\n<h5>拜师前要谨慎观察</h5>\n<p>在座的各位都是对佛法有信心， 都相信轮回， 相信佛陀的话， 才到这里来； 大家都觉得信仰很重要， 才到这里来。不然的话， 我们不可能聚在一起。</p>\n<p>你们现在见到的这个上师（ 上师指自己）， 第一， 没有戒律， 我说的是没有显宗的戒律； 第二， 凡是“人”喜欢的， 我全都喜欢； 第三，我不会做生意， 不会发钱， 也不会治病， 这些我都不会。按照藏传佛教的传统来说， 弟子在皈依一位上师前， 要观察这位上师三年， 所以你们要观察清楚后，再决定要不要皈依我。</p>\n<p>皈依前，你要观察好你修行的对境。</p>\n<p>你要修什么样的法？</p>\n<p>我们佛教有三大体系： 南传佛教、汉传佛教、藏传佛教。你对哪一种法有信心，你自己要想好。</p>\n<p>有些师兄会说： “听说藏传佛教很神秘， 修起来很快的哦， 还听说他（ 龙洋仁波切）的法是比较齐全的。”如果你有这种兴趣的话，那接下来，你要弄清楚第二个问题。</p>\n<p>第二，藏传佛教的“重中之重”是什么？</p>\n<p>藏传佛教的“重中之重”就是“传承”。那它有多少个教派？ 一个教派又有多少个传承呢？</p>\n<p>第三，在众多的传承中，最清净和最接近的传承是哪一个？</p>\n<p>当你发现了这个最清净和最接近的传承之后，又面临第四个问题。第四，这个传承里的上师有很多，最好的是哪一位？</p>\n<p>什么叫最好的上师？ 就是得到这个传承， 或者说是这个传承的持有者，这样的上师才是最好的。</p>\n<p>修学要一心一意</p>\n<p>你找到了这样的上师后， 还得去进一步了解一下， 这个上师的脾气怎么样， 语言怎么样， 年龄怎么样， 学习成绩怎么样， 闻思和实修怎么样？这是你生生世世的一件大事， 要是不认真对待的话， 就是对自己不负责，</p>\n<p>也是对你所有的后代不负责。所以皈依之前，你要了解清楚，想清楚。</p>\n<p>最终，你确定要追随这位上师，你要有一种：“啊，我决定了，就是他！打死我也不会放过他！”真的， 要有这样的信心。不管他的名声是怎样的，也不管他的地位是怎样的，你就是要跟定这个上师。</p>\n<p>下定决心后， 你就得想方设法得到他的摄受。有些上师很容易摄受弟子， 有些上师不轻易摄受弟子。世间法上， 为了得到一个项目， 有些人花了多少心思； 为了得到一个公务员的职位， 又花了多少心思； 为了得到一个好老公， 又花了多少精力！ 我觉得这些都是小事， 真的， 对一个修行人来说都是小事。</p>\n<p>为什么说这些都是小事呢？ 因为你这辈子最多活三万天。我们分析一下这三万天。小的时候， 你有权力做自己的事吗？ 没有！ 太小了， 你没有能力做； 稍微有一点能力的时候， 父母和学校管着你； 到了中间，你要听家人的， 或者要听领导的话； 等你老了， 又要伺候你的儿女。所以，你想想看， 在这个三万天里， 有多少时间是你可以自由支配的？ 而且这个三万天里， 还有一万天你是用来睡觉的。除开这些， 你有多少时间去做一件重要的事呢？</p>\n<p>一辈子这么短暂， 你也要精疲力竭地挣扎， 为什么你不为你生生世世的大事去挣扎一下呢？你要是没有这样的信心， 那你根本不是修行人，只能叫“赶时髦”。“哦， 听说有个修行， 什么叫修行人呢？就拿个念珠，嗯嗯嗯（ 念咒声 ）……”你也这样做一下。但是实际上， 你的心里没有想到怎么去修行， 没有想到什么叫作死亡， 什么叫作恐惧， 什么叫作轮回，什么叫作轮回的痛苦， 你没想过！ 只是像换一件衣服一样， 今天大家都在穿牛仔裤， 我也穿个牛仔裤。明天大家都在穿西裤， 我也去穿西裤。但是你从来没想过这些牛仔裤和西裤对你有什么用？ 只是别人怎么做，你就跟着这么做， 这不叫“修行人”， 这叫“跑跑居士”！这叫“赶时髦”！</p>\n<h5>如何开一个好头</h5>\n<p>修行最重要的不是要去见多少个上师， 不是要去念多少个咒， 也不是要去放多少个生，做多少个佛事，而是要有正确的发心。</p>\n<p>这就好比你想种菜的话，首先要把你那块地做好。没有一块良好的地，你做什么都是空的。空中种菜， 我不信！ 没有地基的房子， 我始终认为是很危险的！ 不是说见了很多上师不好， 肯定好， 他们都有他们的加持力！但是这是一个修行的程序，修行必须要有“次第”！</p>\n<p>“次第”怎么去做呢？ 就是要把“头”开好。第一步做好了， 步步都是好的； 第一步走错了， 步步都是错的。如何开一个好“头”呢？ 就是要有一个广大的利他的发心。比如说你去参加一个大规模的放生， 有几百几千人的放生， 你是为了什么去放生呢？ 你的发心是什么呢？ 有的人是为了长寿去放的， 有的人是为了身体健康去放的， 那个发心也太狭小了！</p>\n<p>有的人会说：“福报攒不下呀， 病越来越多， 身体越来越不好， 财</p>\n<p>产越来越少。”你说这个话的时候， 你不觉得你自己的发心错了吗？ 我们佛教修的是什么？ 修的是来世， 而不是追求今生， 师兄们要想好。今生修行可能有好处， 就像你要种一朵花， 旁边的那些叶子自然会产生，但是你的目标不是叶子， 而是漂亮的花。你天天去看这个叶子是没有用的。所以第一步要走好！修行最重要的第一步就是如何发一颗利他的心。</p>\n<p>今天讲的这些都是我自己的亲身体会， 也是每个修行人努力要做到的。</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/亲近师父的礼仪", "title": "亲近师父的礼仪", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/亲近师父的礼仪.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2010 年 11 月开示</p>\n<p>上师路过的时候， 如果你站在比上师高的地方， 要马上跑到低处，恭敬地低头，等上师走过。与上师在一起，自己的位置不能比上师高。</p>\n<p>如果一位真正的出家人经过你身边， 你不理他， 会有损你的福报。按照藏族的习俗， 见到出家人如果戴了帽子要揭帽子； 如果没戴帽子可以欠欠身，让他过了你再走，不能并肩而行甚至越过。</p>\n<p>拜见上师的时候， 要先问侍者， 上师是否方便， 上师同意之后才能去见， 不能不打招呼。见任何一位上师都是这样， 否则对自己的福报有损害。</p>\n<p>进上师的门， 必须先轻轻地敲三下， 然后才可以进， 不敲门直接进是不礼貌的。</p>\n<p>拜见上师的时候要面带笑容， 以一个恭敬和清净的心态来拜见上师。不能以痛苦或丑陋的面孔去看上师， 这对自己来世的容貌不好， 下一世可能会长得很难看。所以，尽量以笑容来见上师。</p>\n<p>现在很多人在上师面前是两个膝盖都着地， 其实真正的跪法不是这样，应该右膝着地，然后坐在那儿，合掌恭敬。这可能跟大家习惯的不一样，但真正的跪法就是这样。</p>\n<p>见过上师以后，先往后退三步，然后才可以转身，直接转身不好。</p>\n<p>跟着上师走的时候， 在没有危险的情况下， 要走在上师的左后方，跟上师合影、一起坐的时候都是一样。如果上师让你坐在右边， 那没有问题，但是没有开许之前，你要在左侧。</p>\n<p>乘电梯下楼的时候， 你要先下， 然后上师再下； 上电梯的时候， 如果前面没有危险， 上师先上， 然后你再上。上下楼梯也是一样， 不能跟上师同上同下。</p>\n<p>不能故意踩上师的脚印和影子， 踩了的话， 九世会变成穷人。这个规矩我觉得还是懂一点好， 否则别人会说“龙洋活佛的弟子， 连这些规矩都不懂”，那就不好了。</p>\n<p>有次我去唐山， 当时我的一个师兄， 也是一位活佛， 在他的弟子家里，打电话让我过去。过去以后， 看见他的一个弟子跟上师平起平坐， 跷着二郎腿， 抽着烟， 还说“这是我的上师”。和我一起去的一个弟子就提醒他说： “既然是你的上师， 你不可以下来吗？”他养了很大的一只狗，也跟上师并排着， 他还说“这是我的狗”。这位上师可能有点不好意思，就用藏语说： “请谅解， 他可能不太懂。”这个弟子的做法其实不太好。</p>\n<p>上师讲经说法的时候， 你必须调整好自己的念头， 不要胡思乱想。比如去哪里做生意， 哪里的商店赚多少钱， 哪里去买个菜， 不能这样，要聚精会神地听。</p>\n<p>拜见上师的时候不能抽烟， 不能喝酒。你要是喝了酒、抽了烟， 让这些味道熏到上师的话，你几世都会成为有体味的人。</p>\n<p>进入佛堂、经殿， 必须得脱鞋、揭帽子， 不然的话来世会变成畜生，像牛一样，角和蹄子是取不下来的。这些微小的细节要注意。</p>\n<p>见上师的时候身上不能有刀剑、凶器及有毒气体。如果有的话， 要放在门外，否则对自己不好。</p>\n<p>声音小一点，不要大声地笑，也不要高声喧哗。想笑的话，最好捂着嘴，以免你的口水喷到上师。打喷嚏也要遮挡一下。</p>\n<p>藏族人的袖子很长， 他们见到上师的时候会把袖子背在肩膀上， 然后把帽子摘下来。</p>\n<p>如果你骑自行车， 上师从你身边路过， 你必须得下车， 把车子停放在那儿等上师过去。坐车的时候， 如果从上师身边经过， 要把车停在路边，下车等着上师先过去， 不能把车直接开过去， 不管上师。否则， 对上师没什么，但对自己的福报有损害。</p>\n<p>见上师的时候， 穿着要整齐、得体、美观， 最好戴上一些首饰， 比如漂亮的戒指、手镯、项链、耳环， 还可以化化妆， 你不需要掏一分钱，就在上师面前做了很好的供养。荟供、念经、参加佛事活动的时候， 也要尽量打扮得漂亮一点。如果打扮得很丑， 在上师面前不修边幅、随便穿戴，可能不大好。</p>\n<p>这些东西呢， 可能不是任何时候都有必要。比如像我们这样， 已经很熟悉了，都是一家人，也没有必要那么客气，但是最好了解一下。</p>\n<p>像我， 在你们面前随随便便的， 但是见上师的时候肯定不会这样。袈裟都整整齐齐地穿好， 然后头发理了、指甲剪好了去见。平时我也吃葱蒜， 但见上师的时候， 我不会吃。几个小时、几天或者几个月， 凡是有臭味的东西我都不会吃。</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/依止弟子与心子", "title": "依止弟子与心子", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/依止弟子与心子.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2011 年 08 月开示</p>\n<p>什么才是“依止弟子”</p>\n<p>藏传佛教中皈依的概念是什么？ 皈依是一个宣誓， 宣誓皈依三宝。在这方面， 藏传佛教和汉传佛教有什么不同之处呢？汉传佛教是三皈依，藏传佛教是四皈依， 藏传佛教加一个上师。藏传佛教认为： 上师是所有佛法僧三宝的总集。所以你皈依了上师就皈依了三宝。</p>\n<p>戒律， 我们师徒之间不是有一个戒律吗？ 皈依之后， 师徒之间就产生了皈依的戒律，但这里没有包含三昧耶戒。三昧耶戒产生的条件有三个：灌顶、窍诀、密续， 三者之中得到任意一种， 你和上师之间就产生了三昧耶戒。</p>\n<p>上师收弟子的时候， 皈依这一步， 佛教的大门是敞开的， 有缘分的人都可以进来。但是选择“依止弟子”就不同了。“依止弟子”是什么？就是学法的人，真正学法的人。</p>\n<p>皈依好像没什么关系， 虽然对上师来讲， 弟子多了也不是什么好事。对弟子来讲， 真正的上师、真正的大德， 多皈依几位也没什么。所以，“依止”和“皈依”的概念不大一样。</p>\n<p>汉传佛教是很重视皈依仪式的， 皈依了以后就是他的弟子。在藏传佛教里， 可以去皈依某一位上师， 但是皈依了以后， 他不一定是你的根本上师。他只是把你领入佛门的介绍人， 是你和佛教之间的一座桥梁。进入佛门之后，你怎么选择，需要根据自己的缘分来决定。</p>\n<p>藏传佛教中， 不太单独强调皈依的仪式。你只要认准一个上师， 传某一种法的时候你就有可能皈依了： 第一， 上师念皈依境的时候就包含皈依； 第二， 上师赐予灌顶的时候， 第一个灌顶的仪轨里面， 前几句就有皈依。所以，不一定需要专门做一个皈依的仪式。</p>\n<p>有的人会说“我是某位上师的弟子”， 他说的其实是皈依弟子， 但藏族人一般会以为你这样说的是你的根本上师。为什么呢？ 如果是根本上师， 你在上师那肯定学了很多， 而不只是在那里瞟一眼、说几句话、皈依一下就走了。你们可以去看， 你要是说自己是一位大上师的弟子，那大家就会很敬佩你。为什么呢？ 大家知道， 这位上师不会轻易接受谁当他的弟子， 你也不可能轻易就成了他的弟子。所以你既然是他的弟子，那肯定跟他学到了东西。就好像说你是清华或者北大的学生， 那大家都会认为你的文化很高。如果你说“我是某某上师的皈依弟子”， 他们就认为你刚入门， 只上过小学一样， 但要说是你的根本上师， 那他们就觉得你是真正的弟子。这两个概念的差距是很大的。</p>\n<p>师公是完全没有汉化的一位上师。在他的眼里， 没有什么单独的“皈依”仪怯。你们见过他专门给谁做皈依仪式吗？ 没有！ 我和他接触了那么多年， 没见过他有皈依的要求。如果有人说：“我想皈依。”师公就念几句皈依有关的经就完事儿了， 没有什么其他的了。但是我们这种人，已经汉化了。如果你说想皈依， 我就给你做皈依， 发皈依证， 按照汉传佛教皈依的套路去做。我这个皈依的程序是在显宗的基础上拿出来的。</p>\n<p>其实皈依是什么？ 从灌顶的那一天开始， 你就皈依了佛门， 也皈依了密法， 所以这种感觉是不太一样的。我在汉地有很多弟子， 皈依弟子很多， 但真正跟我学法的人没有那么多， 我肯定不会不负责任地乱收不认真学法的弟子， 这样的话我自己业上加业。要通过考验、经过审核，经过严格的程序， 才能成为我的依止弟子。不然的话， 你连戒律的概念都没有， 我收你干什么？ 我欢迎你学佛， 欢迎你进入佛门， 这是我们学佛人一贯的态度，但是怎么学、怎么修，就要看你自己了。</p>\n<p>总有一天，他会闪闪发光</p>\n<p>我们传承在很多地方都有自己的道场， 有很多弟子。但我的依止弟子有哪些， 你们谁都不知道。藏传佛教就是这样。一般人看来， 在大德身边的， 谁都像心子。但是真正来讲， 到底哪一位是上师的心子， 谁都不知道。就算上师说“这是我的心子”， 也不一定真的是。比如法王如意宝， 在江玛佛学院求法的时候， 他的上师托嘎如意宝说， 和法王如意宝一样的弟子， 甚至表面上超过他的多得很。托嘎如意宝从来都没有说过法王如意宝是他的心子， 倒是每次都会赞叹某某活佛， 说他如何如何了不起，对法王如意宝的事却什么都没说。</p>\n<p>只有一次， 大家认为法王如意宝不好好学习、不努力， 睡觉的时间太长了。大家都在学习的时候， 他还在睡觉， 大家就给上师提意见。某某堪布说： “上师， 他这样睡觉能行吗？ 他在这里不好好学习浪费时间不好吧？”那一天， 托嘎如意宝只透露了一点：“他睡， 你们不用管；他起来， 也不用管。你们自己学好， 不用管他。但是我认为， 你们要是能学到一点他睡觉的那个姿势都不错了。”除了这一句， 什么都没有说。但最后你们看看， 托嘎如意宝所有的弟子里面， 对佛教贡献最大的是法王如意宝。这个时候才知道托嘎如意宝当时那句话的含义。而他天天夸的那个活佛，十年过后就圆寂了，对佛教也没有多大贡献。</p>\n<p>在五明佛学院， 大家都说这个是心子， 那个是心子。我在五明佛学院呆了较长的时间， 真正是在上师身边度过的。不是因为我很好， 而是我喜欢玩， 上师去的地方多， 我就跟着他跑， 所以跟上师最接近。在这段时间里面，我真的没有发现上师真正的心子是谁。</p>\n<p>上师有时说“慈诚罗珠很好”， 有时说“丹增嘉措很好”， 有时说“索达吉很好”， 有时候说“龙多活佛很好”， 有时候说“里郎曲吉尼玛活佛很好”。但有一天， 上师说： “我的代表、我的继承人、我的心子，明天就要坐床了，要举行坐床仪怯。”大家就都期待着，推测可能是谁谁谁。结果是什么呢？ 就是一本书！ 仪式上佛教音乐吹响， 请什么什么上去，结果一看，是他自己写的一本书一一《21 世纪学佛人的 ***》。</p>\n<p>直到现在， 我们都不知道谁是他的心子， 但相信一定会有很多心子。一个上师不可能没有心子， 为什么呢？ 因为他要把压箱底的最圆满的法传给他的心子。心子不一定只有一个， 也许为了保险， 会有两个或三个。如果只有一个， 他寿命遇到问题的话， 法脉就中断了， 所以肯定会有两三个或者是更多， 具体就不知道了。比如阿秋喇嘛， 哪个是他的心子？和他最接近的弟子， 像普巴扎西、阿松， 也许他们都不知道到底谁是阿秋喇嘛的心子。我们的师公也是一样，谁都不知道他最爱的弟子到底是谁。当今末法时代要是泄露了最爱的弟子和心子是谁， 可能会给他人带来不必要的羡慕嫉妒恨， 也有可能造成心子的弘法利生事业诸多障碍。为什么呢？ 因为人间嘛， 是一个五毒俱全的地方， 很多人都有嫉妒心， 会想方设法给他制造舆论和绯闻。还有， 在上师身边待着， 知道了谁是上师的心子， 一些有心机的人， 就会天天在上师和这位弟子之间挑拨， 给大家造成一个造业的机会。不知道是谁的话， 就没法造业了。所以谁是心子，上师知道， 心子本人知道。总有一天， 这位弟子会跟别人不一样， 像金子一样闪闪发光。看上去最有希望的，不一定是心子。</p>\n<p>五、正确的依师之道</p>\n<p>从外在是看不透人的</p>\n<p>以前法王如意宝有某个弟子， 和我们在一起的时候谁都不喜欢他。</p>\n<p>因为他不会与人相处， 说话也不怎么柔和， 大家都看不惯他， 天天都骂 他， 感觉快要打起来一样。他也像要动手一样， 感觉很粗鲁。后来有一天，上师就对这位弟子说：“你没有缘分在五明佛学院呆了。学院所有的弟子， 包括那些优秀的弟子都已经不把你当修行人了， 认为你应该离开五 明佛学院， 回家去。”他问： “上师， 这是开除我吗？给我一个机会吧。”上师说： “开除不是这样的。”他就说： “好， 只要不是开除， 我马上走。”他回家后， 又把生产队队长、支部书记全都得罪了。大家都议论说： “法王如意宝身边怎么会修出这样的人呢！”他给别人的感觉就这样。但是每一次他都会说：“从外在是看不透人的。”</p>\n<p>有一天晚上， 他看到法王如意宝跟他说话（ 那时候法王如意宝已经圆寂了） : “孩子， 你在那里过得不太开心， 还是回来吧！到我这里来，可能会开心一点。我以为把你放在那里会过得好一点， 但是我可能错了，你还是回来吧。”然后他在开会的时候， 当着很多人的面说：“法王如意宝跟我这样讲了， 我可能明天就要离开人间了。”有人就说：“那个地方好， 你早就该去了， 我们都期待你早点去。”第二天， 他就把跟他关系稍微好一点的朋友请来吃饭， 说：“我不是要离开人间了吗？ 你们再恨我， 也来看看我， 见我最后一面吧。”大家都觉得这个人疯了， 但因为好奇， 就去看看。发现他盘腿坐在那里， 穿着自己的法衣， 身体洗得干干净净的。这么一坐， 就没气了。你说这个谁能看得出来？从外在看，别人都认为他是修得最差的， 但这个弟子得到了什么呢？ 肯定是得到了</p>\n<p>最厉害的法！他不需要外在的形象， 不在乎别人说什么，只要自己修得好就行了。</p>\n<p>在五明佛学院的时候， 我隔壁有一个炉霍县的师兄，年龄跟我差不多。那个时候， 我们都年轻， 大家一到学院都很勤奋地学习， 但他不学。早上起来就洗脸洗脚，</p>\n<p>擦身体， 然后在脸上打些粉， 擦一个叫“霞飞”的擦脸油，擦在脸上白白的。今天说“用牙膏洗脸很白的”， 明天又说“用豆腐洗脸很白的”， 他就爱研究这些。大家都笑话他， 只要是个堪布就会说： “大家不要学他那样。”他成了反面典型， 大家都会拿他举例， 说修行人不要学 成他那样。我们一起吃过很多次饭， 他也来过我家里。</p>\n<p>我跟他说：“你怎么这么爱打扮呢？ 你前一世是不是个</p>\n<p>女人哦！”他说：“龙洋活佛， 你也这么看我呀？”我说： “不是我， 你看看， 全部、全部的人都觉得你这个修行方法不对。”“那你说个良心话， 我的这个修行方法对吗？”我说：“这我不敢说。释迦牟尼佛说过， 除了他以外， 任何人都没有权利评价别人。我不能说你不好，但是很多人说你不好。”他说：“开心就行了。”</p>\n<p>他天天唱歌， 歌声从窗户里面传出来， 很远的地方都能听到。唱的是《粉红色的回忆》， 我听得清清楚楚，还有《情网》。一个人在那儿唱：“情茫茫、情茫茫，</p>\n<p>我的心儿荡呀荡……”天天洗得干干净净的， 戴上口罩、手套去听法王如意宝的课， 还经常把帽子摘下来掸灰尘。就这样， 在整个五明佛学院， 他成了反面教材。后来有一天， 他生病了， 法王如意宝就跟他说：“你不要离开五明佛学院， 你没有什么好的亲戚朋友， 我们五明佛学院的僧人可以轮换着伺候你。”然后他就待了七天。七天以后，他就决定要走了。上师还劝了他，但他给上师说： “这么多的修行人伺候我， 我受不起。”还是给上师申请离开学院回家了。后来有一天， 他坐在那里， 跟亲戚们说：“我是五明佛学院学得最差的弟子， 但是你们不要小看我。五明佛学院最差的弟子也有他的能力哟。”又在那儿念：“东、南、西、北， 东、南、西、北。让我朝向西方， 再不要说话了。”大家都觉得他是不是没吃饭， 饿得精神有点崩溃了。他又笑了一下， 说：“不要说话， 你们以为我疯了。我是法王如意宝的弟子， 我不会疯的。我在五明佛学院闻思学得不是太好。但是， 我把法王如意宝传的颇瓦法认认真真地学过。我给你们示范一下啊！ ”说完， 他就坐在那儿念颇瓦法。念完了以后，“啪的”一下。“啊？ 怎么还没走啊？”他好像开玩笑地说：“刚才精神没有集中， 再来一次。”又开始从头到尾念。最后“啪的”一下， 往后一倒， 就走了，自己把自己超度了。</p>\n<p>这种师兄， 从外在根本就看不出来。后来， 法王如意宝说：“他给我们留下了一个很好的缘起。”为什么呢？因为， 大家都说他是最差的， 他都能那样， 那我们所有的弟子都会有自己的能力。这是他给我们创造的一个缘起。</p>\n<p>其实你们想一想， 他肯定得到了上师的真传。如果没得到的话， 不可能修过一个颇瓦法就这样了， 很不容易做到这一点。得到了以后， 他已经满足了。他知道， 死不需要害怕了， 他有自己的能力， 根本不用怕，所以就玩。除了不抽烟、不喝酒，唱歌、吃肉他都来。</p>\n<p>所以说， 上师真正的弟子、真正的心子在哪里谁都不知道。好的弟子特别低调。虽然我没有什么实修的本领， 但我希望我的弟子们都跟他们学一学，模仿别人，成为依止弟子也不错。所以，大家得努力一下！</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/修行程序拒绝 DIY", "title": "修行程序拒绝 DIY", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/修行程序拒绝 DIY🔊.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2014 年 12 月开示</p>\n<p><span class=\"audio-name\">修行程序拒绝 DIY</span><button class=\"play-btn\" data-audio=\"修行程序拒绝 DIY.mp3\">▶ 播放</button></p>\n<h5>修行程序要靠师父</h5>\n<p>各位师兄都是学佛的， 已经把自己的身语意供养了三宝， 都一心一意追求成就。那怎样圆满自己的心愿呢？ 要遵循正规的修行程序。这个程序是什么呢？ 就是完全依靠上师！ 从藏传佛教的密法来讲， 没有上师就没有佛， 没有上师就没有佛经， <strong>没有上师就没有你的一切， 没有上师就没有悉地的来源。</strong>要成为一个优秀的修行人， 必须听上师的话， 严格遵守修行程序。没有修行程序的成就者从古到今都没出现过。</p>\n<p>所以， <strong>师兄们要努力去研究自己的修行方法， 认认真真地听上师每一次的开示。开示中可能有很多重复的内容， 但这是为了师兄们能牢牢记住。如果一次就能记住， 也没必要说那么多了， 但是我发现很多师兄好像还做不到。</strong></p>\n<p>比如有一些师兄， 每天都能跟上师见面、说话， 能听到上师的开示，这时他的修行会比较精进。但是两三个月见不到上师， 听不到上师的声音，好像他就会改变， 这是不应该的。上师在与不在， 见与没见， 上师的开示听没听到， 其实是一样的。<strong>上师从来都没有离开过师兄们， 也从来没有间断过开示。</strong></p>\n<p><strong>为什么这么讲呢？ 你一想到上师， 就是见到了上师； 你一想到上师的开示， 就等于上师已经开示了； 你一想到自己做功课， 那就是上师的开示； 你有一点点善心和比较完整的发心的时候， 那就是上师出现在你的心里。所以师兄们不应该有改变，但是不知道什么原因很容易改变。</strong></p>\n<p>就我而言， 我也有上师， 现在在世的上师就是你们的师公。我有时候两年见他一次， 有时候一年见一次， 但<strong>我从来没有改变过对他的信心，从来没有因为见不到上师就无法可修， 或者改变一下自己的修行方法，没有过这样的想法。</strong></p>\n<p>所以，我不太理解师兄们怎么会有这样的变化。</p>\n<p>但我也能谅解， 都是和我一样的众生， 都还不是成就者， 性格上总会有一些这样或那样的改变，这样想的话也可以理解。</p>\n<p>不管怎么样， 修行的时候你的身语意一定要交给佛陀， 佛陀就是你的上师。很多佛经都讲过： <strong>你见无数的佛不如见一次上师的功德大； 你听无数佛的开示，不如祈祷一次上师的功德大。</strong></p>\n<p>所以， <strong>随时随地都要想着上师， 都要记住上师说过的话。你们的身语意交给上师以后， 就不应该有别的思维了。如果在修行程序上有别的思维， 你就欺骗了三宝， 违背了自己的信仰， 也偏离了自己最需要的成就。</strong></p>\n<h5>为什么还要自作主张</h5>\n<p>下面讲几个师兄们当中， 除了上师开示的修行程序以外， 还存在别的想法的例子。</p>\n<p>比如， 有的师兄一闲下来就想做点什么。<strong>其实修行人不应该有很多空闲， 因为有自己的功课， 还有工作。</strong></p>\n<p>但是他自己觉得很闲， 然后就到网上去搜索一些别的修行程序， 去看里面怎么说的， 说得越厉害他就越激动，越神秘他就越好奇，看着看着就会想修这样的法。</p>\n<p>有一次， 一个师兄跟我说：“上师， 我想修莲师传给佛母益西措嘉的这个法， 我觉得很适合我。”你这么提出来， 上师真的说不出话来，不知道该说什么，说真话怕伤害到你。</p>\n<p>其实当时上师的想法是：“莲师传给佛母的法适合你吗？ 你是佛母吗？你是益西措嘉的转世吗？你真的有益西措嘉这么高的境界吗？”</p>\n<p>但我要是这么直接说， 害怕打击到她， 只能说：“你想修啊？ 那就修呗。”“那上师您要教我啊。”“我不会。”只能这样！</p>\n<p>有的师兄会说： “上师， 我百分之百听您的话！”他真的是这么讲的，这句话现在成了很多弟子的口头禅了。“但是我听说在上海有一位伟大的上师来了， 听说是大圆满的成就者， 而且他传的都是大圆满法， 只要接触到他的法就会成就，我能不能去看看呢？”</p>\n<p>我说过， 你想去哪儿是你的自由， 你想拜哪一位上师也是你的自由。但是你要想好， 你要见的那位上师怎么样， 适不适合你？ 你现在修的法是什么法？你要接受的新的法又是什么？你应该去研究一下。</p>\n<p>后来他去了， 也接了法。过后， 我了解到这位上师其实也不太如法。</p>\n<p>有的弟子会说：“上师， 我自己在念《地藏经》， 以及般若波罗什么什么经， 念了感觉对我帮助很大， 我要念！同时上师的程序我也要修，听上师的话！”这个时候也没有办法拒绝你， 这是你自己的选择， 你说的都是佛经，我只能说可以念。</p>\n<p>其实我没有说过哪一位上师不好， 也没有说过佛经不好， 当然好！如果修什么都可以的话， 一个法门就够了。但是为什么释迦牟尼佛开取八万四千法门呢？ 因为佛看到了每一个众生的缘分， 每一个众生所需要的法， 以及每一个众生需要经过的修行程序， 才开取了这么多的法门。然后我就想：“你能知道你适合什么法吗？”其实去拜一位上师就是为了请他指导修行。我们不知道什么法适合自己，不知道修什么法才能解脱，所以才选择一位大德作为自己的上师。<strong>你明明有这样一位上师， 为什么还要自行安排别的程序呢？ 那你不是懂了吗？ 懂了为什么还要找一位上师呢？</strong></p>\n<p>还有的师兄喜欢说一些让人听不懂的话， 这可能和身体、环境有关系吧。“昨天晚上释迦牟尼佛来了， 给我传了法。释迦牟尼佛传的法，我要修吧？ ”佛陀亲自传给你的法， 我怎么敢说你不要修啊？ 其实我心里想的是：“完了， 出现幻觉了， 很快就要精神分裂了。”这是实话，我真的是这么想的。但是我没法说你快要精神分裂了， 只能说“好吧，你自己有感觉的话就修吧”。</p>\n<p>又比如我们算卦念经， 我打卦要念的经文你可以请多智钦寺念。我是这么想的， 你是龙钦心髓的弟子， 你的传承就是多智钦寺的传承， 让这些跟你有直接缘分的僧人给你念经可能更好。但是有的师兄会说： “上师，这次您给算个卦，这个经我到别的寺院去念好吗？”我只能说：“当然，别的寺院也可以啊！”但是我想： 佛不度无缘人，你跟别的寺院有缘分吗？</p>\n<p>再比如你要看病， 请示上师怎么看的时候， 上师说什么你就听什么，因为你的身语意都已经交给了三宝。有的师兄去医院， 自己选择了三个医生，“上师， 这三个医生当中帮我选一个吧。”我给他算出来一个，他去了以后回来说：“这个医生感觉不是太好，上师，能不能在另外两个中选一个？”我又选出来一个。他去了， 回来又跟我讲：“上师啊，这个医生给我开的方子里有一种药我是不能用的， 继续这样吃下去不是吃死我了吗？ 我还想换两个医生。”就这么一直换下去， 自己都不知道在挑什么， 最后什么都没有选到。而他的病情没有好转的时候， 又会说： “上师， 我听了您的话， 我也去看病了， 可是还没好， 这是为什么？”其实我心里真的很郁闷，这是你选的还是我选的？</p>\n<h5>不要做念头的奴隶</h5>\n<p>为什么要讲这些呢？师兄们容易跟着念头跑。你的修行跟着念头走，过生活、做生意都跟着自己的念头跑， 永远都是念头的奴隶， 一刹那也成不了念头的老大。从成为念头的奴隶的那一天开始， 你就不会成就，也不会有完美的修行。<strong>修行人必须是念头的主人， 不能成为念头的奴隶。</strong></p>\n<p>所以， 要听上师的话。比如在座各位选择了我， 当时我也没有说自己是成就者， 也没有说自己多么多么伟大， 但是你们的缘分就在我这里，你们心底里有一个挡不住的想法： “我要选择的上师，就是龙洋活佛”。你选了，上师也接受了。在这种情况下，上师再差也是你们自己的缘分和福报感召来的，必须要听他的话，不听就没有办法成就！</p>\n<p>说实话，很多上师为了让你开心，为了安慰你，会说很多漂亮话，会说：“见一百位上师很好，越多越好；接的法越多越好；结的缘越多越好。”</p>\n<p>这个话也没错， 但是这个“越多越好”里面有些是不适合你的。比如说吃饭也很好，但是你吃得越多越好吗？吃得太多吃胀了，也许会很不舒服，甚至生病。</p>\n<p>在座的各位都上过学， 上学的时候你读的学校越多越好吗？ 你在成都、北京、天津、上海各上一个学校， 你怎么去读啊？ 这些学校都好，老师也好，教给你的文化知识也是好的，但是对你适不适合呢？</p>\n<p>这么一说， 大家都会觉得不应该选择这么多学校， 那为什么要选择很多的上师和法门呢？ 这完全是对自己不负责任， 对身边的师兄不负责任。因为在座的各位都是一个上师的弟子， 生死都在一起， 一个牵着一个，就像生物链一样， 一个出了事全都会出事， 那你不是要给师兄们添乱吗？</p>\n<p>你到处跑， 修行从来没有认真过， 直到最后死的那一天， 你都不知道应该信谁， 应该相信哪一位上师。快要死的时候就会恐惧： “上师知！上师知！我要祈祷哪一位呢？龙洋上师还是噶玛巴上师， 还是班禅大师，还是……”这么一犹豫，就错过了，你就没有祈祷成。</p>\n<p>如果你只有一位上师， 马上就会想到“我的上师龙洋活佛知！”这样就很快。但是如果你心目中有很多位上师， 选过来选过去， 在选择当中就错过了。</p>\n<p>所以师兄们一定要对自己的修行负责任， 对这个坛城负责任。<strong>不管做世间还是出世间的事情， 都不要伤害师兄弟， 不要扰乱上师的心态，否则还不如不学。</strong></p>\n<p>打着我的旗号， 说自己是龙洋活佛的弟子， 还这么做的话， 我有点脸红。你根本就没有学什么， 也没有修行， 天天在社会上闯荡， 该吃的吃， 该喝的喝， 该骗的骗， 那算什么弟子啊？ 上师教过你这样做吗？不可能，不可能！</p>\n<h5>跑破鞋子不如坐破垫子</h5>\n<p>所以， 要做一个真真正正的人， 做一个真真正正的修行人。对得起上师， 对得起自己的信仰， 对得起自己的师兄弟， 这才是真正的修行人。</p>\n<p>其实你在这里念金刚七句， 在那里念宗喀巴大师的心咒， 或者念噶玛巴的什么程序， 都是一样的， 都是在学佛。你就学一个， 死心塌地修下去，就能从头到尾很完整地接到这个修行程序。要是像跳蚤一样到处跑，这边是个头，那边是中间，另外一边又是个尾，你怎么接得上呢？</p>\n<p>而且你在选择的过程中有舍弃佛法的风险。为什么这么讲呢？ 你已经有一位上师， 又去选择第二位上师的时候， 在思维的细节里面， 肯定觉得两位上师有区别， 这个时候你已经舍弃了你认为差一点的上师了。而上师是所有佛和佛法的总集， 你有这样的想法， 就相当于放弃了佛法，放弃了信仰。</p>\n<p>另外， 上师发现你跑的地方太多了， 他虽然不会直接得罪你， 但是在心里会慢慢放松你。到最后死的时候， 你都不太确定还是不是上师的弟子， 上师心里有没有你也不知道， 那你干什么呢？不是在浪费时间吗？</p>\n<p>说实话， 我们的弟子圈里有这样的弟子， 我心里清清楚楚。他来跟我说要修一个什么法， 我不会打击他， 但是我也不会教他什么。我心里想：教你有什么用啊？ 只是在浪费时间。“你就念个阿弥陀佛或者念个什么心咒。啊， 好了。嗯， 你修得很好。”其实上师已经放弃你了。<strong>你觉得上师放弃你的结果是什么？ 对你的祖祖辈辈、子孙后代都有影响， 有可能代代成为乞讨人</strong>，就会有这样的果报。何必要这样呢？</p>\n<p>不要误解我说的话， 不是说一定要围着我转， 而是我求你在跑的过程中有一天能定下来， 在哪一位上师那里都可以， 只要是大德我都同意。要在一位上师那里死心塌地去修，不要跑来跑去的，跑来跑去得不到什么。其实对我来讲， 哪天你走了， 我可能会少一个弟子， 但是那一天也许又来十个，所以上师不缺少弟子，可是你自己的损失就大了。</p>\n<p>你们去问任何一位认真带弟子的上师：“我在一个地方死心塌地修好？还是各地去跑，见很多上师，接很多法好？”听他怎么说，你就知道了。</p>\n<p>其实你自己心里也知道， 学校只能读一个， 同时上四五个学校没有什么意义。那你现在学佛学，走那么多门路、学那么多有用吗？</p>\n<p>所以再说一次， 认认真真地去做人， 认认真真做一个特别在意戒律的好的修行人。千万不要成为在佛教圈子里不招人喜欢、背后受到很多非议的这种人， 尤其是自己师兄群里瞧不起的人， 特别是在上师的心里你像个马蜂窝一样， 捅你一下就会立即反蛰， <strong>上师怕你造业， 所以无奈地随顺你的那种弟子。</strong></p>\n<p>这样真的很可怜。也许你不知道， 还以为自己做得很好， 自己认为拥有能力，也有威信，也有资历， 但是上师和师兄们清楚地知道你心口不一， 关键时刻不需要戒律、不需要上师、不需要信仰，只需要你自己认为的念头。你来了， 他们为了不伤害你， 也许不会说什么，但是你走了以后私下就会说： “小心啊， 这个人自私， 怎么怎么 ... 好色，怎么怎么 ... 爱喝酒、爱忽悠， 怎么怎么 ... 爱财如命， 怎么怎么 ... 爱面子超过戒律，怎么怎么……知道吗？”</p>\n<p>所以师兄们， 你们一定要记住这些话， 这是修行当中最危险， 但又最关键、最需要了解的一些事情。</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/做一个合格的密行者", "title": "做一个合格的密行者", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/做一个合格的密行者.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2011 年 12 月开示</p>\n<h5>这不代表师父没有伤心过</h5>\n<p>从皈依的那一天开始， 你就成为了三宝的弟子， 把自己的身口意都供养给三宝了。我相信大家当时的决心和所说的话多半都是真的， 不会欺骗三宝， 不会欺骗自己的上师。但这一时半会儿的激情过后， 也许过段时间发现发心和生活相碰撞的时候做不到的事情还很多。所以迷茫的前提下犯一些修行人不该犯的一些错误是会有的， 这个虽然有错误但不太严重。但有些弟子如果明明知道是错误， 有时候还知道是犯戒还去做，那比较严重。</p>\n<p>百分之七十的师兄相当好， 根本就不用担心上师是在说自己。但是另外百分之三十的师兄， 今天说的这些话可能跟他们有联系。为什么这么讲呢？ 因为每次上师说的话里面， 只要对自己有利的， 他就接纳， 也会去宣传， 还要再添加点什么。但是如果对自己不太有利， 而且发现好像是针对他的， 哪怕是犯一个比较大的过失， 不但不忏悔， 还会去掩盖。当别人问他：“为什么今天上师说这些呢？”他明明知道，但他马上就会说： “不知道哎。”然后延续自己的错误。</p>\n<p>比如： 上师说过不能喝酒， 他找各种借口去喝酒， 而且喝得很有理的感觉；</p>\n<p>上师也说过， 我们的修行是调整像野马一样难以调伏心态的良药，但往往他不对症自己；</p>\n<p>上师也说过，我们永远是众生的服务员，但他始终居高不下；</p>\n<p>上师也说过，欲望是下地狱的根源，但他偏偏播种欲望的种子；</p>\n<p>上师也说过， 对境是你修行最好的老师， 但他偏要把它想成假想敌；</p>\n<p>上师也说过， 戒律是师兄们的命脉， 但刺激到他的自我的时候却踩踏红线；</p>\n<p>上师也说过， 上师是一切悉地、一切成就、一切幸福、一切财富、一切安全和一切健康的源泉， 值得珍惜， 但遇到个人利益的时候上师也成了他的利用品；</p>\n<p>上师也说过， 上师指着东说“这是西”， 你一定认为是西。但触碰到他执着的方面的时候他可以跟上师狡辩几个小时；</p>\n<p>上师也说过， 你承侍上师和协助弘法利生事业是为你自己成就种福田的， 但某些时候上师的语言刺激到你的嗔恨心的时候， 你却用以前做过的一些你认为是功德的事情来威胁上师： “没了我地球不转， 太阳不升，万物不长。”</p>\n<p>你们是为了你们成为一个符合闻思的正规的沙弥或者比丘， 而不是成为一个唱歌跳舞的演员。”结果恩师安排的这些人束手无策，只能放弃。</p>\n<p>但这些事慢慢传到恩师的耳朵里， 恩师说：“我认为演一场这样的场面很有意义， 消除众多的障碍， 如果某某堪布、某某大德觉得这没有意义， 那就算了。”上面所说的堪布和大德觉得情况不对， 很快地他们自己练习舞蹈、学习唱歌， 亲自供养给恩师看、恩师听， 来表示自己是乐意参与的。可是当初不同意自己弟子参与的那一位还没有醒悟过来，所有的师兄劝他：“你不应该这样。”但他坚持说自己没错。后来恩师都发话了：“如果不忏悔就离开圣地。”就这样， 还是认为自己没错，只做了一个形式上的忏悔， 而内心固执己见。一个月后， 恩师开启了慈悲的胸怀， 没有放弃他， 但这不代表恩师没有伤心过， 也不代表劝他的师兄们没有失望过。</p>\n<h5>讲条件，就不是好学生</h5>\n<p>我讲过什么都可以供养， 衣物、声音、容貌、金钱，还有法的供养等等， 只要自己最珍贵、最喜欢的都可以。有的人听了， 马上就会说： “上师说所有的都可以供养，身体供养也可以的是吗？”只要你发心正， 真心想供养，按法理来说没什么不可以的， 也不是什么大惊小怪的事。但传话的过程中传着传着就变为： “哦， 龙洋活佛说了，所有的弟子都可以把身体供养给他。”我觉得不太好，多半的汉族人听了会觉得接受不了， 因为藏传佛教深入到汉地的历史不是太长。</p>\n<p>有一些涉及因果的事情， 主要看你能不能分析。不需要外人说什么， 你自己最清楚自己， 所以不要麻痹自己， 不要欺骗自己， 能做到不违背因果， 起码自己的良心过得去， 你去做。“我能做， 给自己的解脱不会带来障碍， 至少给家人和跟你有关系的人都不会带来什么不好的后果。”有这样的底气你才可以去做，这就叫有把握。</p>\n<p>有一些请示上师的事要给上师留点权限和空间， 等你自己能确定， 如果上师说了我肯定能听上师的话， 而且有信心认为上师的决定没有丝毫的误差你才去请示上师。而不是绑架上师的思维和语言， 拽向你自己欲望的框架， 让上师做你的挡箭牌。比如： 有一些师兄请示事情的时候， 不是真想来听上师的意见， 只是想让上师同意他自己想做的事， 然后他就会跟别人讲：“这是上师同意的。”或者说：“这是上师让我做的。”遇到这种情况， 上师能不答应吗？ 一旦不满足你的欲望， 上师和弟子之间脆弱的戒律线有可能都要崩断。</p>\n<p>天天说师兄弟之间要团结， 像亲兄弟一样， 甚至要超过亲兄弟。说过这些以后， 有的人就会说：“上师，</p>\n<p>我有自己的原则，既不想对别人好，也不想对别人不好。”你有自己的原则的话， 还来听我的干什么呢？ 就按你的 原则做就行了呗。</p>\n<p>修行人应该是什么样子呢？ 无条件地去修行！ 只要你还有条件， 就不是什么修行人， 而是在培养一个“自我”，培养一个让你轮回几亿年的祸根。</p>\n<p>比如说我布置一个功课， 今天讲应该这样修， 第二天他就觉得应该按自己的方法来， 说：“这个是不是需要改一下呢？”因为他去过的地方太多， 见的师父太多，师父教的方法也太多了， 所有这些混在一起就把他搞晕了， 不知道该怎么做了。给他讲了做功课的程序， 才过十天， 我没听说过的内容他都念出来了， 然后又说： “哎哟， 我这个功课怎么办呢？ 是不是需要布置一下？”我重新布置了。过了一个月， 又返回原样了， 就像弹簧一样， 把它掰过来， 一放手就弹回去了。永远就是老样子，改变不了。</p>\n<p>比如说有的人每天磕三个头， 上师让他只磕两个，他非得磕三个。上师让他只念一个观音心咒， 他非得加一个《地藏经》， 再加一个阿弥陀佛圣号， 后来不知在哪个地方听到一个开智慧的文殊仪轨。加来加去， 最后没有什么效果， 又说： “唉， 上师，我该怎么修呢？”</p>\n<p>我不是说这些不好， 你念的这些都是佛法， 都很好， 但是对不对你的路子呢？ 比如说你发烧了， 医生先给你开一个退烧药， 再给你吃一个保健药， 又吃一个抗生素， 再吃一个什么东西， 全是药， 这样对你有好处吗？</p>\n<h5>有头有尾，贵在专一</h5>\n<p>我到汉地十多年了， 从头到尾讲的都是一师一法一本尊。我的弟子可能不会这样想， 但是有的人会认为： “龙洋活佛， 你是不是想搞垄断，不让别的上师进来？ 华智仁波切有一百多位上师都可以， 而你说只能有一位上师，哪有这种说法？”</p>\n<p>我是为了弟子们能够学到一个清净的法， 然后比较专一、有程序、有次第地去修， 我觉得这样是最好的。如果要有头有尾地修一个法， 必须得依靠一位上师。否则， 你找到第二位上师， 说：“上师， 我已经修到皈依了， 这之前的法不用给我传， 给我传后面的法就行了。”能这样吗？这就不礼貌了，他也不会这样给你传。</p>\n<p>比如说， 我们的套路是这样的， 从金刚七句开始， 到后面修完三根本一一上师瑜伽、本尊、护法。你在我们这里修了持明总集， 又到另一位上师那里， 说： “上师， 持明总集我修过了， 你给我传一个空行的法。”可能吗？他有自己的套路，为你一个人改变所有的程序， 不可能。你永远只能原地踏步， 成了一个哪儿都跑， 哪儿都站不住脚的混社会的人。什么活佛都见了， 什么法都接了， 到最后什么都没得到，什么都没成功。死的时候想祈祷一位上师， 却想不出一个对自己好一点的， 也许你拜过的上师没一个记得住你。不要说完整地修一个法，甚至连一个深刻的印象都没有给上师留下。跑有什么用呢？</p>\n<p>我们都上过学， 都知道要读书的话， 待在一个学校是最好的。如果今天这个学校， 明天那个学校， 后天又是另外的学校， 对你有好处吗？有的人会说： “有的上师说过， 法接得越多越好， 同时接十几种法对我很好。”你想一下， 同时在七八个学校上学， 对你有好处吗？ 你想这样恐怕也没这个时间，就算有时间， 也没有智慧的能量来接纳。一会儿听这个， 一会儿听那个，你会搞晕的。</p>\n<p>比如说， 你依止师公， 他可能会说：“念金刚七句， 一辈子。”作为弟子， 你该不该听他的话？如果不听他的， 你是不是破戒者？破戒了，你修行还有成功的机会吗？ 如果你再换一个地方， 到法王如意宝那里，他让你一辈子念文殊心咒。你该听谁的？ 这些只是打个比方啊。每一位上师的目的是一样的， 但修行方法不同； 即使修的法门一样， 但是套路也可能不同。</p>\n<h5>一百多位师父的来历</h5>\n<p>现在， 很多人看了《龙钦前行引导文》以后， 觉得华智仁波切的上师很多，自己也得有很多：“他有一百位上师，我得有两百位。”</p>\n<p>华智仁波切的有些上师是怎么来的， 我给你们讲过。举一个例子。那个时候， 华智仁波切在整顿佛教， 以暗访的形式去观察修行人的状态，无论好的还是坏的，都会记录下来，写成著作告诉世人。</p>\n<p>有一次， 他去了一个寺院， 进到一个僧人的屋里， 说：“我能不能在这儿借宿一晚？”那个僧人同意了。第二天， 僧人一大早就起来念功课， 而华智仁波切一直在睡觉。僧人就教育他说： “一个出家人不能这样，必须得念一些自己的功课。”并说：“你要是没地方去，每天给我担一桶水，我给你讲华智仁波切的《前行引导文》。你应该学一学。你穿着僧人的衣服， 如果什么都不懂， 什么也不念， 这样不好！”华智仁波切对这位僧人很感兴趣， 就说： “好， 我给你担水。”于是， 华智仁波切每天担水，而僧人就给他讲《前行引导文》。</p>\n<p>讲到一半的时候， 有一天华智仁波切出去担水， 一直没有回来。那个僧人就到取水的地方去找，看到很多人在给他的“弟子”磕头，还喊他“阿沃仁波切”（阿沃仁波切是华智仁波切的尊称） 。那个僧人一听吓坏了，出了一身冷汗， 赶紧回去收拾东西准备跑路。这时华智仁波切担着水进来了， 对他说：“请你把《前行引导文》给我讲完吧。”从此以后， 这个僧人就成了他的上师。华智仁波切说，有一些修行人虽然没有什么本事，也没有什么修行，但他们的发心很好。</p>\n<p>华智仁波切有很多这样的上师， 其中还有一个不识字的老太婆。有一次， 华智仁波切到噶陀寺去讲课。一天， 下了场雪， 他走进寺院边上一个很穷的老太婆家里。那个老太婆问：“佛爷，你从哪里来？”他说：“我今天要到噶陀寺去一下， 能不能给我舀口水喝？”老太婆说：“当然可以！</p>\n<p>但是我只有自己用的碗， 没有多的， 怎么办呢？ 我是在家人， 又是个女的， 而你穿着三宝的衣服， 要是给你用我的碗， 会不会不恭敬呢？”华智仁波切说： “没关系， 只要有喝的就行。”老太婆就把碗洗得干干净净，说： “你要帮我消业哦。今天是实在没办法， 你这位出家人向我要喝的，我不给也有罪过。给呢， 只有用我的碗。”然后就给他倒茶， 华智仁波切就很开心地喝上了。</p>\n<p>老太婆看见华智仁波切的鞋破了， 脚指头都露在外面， 就问：“你 的鞋怎么破了？”他说：“我没条件买新的。”老太婆就说：“我有一双新鞋，是做给自己的， 能不能把它供养给你？”华智仁波切说：“好啊！”就接受了供养，把那双鞋穿走了。</p>\n<p>那时， 华智仁波切要来的消息轰动了整个噶陀寺， 僧众把寺院打扫得干干净净， 都在议论华智仁波切要来的事。那个老太婆知道了， 也跑去接法。结果， 她到的时候， 看到她供养的那双鞋放在法台上， 华智仁波切正在讲课。他说：“这位老人家是个真正的修行人， 对三宝的恭敬度就应该像她那样， 她是我的上师。”让他感动一次， 就成了他的上师。</p>\n<p>而我们找上师的套路是什么样的呢？ 像华智仁波切一样， 去接受灌顶、传法，全部都来。但接法以后，随之而来的都是邪见。</p>\n<p>华智仁波切是怎样的呢？ 他的根本上师是晋美嘉伟尼格， 是晋美林巴的“四大晋美”弟子之一， 也叫恰玛喇嘛。如果他是一百多位上师一起教成就的， 没有自己主要依止的上师， 为什么会有“根本上师”的说法呢？</p>\n<p>对华智仁波切来说， 整个世界上， 最宝贵的财产就是上师给他的一个木头碗。他把它一直揣在怀里， 从不离身。其它东西都可以不要， 但这只碗他看得比生命还重要。有一天， 华智仁波切去见蒋扬钦哲旺波，听说他名声在外， 是位了不起的大德， 就想去看一看。他一进到房间，就看到黄金制成的法座， 边上还镶嵌着各种珠宝， 还有黄金做成的床。他心想：“这么有名的大德， 为什么对财产那么执着呢？”蒋扬钦哲旺波一下子知道了他的心思， 就对他说：“我再执着， 也远远没有你对怀里木碗的执着大。”华智仁波切一听， 马上也意识到了这点， 发现这只木碗确实障碍了自己的修行，立刻拿出来供养给了蒋扬钦哲旺波。</p>\n<p>所以， 华智仁波切的根本上师是晋美嘉伟尼格， 他不是一百位上师全部去跑，去接受传法的，不要上当。</p>\n<h5>跑来跑去，两手空空</h5>\n<p>我不懂闻思， 也不懂实修， 但是我有眼睛， 看到了藏地一个又一个的高僧成就。他们是怎么样成就的呢？ 就是依靠一位上师， 修一门法，修一个本尊，然后成就的。</p>\n<p>像法王如意宝， 一生中修了二十四年的法是什么？ 空行心滴。圆寂之前这是保密的， 圆寂以后大家才知道。他的上师是托嘎如意宝， 法王如意宝一辈子学他的法。我们的师公， 他的根本上师是玉科喇嘛， 没有说是别的上师。</p>\n<p>难道这几位大德找不到我们找的这些上师吗？ 如果上师越多越好的话， 这些大德们的上师应该是最多的， 反而他们的上师最少， 而我们这些人的上师最多。</p>\n<p>这证明了什么呢？ 一个字： 贪。在这个世间，在这个社会，在生活当中，我们习惯了贪，连上师都贪，不止一个，两个三个、五个六个地贪，不知足。贪的结果就是下地狱。你贪什么不可以？ 连最敬爱、最纯洁的那么一点点净土你都要去贪，还要拉到你那种混乱的状态中去。</p>\n<p>这个世界让他觉得特别没有安全感，他就会想：“一位上师能救我吗？越多越好吧。一位上师救不了， 还有第二位、第三位上师， 来一个多重保险。”但你发现没有， 当第一位上师还在世的时候， 再找第二位上师，你观察过自己的心态没有， 你的良心已经背叛了第一位上师。你想的是这位上师远远满足不了你的修行， 要再找一位， 或者是不是觉得另一位上师更厉害？ 如果你对原来的上师充满信心的话， 干嘛还要找别的上师呢？</p>\n<p>我们的文化习俗导致了一些心态上的问题： 比如吃个饭， 其实一样东西就能吃饱， 完全可以满足生存的需要， 但是他非要吃很多种才觉得吃舒服了。吃了太多的饭菜， 结果也许对身体有害， 不但没有好处， 还可能影响寿命。如果把这种习俗带到修行中来， 这不是很可惜吗？ 我们修行就是为了丢掉这些坏习惯， 不再重蹈覆辙， 现在又把这些拿到上师的净土里来干什么？</p>\n<p>有的人， 瞒着上师做一些事情， 今天对这位上师说：“上师， 我只有你一位根本上师， 我哪儿都不会去。”第二天就发现在别的地方趴着，跟那边的人一模一样， 忙着那边的事情。忙那边的时候就是他们的人，跑回来又成了这边的人，好像穿越了两个世界一样。</p>\n<p>你以为是两个世界， 跑来跑去， 两边都不知道吗？ 不是这样的， 我们佛教的圈子太小了， 几个活佛面前跑来跑去的就是这么几个人， 谁都认识。我都遇到过这样的事情。活佛们在一起吃饭聊天：“我有一个比较好的弟子， 他比较忠诚、老实， 也比较踏实， 修得比较好。”“叫什么名字？”一说名字，“这是我的弟子啊！”这都成一个笑话了。</p>\n<h5>对你负责任的脸必须是黑的</h5>\n<p>有人问：“我念观音心咒可以吗？”很多上师会说：“可以，很好。”“我念百字明可以吗？”“可以， 很好。”“我见别的上师可以吗？”“可以，很好。”“我去吃屎可以吗？”“可以， 很好。”这叫放烟雾弹， 这是不负责任的话。</p>\n<p>有些上师为了不得罪弟子， 不会说什么。他觉得你对他不认真， 他也没有必要对你认真。有缘分见个面， 在一起待几天， 干嘛要得罪你呢？</p>\n<p>“你又不是要跟着我一辈子， 学我所有的套路， 只是结个缘， 今天见个面，明天你偷个东西跑了也没问题。如果你要跟我一辈子， 学所有的套路，</p>\n<p>那我得对你好一点， 认真一点。不然的话， 你的毛病不改， 我也难受啊。”</p>\n<p>有的人把上师拉到养鱼场去， 指着那些马上要被杀的鱼说： “上师，</p>\n<p>今年生意不太好，你给我加持一下这些鱼，让我多卖一点。”那位上师就说： “好。”然后嗡嗡嗡嗡念一阵。</p>\n<p>还有的， 把上师请到比较肮脏的舞厅里面， 说：“这里的生意不太好， 上师， 你给我加持一下。”上师也不明白是怎么一回事， 又念了一阵。根本就不考虑这是在做什么。所以，这些话你能听吗？</p>\n<p>藏地有一种说法：“对你负责任的脸必须是黑的， 对你不负责任的脸永远是白的。”弟子在上师身边始终不太自在的话， 那说明我这个上师做得还比较好。现在， 很多弟子说：“我在上师那里好舒服哦。”我都在考虑自己是不是做得太差了， 怎么能舒服呢？ 不应该啊。我在两位上师那里的时候过得可是紧紧张张的。</p>\n<p>所以， 该说的还是要说一下。不要以为莲师心咒念了一千二百万就够了。有的人跟我说：“上师， 我都念了一千二百万了， 现在还没有什么感觉。”我说： “你需要什么感觉呢？”好像他需要的是： 这么一指， “啪”一个人就倒了； 这么一点，“嚓”一个房子着火了。那是电视看多了。我们需要的是调整心态， 解脱痛苦， 而不是什么在天上飞来飞去。以前真的有人说过： “上师， 我想飞。”所以这些天真的东西不要去想。</p>\n<p>还有电视里面有一些治病的什么内功，“嗞一一”人就好了。装着这些妄想去学佛， 念几百万心咒， 心里也不太清净， 念咒时所有的事情都想遍了。</p>\n<p>“嗡嗡嗡（上师模仿念经的声音），能赚多少钱？”</p>\n<p>“嗡嗡嗡，来一个女的？”</p>\n<p>“嗡嗡嗡，什么时候能结婚？”</p>\n<p>“嗡嗡嗡，什么时候能发财？”</p>\n<p>念了这么一点点，就说没感觉。肯定没感觉。</p>\n<h5>告诉你们一个秘密</h5>\n<p>所以， 大家得死心塌地去听上师的话！ 上师再差， 绝对绝对会对你们认真。只要上师自己知道的， 在允许的范围内， 肯定会告诉你们。只是传法本身有自己的规矩， 我不能破坏这个规矩。你需要什么我就给你什么， 不行， 因为这对你没有好处。只要我有的， 肯定会在适当的时候教给你。上师没有的，说教给你那也是骗人的。</p>\n<p>要听上师的！ 我说的是实话， 上师今天让你喝毒药， 你得喝下去，没有问题！ 父母会给自己的孩子喂毒药吗？ 让你一百天不要念经， 什么都别做， 你也得开开心心听上师的。你为什么要说： “上师， 一百天了，你都没有让我念经，我自己念了好多哦。”这样是不行的。</p>\n<p>你既然成为藏传佛教的弟子， 又是密宗弟子， 就要依靠上师， 上师让你走你就走， 上师让你坐你就坐， 上师让你念你就念， 上师让你不要念就别念，上师让你喝酒你就喝酒，上师让你抽烟你就抽烟，那有什么呢！</p>\n<p>我敢保证， 这里所有的弟子都过不了这个坎儿。我突然说：“来，喝点酒吧。”本来他是喝酒的， 绝对会说：“可以吗？ 上师。”真的，我们的修行太差，执着太大了。</p>\n<p>告诉你们一个秘密， 我从小到大都不喜欢喝酒， 但是师公有一天让我喝酒， 我“pia”一下就喝了， 只是心里面有点担心会不会倒在那儿，但喝下去就像喝了水一样， 一点都没醉。</p>\n<p>我年轻的时候当过比丘。刚当比丘那时，我一心想做一个正规的比丘，不接触女人、不看女人。在我小时候不懂的情况下， 色拉阳智活佛给我灌过顶， 这一世就成了我的上师。有一次， 我到色达县去， 看到他坐在那儿， 跟很多人在喝酒。他看到我， 说：“喔， 龙洋活佛来了。”就把他自己的那碗酒给了我：“来， 喝。”比丘的戒律是不能喝酒的。我当时说了一句直到现在还有点后悔的话：“上师， 我是比丘。”“放你妈的屁， 叫你喝就喝。”我一下子就把酒喝了， 结果发现是凉水， 根本就不是酒。但是他们喝的都是从一个瓶子里倒出来的， 都是酒， 喝得脸都红了。你们要是遇到这种情况，有可能过不了这个坎儿。</p>\n<p>假如医生告诉你， 只要喝一杯酒就会死。然后上师举一杯酒让你喝，你会说：“上师， 医生说了不让喝的。”我只是举个例子， 上师不会让你们喝酒、抽烟， 也不会让你们做违背因果的事情。其实听了上师的话也不违背因果， 但是你们的上师胆子小， 不会这样做。上师总是心太软。</p>\n<p>但是， 上师让你做什么， 你要是不做， 三番五次过后， 有一天上师肯定会在人群当中说：“你为什么不听我的？”</p>\n<h5>为了一个窍诀，我等了整整五年</h5>\n<p>传法也是一样的。求法是你的责任，“上师， 我功课完成了， 我怎么怎么。”你可以去求， 但是传不传是上师的权利。你不能天天说：“上师，你怎么不给我传？”那我干脆就不给你传了。上师在观察什么时间传什么样的法对你的心态和身体好一点， 不要听某些师兄的魔语：“我们的上师不传大圆满， 光念一个咒是成就不了的。”也不要听某些师兄的妖言： “我见过佛，知道你的前世来生。”这样误导你的修行。</p>\n<p>为了得到法王如意宝的一个窍诀， 我等了整整五年。说实话， 你等一两天或者一个月不算什么， 没得到也不用害怕。有的弟子会说： “上师，你不传， 我死了怎么办呢？”哦， 你知道的上师就不知道吗？ 上师不给你传， 证明你还不会死呢， 也许传了也不适合你呢。比如， 藏族的有些弟子会说： “上师， 我今年某些事情一定要做完， 不然的话明年我会不会怎么样啊？”上师绝对不让他做， 他就知道他明年还活着。要用这种心态来对待。</p>\n<p>不然的话， 自己觉得：“我都要死了， 上师还不传。”好像上师很无知， 什么都不知道似的。如果他什么都不知道， 你皈依他干什么呢？我倒是不知道什么，但我相信三宝会保佑我们，该修的都能很完善地修完。不该得到的法， 你再努力也得不到。哪怕上师想传， 你想接， 也可能因为种种原因接不了。但只要你有这个缘分， 不管什么时间、地点， 有怎样的困难都会传。</p>\n<p>比如说在藏地， 多智钦系列的超度法是相当厉害的。我自己倒不会什么， 只是大家认为我是多智钦的转世， 所以很多人希望自己死的时候由我来超度。但是有的人刚要死的时候， 我就离开了， 遇不上。而有的人死的时候， 不知道什么原因， 我必须得去他附近的地方， 倒不是专门为了他， 但是碰巧在那里， 不得不给他超度。求法跟这个一样， 不要着急，只要有这个缘分就不会错过。</p>\n<p>现在上师老了， 可能有点唠叨， 以上说的这些， 可能有点杂、有点乱，但是综合起来对修行是有帮助的，大家最好记一下。我说的是什么呢？</p>\n<p>不要乱跑，不要乱想，做一个很简单的修行人，依止一位上师，依靠一门法， 修得专注一点。不要像疯狗一样到处乱跑。狗就是这样的， 一只狗“汪汪”一叫，没有任何理由，其他的就呼啦一下全跑过去。</p>\n<p>现在有很多修行人也是这样。一个人说： “到这里来， 这边很好”，马上就过去了，不加考虑，也不去研究。在这边聚集的时候，那边又有人叫，立刻又跑了。</p>\n<p>自己没有什么研究，什么样的话都听，在不需要天真的时候特别天真。来一个人说 , 修地藏法马上会成为千万富翁， 他就把上师的话都忘了， 马上就开始念。念了以后， 第二天没发财， 第三天也没发财， 这才想起上师，过来问：“上师，我修什么法才能发财呢？”</p>\n<p>然后又听说《楞严经》怎么怎么好， 又去念。念了以后：“哎呀， 《楞严经》不能念， 一念梦境就不好， 妖魔鬼怪都到我身边来了。”一开始什么都不考虑， 一个人说这个好， 他去尝试一下， 另一个人说那个好，他也去试一下。这种态度和习惯特别不好。</p>\n<h5>做人不能太“无常”</h5>\n<p>我说过，刚开始的时候你要研究，要去观察，刨根问底地调查。观察完之后， 皈依了哪位上师， 就死心塌地跟着他， 拼死也不离开， 这才是真正的修行人。上师九年不理你都可以。“你不理我， 但是我得理你，不会离开你”，这才是真正的修行人。</p>\n<p>红原县有一位活佛， 是师公的弟子， 每次师公回国， 他都会邀请师公去他的寺院， 可每一次都会被拒绝。都二十年了， 但他一点都不泄气。</p>\n<p>大家都说： “上师已经拒绝你那么多次了， 你都不泄气， 难道你不累吗？”他说：“这是我的上师， 我有选择吗？”这才是真正的修行人！ 最后有</p>\n<p>一次， 师公到香港， 他就想跟着， 师公就说“不准跟着我。”他就求师公： “上师， 求求你， 让我到香港来看你吧。”他一到香港， 可能师公感动了，就给他传法、传了窍诀。二十年呐！这才是真正的弟子！</p>\n<p>不像我们， 上师在哪里， 哪里的人就很多。上师一走， 就全部散了。上师在的地方人最多， 上师不在的地方人最少。修行的时候也是这样。比如这一次我在这里荟供， 人就很多， 但我一离开， 平时来的就只有那么二三十号人， 其他人就不见了， 所有的东西好像都被上师搬走了。到广州， 马上广州的人就多了， 活动每次都来， 我一离开就冷清下来了。官场上有一种说法叫“人走茶凉”， 我们修行不应该这样。上师不在，但是你的法还在， 上师布置的功课还在。上师经常说荟供、放生要尽力参加， 没有钱不要紧， 你每次出一块钱、五毛钱， 一毛钱都可以， 重在参与啊。这样的话我说过很多次。所以，做人不能太“无常”。</p>\n<p>我现在有一种感觉， 我到哪儿， 哪儿的弟子就比较精进， 但是我一离开就不行了。要是我死了，这些人会不会彻底放弃修行呢？想到这一点，心里真的有点忐忑。为什么呢？ 因为我付出了很多年， 真正地付出了感情， 把自己的弟子真正地当成一回事。有一些上师是在不耽误自己时间，不障碍自己的程序的前提下， 在网络上给大家讲几句话。而上师呢， 无论到哪里， 都把主要的精力放在弟子们身上， 这一点你们是有目共睹的。</p>\n<p>上师不是没有个人的事情， 也不是没有寺院的事情， 也不是没有亲戚朋友的事情。有， 而且太多了！ 但我都没有怎么去管， 差不多要被人说成是“冷血”了：“不要提龙洋活佛， 他不会管的， 别指望他了， 他不会来的。”但是弟子们的事情，我是放在了心上的，真的！</p>\n<p>所以， 我给你们讲过， 无论什么时候， 在什么样的情况下， 再艰苦、再困难、再过分、再痛苦的状态下， 都应该更进一步地去修行， 应该更努力地去修行， 而不是离开上师就松懈， 离开上师就放弃了， 不能这样！</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/成就的必由之路", "title": "成就的必由之路", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/成就的必由之路🔊.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2010 年 12 月开示</p>\n<p><span class=\"audio-name\">成就的必由之路</span><button class=\"play-btn\" data-audio=\"成就的必由之路.mp3\">▶ 播放</button></p>\n<h5>一师一法一本尊</h5>\n<p>“一师一法一本尊”已经讲过很多次了， 为了让大家更好地理解，今天再讲一下。</p>\n<p>“一师”， 并不是说不能依止别的上师， 也不是说只允许有一位上师， 而是<strong>建议专心依止一位上师</strong>， 这样可能好一点。佛教有很多修行方法，但无论哪个教派的成就者， 最终都是靠一位根本上师成就的。一百位上师一起加持成就的例子，我没听说过。</p>\n<p>从小到大， 我都很向往依止一位上师， 忠于一位上师， 希望到老、到死都是一位上师。这是我的信念。为什么这么讲呢？ 每一位上师讲的都有道理， 但是你智慧够大吗？ 如果所有上师教的都接收， 那么多的知识你能容纳得了吗？ 我打个比方： 有的上师会讲修五加行是最好的， 必须要修五加行； 有的上师会讲念心咒是最好的， 必须念多少多少心咒；有的上师讲修本尊是最好的， 必须修本尊； 有的上师说供护法是最好的；有的上师专门推荐绿度母， 说这是最好的； 有的上师专门推荐观音； 有的上师专门推荐莲师； 有的上师专门推荐阿弥陀佛。这么多的上师， 这么多的法门， 如果你都要去修， 肯定修不过来。如果修不过来的话有可能有不听上师话的嫌疑， 那后果就更严重了。其实他们说得都对， 没有一个不好， 每个法门都有独到之处。但如前面所说， 我们的智慧是有限的。所以， <strong>脚踏实地地去修一位上师的法门， 可能会修得稳定一点， 安全一点，专业一点，修得更专注，到最后得到的法可能更全面。</strong></p>\n<p>我很担心你们成为跑跑居士。现在在藏区， 每一位上师都会说“不要当跑跑居士”。 什么叫“跑跑居士”？ 就是上午在这位上师这里， 中午在那位上师那边， 下午又在别的上师那里。白教的、黄教的、宁玛的、觉囊的理论，所有的都看，觉得它们讲得都好，都想去接触一下。</p>\n<p>打个比方， 就像吃自助餐， 可能有上百种食物， 但每个人都会挑选适合自己口味的、对身体没害处的， 这就是缘分。不可能把一百多种东西堆在一起吃， 吃了也会消化不了。所以我就说， 一位上师是最好的。这是我根据自己的修行经历来讲的， 像我这样的修行人， 可能更适合一位上师。</p>\n<p>“一法”是什么？ 这<strong>一位上师传授的所有的法， 都叫“一法”。</strong></p>\n<p>比如他传了上师瑜伽， 传了本尊、空行、护法， 只要是一位上师传的， 都叫作“一法”。不是说“一个度母修法就是一法。”这里讲的“一法”不是这个概念。但是修一门也不是不可以， 比如说持明总集法， 或者是度母法。专修一个金刚七句也可以，只要这个上师开许。</p>\n<p><strong>“一本尊”也就是这一位上师给你传的本尊，你自己没有挑选的余地。</strong></p>\n<p>不能说玛哈嘎拉不好、马头明王不好、度母不好， 每一个人有缘分的佛是不一样的。</p>\n<h5>“过来人”的修学方法</h5>\n<p>很多上师可能不会这么讲， 因为讲了这个话， 会得罪很多人。别人会骂：“你为什么把弟子控制在一个小范围里面？ 为什么不给其他上师机会， 只强调一个上师？ 为什么要这样讲？”我都接到过这样的电话， “你在新年祝词里面讲一师一法一本尊 , 是不是指只能信你一个人，其他上师都不行？”我敢保证， 我从来没这么想过。摸着良心说： 作为一个修行人， 从小到现在， 我从来没有认为自己最好， 比我好的太多太多了。我亲眼目睹的高僧大德太多了， 我算个什么东西啊！ 我怎么敢说自己最好， 除了我以外不能有别的上师？ 我能这么说吗？ 这是谤法。我再差， 还是知道该怎么修行， 什么会影响自己的修行。但是我再强调一下，修行要想成就， 而且成就得快， 我说的这个话绝对是没错的！ 哪怕一百个人不高兴， 一千个、一万个人不高兴，那也是他们的事。</p>\n<p>如果哪位上师说：“什么都可以。你修格鲁也可以， 噶举也可以，同时一起修也可以， 你有一千位上师也可以， 怎么不可以呢？”你去问一下他：“上师， 你是怎么成就的？ 你是噶举、格鲁、宁玛、觉囊， 全部一起修成就的吗？ 你难道真的没有自己的根本上师吗？ 你真的没有依靠过一位本尊吗？你真的没有依靠过一个法吗？”</p>\n<p><strong>如果不需要一师一法一本尊的话， 为什么要分教派呢？ 分教派就是为了满足众生的不同需求， 让众生都有适合自己的修行平台， 否则根本就没有必要去分教派。</strong>如果不需要一师一法一本尊的话， 释迦牟尼佛为什么要开取那么多的法门？ 一个阿弥陀佛法门就行了， 为什么还要开取八万四千法门？ 因为每一个人都有适合他的修行方法， 每一个人都有对机的法。如果可以一刀切的话，就没有必要这么麻烦。</p>\n<p>我了解的你们的师公， 我的上师， 当今世界， 整个藏传佛教在世的大德中， 成就最高、地位最高的， 我敢保证就是他。他是怎么成就的？就是靠一个法一一龙钦心髓， 一个上师一一玉科喇嘛， 一个本尊一一华迪成就的。他可没有到格鲁去学习， 也没有到噶举、觉囊去学习。没有！</p>\n<p>还有， 我最珍贵的， 对我最有恩德的上师法王如意宝， 也是“一师一法一本尊”成就的。他靠的是他的上师托嘎如意宝。他会说：“我的根本上师是托嘎如意宝。”而不是说：“我的根本上师有很多。”他的法是龙钦心髓中的空行心滴， 本尊是绿度母， 智慧就靠文殊菩萨加持。大家看看，还有比他们学问更高、成就更厉害的吗？</p>\n<p>他们为什么不选择“很多”呢？ 为什么不满地球去求法呢？ 他们就在一个地方待着， 哪儿都不去。很多上师是因为慈悲， 不想得罪你， 所以不敢对你说真话。他觉得说了也没用， 你也不会听， 反而让你起烦恼，就会说：“都好， 都特别好， 什么都好。”好个蛋！ 这是给你们放的慈悲的烟雾弹！</p>\n<h5>别小看师父布置的功课</h5>\n<p>所以， 每一位弟子都要认认真真地修， 不要小看上师布置的功课。这位上师既然敢给你布置功课， 他绝对比你懂得多。他为什么不选择别的法， 就让你修这个呢？ 他绝对比你高明， 所以要相信上师。<strong>上师布置的所有功课， 不管什么心咒， 哪怕只是一个小小的观想， 让你观想十年，你也得开心地去观， 不要小看它。</strong></p>\n<p>只要你小看了第一步， 就会有第二步，三步四步都会小看。就像走路， 你只要一步没走踏实， 后面就很可能步步走不好。</p>\n<p>我以前不是跟你们讲过吗？ 有一个弟子对自己的上师特别有信心，天天求上师传法， 但上师一直没给他传， 这可能有上师的密意。但弟子天天求， 后来上师烦了， 看到那个弟子的鼻子像金刚菩提， 就说了一句“金刚菩提鼻！”那个弟子认为这是上师给他传的法， 马上起来磕了三个头。</p>\n<p>回去以后他就闭关， 天天念“金刚菩提鼻、金刚菩提鼻”， 念了一个亿。其实这句话根本就不是什么心咒， 就是笑话他的， 但是他却很有信心地去念。后来， 他用这个金刚菩提鼻“心咒”救了自己上师的命， 还得到了一个很高的法。所以， <strong>信心才是关键。没有信心想要成就， 这是根本不可能的。</strong></p>\n<p>有一次，玉科喇嘛的弟子正在打坐的时候，对面的山上有一个女的唱道：“大法你们这些僧人不懂， 小法你们又瞧不起。离开这个世界的时候两手空空， 你们是这个世界上最可怜的人。”玉科喇嘛听到这句话之后奉为修行人的最高窍诀。我们很多弟子都有这个毛病。说到大圆满，大家都很期待、很渴望： “哦！大圆满！传大圆满啊！真的啊？”但是让你念一个心咒， 就不耐烦了：“又要念心咒了！ 我已经念了一百二十万遍了， 还不够吗？”这就跟那个女的唱的一样： 小的法能救你， 你不去修； 大的法你不懂， 给你讲了也没用。在中间徘徊了一辈子， 到死的时候， 什么都没得到。修行和做事一样， 要一步一个脚印， 有次第地去修，不能光看数量，还需要质量。</p>\n<h5>不要错过时代，丢失大海</h5>\n<p>今天我去看了一个生病的女孩， 才十九岁。她请我过去， 是想在我面前向佛忏悔一件事情， 是什么事呢？ 以前她还没有生病的时候， 她妈妈带着她去皈依。当时她就像无头苍蝇一样， 觉得莫名其妙， 心想为什么要皈依呢？皈依有什么用呢？后来她生病了， 病得很严重， 病了五年。</p>\n<p>她的疼痛不是时断时续， 而是连续性的， 经常连续三四个月痛得在床上打滚。这个时候她悟到一个道理： 人没有信仰是无法活下去的。她才发现，那个时候妈妈带她去皈依，她错过了这个特大的机会。心想自己身体健康、不太疼痛的时候， 怎么没有好好修行呢？ 皈依这么好的事情， 怎么还去质疑呢？她说：“我很惭愧，要在这里忏悔。”</p>\n<p>她不知道自己的生命还有多长， 但从此以后， 她的思维， 她的灵魂忠于佛教， 忠于佛陀。她看了很多经书， 明白了所谓的疼痛、痛苦、开心都只是自己的念头， 其实是不存在的。<strong>她现在懂得了这个道理， 却没有能力用到自己身上。因为当时她敷衍了事， 没有去修， 否则， 现在不会有这么大的痛苦。</strong></p>\n<p>这种痛苦， 如果没有佛法陪伴， 她自己一个人， 绝对支撑不下去。所以她感谢佛法提供了这么好的一个灵魂归宿， 为人类创造了这么宝贵的精神财富。很多人不明白这个道理， 直到遇到大的灾难才醒悟，也许已经晚了。</p>\n<p>我们这些修行人为什么就没有她这样的领悟呢？ 就像漂在水面上的一点油，没有深入自己的内心。我讲了很多次，人生是无常的，人是会死的，财产、地位和名声是没用的。你们真的是这样认为吗？</p>\n<p>她说的这些话， 和我们一般的修行人说的不一样。因为病痛， 她思考了很多年， 她的话是发自肺腑的。所以， 这些话是对我们的忠告： 现在还有权利的时候， 我们哪怕只抽出一点时间来修行， 也是很关键的。要是临时抱佛脚， 可能就晚了。<strong>每一个人都会遭遇无常， 这个时候对付它最好的武器是什么？ 就是佛法， 就是自己的信仰， 没有别的。</strong>金钱救不了你，地位、名声、容貌也都救不了你。</p>\n<p>每一个成就者， 要离开人间的时候， 都是很平稳、很安详的， 就像从一个家到另一个家里去做客一样， 没有痛苦。一般人死的时候， 恐慌、焦躁、痛苦，为什么？因为他没有修行。</p>\n<p>所以大家要注意， 我们既然找到了佛法， 也遇到了自己的上师， 得到了上师的开示和功课， 就要好好珍惜。哪怕是一个莲师心咒， 也不能小看它。<strong>莲师心咒是所有佛力量的凝聚，所有佛力量的载体。</strong></p>\n<p>莲师是什么？莲师是佛陀的化身。当佛陀无法亲自出现在众生面前的时候， 就以莲师这样的威猛身相出来度化众生。</p>\n<p>我敢保证， <strong>最适应当今时代人类思维，最适合这个世界的法就是莲师的法。</strong></p>\n<p>别的法虽然也有加持力， 但不一定适合这个时代。现在就是莲师的时代， 现在就是大圆满法的时代， 大家不要错过这么好的一个机会。不要丢了大海，反而去寻找一个干枯的水源。</p>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/求学的关键问题", "title": "求学的关键问题", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/求学的关键问题🔊.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {"author": "龙洋仁波切", "tags": []}, "html": "<p>2010 年 11 月开示</p>\n<p><span class=\"audio-name\">求学的关键问题</span><button class=\"play-btn\" data-audio=\"求学的关键问题.mp3\">▶ 播放</button></p>\n<h5>听话的智慧</h5>\n<p>修行有很多种方法，你坐在那儿打个盘腿，不一定就是修行。</p>\n<p>在寺院里 , 我天天看着那些工人施工、搬砖、拌水泥、卷钢筋什么的，天天跟他们吵架， 自己心里常常想：“我这个活佛到底在干什么？ 是不是在浪费时间呢？”</p>\n<p>有一次， 师公回来了， 我就跟他说：“上师， 我是为了多智钦寺，为了您的一句话把自己的时间浪费了， 您一定要加持我啊， 我死的时候全靠您了！”“你真的是这么想的吗？”我说：“是。”“我对你太失望了！”他说，“你连自己的修行方法都没搞懂， 听上师的话难道不是修行吗？ 你跟我翻翻书， 看看除了听上师的话， 哪里还有什么别的修行方法？如果不听上师的话，你在山洞里天天闭关，会有成就吗？”</p>\n<p>他跟我讲了这个以后， 我就放心了：“啊， 随便， 我不修也可以，我只要简单，哪怕只是做一个好的工人也行。”真的，我真的有了这种想法。</p>\n<p>藏地的寺院， 跟汉地一样， 里面的人际关系也很复杂。比如说， 哪一位上师要灌顶了， 你不去捧一下场， 他如果不是位真正的成就者， 有可能以后会对你不好。而且， 这些人很喜欢给你写纸条：“龙洋活佛，我要灌顶了， 你要是参加的话会长寿的， 我是为了你而灌顶的。”要是不去的话， 他肯定会伤心的。但无论他们怎么说， 我得问问上师， 如果上师说：“别去！”那我肯定就不会去。</p>\n<p>后来， 很多人对我说： “龙洋活佛， 你好像是不想在人群里混了吧，谁的面子都不给， 你真的不需要别人来帮你吗？ 你没想过有一天你也需要别人吗？”我说：“我得罪全天下的人都可以， 但是， 我不能得罪自己的上师。如果上师让我得罪全天下的人， 我开开心心地去得罪。”真的，自从那次上师说了以后，我就有了这样的信心。</p>\n<p>从对上师的信心和听上师的话这方面来讲， 我是一个合格的修行人，这么说问心无愧。要说在山洞里闭了多久的关， 达到了什么样的一种境界， 那我很差、很差。不过， 我看过很多经典， 其实真正来说， <strong>没有上师，所有一切的成就都不会有的！</strong></p>\n<p>比如说， 别处的师兄到这边来， 这里的上师如果对他“不太好”，他就会说：“哎呀， 某位上师对我很好， 他才是我的上师。”在这里接受了多少法， 他都不会承认。但是后来， 某位上师对他也稍微不那么重视， 不怎么提他了， 在那边好像也没什么市场了， 他就又换一个地方： “我的上师是这位。”其实他前面有两三位上师， 但他永远都不提。这叫什么？这叫叛徒，甫志高。我们修行人真的不能这样！</p>\n<p>尽自己的能力， 把以前的上师安顿好， 把他们伺候好， 在他们开心的状态下再依止另一位上师， 这是允许的。但是有的上师， 不是成就者，就是个骗子， 为了拉拢自己的弟子， 弟子即使是真正的想修行他也不会同意， 针对这种情况， 释迦牟尼佛早就说过： “远离他， 在远处恭敬他。”我们不能舍弃他， 但是我们可以在远处恭敬他， 这是释迦牟尼佛给我们的权利。</p>\n<p>所以， 这种修行方法大家要了解一下。你说自己不会修， 那是不可能的， 连一个观音心咒都不会念的人是没有的， 只要是听上师的话， 你念个咒也是修行。</p>\n<h5>循序渐进，切勿高攀</h5>\n<p>上师让你怎么修， 你就怎么修， 要按照程序来修， 不要过早地去要求一些后面的程序。比如， 一个弟子的前面的法修完了， 我在给他布置新功课的时候， 另外一个弟子跑过来： “上师， 我现在的功课还没做完，但是我想跟他一起接法， 我后面再完成， 可以吗？”他也是好心， 积极性倒是可以， 但是他原来的程序还没有过完。就像上学一样， 修行也要有次第， 不要像跳蚤一样去修。次第是什么呢？ 我们每个人都上过学，从小学、初中、高中、大学， 然后到硕士、博士， 是这样一步步地去学。上了一年的小学就想要当博士，那是不可能的事。</p>\n<p>有的上师会说： “什么都不用学， 看着我。啪的！好了， 成佛了。”哪有那么简单？真的，这是不可能的事情。</p>\n<p>然后， 有的上师把大圆满的那些灌顶、修法， 全部以集体开会的形式来传。只要是懂一点文字的人， 都可以去看看经论， 有没有这种程序？没有！ 十四条根本戒里面说了，“于未成熟有情宣说密法”是犯戒的。这是什么意思呢？ 就是说当你根本就不是这种法器的时候， 给你传一些高深的法，那就是犯戒，会构成上师和弟子一起下地狱的条件。</p>\n<p>你自己想一下， 你一点层次都没有， 什么感觉都没有， 上师也没有感觉， 但装成有感觉的样子， 两眼一瞪， 坐在那儿不动。其实上师什么都不懂， 什么境界都没有， 弟子也没有， 但是他装成有境界的样子给弟子传法，这种人是最大的骗子。</p>\n<p>上一次， 师公在多智钦寺的后山上作开示， 他说：“现在有一些上师不要历史、不要程序、不要戒律地去讲大圆满， 把大圆满法用开会的方法去传， 我真的想不通他们到底是不懂因果， 还是不怕因果？ 他难道不想一下这些弟子有多可怜吗？”师公说着说着就哭了。</p>\n<p>这些上师， 他们明明知道这样做对弟子没有好处， 启发不了他们，因为时机还不成熟。你想一下， 给一个小学生讲一些博士的课程， 他能听懂吗？ 师公比喻过， 要想上三层楼， 如果不走楼梯， 从地上一跳就跳到三楼去，这可能吗？不可能的！</p>\n<p>所以， 修行一定要按程序来， 上师怎么安排， 你就怎么去修行。你的<strong>上师只要是够格的， 那他绝对知道弟子的根基， 知道弟子的来历， 知道弟子前世修了多少， 这世还需要修多少， 他都知道， 所以肯定会给你安排适合的功课。</strong></p>\n<p>也许你只修个五加行， 然后什么都不用修， 我就直接给你传大圆满；也有的弟子， 一辈子都在五加行上打转， 那也没什么好奇怪的。当然，你看看，像法王如意宝一生都修了十遍五加行，有的还修了二十遍五加行，这些都是上师来安排的。</p>\n<p>释迦牟尼佛之所以开取了八万四千法门， 就是为了不同根基、不同福报、不同来历的众生， 为他们开取相应的法。如果像有的人说的， 有一个大圆满法就行了， 那释迦牟尼佛何必还要辛辛苦苦地创建那么多法门呢？每个人的需求不一样！如果感冒了用头痛片， 肚子痛了用头痛片，拉肚子了还是用头痛片，这样是不行的，要对症下药。</p>\n<p>因此， 要好好地跟随上师， 听上师的话， 以一个渴望成就的心态去修行。你可以去请法， 但上师怎么安排你都得听， 不能要求上师听你的。我们的弟子里有这种人， 我让他念莲师心咒， 他说：“上师， 我念一个观音心咒吧。”那好， 你念观音心咒。念了五六天， 他又说：“这个对我好像不好， 我就念一个百字明吧。”他自己在那儿选功课做， 自创程序。既然你都懂，那还找一个上师干什么呢？</p>\n<p>藏传佛教和汉传佛教不太一样， 汉传佛教也很了不起， 有适合它的那些根基的众生。比如你只要一直念阿弥陀佛， 然后自己去领悟， 就这样悟悟悟， 到最后， 什么时候能悟出来全靠你自己。但藏传佛教不一样，就像老师教学生一样去教， 不教的话你什么时候才能悟得出来呢？ 它是这样认为的。这两个概念都对， 不能说哪个不对。但是， 我觉得像我这种像笨猪一样的人， 有老师教是最好的， 要靠自己悟出来需要有很大的智慧，真的。</p>\n<p>所以， 大家得跟随上师好好地去学， 不要浪费时间。人这一生， 时间真的很少， 很多人心里总想着：“明天再修吧； 后天再修吧； 赚了钱以后再修吧； 念经的时候再赚赚钱； 老了以后再修吧 …… ”， 你有这些个时间吗？ 肯定没有！ 你看看， 一个地震死了多少人？ 不分年龄， 有老的少的， 大的小的。一个泥石流掩埋了多少人？ 这些人都死了， 我们又怎么能保证自己不死呢？</p>\n<p>当我们听到身边的这个死了， 那个死了， 谁谁谁又死了， 这其实是在提醒我们： “你快要死了。”人家会死， 你怎么就不会死呢？ 都是一样的。所以， 要想到死亡随时可能降临， 想到死亡的时候， 要想到佛法。真正能救你的是自己修的法， 不要去盲目追求一些空的、假的、没有用的东西。</p>\n<h2 id=\"toc-相关主题文章推荐\">相关主题文章推荐</h2>\n<ul><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.1 诸行无常/万事无常，唯有佛法是依靠\">万事无常，唯有佛法是依靠</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/饿鬼道\">饿鬼道</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/“羡慕嫉妒恨”的结果\">“羡慕嫉妒恨”的结果</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会\">不可错过的机会</a></li><li><a class=\"wikilink\" data-page=\"上师开示/1. 为何修行？/1.2 轮回过患/不同状态的生命形态\">不同状态的生命形态</a></li></ul>"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/至少让师父记住你", "title": "至少让师父记住你", "rel": "上师开示/4.如何修行/4.1 正确的依师之道/至少让师父记住你.md", "dir": "上师开示/4.如何修行/4.1 正确的依师之道", "is_index": false, "meta": {}, "html": "<p>2010 年 11 月开示</p>\n<p>修行人要特别在乎自己的上师： 上师夸过我没有？ 上师今天是不是不开心了？ 今天我的所作所为， 上师满意吗？ 要特别关注这些方面， 就像军人在乎军令一样。</p>\n<p>我们修行人有一个习惯， 都希望成为上师的优秀弟子， 就像我们常说的心子。就是跟上师没有误差的心心相印的弟子。这是很难做到的。第二种， 成为上师尊敬的弟子。他的闻思好、实修好、为人好， 上师就很开心， 会尊重这样的弟子。不过在末法时代， 这个也很不容易做到。但是最起码，要做到让上师认识你。</p>\n<p>比如， 很多人都自称是法王如意宝的弟子 , 但法王如意宝并不完全认识他们。他只是心里觉得“这是我的上师”， 但三年都没有见过上师一面。成为这样的弟子很可惜。有机会的话， 比如跟上师聊聊天， 探讨一些修行的套路什么的， 都是很好的。如果没有这样的机会， 也要多在上师面前晃一晃， 天天晃一晃。为什么呢？ 如果你的上师是个大德， 只要他记住你，那你这一辈子就没有白活。</p>\n<p>我们每个人的生命都是无常的，不知道什么时候会走。一口气呼出去，还能不能吸回来， 谁也不敢保证。谁都有可能现在还活着， 过一会儿就死了。那时候， 如果有条件， 说一声：“上师， 我不行了。”上师一想：“啊，这是我的弟子， 我知道， 我记得他。”能够这样更好。如果是突然死亡，没有这样的时间， 别的师兄跟上师说： “某某师兄死了。”上师一想： “哦，我认识他， 我记得他， 很可爱。”那也一样很有好处的。有的上师只要想一下那位弟子， 就可以立刻超度他， 他有这样的能力。昨天我讲了佐钦仁波切的故事。那个土司做了那么多的坏事， 佐钦仁波切只是想了一下， 弹指之间就把他超度了。那个土司确实是先堕入了地狱， 不去不行，因为他要承受因果， 但过程大大缩短了。所以， 让上师记住你是最重要的。</p>\n<p>在五明佛学院的时候， 法王如意宝是我的上师。我不是上师的心子，差得太远了， 也不是上师尊重的弟子。但我敢说， 我就是让上师开心的弟子。我天天拿着一把钉子， 再拿一个钉锤， 然后到上师的房间去看，哪块地板翘起来了， 就过去敲两下。其实， 我是想去看看上师， 想让上师记住我。有时候， 穿上一些很古怪的衣服在上师面前晃一晃。“哎，你这是什么东西啊？”上师就记住我了， 然后讲一些笑话， 做一些吉祥的鬼脸， 有时候装成很可怜的样子， 有时候装成很饿的样子讨一点悉地，反正让上师记住我。我做过这样的事情。其实是我自己心虚嘛， 修行不好，闻思也不好， 只能用这种方法来让上师记住我， 就是为了让上师开心。这个我不骗你们。上师说过：“龙洋活佛在的时候是很好玩的， 他让人很开心。”</p>\n<p>有一天上师跟我说：“我有你这样一个儿子就好了。”真的说过，我一点都不骗你们。对一个修行人来说， 一生之中， 如果被上师说过是他的儿子的话， 这是很高的荣誉。但上师这句话我是怎么得来的？ 就是在上师面前玩闹， 做一些稀奇古怪的动作， 让上师开心得来的。比如，上师喜欢看跳舞， 我小时候正好学过， 所以， 一有机会就在上师面前跳一跳， 晃一晃。上师说：“哎哟， 你这个跳得太难看了！”但是他记住我了。还有， 我小时候学过一点点武术。有一天， 上师说： “龙洋活佛，听说你打架还是很厉害的嘛， 给我露两手看看啊。”当时， 五明佛学院有个从法门寺来的和尚， 大家都知道他武艺高强。上师让他过来， 对我说： “你跟他比一比， 我看看你有多厉害。”我们俩就交上手了。结果，他把我摔在地上， 我的裤裆一下子裂开了， 没办法站起来， 只好蹲在那儿。就这件事， 上师两年都在提。其实我是很开心的， 上师记住我了， 不管以什么样的方法。</p>\n<p>所以， 每一个弟子最好能成为上师的心子。心子是什么呢？ 就是他的修行、境界全部跟上师一模一样， 只是外表、长相不一样。内在都一样，一点区别都没有的时候， 就成为上师的心子了， 这是最好的。我们最需要追求的、首要的目标就是这个。大家不能灰心， 要对自己有信心： “我一定要当上师的心子。”应该这样想。</p>\n<p>哪怕当不了心子， 但是我得对上师有一个回报：“我修了， 我修了一辈子， 我没有后悔。我的境界怎么样， 上师也看到了。上师在与不在的时候，我都很忠诚。我修行了，没有虚度光阴。”这也是很好的。</p>\n<p>实在没有办法， 最差的情况， 至少也得让上师知道你。再说一遍：在上师面前晃一晃， 这是很必要的， 大家要记住这一点。哪怕你成为上师天天攻击的弟子，你只要不灰心，也很荣幸。</p>\n<p>我们在学院的时候， 过一两个月就会问：“这段时间上师提过我没有？”如果说没提过， 那就恐惧了。我们就会想： “上师为什么不提我？哪怕骂一句也好啊！ 上师不提我， 是不是不喜欢我了？”心里就很难受了。“是不是上师心里已经放弃我了？”如果上师一年都不提起你， 那就真的有点问题了。就像做父母的， 自己的儿女做了什么， 马上就会说： “这样行， 那样不行”， 等等。但外人做了什么， 他们是不会说的。所以，就算上师对你说： “你这样不行啊， 你这么做太差了！”那也是你的荣幸，说明上师已经记住了你，把你当成自家人了，这样很好！大家得观察一下：成为上师的弟子几年了， 上师对我怎么样？ 上师还记得我吗？ 到了上师面前，上师认识我吗？这是很需要的。</p>"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/为什么要把修行放在第一？", "title": "为什么要把修行放在第一？", "rel": "上师开示/4.如何修行/4.2 做一个靠谱的人/为什么要把修行放在第一？.md", "dir": "上师开示/4.如何修行/4.2 做一个靠谱的人", "is_index": false, "meta": {"title": "\"为什么要把修行放在第一？\"", "date": "2023-11-24", "author": "多智钦寺", "category": "佛法修行", "subcategory": "多智钦寺网站文章", "source": "网页", "source_url": "http://www.duozhiqin.com/#/article/details?articleCode=AT2023111515473795", "status": "素材", "tags": ["主题/佛法，场景/多智钦寺"]}, "html": "<p>2013年1月开示</p>\n<h1>为什么要把修行放在第一？</h1>\n<blockquote>要知道机会难得，要知道珍惜机会！</blockquote>\n<p>今天我们讲一下，人身是容易得到的吗？</p>\n<p>我们所在的这个星球，有多少个生命？你去看看大海里有多少个动物？你去看看不经常打扫的房间里有多少个生命？你去看看树根下的蚂蚁窝里，有多少个生命？一棵树下，你能看到的生命就有一个国家人的数量。这是我们能够看见的。</p>\n<p>看不见的，就你一个人的身上，就会有无数的生命存在。其实你的人体就是由无数的生命结合在一起的。你要是能看见，就好玩啦！你打一个喷嚏，就能吹死无数个生命；你喝一碗茶，就能冲走无数个生命；你吃一口饭，就能嚼死无数个众生。</p>\n<p>用佛教的概念来计算的话，在这个星球上，人的比例少之又少。这么小的数量里面，完善的人身有多少？</p>\n<p>什么叫完善呢？眼睛没有问题的，耳朵没有问题的，五脏六腑没有问题的，脚、手都没有问题的，有多少？再往细里想一想，思想健全的，有多少？再想一想，有权力，有地位，有自由，不用惧怕的，有多少？很少！</p>\n<p>除开这些，暇满人身就更稀少了。有佛教缘分的人有多少？有了一点点佛教缘分，但是没有瑕疵心态的，有多少？你是有一点相信佛的感觉，但是你走到哪一个佛教圈子都会产生邪见，总觉得不适合你，不是这个问题，就是那个问题，有这种心态的，有多少？这样看来，能得到一个暇满人身，比白天的星星还要少。</p>\n<p>就在这么少的数量里面，能够遇到佛法里精华的精华，像龙钦宁提这样的殊胜妙法，又有多少？在这个地球上，信基督教的大概有17个亿的人，信佛教的只有3个亿。这里面，修龙钦宁提的有没有1万个人呢？</p>\n<p>你们想过没有，你们的福报是从哪里来的，难道这只是一种巧合？</p>\n<p>这么多的人里面，恰恰你们遇到了这么殊胜的法，你们没有血缘关系，也没有事先安排过，但是有一种奇妙的缘起，把你们凑在了一块。你们想过没有，你们的前世在哪里？你们前世说过什么话？结过什么缘？在这么多生命里面，既然把你们凑在一块学龙钦宁提，难道只是为了吃喝拉撒睡吗？你们每一人都有自己的使命，要对得起你们缘分的安排，要知道机会难得，要知道珍惜机会！我敢说，这样的机会是十万分之一，或者说是千万分之一。你要是想下一世再得到这样的机会，做梦！真的。</p>\n<p>你们为什么会有这么大的福报呢？那是你们前世的愿力。但是，光一个靠前世的愿力支撑现在，那也不太现实哦！你以前拥有的这些财富，你一直坐着，什么都不挣，就坐吃山空了。以前的福报全部消耗完了，你现在不增加一点点，行吗？不行。所以现在也得为下一世，多存点福报。<strong>今生，这个人身呐，又难得，又无常，所以为了它不必要的付出是没有用的。</strong></p>\n<p>你想一想，你能在这个世界待多长时间呢？最多三万天！最长寿的人就是三万天。三万天里面你很安详、自由支配的时间有多少呢？小的时候不懂事，全靠别人的意念来控制你；到了中间，在学校里度过，又要听老师的；晚年，也许是听老公(妻子)的，也许是听孩子的，也许是听领导的。除去晚上睡觉的时间，就剩下五千天了。这个五千天里面，属于自己自由支配的时间有多少呢？</p>\n<p>今天你在这里安心地听几个小时的佛法，也是不容易的，这也是很多年前积累的福报才能有的。你想来就来了，不想来就不来了，你觉得有这么简单吗？不可能！这是几千年前已经设计好了的：到了这个时候，有这么个时间让你听一听佛法。你认为这是你推了工作，跟领导请假没去上班，才能来这里？不是！<strong>你没有这样的福报，你怎么“安排”、怎么“挣扎”都不会有的。</strong></p>\n<p>现在有的弟子认为：这有什么呢，我想来就来呗，不想来就不来了呗。但是过几年，你快要到那边去的时候，你往回一想：“啊呀，我真的是遇到了一个很好的法，遇到了一个精神上最完美的东西，但是我没有珍惜，好可惜啊！”你会想到这些，但那个时候已经晚了，再想找这样的机会，不会有的。</p>\n<p>所以，师兄们，我们这么短暂的就像一刹那的时间（人生），利用起来修行。今生很短暂，但是生生世世是比较漫长的，所以千万千万不要错过了这样的机会。我说的是真话。</p>\n<p>不知道什么原因，我成为了你们的上师，其实我心里很惭愧，说实话。我不是一个很优秀的上师，也不是什么具德的上师。但是这是命运的安排，让我们认识了。既然认识了，就得有个认识的价值。价值是什么呢？要学佛。佛法是什么？佛法是文化的灵魂。全人类都需要文化，但文化没有灵魂，就是个尸体。所以我们要掌握文化的灵魂。</p>\n<p>师兄们，每时每刻，我希望你们<strong>把修行放在第一位，生活放在第二位，朋友放在第三位。</strong></p>\n<p>为什么这么讲？因为佛法是你自己的，永远属于你自己，强盗抢不走，别人要不走，你送它也送不走。</p>\n<p>生活呢，太多变了。打个比方吧，你的爱人刚开始跟你在一起的时候，好像装一个皮子装不下，装两个皮子好像离得太远。眨一个眼睫毛，都耽误看他（她），有这么个感觉。到最后，一个门缝里进去的时候，碰一下，“哎呦，不要碰我。”你值得去信任他（她）吗？有的人他（她）是十八变，但是给人的感觉是一百变都不止。</p>\n<p>物质，值得去信任吗？今年的千万富翁，明年有可能就是乞丐。我是看见过地震的。有个人为了挣很多很多的钱，一辈子卖狗，把那个狗说成是神仙一样，欺骗大家。好像狗不像个狗，好像比豹子、狮子还厉害地那种去宣传。宣传完了以后呢，用一种商业欺诈的手段去卖这些狗。地震发生后，骗来的钱一夜之间毁于一旦。不要说钱，他的儿子，他的爸爸，他的妈妈，什么都没有了，就剩下他一个。本来他住的是1000平米的房子，一下子变成了80平米。就这么一刹那，靠得住吗？靠不住。</p>\n<p>朋友靠得住吗？你往回一想，以前可以跟你同甘共苦，拼死拼活地，现在他跟你说话吗？以前你认为特别不好的人，现在有没有成为你的朋友？有时候你没有想到的朋友，突然会出现在你的身边帮你，但是有时候你特别想到的朋友，反而不帮你。</p>\n<p>地位和权力也同样靠不住。</p>\n<p>我们靠不住的东西抓在手里干什么呢？但是你的信仰，只要你有信心，它是永远不会改变的，它永远永远跟你血肉相连。所以我说修行放在第一位，是为了你好！有了精神的财富，什么都有了。没有精神的财富，一个尸体能做什么呢，什么都做不了！</p>\n<p>谢谢师兄们！</p>"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/人品到底有多重要", "title": "人品到底有多重要", "rel": "上师开示/4.如何修行/4.2 做一个靠谱的人/人品到底有多重要.md", "dir": "上师开示/4.如何修行/4.2 做一个靠谱的人", "is_index": false, "meta": {}, "html": "<p>2013 年 01 月开示</p>\n<p>师兄们， 今天给大家讲一下， 修行人怎么做人。其实我已经讲过很多次了，但是为了新师兄，这里再讲一次。</p>\n<h5>忠与孝，缺一不可</h5>\n<p>按照藏传佛教的规矩， 一位上师收弟子， 首先得观察他的人品， 人品要是不合格的话， 上师可能不会接受这个弟子， 因为人品牵扯到很多方面。</p>\n<p>不好的人品就像大蒜的臭味一样， 什么香料都掩盖不了。要是人品太差了， 无论用什么样的方法来调教， 有些缺陷可能还是无法弥补。所以，要很注重人品。</p>\n<p>人品好的主要表现是什么？ 忠和孝。忠于你所在的国家， 孝敬自己的上师、父母。</p>\n<p>一个人要是缺少这两样，他的人品可能有一点缺陷； 要是不齐全的话，学法也会有障碍。为什么这么讲呢？</p>\n<p>第一， 要是不忠于你所在的国家， 不要说修行， 连生存的空间都很小。</p>\n<p>第二， 要是不孝顺自己的父母， 别人都不会相信你是个好人。你对自己的父母都不好， 说对众生好， 对天下的父母好， 那完全是一句空话。</p>\n<h5>做个看得见摸得着的人</h5>\n<p>所以， 师兄们， 要做一个踏踏实实、实实在在、看得见摸得着、比较有安全感的人。不要像水泡一样， 看起来有， 一摸就没了。有的人说话很漂亮， 人前做事也很漂亮， 但是真正需要他的时候， 就靠不住了。需要付出的时候， 他就躲在一个角落， 把自己裹得紧紧的。把别人放在最危险、最困难、最痛苦的地方， 自己却待在比较安逸、舒适的地方，这也是人品问题。</p>\n<p>说话也是一样。说过的话， 就像空气一样， 在这里说过的， 出门就忘了。或许没有忘， 但是他根本就没有遵守的习惯。他的承诺像空气一样，听得见，摸不着。</p>\n<p>做事也是一样， 不踏实。今天这里做一点， 明天那里做一点， 就像小鸟挖洞一样， 到处换地方。可实际来讲， 他真正做了什么？ 只是忙了一辈子，没有做什么对自己和别人有益的事情。</p>\n<p>跟亲人和朋友之间， 没有一点点信任， 没有一点点安全感， 这种人在佛教圈子里， 来了也是白混。他的坏习惯在什么地方都改不了， 即便是学佛，还不是那种不太负责任的、飘忽不定的态度。</p>\n<h5>打好人品的“地基”</h5>\n<p>比如说， 一个人发现佛教是比较优秀的信仰， 发现如果信佛， 对自己有好处， 然后就下定决心要修行。他刚找到上师的时候， 见到上师，就像见到释迦牟尼佛本人一样， 很冲动。然后， 说一些夸张的话， 把自己的上师赞叹得不像人， 好像真的快成佛了。其实真正按佛教来讲， 谎言或有水分的语言千万不要用来赞叹自己的上师。</p>\n<p>但是， 他非要用夸张的语言来吹捧。比如说， 本来上师的能力就像手臂可以穿到这个袖子里来去自如一样， 但夸上师的时候就被他说成是一座山都能在这个袖子里来去自如一样。说上师是自己的再生父母、古佛再来、神通广大、飞檐走壁、稳如泰山、善良超过观音菩萨、智慧超过文殊菩萨、力量超过金刚手菩萨， 等等， 上师听了都觉得毛骨悚然。才过几天， 在大家都觉得没有理由和原因的前提下就把自己的上师说成连做人的资格都没有的那种， 更不要说视师如佛了。做事也是比从来就没有听闻过佛法的人群中品行比较差的还要差， 做出一些常人都难以接受的事。前后落差很大， 上师看了都哭笑不得。上师知道这种举动对他相当不利，但不能说，因为他很脆弱。</p>\n<p>如果把他这五六天的所作所为录下来， 给他本人看一看， 前后变化之大， 恐怕连他自己都不认识自己了。这都是人品不好造成的。没有很好的人品做基础， 就不能成为一个很好的修行人。就像盖房子一样， 地基打不好， 上面修得再漂亮， 遇到下雨， 或者稍有一点震动就会坍塌。所以，人品的地基不好，修行可能就会有点辛苦。</p>\n<h5>人品方面的种种问题</h5>\n<p>还有， 我发现我们的一些弟子特别喜欢新鲜感。只要是新的， 不分好坏， 他都特别喜欢。而跟了你五六年、十几年的， 再好， 他都嫌弃，离你越来越远。就像衣服一样， 今天穿中怯的， 明天看到一个明星穿西怯的， 马上就脱了， 换成西怯的。第二天， 又有一个明星出来， 然后所有人的发型、穿着跟着全变了。第三天， 可能又有一个更大的明星裸体走一走， 那街上不知道会出现多少个裸体了。我觉得这也是人品造成的：你自己没有主见， 没有一个确定的想法， 没有一个规范的程序， 才会这样。</p>\n<p>修行也是一样。皈依的时候， 你不是小到不懂事的孩子， 也没有老到老年痴呆， 是在很清醒的状态下， 跪在你最信任的上师面前， 自愿向三宝发誓：“从今天起到成佛为止， 我不杀生！”别的不说， 只说不杀生这一点。吃饭的时候， 领导说“我想吃青蛙， 点一个。”“好啊！”你点了。第二天， 领导又说“我想吃醉虾。”“好啊！”完全听领导的， 自己没有什么底线，这不是人品问题吗？</p>\n<p>不要说领导， 就是一个好朋友来了， 他不信佛， 在一张桌子上吃饭的时候， 他说： “你装什么装啊， 吃呗， 这是为你点的。”面子就挂不住了， “嘿嘿，好，我吃。”这也是人品问题，说明你人格不稳定。</p>\n<p>再比如，你发誓： “我就修什么什么法门，跟随什么什么上师”。</p>\n<p>有一天， 别人说：“我听说有个什么什么法皇， 比法王还大哦， 只要接触到他， 听到他的四句佛法， 就能立地成佛！”以前的誓言就都忘了，  扑通一下， 又跪在“法皇”面前： “上师， 从今天开始， 我就是您的弟子！”以前所做的一切，说过的一切，全都忘了，这也是人品造成的。</p>\n<p>夫妻两人都是修行人， 因为一点点事情， 就闹得不可开交，“我要跟你离婚， 再也不跟你说话了！”但你以前不是这么说的哦，“我们是金刚师兄弟， 千万不能吵架， 一吵架就会犯戒， 要堕入地狱的。无论遇到什么困难， 我们都要团结， 要听上师的话！”“上师， 您放心， 我们两个在您的门下修行， 至少能做到团结！”就为这么鸡毛蒜皮的小事，你就做不到了。</p>\n<p>还有的弟子， 仅仅因为别的师兄说了一句有点点不尊重他的话， 也许还不是故意的， 他一听就火冒三丈， 所有问题都算到师兄头上， 一点都不顾及戒律。把上师说过的话， 什么团结之类的， 都抛诸脑后了
