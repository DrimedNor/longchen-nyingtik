亏， 修行人就要学会吃亏。 很多人说：“啊？怎么能受欺负呢！”什么叫“受欺负”？你是从哪一方面说是“受欺负”，或者说是“吃亏”？永生永世得到幸福，叫作“吃亏”？还是为了得到暂时一点点好的感觉，才是“不吃亏”？我们很多人眼光很短浅，就看这么一点点、几分钟的事情。“我必须得吵，因为他骂我了。我必须得对他说难听一点的话，必须！因为他对我说了难听的话。” 其实, 这是在培养感情一样培养你的仇恨。人家说你的时候，忍一次，你的脾气就会小一次；忍两次，你的脾气就会好两次。你爆发一次，脾气就增长一次；爆发两次，脾气就增长两次。这个和学武功一样，天天会增加的。 这个我有亲身体会， 不是说空话。小时候， 因为家庭背景不好， 爸爸是反革命， 妈妈是地主（ 牧区的地主）。所以， 上学的时候，我被同学打过， 吐过口水， 还在我嘴里尿过尿， 说：“你是狼的儿子。”那个时候， 因为成分不好， 我没有课本， 没有写字的本子， 老师说“你自己想办法！”我特别渴望同学们戴的红领巾， 我也想戴一戴， 但是， 从来都不会得到。每一次班主任开会的时候， 中间站着一个孩子， 就是我。站着， 让大家来批斗我， 朝我吐很多口水， 等我离开的时候身上全是湿的。 那个时候， 也没人跟我说要修行。当时那种环境谁敢修行啊， 没办法修行。在这种情况下， 我的性情变得暴躁， 成了一个性格孤僻的孩子。 我的老师是一个退休武警， 讲课的时候天天说：“在你们这个公社里面， 有一个反革命叫索丹（ 是我的爸爸）， 他很顽固， 他反对什么，写了什么，我打了他。”我现在都记得。到最后我都恨死他了，真的！ 每一次有什么好机会，都轮不到我。考县中学的时候，我被扣了20分，就这样我还是考取了，全校唯一能考上的就是我。 我去了县上读书， 那儿住校条件很差， 生活是什么样的呢？ 7 天一块钱的菜票， 就是 7 天吃一块钱的菜， 还要省着吃。要是来一个客人的话，你就没得吃了。那个时候， 心情很特别。特别饿的时候， 感觉自己连亲戚家都不敢去。生怕亲戚认为我是不是饿了。我就在亲戚家旁边绕啊，绕啊， 就是不敢进去。现在我一点都不在乎， 进去一下没什么， 但是，以前饿的时候就是不敢进去，那时候真的把我饿惨了！ 住校的时候， 有势力的孩子， 天天到我们住校的地方来打同学。他上厕所也是到我们卧室里来上的， 裤子一脱就在那儿尿了。我说：“你为什么不出去尿？”他说：“外面冷！”当时我就躺在那个高低床的下层， 他就在那儿尿尿。我说：“怎么把人睡觉的地方当成厕所了？”我说了这个话， 他马上冲过来：“你说什么？ 你再说一遍！ 你再说一遍！你不想活了是吧！”我一直在那儿忍忍忍。本来盖着的被子，被他一下拽下去了。我脾气本来就不太好，最后，终于忍不住了，看见那个钢炉的炉圈，我一把抓住那个钢圈，就往他头上砸了一下。我那时候还很小，最后，学校里的孩子，人人见了我都怕。那些孩子们正在说话，准备打我的小报告，我一说：“干嘛！”（众笑）他们就害怕了。真的，（师笑，众笑）成了这种人了。 然后，政策稍微开放一点点了，那些对我爸爸好一点的人，对我爸爸说：“你得教育一下你的儿子，他的一些做法、一些行为，快要犯法了！再这样下去，可能不慢的速度就要进监狱了！”爸爸给我说了一些话，不是不尊重，有一点点帮助，但是帮助不大。最后， 我到藏戏团去演出。塔洛活佛是知道我的， 后来他说：“啊呀！那个时候，可把我折腾坏了，没想到活佛出来是这个样子的，简直是个黑道。”（师笑，众笑） 到了一定的时候， 爸爸跟我讲：“你是多智钦，你的名字在藏族人里面是不一样的， 你不为我考虑， 不为自己的妈妈考虑， 但是你得对得起你的名字， 得为你的名字考虑。很多人在你后面磕头祈祷， 你要对得起他们！ 很多人为了你的健康， 不知道付出了多少代价， 为了暗中保护你， 不知道死了多少人， 你知道吗？你以为是你厉害吗？你惹的那些事，你以为是你自己解决的吗？你回顾一下，你惹了多少事情，都没有人来找你， 这是为什么？你以为你是征服了世界？”他这样讲。 那时我就想： 是啊， 我打了很多架， 也伤了很多人， 但是没人跟我说什么呀！ 原来， 是有一个团体在替我擦屁股。我是什么人？ 我信仰佛教啊！ 那个时候， 擦一个活佛的屁股真的是不太容易的， 是要付出代价的。听了爸爸的话， 我就有一点犹豫： 是不是我的行为不太好？我想了想。然后，就慢慢、慢慢有了一点思维了，有了一点变化。 后来， 有些孩子跟我说些过分的话， 我就忍着。我说：“其实， 我是能打得过你的， 算了。”（师笑，众笑） 我就忍着，忍一次，第二次好像没有这么困难了，忍不住的感觉没有了。 最后， 爸爸说：“你要成为一个真正的修行人的话， 你必须找堪布晋美彭措。”那个时候， 法王如意宝没有这么大的名气， 就是一般的堪"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/不可错过的机会", "title": "不可错过的机会", "content": "不可错过的机会 2012 年 10 月开示 现在， 我们的修行就要靠这个人身了。注意， 师兄们， 要腾出一些时间来修行啊。你们有机会遇到上师， 又听到上师的法语， 得到龙钦心髓的加持，那可能是很不容易的，很不容易！所以不要错过这个机会。 我有一个经验， 在城市里修行的话， 白天太嘈杂了， 人很多， 话很多，看到的太多， 可能心静不下来。但是早一点睡觉， 到了十一二点醒来看看，那个时候什么动静都没有， 比白天清静多了。那个时候你可以修一两个小时， 对你很有帮助的。这是我的经验， 大家可以去试试。 其实人需要什么是自己灌输的， 就是一种习惯。你想睡一天也可以， 睡两个小时也可以， 医学说不能睡得太少， 少了对身体不好， 其实不一定。不睡可能是不行的， 但是睡少一点没有问题。就是关键的时候， 比如说晚上九点到十二点这段时间睡觉，对身体很有帮助。其实这个时候是很嘈杂的时候，你可以睡一会儿， 然后起来修两个小时， 或者两个半小时， 我也不指望你修多长时间。 刚好早上人需要清醒的时候再睡一会儿。这样对身体有好处， 你自己修行也会很精进。这个方法也许不太适合别人， 只是我自己觉得很好。 这样修行也不会成为“显摆”。晚上十二点半以后， 谁知道你在修行呢？ 这完全是为了修行。但是白天修行， 有可能是为了让别人知道，为了让别人看到。“别人说我不好， 哎哟， 我得修一下， 别人都拿念珠了，我不拿念珠的话别人怎么想？”有这种想法，对你的修行不太好。 白天只要有时间也可以念， 但晚上还是比较可以的。可能接近我的一些师兄看到过我这样， 就说：“上师晚上是不睡觉的。我半夜起来，多次看见上师在床上坐着。”其实不是， 就两个小时或者两个半小时。有时候也不起来， 有时候是这样做的。这么做对自己的修行可能有帮助。 夜深人静的时候， 不妨想一想下地狱的感觉， 这和白天想还是不太一样的。比如， 想象你一个人去到我刚才说的那种恐怖的地方， 一滴水滴下去， 发出来的声音， 就好像原子弹爆炸那么大。这种地方你去一下是什么感觉？ 夜深人静的时候想一下， 还是很有感触的。你再慢慢想一下， 自己的肠肠肚肚被刀刮掉， 是个什么感觉？不用说这样， 夜深人静，你观想地狱的时候， 用燃着的香稍微戳一下自己的指头。“啊！”这是什么感觉？ 痛觉是什么样的？ 那时候就知道自己受不受得了这个痛苦。你明明忍受不了，还是害怕的，那怎么不去解决呢？要想到这些。 现在我们的修行是什么样的呢？ 很多人的修行是： 带孩子肯定是很重要的； 拍领导的马屁是很重要的， 因为我要生存； 赚钱是很重要的；修行我是信， 但是有点模糊， 就没有其他方面那么花心思了。有的人明明知道行贿是要进监狱的， 但为了讨好领导， 不惜选择了进监狱。但谁会为了修行进监狱呢？ 要是能够做到为了修行而进监狱， 宁愿进监狱也要修行，那不是很好吗？但谁能做到呢？ 所以自己要考虑一下， 我真的是个修行人吗？ 我真的把修行当成一回事了吗？ 你单位领导给你安排的工作和你上师给你安排的工作，掂量一下轻重，你才知道自己是不是修行人。 比如说， 你的爱人跟你说一件很重要的事， 和上师跟你说的一件很重要的事情有冲突的时候， 你选择谁？你不要认为我不是个优秀的老公，但是，这种时候，我从来不会选择听老婆的。所以， 我的家人一一妈妈、爸爸（ 现在已经圆寂了）、弟弟， 他们都会说：“你对家人来说， 真是太没有安全感了！”我也爱他们， 我想珍惜他们， 但是遇到修行上的问题时，我绝对不会选择他们。是不是修行人，要在这个时候看。 这些都做不到， 你要指望一个好的修行境界， 想达到好的修行状态，那是不可能的， 这是希望天上掉馅饼， 馅饼是不容易掉下来的。我不是什么很优秀的修行人， 但我一直是这么做的。我妈妈八十多岁了， 但我一旦接了上师的电话， 她绝对不会阻拦我， 因为她知道我不听。上师是很重要的， 我不能不听。其实在一个人的人生中， 妈妈是除了上师以外最重要的人， 但是我不能不听上师的啊。妈妈是这一世的， 上师是生生世世的。你们不要误解，“上师是不是不孝顺？”不是，我相当爱自己的母亲。“上师是不是不关爱自己的家人？”也不是，为了他们去得病我都愿意，宁可我死，也不希望他们死，希望他们活得好好的。但是当他们说的跟上师说的有冲突的时候， 我绝对不会听他们的， 因为我是修行人。 上师每次都跟我说：“龙洋， 你是佛教的机器人， 永远像这个。你不是人， 你是机器。”当时我真的没有理解这句话。“人怎么能是机器呢？”但是现在有点感觉到， 自己是不是越来越像机器人了？ 真的， 一年没回家， 妈妈， 作为一个母亲， 肯定很指望我回去看看。有一次我回家，原本计划待个两三天什么的， 谁想正在跟妈妈说话， 上师来了一个电话，我马上起来就走了。这时候我就感觉自己是个机器人。 有一天，我弟弟扎东唯一的儿子死了，他很希望我去超度。他是我的亲兄弟啊。他跟我说：“哥哥，这是我这一生当中遇到的最大的痛苦，你来不来是你的事儿。”我给上师打了电话，上师说：“啊，那我这里的事情不办了？”只能马上跟弟弟说我不能来了。这时候我感觉到自己是个机器人。 你没有一点点付出，想得到一些修行的境界，那是不大可能的。 很多人觉得修行难，其实你什么都没做，难什么难？ 没什么难的！ 你都没做什么， 你还是仍然过你自己的生活， 你自己的那种思想还是没有改变，你很爱惜自己， 很爱惜自己的家人， 很爱惜自己的财产， 很爱惜自己的工作， 很爱惜自己的日常生活， 有一点点空闲的时候才来修行， 这样能得到什么呢？ 得不到什么。 我不是说修行人必须做到这样， 但修行的常识就是这样的。有的人说：“修行人要像军人吗？ ”军人算什么呀？ 修行人必须得超过军人的那种执行度，才是真正的修行人。 所以你们回去慢慢地想， 地狱是什么感觉？ 去了那儿， 我能承受得了吗？ 一千年以后从地狱出来再去修行， 是什么感觉？也许都没有机会，一千年后出来也许是一条狗， 或者是一条虫子， 没有机会去修行。所以大家得珍惜修行的机会。当下虽然都认为修行很好， 但觉得这个机会很容易得到， 等到失去的那一天， 你就知道：“哎呀， 太可惜了， 那个时候我应该用功。”那就晚了， 真的晚了！ 对父母还不是一样吗？ 父母在世的时候， 天天跟他们吵架， 不听他们的话， 他们走了以后才后悔： “当初父母在的时候， 我怎么能那样呢？”那是笨人， 该做的时候没有做到，后面后悔， 那真的太笨了！ 所以这个修行的机会交给你的时候， 一定要抓好。如果错过了，就像彩虹一样，追是追不到的。 我小的时候， 在一户人家里住过三年， 这个家里的人， 一句佛法都没有问过我。他们总觉得：“改天吧， 改天吧。”后来我正式被认证为活佛的时候， 他们才觉得：“哎呀， 太可惜了！ 这么多人去朝拜他， 现在想接近他都没有机会了。当初他在我家里待了三年， 我怎么没想起来呢？”人就是这样。其实那时候问我， 我肯定会说的， 你不问我， 我怎么讲呢？（我主动给你们说）“哎，我跟你讲法。”不可能的！ 以前有一位印度的班智达来西藏， 在一户人家里放了半辈子的羊，这家人一句佛法都没有得到。最后知道他是全世界有名的佛法专家的时候，已经晚了，找不到他了。 所以佛法也是一样。龙钦心髓， 离你最近的时候一定要珍惜"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/不同状态的生命形态", "title": "不同状态的生命形态", "content": "2012 年 10 月开示 不同状态的生命形态 ▶ 播放 身不由己的动物 现在讲一下在六道轮回里的众生是什么样的感觉，先讲畜生道。 像我们藏地，一头母牛生了小牛，是没有权利给自己的孩子喂奶的。人们很自私，会把它的牛奶挤走。它不想给，却没有力量反抗，只能眼睁睁地看着自己的孩子饿死。它很痛苦， 但由于是畜生， 根本也没有办法和条件去消除这类障碍。 然后，让它背着几百斤重的粮食上山下山，一旦发现它走不动了，就用鞭子抽打。晚上被赶回来以后，脖子上也会套上绳子，等着第二天一早继续上山劳动。虽然它再苦再累也说不出来，但心里的感觉跟人是一样的。它会很痛苦地想：“为什么啊？我干嘛要伺候你呢？”人类有的想法它也会有，但就是说不出来。累的时候，它也只能伸伸舌头。等到了派不上用场的时候， 就会被杀掉。快到没有用的时候，它就会很害怕：“我现在背不了东西了，没有利用价值了，是不是快要死了？”它听得懂人们在说什么，“这头牛现在没用了，只有把它杀了吃掉。”人们讨论什么时候杀、怎样杀， 它都听得懂。它很害怕就这么被杀死，却根本没有能力和权利去阻止，没有一点点自由，完全受人支配。 以前还有一些更残忍的做法： 牛还没死的时候就把它的血抽出来喝，说是可以补身体。然后活活地用钉子把它的嘴钉上，再装上车运输个一两天，卖给那些肉铺的老板。牛站在车上一动也不能动， 脚全都跛了，嘴也不能动。尽管身体很痛， 但它说不出“我好痛啊， 求求你了！”连说话的能力都没有， 更不要说修行了。如果我们不好好修行， 下辈子成了这种畜生的话怎么办？还有去净土的机会吗？ 有一些鸟类， 在一个地方产完卵以后， 就会到大海上飞半个月， 就为了找一口吃的喂孩子。等它飞回来， 把嘴里的东西喂给小鸟后， 就累得都快昏倒了。找一口吃的都那么不容易，还要躲避很多很多动物的袭击。就这么飞来飞去，一直到死为止。 还有狐狸， 它的皮毛人可以用， 为了躲避捕杀， 它到处逃跑， 听说一天要跑几千公里。它知道人要杀它， 见到人就跑啊跑啊跑。白天晚上都没有像样的窝， 在零下二十多度的山岗上， 就那么跑来跑去。另外，它也不断在造业，因为它吃的食物都是其他生命。 还有一些动物， 因为一个念头， 就会转生到石头里面。我亲眼看见过这种青蛙， 就生长在石头中间。它一直感觉有几千斤重的东西压着它。你想一下，不要说几千斤，就一个巴掌把你压半个小时，感觉会是什么样？ 它被压在那个石头里几千年都死不了， 一直痛苦地活着。在这个过程中，一些石头碴子慢慢扎进了它的肉里， 最后几乎成了化石， 但它却出不来。 还有的人想：“等我死了以后，下辈子再好好修吧。”你死了以后还有这样的修行条件吗？ 你怎么知道你还会投生为人呢？ 你做过什么样的功德可以得到人身？ 这一次是谢天谢地， 不知道哪一位菩萨发了菩提心， 把我们安排到人间， 还是在能够遇到佛法的地方。这样的机会对我们而言， 就像是白天的星星一样罕见。这个概率有多小呢？ 好比，海底有一只玳瑁，可以在海底一直待几千年的老玳瑁。农民种地放在牛身上的那个木头（ 注： 牛轭）， 不能用了， 甩到海上漂啊漂。那只玳瑁每隔几千年才浮出海面看一下， 某一天， 它浮出来的时候， 正好撞上了这根漂着的木头， 头还刚好卡进了木头孔里， 这种可能性有是有，但是概率很低很低，而遇到佛法的机会比这个还要难得。这是佛陀说的， 不是我们以凡夫的思维编出来的话。 你们想一想， 这么珍贵的修行机会， 现在好不容易得到了， 我们还能再去选择那些低级趣味， 浪费生命吗？ 到人间来， 肯定不是为了吃喝拉撒睡， 这些牛羊也做得到， 鸟类也做得到， 有谁做不到啊？ 到人间最需要做的事是什么？修行。 有的人， 做过很多坏事， 但是还差一点点没做够， 就被安排到人间来继续作恶， 然后很快就堕下去。有的呢， 已经修得差不多了， 还需要一点功德， 也被派到人间来修。谁是修行人， 谁不是， 我们都能看得出来。有的人生来就无恶不作， 那种人肯定就是要下去的， 也许他生来就是这样的安排。但我们不是啊， 我们能意识到人间的有些做法很肮脏， 以前的有些行为是错误的， 觉得应该悔改， 想要忏悔， 以这种心态进入了佛门的。 所以， 千万不要等下一世， 下一世是没有机会的。真的， 不可能再有。我们这个时代是末法时代， 往后只会越来越糟糕， 不是越来越好。就这么一刹那的阳光照在我们身上， 一定要把握好这个机会。 相关主题文章推荐 饿鬼道 万事无常，唯有佛法是依靠 不可错过的机会 地狱里大概的情形 不能太爱钱，它会要你命"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/不能太爱钱，它会要你命", "title": "不能太爱钱，它会要你命", "content": "2012 年 10 月开示 不能太爱钱，它会要你命 ▶ 播放 饿鬼道是很容易去的。饿鬼是什么样子呢？ 大概地说一下。有的身体长得像山那么大， 肚子和头也像山那么大， 但是喉咙和手脚， 却像一根草那么细， 就长成这样的一种生命。它们二十四小时都饿得要命， 想吃东西， 但是又找不到食物， 方圆几千里以内都没有食物。想到别的地方，脚又撑不起身体。即使得到了一点点东西， 也吞不下去。就这样天天想啊想啊， 想几万年， 饥饿几万年， 但又不会死， 也不会老， 痛苦一年比一年增加。这些都是他自己的业产生的。 有的饿鬼， 口渴， 渴得要命， 看见一个很大的绿色草滩， 前面有很大的湖。它很想跑过去喝水， 但它一跑， 脚下全是烧红了的铁。它光着脚板， 一踏上去脚就被烧烂了。它怎么都跑不到那儿， 其实没有东西，只是它的幻觉。就这么一辈子，跑啊跑啊去追水，追一辈子，饥渴得要命，想喝得要命，但是喝不了。到最后下半身都烧烂了， 快烧到腰了， 还要跑。 有的饿鬼， 为了得到别人吐的一 口痰， 就要等五百年。为什么呢？需要的饿鬼太多了，而吐痰的人太少了，它得不到。它只能盼啊盼啊盼，盼五百年，就为了得到一 口痰。它还不能自己吃， 它有五百个孩子， 要分给这些孩子们吃， 它自己什么都吃不了。它们就这么盼啊盼啊盼， 什么都吃不了。这是佛经里面写的， 只要我们相信佛陀，那么这些是的的确确存在的。我们现在看不见，但是看不见不等于没有。 人间也能稍微看到一些饿鬼道生命。海洋中有些鸟类，为了养活孩子，得飞一个月， 飞到很远很远的地方找到一点食物。返回来把食物给孩子的时候，妈妈就已经累昏在那儿了。 有的呢， 看到很多想吃的东西， 但一吃下去， 食物就变成火， 把它的肠肠肚肚全部烧烂， 烧完就昏过去了。等它醒过来又好了， 又想吃，又吞下去。 这是什么因果造成的？ 比如刚才说的吞了又活、活了又吞的例子，这是什么因果呢？ 就是吃了信徒的供养， 但第一没有戒律， 第二没有闻思， 第三没有实修， 在这种状态下， 随便接受信徒的供养， 果报就是这样。受一次供养，就要还五百次。就这么吞一次烧一次，直到五百次。 刚才讲的那种吞不下食物的饿鬼， 原因就是存了很多财物， 舍不得给父母吃， 也不给孩子用， 也不供养三宝， 也不布施给可怜的人， 一直存啊存，自己连一顿像样的饭都没吃过。这种人， 就会变成这样一种生命。 所以， 师兄们， 钱财这些东西， 在人间没有它不行， 但也不能完全靠它活着。差不多就行了，欲望不要太高。“我要做很多很多事情， 要怎么怎么……”长远的打算， 其实是实现不了的。做来做去， 有一天自己还没用就死了， 堕入饿鬼道了。财产都被不应该用的人用上了， 还不如在自己有权力、有能力的时候，用这些财产多做一些好事。 比如山区里那些真正需要帮助的人，他们没有吃的，没有穿的，你给他们一点，你也缺少不了什么，但是对他们来说帮助很大。医院里面有的人交不起医药费， 就缺这么一点点钱， 你有能力的话， 可以给他补助一点钱， 那会救他一命。要饭的、要东西的， 不管怎么样， 他把所有的名声、架子、脸面全部拉下， 跟你说：“给我点钱。”这个时候他绝对是有难处的， 不然的话他不会这样， 所以你力所能及地给点， 不要骂他，不要推他。这些都是为了自己积累一点福报，不是为了别人。 一个老人拉车拉不动了， 你从他身边路过， 无动于衷地走了， 作为一个修行人， 真的有点不好意思。你就帮他推一推， 哪怕是几步也可以。有的老人看不见路， 需要带路的时候， 你在旁边看见了， 你就把他带过去。 那也是为了你自己，不是为了他，所以师兄们要注意。 遇到一些大德，听到一些做善事的机会，比如建经堂、建佛塔这些。 可以根据自己的经济状况，供养一块钱、两块钱，参与一下，这样对你很好。如果供养很多， 然后就后悔了， 那我觉得就浪费了。不用这样。 你能够舍得的， 供出去了以后不会后悔， 也不会指望得到什么， 没有附加条件的供养和布施， 这对你的修行、对你的福报很好。 为了我们自己不堕入那样的饿鬼道， 为了天下做过我父母的众生不堕入饿鬼道， 多做一点，放生啊、荟供啊等等。为了让上师开心、让一些穷人满意、让父母高兴，如果有能力，这些事情多做一些。 这里我要讲一个我爸爸的妹妹， 也就是我姨妈的故事。我有一个姨妈（注：此处的姨妈，是指上师的姑姑。在上师家乡一带，姑姑也可以叫姨妈），生来就很抠，抠得不得了。她有很多财产，牛羊、粮食、银子、珊瑚。但她只有自己一个人。每一次吃饭的时候，她就想：这一次我到谁家里去吃？她觉得吃自己的， 吃一顿就少一顿， 这样不行， 要到哪个家里去吃。考虑好了，就到那边家里去吃，吃得很多。实在没有地方去，自己吃的时候，就吃得很少。真的，我一点都没夸张。有时候她生病了，叫我们去给她念经。念完了她说： “看着我干什么？回家吃饭啊！”她害怕给我们做一顿饭，就是这么抠门的一个人。 我爸爸特别担心她堕入饿鬼道， 经常教育她。说的时候她都听， 但做的时候照旧。她自己有三百多头牛，就死了一头小牛，都要哭一天。不是觉得牛可怜，而是觉得“我少了一头牛啊，怎么办呢？”。真的是这样，变态了。 最后实在没有办法，我的一个舅舅就去找法王如意宝，说明这个情况，问法王如意宝怎么办。法王如意宝说：“有一个很好的办法。你让她到色达县去买个什么东西， 不要让她掏钱， 你给她钱让她去， 等她去的时候，把她所有的财产都搬到五明佛学院来。” 我舅舅很听法王如意宝的话，等她去色达后，把她所有的财产、牛羊等一个不剩都拉走，供养五明佛学院了。她一回来什么都没有了，看了一会儿，坐了一会儿，问：“真的吗？”跟她说了整个情况，她又坐了一会儿，说：“谢谢啊！我轻松多了。”从此以后，她性格变了，她整个人的状态也变了，变成很开朗、很开心、让人很舒服的一个人了。不然的话， 她天天都瞅着自己那一点点东西、财产。人就是有这样的情况，真的。 拉卜楞寺有一个僧人， 他很爱财，想发财， 但就是发不了财。他有一百块银元，只有这么多。每天晚上就在那儿“一块、两块……”倒来倒去地数啊数啊，听银元的声音，数一晚上。有个强盗在外面听见了， 心想“哎呀，他有这么多钱啊！”就跑进去把他杀了，结果整个屋子里只有一百块钱。 别的地方的上师来给他超度，超度了三四次，还在反复地念。他家人很奇怪，就问：“上师，你为什么要反复念呢？”“哎呀，我有点超度不了他。”“为什么呢？”“他已经粘连在一个银元上面了。”真的有这种人。 所以师兄们，不能没有钱，但是不能爱好钱，太爱它了，它会要你的命。不是要一点点东西啊， 是要你的命！ 钱是我们需要的一种东西， 但不是依靠。没有钱的情况下能做到的事情太多了。真正的感情， 真正的上师，真正的朋友， 用钱是绝对买不来的。用钱买得来的， 那有点悬， 真的。其实现在的人都在麻木地生活着， 有钱就成了朋友了， 花钱成了上师了，花钱成了男朋友了。这种关系是很脆弱的。 所以， 人不要成为钱的奴隶， 一定要让钱成为我们的奴隶， 不然的话，就离饿鬼道不远了，真的不远了。你们慢慢去看，有的人抠得要命，一直抠，他的头就慢慢慢慢有点变大， 肚子也会变大， 手脚有点萎缩， 还没有死的时候饿鬼的形象就显现出来了。你看有些当官的， 贪很多钱， 不敢用，也用不了，但是他对钱的执"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/享乐的尽头，是堕落", "title": "享乐的尽头，是堕落", "content": "2013年1月开示 享乐的尽头，是堕落 ▶ 播放 在我们人间，成为神仙的因素是有很多的。第一种：他没有信仰，也不做什么坏事，只是跳舞、唱歌这样去消磨时间，多半就有可能成为神仙。第二种： 他没有信仰， 没有发心， 没有目标， 也没有修行的程序，他就是用一颗爱心去捐助东西， 为人间做了一些什么事， 就会成为神仙。第三种， 性格就像我这样的人， 喜欢笑， 喜欢开玩笑。开的玩笑不带刺激的语言，就是好玩儿，这种性格也很容易去天人道。下一次你们的上师，有可能出现在天人道。 神仙有很多界，有三十三界，每一界的神仙感觉都不太一样，寿命也不太一样。比较好的神仙寿命长一点， 长相也漂亮一点。神仙的寿命是比较长的，寿命好像是地狱的一半，大概可能是一万多年吧，地狱更长。阿修罗的寿命和神仙的寿命比， 还是神仙的寿命长一点。这一万多年太开心了， 所以他觉得好像只过了一天一样， 不知道时间是怎么过去的。刚开始觉得那里很舒服，但是后来就不太好过了。 到了天人道就感觉自己好像快没时间了， 有这样一种感觉。我们在人间有时也会有这种感觉， 心情特别愉悦的时候， 这个日子真的是不知道怎么过去的。别人问我们在这里待了多少天，感觉好像一天、两天吧，其实已经过去了 15 天。但是痛苦的日子， 过一天觉得就像是过了一年。神仙的快乐比我们多， 所以他们不知道日子是怎么过去的， 反正就是感觉很快过去了。 快乐的日子过去以后，这时他身上的光慢慢消失了，漂亮的长相也慢慢衰老了， 身上的香味也慢慢变淡了。以前在一起玩的朋友也慢慢地远离他，他恳求他的朋友：“带着我去吧！”但是他的朋友觉得， 这个时候他身上有臭味， 长相也配不上， 带着他一起玩的话， 人家会笑话，所以不能带他去。就像我们人间的美女， 快要老的时候很痛苦， 很恐惧。虽然我还没做过美女， 但是我大概知道， 人间美女衰老的感觉是比较痛苦的，比男人衰老还要痛苦。神仙衰老的痛苦是她的一万倍。 然后他就坐在一个地方， 没有朋友， 没有人跟他说话。这个时候的日子是特别的漫长。吃不好， 睡不着。只能喝一点点甘露， 有时候连甘露也喝不下去。到了一定的时候他会看： “我走了以后去哪里？”一看，有可能是畜生道，有可能是地狱。他能看到地狱痛苦的样子，把他吓得想尽一切办法去救自己，但是救不了。在天人道， 是无法用修行的办法来补救的。这就有点像眼看着自己快要进监狱了，进去以后，可能是枪毙，所以很恐惧啊！就这样他一直在痛苦中等到呼吸停止。呼吸停止后，多半是下地狱的，这就是天人的结局。 所以师兄们， 在世的时候心情要愉悦、要开心，但是必须得开心得有价值、有目标、有发心、有信仰 ，不然的话，没有目的傻乎乎的开心，有可能成为去神仙道的一个因。不念咒，不念功课，不发心，天天就在歌舞厅里面蹦啊蹦，要不然就泡在网络上天天聊天，家里来个客人他连个招呼都不会打，这样的人多半真的会去神仙道。他是没有时间去做坏事，但是就这样白白消耗了时间。"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/人生中最重要的事情", "title": "人生中最重要的事情", "content": "人生中最重要的事情 2013 年 01 月开示 人间， 我觉得不用多讲， 都知道是个什么样子， 但每一个人的感受不一样。 有的觉得人间太痛苦了， 有的觉得人间太恐怖了， 有的觉得人间太肮脏了， 有的觉得人间过得去。有“过得去”这种想法， 可能还年轻，还没有遇到什么挫折。等到年过半百的时候， 就知道过不去了。这个时候不是过不过得去，是过不去也得过！ 人间唯一的优点， 跟别的道不一样的就是可以修行。 我们就要利用人间的这个优点， 能够抓住， 就是我们的福报， 抓不住， 就什么意思也没有了。就是吃个饭， 睡个觉， 然后再撒泡尿。第二天起来了， 又吃个饭，睡个觉……没啥意思。 但是有了信仰， 就有了文化的灵魂， 你的状态也不再是有障碍的状态了。什么是“有障碍的状态”？就是对佛教没有信心、有邪见。 我们的人身是暇满的，感谢三宝，感谢自己的前因后果给我们安排了这么好的人生。所以， 我们要对得起这个安排， 尽心尽力地去修行。 师兄们， 只要有一口气，把修行放第一位，生活放在第二位。 “生活放在第二位我怎么活？”不要这样想！生活放在第二位，也许你活得更轻松；修行放在第二位，也许你活得更糟糕。 相关主题文章推荐 万事无常，唯有佛法是依靠 不可错过的机会 不能太爱钱，它会要你命 地狱里大概的情形 死亡是最公平的"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/千万不要滞留在中阴间", "title": "千万不要滞留在中阴间", "content": "2012 年 10 月开示 千万不要滞留在中阴间 ▶ 播放 今天晚上我们讲一下中阴间的地狱， 就是断气之后还没有去往六道，在中阴间还有个地狱。这种地狱跟其他地狱的痛苦相同， 只是受苦的时间可能稍微短一点。 这种地狱是怎样形成的呢？比如，一个人死的时候，不知道自己死了，这种情况下他很快就会流转到中阴间。他以为自己还活着， 但有时候也会觉得自己跟活人不太一样， 然后就在这当中徘徊， 很痛苦。不像我们人间的痛苦， 在任何地狱，痛苦都是加倍的，是很刺心、让人承受不了的那种痛苦。 举个例子，感情很好的夫妻两人里，男的一方死了，却不知道，觉得自己还活着，还在家里走来走去。他看见大家吃饭的时候不给他放碗筷，就上去说话，但别人却听不到，好像都不知道他的存在，而他却能很清楚地看见其他人。然后， 他想证明自己还活着，就到雪地里去走路，看见踩下去没有脚印时，才发现自己已经死了，就被吓昏过去了。但醒过来以后， 一切又都忘了。就像我们一样， 前一世做过很多事情， 但是这一世一出生就全部都忘了。他又跑回到自己的家里，想跟亲戚朋友说个话，干点什么， 但似乎所有人都不理他。他很痛苦， 会想：“我好像没有得罪他们， 怎么都不理我呢？”这时， 要是发现自己的女人有了别的男人，痛苦和仇恨会使他的业力增加十倍。他想去阻止这种关系， 但他既发不出声音， 也弄不出动静， 什么也做不了。可能有的师兄在睡眠中有这种状态， 想干什么却干不了， 很痛苦， 有时候被很恐怖的东西追赶， 想跑却无能为力， 类似这种感觉， 一直这样， 很痛苦。他有一点小神通， 当他发现自己最信任的“上师”是假的， 或者自己最信任的家人背叛了自己，就会很愤怒，并且会因为这种仇恨而堕入地狱。 有的人生前爱好唱歌跳舞， 死了还爱去那些歌厅舞厅， 但每次去都发现好像没人理他。其实我们在人间也能感觉得到，在人群当中不被在乎、融不进去的那种痛苦， 谁都有过。但他的感觉比这个严重多了， 会很伤心，想方设法想融入群体，却没有一点办法。他跟大家一起跳舞， 却没有人夸他跳得好，没有观众能看见他。他会在这种痛苦中徘徊很长时间。 这种情况有些师兄是亲眼目睹过的， 比如说曹原师兄。以前我们两个在春熙路， 有天晚上十一点半左右， 我在房间里待着的时候， 觉得有点想出去玩， 就带上他到春熙路步行街去散步。那一天是圣诞节， 我们走在街上， 就听到一阵阵呼喊声传过来， 好像前面有几千个人在闹。我们以为有很多人在那边聚会，但怎么往前走都看不见人，其实根本就没人。 快要走完整条街了，声音还在前面。这个时候我想了一下：“这个声音不对劲啊， 可能不是人的声音。”然后， 我重新整理了一下自己的思路， 再去听， 发现那个声音很刺心， 很可怜， 穿透力很强， 不是我们平常的那种声音。这个声音一过来，“呜……”好像传到很远的地方。我知道这不是人的声音， 就对曹原说：“这可能不是人的声音。”然后， 我们就回酒店了。回来以后， 他觉得那里不可能没有人吧， 就想回去再看看。后来他去问附近卖烧烤的那些人：“这里刚才有聚会吗？有多少人？”“今天晚上没有聚会， 因为是圣诞节， 警察戒严了， 这个地方是不允许聚会的。”“没有人。”但我们的的确确听到了几千号人在那儿狂欢的声音。你们看，中阴间就有这么多的人。 还有一次， 也是我亲眼所见， 是在西宁的一个歌厅里， 就是那种迪吧，一般人不怎么去的地方。一个老板请我去玩， 刚开始我也不知道这是个跳舞的地方， 进去以后， 他给我准备很多吃的喝的， 前面有很多灯在转， “瞪瞪瞪瞪”大家都在那儿跳。那个老板自己去点歌了， 然后很多人在那儿跳呀跳的。我在那儿看他们跳舞的时候， 虽然灯是闪着的， 但我的的确确看见了一个骷髅也在里面跳舞， 就是一个人的骨头架子， 没有肉。当时我真的觉得他很可怜， 都成骨架了还不知道自己已经死了， 还在那儿跳。我觉得他特别可怜， 差点眼泪都掉下来了， 就念了一些心咒和佛号，给他吹气，然后骷髅就消失了。这种情况就是中阴间的地狱。 还有一种，是在门缝里、锅和锅盖中间，还有碗里，所有东西的边缘上，甚至人的指头缝里都会有这种地狱。有一天在寺院里，有一个和尚坐在那儿僵住不动了， 我让他起来， 他说：“我不能起来， 上师， 你看看我的身上有个大城市， 现在已经居住了很多生命， 我一起来就像地震一样， 全部都会倒塌的， 会杀害很多的生命。我该怎么办呢？”我没看见， 这是他说的，他看见了。在佛经里确实讲到有这些地狱。 比如， 你用的碗， 早上最好要念观音心咒或者比较有加持力的心咒往里面吹一下， 否则倒个开水都会烫死无数这种生命。然后， 门随便“嚓”地一关， 也不知道会压死多少生命。可能我们觉得没什么， 但是我们的一个喷嚏， 对他们来说简直就是阵飓风， 我们一碗茶倒下去， 对他们来说可能是一场洪水。这种生命在地球上占百分之七十， 但是我们看不见。 所以， 人类其实只是所有生命当中很小的一部分， 还不到百分之十。从科学角度来讲，这些众生可能是微观世界的一些生物，但是在佛教来看，就是中阴间的生命， 有很多很多。就像我们的身体， 实际上也是由很多生命堆聚成的，虽然我们看不见。 再比如， 吃一口白菜，你这么卷进去一咬， 不知道压死了多少众生。喝口茶， 也不知道喝死了多少众生。这种情况的的确确是存在的， 有神通的人就能看见。有人觉得谈恋爱是最幸福的， 大家拥抱一下吻一下，好像觉得很舒服是吧？ 但就在这个舒服的时候，在两张嘴中间要压死多少众生？ 一个亿的生命！他们不开心我们开心，真的。 但这个没有办法， 只是讲讲而已。你不可能不吃饭，也不可能不走路。但是我们的办法是什么呢？ 就是要信佛， 要发心， 所有的这些众生都曾经当过我们的父母， 跟现在的父母一样对待过我们。现在他们没有能力救度自己，也没有能力帮自己，但是我们有能力超度他们，为什么呢？ 我们有佛法！ 最靠得住的， 别人永远抢不走的， 生生世世跟你在一块儿离不开的， 就是你的信仰。这个信仰， 要靠上师一步一步地去教。 比如，刚才我说了， 早上还没有喝茶之前， 要用一个很好的发心去念一个心咒，因为心咒的加持力，也许度了碗里的众生，也许对他们来说就没有痛苦了。再进一步说， 如果你有一个禅定的境界， 哪怕是看这个世界一眼， 都会让所有的众生得到安乐。这个功德有多大呢？ 地球上爬得最快的虫子， 从额头爬到鼻尖的时间里， 你在禅定中观想一遍， 就有十八亿观音心咒的功德， 相当于亲口念了十八个亿的观音心咒。 其实我们有这样的条件，只是没有去做而已， 只要想去做， 完全能做到。所以， 我们要学好佛法，要达到这样的境界去救度这些众生。 现在很多人认为不能吃肉， 因为这是众生的肉， 是我们父母的肉，不能吃。但是， 这种眼光太单一了。蔬菜、米饭、所有的食物， 花草树木里面都有生命， 一样的。你不能说生命小吃了就没有罪过，生命大了，像看得见的牛、羊、鱼，吃了就有业障，不可能的，生命就是生命。很多人会问：“那怎么办呢？”我们能做到的就是努力地去念佛、持咒、修行， 以此来帮助他们。你们可能知道， 为什么有的人一定要请上师到一个地方去， 想方设法、拼命地请， 哪怕上师只在那待上半个小时， 甚至五分钟都行， 只要去就行， 这是为什么呢？ 就是因为 上师有境界， 只要他在"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/地狱里大概的情形", "title": "地狱里大概的情形", "content": "地狱里大概的情形 ▶ 播放 地狱里大概的情形 死了以后，六道里是没有什么好的地方可去的。唯一好的去处，是你修行好了，可以去净土。 今天讲一下地狱。 地狱有十八种，一一去讲的话，要讲十八天。这里大概地讲一下地狱的种类，以及什么因素导致去什么样的地狱。 首先讲一下夫妻之间不忠诚会去什么样的地狱。结为了夫妻，相互之间就有了承诺。你们汉人有没有我不知道，藏人就有这种誓言，发誓两个人要一辈子在一起，等等。 光是说：“我可能跟你在一起，我们要结婚。”这个还不算数，要在三宝或者德高望重的人面前，说“我决定嫁给你”或者“我决定要娶你”，在这样的前提下结婚。结了婚以后，如果对对方不太忠诚，有了外遇，就会因此下地狱。这种情况下到的地狱是什么样子呢？ 那个地方没有太阳，没有月亮，没有光明，地和天都是乌红色的，到处都好像快要着火了一样。还有很大的声音，就像天上有一千条龙在一起不断地大声吼叫。走一步都感觉整个天地快要倒塌，咳嗽一声都好像整座山要爆炸，所有的感觉都放大了。 进去以后，就会看见一棵树，看起来还比较漂亮。在树下，会听到自己最爱的人在树上喊他：“上来！”他控制不了自己，很开心地向上爬，但是树叶都是刀，双面都是利刃，爬到树顶的时候，肠肠肚肚全都刮烂了。这种刮肠刮肚的痛苦，是人间的一万倍，他就痛得昏倒了。 醒过来以后，刚才树上有什么刀，他都忘了，又觉得最爱的人在树下喊他，就又往下走，然后肠肠肚肚又全部被绞烂。在人间做过多少次对不起对方的事，就会千倍地偿还给因果。 比如在人间做过一次，就要这样上上下下爬一千次，但却死不了，那是命!爬啊爬啊，最后实在没有力气的时候，听到上面的人喊他，他虽然还是有那个心想去，但是去不了，就躺在树下。 这时，树上滴下烧红的铜水，滴到男（女）人的生殖器官里面，全部烧烂之后，他就昏倒了。醒来以后又好像什么都忘了一样。只要想一下，就有铜水滴下来，想一下就滴几滴。如果是男的，就把男人的阳具烧掉，是女的，就把阴道烧掉，就这样很多次很多次。 不是一年、两年，按照我们人间的时间来算，至少得呆一千年，这样的痛苦要承受一千年。不需要吃饭，也不需要睡觉，没有这个概念。下这种地狱就是出轨的果报。 还有一种地狱是对父母不恭敬感召的。 父母天生就是对子女有恩的，如果子女不恭敬父母，说一些特别激烈、特别伤父母心的话，让父母失望，产生了“唉哟，这个孩子死了算了”的想法，对父母做过这样的事情，就会去到一种地狱。 这种地狱，进去的时候是一个很好的经堂，他感觉父母在里面叫他。那时的感觉和在人间不一样，特别渴望父爱、母爱，很想进去。进去之后，经堂里面没有人，有一个大型的经轮在转。 空中一个声音说：“把经轮抬上去！”就听见“特”一声巨响，就是刚才说的那种轰鸣，经轮就被抬了起来。经轮上去以后，他会不由自主地坐到刚才经轮转的地方。 那个声音又说：“按照因果把经轮放下来，放到这里。”那个经轮就往下压，经轮的转轴就会压在他的脑袋上转，把他的脑浆绞得像下雪一样，他就痛得昏倒了。 醒来后又会回到门外，听到里面父母在喊他，就又进去重复受罪一次。在地狱的感觉就是这样，反反复复受苦很多次却死不了。我讲的只是大概，细节的话还有很多。 撒谎，特别是向自己的上师和父母撒谎，这种人会去到一种地狱。在那里舌头被抽出来，有一块田那么大，然后被在上面种地。 整个舌头上面被划来划去，犁得稀巴烂，又出血又化脓。舌头上面又要种地又要被踩，那种痛苦是没有办法用语言来形容的。 这些只是地狱的很小的一个角落。师兄们要记住，死了以后，六道里是没有什么好的地方可去的。唯一好的去处，是你修行好了，可以去净土。去不了净土的话，就只能去六道了。 今天大概讲一下地狱，以后还会讲神仙道、阿修罗道和人间道。去了这些地方，同样也是痛苦，哪怕针尖那么大的幸福都没有。 2012年10月开示 利他明思小家校对整理 相关主题文章推荐 不同状态的生命形态 不能太爱钱，它会要你命 人生中最重要的事情 计划赶不上无常 万事无常，唯有佛法是依靠"}, {"slug": "上师开示/1. 为何修行？/1.2 轮回过患/饿鬼道", "title": "饿鬼道", "content": "饿鬼道 ▶ 播放 饿鬼道 六道里面的饿鬼道，因为各种原因，各种念头，会出现各种形象，这都是他们自己的业力造成的。佛经里面对饿鬼道的形容是比较多，我们很多的修行人也看到过，听到过。其实我们身边就有饿鬼道的人存在，我的姨妈就是这样的人。 我姨妈性情固执，虽说她对佛教大概是相信的，但是可能是她自己前一世的福报问题，有些概念就是转换不过来。我爸爸是一个佛学博士，我的家庭就是一个佛教家庭，我们生下来第一个听到的就是佛教圣号，或者是心咒。即使有这样好的环境，也很难改变姨妈的习气。她已经去世了，我为什么要讲她，是为了帮助你们，而不是不尊重她。 她特别喜欢世间的东西，她没有老公，没有儿女，唯一的亲戚就是我们。她有很多的财产，她有很多的古董，也有很多很多的牛羊。她一个人要是吃，吃一百年都吃不完，穿一百年都穿不完，但是她的心情一直都是活在地獄里，很痛苦。为什么呢？她害怕她的东西被别人抢走、偷走，骗走。 她上锁的时候，都是同时上几道锁，上一道锁，她不放心。晚上，整夜整夜地睡不着觉，只要有一点点动静，她就怕：“是不是有人来抢我的东西？” 她一个人就有三百多头牛，但是只要死一头小牛，她都会哭一天，不是为了可怜它，而是觉得自己少了一头牛。 吃饭呢，80% 是在别人家里吃的，她很少在自己家里吃，因为自己家里的钱要省，吃饭也是个开销，实在没地方去的时候，她只能在自己家吃饭，她就吃得很少。但是，如果是到别人家里去吃，那吃得太多了。我们去给她念经，她是需要念经的，念了一天的经，到吃饭的时间，她说：“快呀，回家吃饭啊！吃好了，再过来念经啊！” 她哥哥，也就是我爸爸，天天跟她讲：“人身是难得的，人生是无常的，你要这么多的财产干什么呢？你死的时候一根针都拿不走的。你死了以后，要是运气好，这些财产属于我的。你为什么不处理一下这些财产呢？” 她说：“你过来看我可以，但是不要动我财产的念头。” 慢慢、慢慢地她变成手脚很细，肚子很大，头很大，脖子很细的样子，真的，就有点像饿鬼道的众生的形象。那个时候，我爸爸又劝她：“你能不能照照镜子啊，你不用听我的，你得看看你自己，你是不是应该转换一下你的思维？” 她还是不信，不肯转换。 有一天，我的一个表弟到尊者法王如意宝那里去。他很担心我们的姨妈会堕入饿鬼道，我们所有的人都很担心她会活生生地堕入饿鬼道。 他对尊者法王如意宝说：“有没有一点办法救救她？她周围所有的亲戚说的话，她都不听，您的名气大，你说一下也许会有用。” 尊者法王如意宝说：“我说了也没用，但是有一个办法，有时候得下狠手。你找一个她去别的地方的时候，不在家的时候，把她所有的财产都捐献给五明佛学院。” 表弟说：“这样行吗？” 尊者说：“行，我做主！” 有一天，我们的姨妈到色达县去了。表弟把她的全部财产都捐献给了五明佛学院，只给她留下了一个碗。捐了以后，她回来一看，什么都没有了，她什么都不说，就坐在那儿。 表弟说：“姨妈，你可以骂我可以打我，但是我的出发点是好的，我不能让你活生生地堕入饿鬼道。我把你的财产全部捐给五明佛学院了！” “啊！五明佛学院啊，没有给哥哥留一点儿啊！” 她这样讲。 “没有。” “哦。” 然后，姨妈啥都没说，也没哭，很奇怪，真的。 第二天，我们就想，她会不会想不通啊，就一直看着她。第二天一早，她很开心地来了，跟大家说：“谢谢你们，我已经轻松了，我觉得好像在监狱里待了二十年，刚从监狱里越狱出来一样。” 然后，从此她就很好了。 真的有这种人，不知道是什么 “愿力”。 2013 年 1 月 3 日开示 相关主题文章推荐 万事无常，唯有佛法是依靠 不同状态的生命形态 不可错过的机会 人生中最重要的事情 死亡是最公平的"}, {"slug": "上师开示/2. 找到智慧的指引/什么样的老师适合你", "title": "什么样的老师适合你", "content": "2013 年 09 月开示 如何选择上师， 是师兄们比较关心的问题， 这也是修行过程中比较棘手的一个问题。前后可能有二十位师兄问过我：“找一个什么样的上师最好？ 找一个什么年龄段的上师最好？ 找堪布好还是活佛好？”当时我没有回答。现在我把我知道的、了解到的情况告诉师兄们。我说的不一定都对，也不一定全面，仅供师兄们参考。 当上师的那种感觉有点像当老师。通俗点来说， 一个人要到学校当老师， 刚开始自己要学习， 达到一定的文化层次， 具备一定的素质， 还要有认证机构颁发的证明， 才能上岗。活佛和堪布们， 如果要当上师，也应该具备这些条件。 要做上师， 首先要完成自己的学业， 经过自己上师或者佛教团体的考核， 合格以后， 得到了大家的公认， 才有资格做上师。从年龄段来讲，二十岁以下不大可能成为上师，因为学习的过程是比较漫长的。 第一， 对一个修行人来讲， 至少得闭关六到七年， 完成好自己的功课。起码该念的三根本心咒要念完， 该观想的次第要过完。在这之前， 要学闻思， 必须得先了解佛教的理论知识， 然后再走实修程序， 闭关、念咒等等。 这个程序， 不见得能一次性通过， 要由自己的上师来看合不合格。 有的人反复做了很多遍， 做了很多功课才成功。做完了以后， 最好是上师亲口对你讲：“你现在可以度人了， 你可以去弘法了。”这种人才可以当上师。堪布也好，活佛也好，都可以。 所以， 你们问的关于年龄段的问题， 除了极个别的情况以外， 其余的， 二十岁以下当上师不大可能， 因为他自己还在上学。有的也许还是逃学出来的呢。为什么说极个别除外呢？ 像第三世多智钦那样， 八岁就可以讲《入菩萨行论》， 这种人就不在其中了， 他生来就具备这样的条件。别的，可能就值得研究了。 活佛或堪布， 找哪一个当上师好？ 这得你们自己选择。堪布， 大多是普通人这一生学出来的， 是学者。他们理论知识学得很好， 也许今生修得也很好。那活佛呢？ 是古佛再来。他们在过去世就已经修行成就，成了佛或者菩萨了， 到了净土以后， 专门来到人间度化众生。两者的概念是不一样的。但是， 找活佛当上师的风险比较大。为什么这么讲呢？冒充活佛的人太多了， 冒充堪布的则不太多。为什么呢？ 道理很明显，越是好的东西越有人冒充， 因为它们越有冒充的价值。像茅台酒、五粮液，这些东西冒充的就很多， 假货很多。江津白酒就不会有假冒的。虽然堪布里面也有很优秀的， 但总体而言冒充堪布的很少。冒充活佛的， 也就是假冒的活佛， 很多。所以， 找活佛当上师， 这方面风险很大， 值得你们去思考。要精心地研究和观察，看看到底是不是真的活佛？ 众生的思维是比较狭隘的， 往往看不大清楚对方是不是活佛。但是你们可以仔细观察： 大德们认可他吗？ 信众认可他吗？ 他所在地区的统战部、宗教局认可他吗？ 其实统战部和宗教局是专门管理活佛和堪布的机构， 对他们各方面的情况掌握得很全面。他有没有什么不良影响？ 他有没有影响力？ 影响力有多大？ 他们虽然不信仰这个， 但这是他们的职责所在， 所以他们了解得很清楚。现在交通又不闭塞， 信息这么发达，你去问一下很简单。如果统战部说他是在册的活佛， 那可能还可以。对于我们没有神通的人来说，这也不失为一种观察的方法。 第二， 可以观察他的各方面言行。首先， 要看他是不是一个好人，这个我们应该能看得出来吧？ 第一是不骗人， 第二是不撒谎， 第三， 至少得不打架。然后呢， 做事比较认真， 比较实在， 不是那种捉摸不透的人。说话也说的都是人话， 不是那些云里雾里的。在这种基础上， 才值得进一步去考虑。 很多人问我：“藏传佛教可以皈依多位上师吗？ 可以在多位上师那里学法吗？ 著作里提到不少大德都是学过很多法的， 这样好吗？”佛法有八万四千法门， 是为不同众生开取的。每个人的性格、状态、福报、年龄和身体状况都不太一样， 所以开取了这么多的法门。你学什么法，要看你适合哪一种。适合显宗、密宗， 还是南传佛教？都可以自己去看。 不过据我所知， 跑的地方太多了不太好。最好认准一个法， 认准一个上师， 跟着他完整地学下去， 这种修行方法比较好。否则， 跑来跑去，今天修一个禅宗的什么禅定， 明天修一个密宗的什么法， 后天又修一个什么什么， 最后自己都搞不清楚自己在做什么。你可以结很多缘， 可以见很多上师， 也可以皈依很多上师， 但是真正学法的时候， 也就是说依止上师的时候， 你应该认准一个自己的根本上师。就好像你可以有很多干爹， 但是只能有一个亲爹。亲爹太多的话可能有问题。修行也是一样的道理。好好去修行， 要认真一点， 不然的话对自己不负责任， 对自己的灵魂不好交代。 笼统地说， 修行方法是这样的： 共同部分的修法， 是可以共同去修的。这个上师可以讲， 那个上师也可以讲， 这是共同的。但是 不共的部分，你和他可能不一样， 他和她可能也不一样， 不专一依止上师没有办法修。 我今天讲的法， 有的对你可能很适合， 但有的也许不太适合。举一个简单的例子， 刚才这个录音， 有的师兄录了， 我跟他说别录， 因为这对他来说不太适合，但对曹原师兄来说是很适合的。一个上师说出来的话，对哪个人适合， 哪个人不适合， 道理跟这个一样。你去餐馆吃饭， 有的人吃辣很适应， 可有的人就不适应。佛法的修行方法跟这个也是一样的，要看对你适不适合？ 找上师也差不多一样的道理。比如， 这位上师跟你适合吗？他的性格，爱好，他的喜怒哀乐，跟你像吗？是你喜欢的风格吗？ 肯定有的喜欢，也有的根本就不喜欢。 我给大家举几个师徒之间没有缘分的例子。比如说，我很喜欢开玩笑，喜欢说笑，不喜欢很多弟子很沉闷的那种感觉，好像明天就要地震了似的，我是不太喜欢的。但是有的上师， 因为众生的苦显得比较沉闷， 觉得大家都很痛苦，这种情况不一样。 讲笑话的时候， 有的弟子很开心，“上师的笑话我喜欢听， 我乐意听。”但有的弟子产生邪见就走了。就是不一样。上师也应该理解他，“他可能和我没缘分。”他自己也应该能够理解上师， 因为上师没有办法度他。 大家都只用修一个法就可以的话， 释迦牟尼佛那么辛苦， 开取这么多的法门干什么？念一个阿弥陀佛阿弥陀佛， 全都念阿弥陀佛就行了呗。很多人认为只要念好阿弥陀佛就会去极乐世界。不一定，不是那么简单的。 要修阿弥陀佛法门的话， 首先需要得到阿弥陀佛法门的灌顶。你需要找到一个合格的上师， 才能给你灌顶。第二， 需要阿弥陀佛法门的传承，而且传承必须得比较清净。如果找一个杂七杂八的传承， 也许你都得不到真正的传承。第三， 需要有完整的修法仪轨， 不然你只是想一下的话，没有那么简单。要修阿弥陀佛法门， 就需要知道整套阿弥陀佛的观想法。另外，还有三种情况会障碍你去净土，没有了这些障碍，才可以往生。所以，阿弥陀佛净土也不是那么容易去的。 每一种修行方法都是这样的。比如说， 有的人， 遇到了好的上师和清净的传承， 看起来他做得很简单， 但实际上他修得很快。这是为什么？他真的得到了真传！ 有的人， 一年四季就看闻思， 看了三十年， 书都翻破了， 还在那儿看。旁边有人问他：“你在干什么呢？”多问几句， 他就会生气：“你干什么！”火气一点都没消下去，这样是没用的。 以前不是说过嘛， 有一个老和尚， 说自己要去修忍辱， 上师就跟他说： “你修忍"}, {"slug": "上师开示/2. 找到智慧的指引/认真对待自己的选择", "title": "认真对待自己的选择", "content": "2013 年 01 月开示 现在很多修行人， 没有一种踏实的感觉。虽说他是修行人， 但是他没有那种找到了依靠的感觉。 佛教带给他好的感觉的时候， 他从来都发现不了， 认为那是自己的本领。但是一旦出现障碍， 全部算在佛教的头上。家里死一头猪，“那是我信仰造成的！”孩子哭了， “怎么我信仰了以后， 孩子都哭了呢 ？”全都算在信仰的头上。他不想一想， 没有信仰之前不会出现这些事吗？ 也不想一想，如果没有信仰，会不会比现在这种情况更严重呢 ? 遇到一些危险和痛苦的时候， 很着急地出现在上师面前， 说： “上师，我是你的弟子， 你认识我吗 ？”那个时候， 我确定他遇到了麻烦。当我解决了他的麻烦后， 他就消失了， 消失得无影无踪。还有的弟子碰到困难来找我， 我给了他一个解决的方案， 也许效果不太好， 他又到别的上师那里去换“配方”，就这样跑来跑去。 遇到危险的时候， 所有上师的名字都会祈祷； 所有知道的念经方法都去念。这个还是一个比较有一点点信心的人。没有信心的人， 关键时候想不起来去祈祷上师。他会去找一个领导， 或者是去找一个医生解决问题。即使他能想起来，也是一种比较不稳定的东西。 念经的时候， 这里念一点， 那里念一点， 到处去念， 最后结果是什么样子，也不知道。就是这种心态造成的。 供佛像也是一样。释迦牟尼佛、莲师、观音（ 菩萨）、文殊菩萨、地藏王菩萨、弥勒菩萨、金刚手菩萨，供了许多的佛像。 我的一个弟子， 我去他的佛堂一看， 上面摆了不认识的很多像。他说： “这是伊斯兰教的， 这是基督教的， 这是什么什么教的……”我说： “你 摆那么多， 干什么 ？”他说： “一个教派救不了我， 总有一个教派能救我。”这是事实啊，好多师兄都有这样心态。 其实全球转一遍， 除了他的上师以外， 没有别的佛。 他得罪了他的上师，其实就是得罪了整个他所说的佛，他都不知道。所以，心态要调整好。 有时候你想去接另一个上师的法， 你去请示自己的上师开许。也许你的上师会装成不开心的样子， 不同意你去。其实上师这样安排是有密意的。这时， 你可以停一会儿， 心里默默祈祷：“将来我能成为这位上师的弟子”，就行了。 诸如此类的这些事， 我们都要仔细地考虑清楚， 不然的话， 修行就会出现很多障碍。 修行没有进展， 原地踏步， 都是因为之前我们没有考虑清楚的决定和行为带来的障碍。 本来你是个清净的弟子， 你的修行不可能没有进展。但是， 只要在任何一个方面有点不清净， 就会影响你的修行。不但影响你，还会影响集体的修行。 所以，师兄们在做一些决定之前，要好好考虑一下。 你对一件事情不认真的话， 其实对所有的事都不会认真。你一旦认真一件事情， 有可能对所有的事情都认真。所以， 不要养成这个坏习惯，什么事情都不认真， 那不太好。师兄们， 修行要认认真真地去修。信仰是自己选择的，不是哪一个人逼迫的。 我很开心， 看到你们有这样一个发心去学佛， 有这样的福报和根器，这是值得随喜的。但是这个学佛的机会， 就像比较危险的胎儿一样， 很容易会流产， 而且 到最后， 情况就会更加严重。所以每时每刻你们都要祈祷三宝： “我的这个发心不要变， 永远成为一个根深蒂固、坚不可摧的修行人。” 刚开始， 共同修行部分， 请起来也很简单， 修起来也很有信心。修着修着，有些人可能就对自己没信心了。 要对自己有信心。有的修行人说：“我可能不行哦， 上师， 我很差劲的。”你以这种状态去修可能不太好。“ 我一定行！不管我遇到什么困难，我保证在什么时候， 修出我自己需要的境界来。”要有这样的决心才能修得出来。修行人就需要有这种精神。"}, {"slug": "上师开示/2. 找到智慧的指引/选好你的“救命稻草”", "title": "选好你的“救命稻草”", "content": "2012 年 09 月开示 选好你的救命稻草 ▶ 播放 今天晚上我们讲一下怎么入佛门。其实我对老弟子已经讲了很多了，有的弟子甚至可以背诵下来了， 但是执行了没有？ 这是另外一回事了。有的弟子刚来， 还不太懂， 只是对佛教有兴趣， 去过很多地方， 但是真正的修行是个什么程序， 还没有搞清楚的人比较多。所以这个多说几次没有坏处，只有好处。 佛教有三大语系： 南传佛教、汉传佛教和藏传佛教。而我们属于藏传佛教。藏传佛教也有很多教派， 每一个上师和每一个教派的修行方法和修行程序， 以及上师调整弟子心态的模式不太一样。我今天是按照我们龙钦心髓调整弟子心态和调整弟子修行的程序去讲的。 入门的先决条件 入门是什么呢？ 你是不是一个佛教徒， 取决于有没有皈依， 别的什么都不算。你没有一个正规的皈依， 光有丰富的佛学知识， 你只是个学者，还不算是修行人； 你见过一千位上师， 只能说你对佛教有兴趣， 还不算是佛教徒。别人说你是什么佛的转世啊， 罗汉的转世啊， 怎么说你都没用，你还不是佛教徒。是不是佛教徒取决于皈依。皈依是什么呢？ 就是皈依三宝：佛、法、僧。藏传佛教还有一个皈依上师，是四皈依。 对于皈依的程序， 一定要清清楚楚， 明明白白， 不能盲目地去皈依。现在我们有一句话叫“跟风”。比如说， 一个大德来了， 你搞不清楚他的来历， 也不知道他是什么教派， 也不知道他在哪里学过佛法， 也不知道他有多大的成就，“哎呀，很多人在皈依，管他的，我都皈依了。” 皈依以后该做什么？ 很多人都不知道。皈依完了回来， 照样杀生，照样去拜一些不该拜的宗教。倒不是明知故犯， 是他不懂。所以皈依的时候， 一定要了解得清清楚楚、明明白白： 你皈依的是哪一位上师？ 这一位上师的教派是什么？ 他在哪一位上师那里学过佛法？ 他的佛学知识怎么样？ 他的上师对他的评价怎么样？ 他在师兄弟当中的口碑怎么样？我们没有神通， 只能通过这些人的行为来观察。除此之外， 还可以去当地的政府机关了解一下。虽然他们不信佛， 但是哪一位是大德， 哪一位在老百姓当中有威信，他们调查得很清楚。 选择适合自己的传承 皈依之前， 第一个要选择的是教派。比如， 你是属于哪一个教派的缘分？汉传佛教、南传佛教、藏传佛教？这里我大概说一下。 汉传佛教大部分是显宗。显宗的很多法门都是靠自己去悟， 比如念一个阿弥陀佛， 有一天悟到一个道理， 认为自己成佛了， 但这是不是佛的果位还很难说。现在是末法时代， 能修出这样的果位也很不错。如果你是这种缘分， 要什么样的条件才能达到这种果位？ 第一个， 你前一世的根基很好； 第二个， 现在你对佛教很有信心； 第三个， 你持续修行的忍耐力很好。这种人才有点适合去修显宗。这种修行方法， 一万个人去修，有可能有两三个人悟到道理，但其他的九千九百九十几个人怎么办呢？ 南传佛教属于小乘佛教， 修行的方法以苦行居多。比如， 吃得很差，穿得很破， 什么都不要， 在没有干扰的地方打坐， 等等。他们在修一个静心的基础。能够把心静下来也是很不错的， 但是你能吃得了这个苦吗？要好好想一下，自己去想。 藏传佛教， 有的人说是贵族血统的佛法， 有的人说是一个快速成就的法，有的人说是很危险的法，我觉得这三种都说对了。 为什么说是贵族的佛法？在过去， 藏传佛教只能在汉地的皇宫里传，老百姓是不允许接受的，可能有这样的因素，才被说成是贵族的佛法。 它也是个快速成就的佛法， 有很多方便， 有多种方案， 能很巧妙地抓住修行人的心态。有的上师有对症下药的能力， 而不是采取“一刀切”的方法。“一刀切”是什么呢？ 就是不管怎么样， 你们都得修一个法， 大家一起修， 都是一个规格。藏传佛教不是这样。每一个弟子的心态，每一个弟子的智慧， 每一个弟子的根器， 每一个弟子的寿命和福报不一样， 所以上师给你给的功课到最后都不一样， 这个要取决于上师。如果选择的上师不合格， 就像选择了一个很差的医生， 他找不到你的病根， 再怎么给你治疗都没用。如果选择了好的上师， 那就是选择了一个很好的医生， 他会对症下药，对你的修行很有帮助。 就这三大传承， 要自己去选，选一种适合自己的。我的建议是学藏传佛教， 为什么呢？现在是末法时代， 人类生存的条件很少， 死亡的因素很多。今天哪怕是吃一 口饭， 里面也有很多因素可能会让你短命； 你吸一口空气， 可能就有很多因素让你死亡； 一个念头也可能会让你很快地衰老， 这是末法时期的特征。在这种状态下， 我们有没有时间去修一些很漫长的法呢？我觉得不太可能。 现在我们汉地的修行人、居士， 按比丘的规格去修行的很多。 比丘的规格是什么呢？ 要学完从菩提道次第广论到后面的五明功课， 学完了以后， 再学大幻化网， 再学中观， 再学大圆满， 再学一个脱嘎。他们会制定这样的计划， 而且完全按这样的规格去修行。这个规格不是不好， 但是要看适不适合你。出家人是怎么修行的？ 除了吃饭睡觉以外，他的职业就是修行， 没有别的事情。早上六点到晚上十二点， 吃睡以外，都在专修。他花的时间和你花的时间， 你要算一算。你还要生存， 你还要赚钱， 你还要养孩子， 你还要伺候老公， 你还要看单位的脸色， 你还要看领导的批文。我讲过很多次了， 像我们这样的修行人， 生存时间，你们去分析一下， 长的大约也就是三万多天， 除开睡觉的时间， 大概也就两万多天； 除去小时候不懂事的时间， 稍微懂事一点上学的时间， 然后谈恋爱、结婚生子、工作， 你的孩子生了孩子你当保姆的时间， 算起来你有多少时间拿出来修行呢？ 这些时间和出家修行人的时间对比一下，你觉得按比丘的规格修行现实吗？这点账谁都会算。现不现实？不现实。 选择与你契合的老师 那不现实怎么办？ 只有一根救命稻草一一靠上师， 你要选择一个好的上师。 只要选择好了上师， 你不要用商业的头脑， 不要用世间混杂的心态去想他， 他绝对有能力度你到极乐世界。 选好了上师， 哪怕他让你喝酒、抽烟、杀生都不用害怕。为什么这么说？ 那诺巴和帝洛巴的传记你们是看过的。那诺巴跟随帝洛巴三年， 这三年当中他没看到过帝洛巴一次“上师”的行为， 他为什么成就了？是弟子的信心和上师的加持力。让他干什么？ 钓鱼、偷东西、骂人。还有米拉日巴和玛尔巴， 你们也看过这个光碟， 看过他的历史。第一次师徒相见的时候， 玛尔巴在那儿种田。像我们这种众生， 可能一看见就没有信心了， 你一个上师种什么田呢？ 一边放着一个很大的酒坛， 一边在种田， 一见到米拉日巴：“哦，你来找我是吧？ 想让我当你的上师， 你把这个酒喝了。”米拉日巴毫不犹豫地喝下去了。喝完了以后， 玛尔巴说：“这个该我种的田， 你帮我种完再说， 我可以收你做弟子。”他种完田一回去， 玛尔巴全部不认账了 : “什么时候说过收你做弟子？我还有一个要求。”什么要求呢？ “我有很多仇人， 我听说你的咒法很好， 去把我的仇人杀了， 杀完了我收你做弟子。”他很开心地去施放咒术， 咒死七个人， 回来后很开心地说： “上师， 我能当你的弟子吗？”“杀人魔王， 我怎么敢收你这个杀人魔王呢？ 你有这么大的罪过， 我什么时候让你去杀生了？”诸如此类， 很多很多。你说这些不是修行吗？所以， 我刚才说了， 只要你选对了上师，他让你念咒你就念咒， 他让你磕头你就磕头，"}, {"slug": "上师开示/3. 心态决定命运/一切从心开始", "title": "一切从心开始", "content": "2013 年 01 月开示 心的力量不可思议 轻松一下啊，讲个故事。 以前有几个强盗， 到处去抢东西杀人。其中一个强盗看见有一个和尚在山洞里闭关， 就跟他说话。和尚不回答强盗的问话， 只是乐呵呵地坐在那儿。强盗想：“你这个和尚怎么回事？到底死了没死？跟你说话也没反应， 我倒要看看你有没有反应！”于是， 强盗一刀把和尚的头割了， 头掉到了地上。然后强盗就走了， 继续到处抢劫。 一年后， 这个强盗听说附近一个村庄里有人在传法。他就过去看看传法是怎么回事。一看，“哎哟！”当初那个被他用刀砍下头的和尚正在那儿讲课。“不可思议啊！ 这个和尚真是功夫不浅啊！”强盗想：“虽然我不信佛，但是我得学学他这种本事。” 于是他就跪在那个和尚的面前：“上师，对不起！我得罪过你。” “什么时候啊？” “去年你在什么什么山洞闭关的时候， 我一刀把你的头砍下了， 现在你居然还可以传法，太厉害了！” 和尚说：“真的吗？” “真的！”强盗说。 只听到“嗙”的一声，头掉下来了，和尚圆寂了。 之前和尚还不知道别人砍过他的头。在当时那种境界下， 他是感觉不到被砍头的，要是不说的话，他可以继续活下去。 这就是念头，什么都是念头造成的！ 还有一个故事。 一个人被绑架了， 他们吓唬他， 用黑布蒙住他的眼睛， 什么都看不见，捆在椅子上。然后用一个东西在他的动脉上擦了一下， 身边再放一个茶壶， 里面的水往地上一滴一滴地流。过了一段时间， 他们故意在他边上说： “血要流尽了。”他一听就觉得： “我完了！”再过一会儿， 就没动静了。他们把蒙眼睛的黑布去掉， 一看，他已经死了。其实他们什么都没做。 四川省骨科医院的一个主任医生（ 现在还在四川）， 他有一个病人粉碎性骨折， 去他那里开刀做治疗。开刀的时候， 护士跟这个医生说： “骨头碎成这样， 可能永远好不了了。”手术很成功， 可一段时间后病人一直好不起来， 比他严重的病人早就好了， 他还是好不了。医生觉得郁闷啊：“为什么？ 什么原因呢？”他就在自己的办公室里走来走去， 冥思苦想。走着走着， 他想看看理论方面的书， 于是随手在书架上拿了一本，是我们东珠仁波切写的《西藏医心术》， 这可能是缘分啊！他一看： “哦，什么都是心灵造成的， 心灵可以治病。”其实那时候他一点都不信佛，但是他看到这一点就想：“我得看看这个有没有道理。”然后他想起了手术台上护士说过的那句话， 啊！ 那天可能是护士的那句话说错了。于是他对这个病人说：“重新做手术， 重新治疗。”然后把病人重新推进了手术室做手术， 其实做手术是假的。到了手术台上， 他就假装给病人开刀， 其实什么都没做。然后医生故意在病人的耳边说：“这次太成功了！肯定会恢复得很快！”之后这个病人一下子就好得很快， 恢复得相当好。从此以后，这个医生就信佛了。 全世界的医生能治好疾病的概率是多少？ 最好的医生能医治百分之 三十、 百分之七十是靠自己的心理状态去治疗的。按真正的医学来讲，连一个感冒都治不好的。你们的上师学过兽医，生命都是一样的嘛。 其实， 所有的问题都是自找的， 不是外在的东西， 外在是没有东西的。你所谓的外在， 山山水水啊、房屋啊， 你看看， 用一面镜子就可以把它们都装进去。这么小的一面镜子都可以装整个上海， 你说它实实在在有的话，能装下吗？装不下的！没有，才能装得下！ 我们有各种各样的显现， 整个地球都可以装在我们的心里， 这就证明外在的东西是没有的， 有了， 你装不下。如果实实在在有的话， 不要说地球， 就是我的手都装不下， 知道吧？只是这么讲， 我自己还没感觉到。 科学是什么？ 科学研究的成果是什么？ 其实都是想出来的。对一个东西专注的时间太长了， 自然会出现一个结果。包括气功， 他观想一个气体，观观观观，最后来了。 （ 一师兄问： 那上师我们坚定信念会成佛， 那就一定会？） 当然啦！一定会！ 师生之间的信任 现在我们坚定信心是比较困难的， 就要从这个上面去下功夫， 慢慢去做。 比如说， 我是你的朋友， 我信任你， 你得珍惜这个信任， 你不能浪费它， 你学会珍惜我对你的信任， 你也会成为一个说话比较算数的人。如果你连这点都没有， 你想成就那是很遥远的， 真的。我信任你， 借了你一千万， 第二天你就跑了， 这种人是修不出来的。我信任你， 借了你一万块钱， 你如实地把一万块钱还给我， 第二次你再想借就很容易了。 但是你这一万块钱不还， 第二次你就没有这个机会了， 你的机会就是这样慢慢慢慢减少的。现在我们很多人没有朋友， 没有信得过的人， 其实都是自己造成的，不是别人。 信仰也是一样， 从小事情去做。不管别人怎么样， 你得信任别人，别人信不信任你， 那是另外一回事。现代人就是不珍惜对方的信任。我们师徒关系还不是一样？ 我信任你（ 弟子）， 你信任我（ 上师）。我信任你了， 你不信任我， 那不就浪费了嘛。弟子再虔诚， 上师对弟子不好，弟子也得不到什么加持。 我们之间的一股力量是什么？ 就是信任！ 哪怕伤害自己， 我也绝对不会伤害我的弟子， 作为上师就要有这种想法； 作为弟子， 你应该想：哪怕失去我的生命， 我也不会伤害我自己的上师。这就叫“信任”， 也可以叫“信心”。 学会忍让与奉献 “信心”长大了以后就会有菩提心， 利他， 最后找不到自己。你常常想到利益别人，这才是真正的菩提心。 比如说， 那天我要算卦， 算卦的时候有师兄递上来一串念珠， 我说： “不要， 用我自己的念珠更好一些。”那位师兄的脸色就变得很难看。这么一点小事就能看得出来，你的信心没有培养出来。如果有更大的事情，你是不会去照顾别人的，只会为自己考虑。 又比如说， 一个女孩坐在你身边， 如果你为了自己开心， 用语言和动作去骚扰她，只顾自己的感觉，不顾别人的感受，这就是自私。 刚开始谁都有“我执”，不可能没有“我”，但是要学会一点点淡化自己。其实你对别人好就是对自己好， 你对自己好过头了就是对自己不好， 到最后一个朋友都没有了。凡事要学会忍让， 不要事事都考虑自己。吃顿饭也考虑自己，看个电影也考虑自己。这些小细节都有修行的状态啊！ 对于法也是这样。我没试探过， 也许要试探一下， 我就说：“在场的有十个人能得到最珍贵的法， 别的人得不到， 谁来？”那肯定哪一个人就第一个跳出来了：“我！ 走一万个人我都不在意， 只要我在成就人的名单里面！”其实你这种行为在上师心里， 你才是第一个该走的人。上师不太喜欢这种人，真的。 师兄们学会奉献， 学会吃亏， 学会忍让， 把自己变得低一些、把别人举得高一些， 这样的弟子才是优秀的。我们修行要从人品做起， 没有人品的基础做不了事。我那天都说过， 人品不好就跟大蒜一样， 什么样的原料都盖不住那股臭味道。人品不好，修什么样的法都很难调整。 你看我们的师公， 今年八十八岁了， 他从来都没有考虑过自己的亲戚朋友。他是不是没有感情？ 不是， 肯定有！ 但是他优先考虑别人。每一次我都看到他的亲戚朋友就在那里等候， 在草滩上等候， 晒得流汗。从来都没见过他的亲戚朋友有谁可以优先进去拜见的， 没有， 跟一般的信徒一样。 师公从来都没有说过： “今天我休息一下， 我要看一下家人。”没有！我从来都没有听见他说：“我没鞋了， 我要穿一双好的鞋。”“我今天生病了， 师兄们等一等， 我要去"}, {"slug": "上师开示/3. 心态决定命运/发一颗无私的心", "title": "发一颗无私的心", "content": "2013 年 01 月开示 来自师公的教诲 有那么一段时间， 我想远离智钦寺院， 回五明佛学院待着， 什么都不想管了。 当时， 第四世多智钦已经成了我的上师， 他对我说： “你为众生做事， 你为寺院做事， 你为了自己的上师高兴而做事， 这全都是修行！ 如果你连这一点点的觉悟都没有， 我不知道你在五明佛学院待了六年半，是为了什么？ 难道是为了你自己的解脱？ 为了一种比较轻松的感觉而待在那里吗？ 如果你是这样一个修行人，（ 修行） 实在是没什么意义！ 你能不能想宽一些， 为了别人； 你能不能再想一下， 为了对你有期望的人；再想一想， 为了对你的名字（多智钦） 付出的这些人， 做一点贡献呢？” 听了上师（ 第四世多智钦） 的话， 我又继续在智钦寺院待了下去。虽然我在智钦寺、“活佛界”干得不太好，但这是上师的意愿，我必须得听！ 藏传佛教中， 你的“悉地”的来源， 你的一切的一切的来源， 都来自于你的上师！ 你要是不听上师的话， 你说你是个修行人， 那就是一句空话！ 拜师前要谨慎观察 在座的各位都是对佛法有信心， 都相信轮回， 相信佛陀的话， 才到这里来； 大家都觉得信仰很重要， 才到这里来。不然的话， 我们不可能聚在一起。 你们现在见到的这个上师（ 上师指自己）， 第一， 没有戒律， 我说的是没有显宗的戒律； 第二， 凡是“人”喜欢的， 我全都喜欢； 第三，我不会做生意， 不会发钱， 也不会治病， 这些我都不会。按照藏传佛教的传统来说， 弟子在皈依一位上师前， 要观察这位上师三年， 所以你们要观察清楚后，再决定要不要皈依我。 皈依前，你要观察好你修行的对境。 你要修什么样的法？ 我们佛教有三大体系： 南传佛教、汉传佛教、藏传佛教。你对哪一种法有信心，你自己要想好。 有些师兄会说： “听说藏传佛教很神秘， 修起来很快的哦， 还听说他（ 龙洋仁波切）的法是比较齐全的。”如果你有这种兴趣的话，那接下来，你要弄清楚第二个问题。 第二，藏传佛教的“重中之重”是什么？ 藏传佛教的“重中之重”就是“传承”。那它有多少个教派？ 一个教派又有多少个传承呢？ 第三，在众多的传承中，最清净和最接近的传承是哪一个？ 当你发现了这个最清净和最接近的传承之后，又面临第四个问题。第四，这个传承里的上师有很多，最好的是哪一位？ 什么叫最好的上师？ 就是得到这个传承， 或者说是这个传承的持有者，这样的上师才是最好的。 修学要一心一意 你找到了这样的上师后， 还得去进一步了解一下， 这个上师的脾气怎么样， 语言怎么样， 年龄怎么样， 学习成绩怎么样， 闻思和实修怎么样？这是你生生世世的一件大事， 要是不认真对待的话， 就是对自己不负责， 也是对你所有的后代不负责。所以皈依之前，你要了解清楚，想清楚。 最终，你确定要追随这位上师，你要有一种：“啊，我决定了，就是他！打死我也不会放过他！”真的， 要有这样的信心。不管他的名声是怎样的，也不管他的地位是怎样的，你就是要跟定这个上师。 下定决心后， 你就得想方设法得到他的摄受。有些上师很容易摄受弟子， 有些上师不轻易摄受弟子。世间法上， 为了得到一个项目， 有些人花了多少心思； 为了得到一个公务员的职位， 又花了多少心思； 为了得到一个好老公， 又花了多少精力！ 我觉得这些都是小事， 真的， 对一个修行人来说都是小事。 为什么说这些都是小事呢？ 因为你这辈子最多活三万天。我们分析一下这三万天。小的时候， 你有权力做自己的事吗？ 没有！ 太小了， 你没有能力做； 稍微有一点能力的时候， 父母和学校管着你； 到了中间，你要听家人的， 或者要听领导的话； 等你老了， 又要伺候你的儿女。所以，你想想看， 在这个三万天里， 有多少时间是你可以自由支配的？ 而且这个三万天里， 还有一万天你是用来睡觉的。除开这些， 你有多少时间去做一件重要的事呢？ 一辈子这么短暂， 你也要精疲力竭地挣扎， 为什么你不为你生生世世的大事去挣扎一下呢？你要是没有这样的信心， 那你根本不是修行人，只能叫“赶时髦”。“哦， 听说有个修行， 什么叫修行人呢？就拿个念珠，嗯嗯嗯（ 念咒声 ）……”你也这样做一下。但是实际上， 你的心里没有想到怎么去修行， 没有想到什么叫作死亡， 什么叫作恐惧， 什么叫作轮回，什么叫作轮回的痛苦， 你没想过！ 只是像换一件衣服一样， 今天大家都在穿牛仔裤， 我也穿个牛仔裤。明天大家都在穿西裤， 我也去穿西裤。但是你从来没想过这些牛仔裤和西裤对你有什么用？ 只是别人怎么做，你就跟着这么做， 这不叫“修行人”， 这叫“跑跑居士”！这叫“赶时髦”！ 如何开一个好头 修行最重要的不是要去见多少个上师， 不是要去念多少个咒， 也不是要去放多少个生，做多少个佛事，而是要有正确的发心。 这就好比你想种菜的话，首先要把你那块地做好。没有一块良好的地，你做什么都是空的。空中种菜， 我不信！ 没有地基的房子， 我始终认为是很危险的！ 不是说见了很多上师不好， 肯定好， 他们都有他们的加持力！但是这是一个修行的程序，修行必须要有“次第”！ “次第”怎么去做呢？ 就是要把“头”开好。第一步做好了， 步步都是好的； 第一步走错了， 步步都是错的。如何开一个好“头”呢？ 就是要有一个广大的利他的发心。比如说你去参加一个大规模的放生， 有几百几千人的放生， 你是为了什么去放生呢？ 你的发心是什么呢？ 有的人是为了长寿去放的， 有的人是为了身体健康去放的， 那个发心也太狭小了！ 有的人会说：“福报攒不下呀， 病越来越多， 身体越来越不好， 财 产越来越少。”你说这个话的时候， 你不觉得你自己的发心错了吗？ 我们佛教修的是什么？ 修的是来世， 而不是追求今生， 师兄们要想好。今生修行可能有好处， 就像你要种一朵花， 旁边的那些叶子自然会产生，但是你的目标不是叶子， 而是漂亮的花。你天天去看这个叶子是没有用的。所以第一步要走好！修行最重要的第一步就是如何发一颗利他的心。 今天讲的这些都是我自己的亲身体会， 也是每个修行人努力要做到的。"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/亲近师父的礼仪", "title": "亲近师父的礼仪", "content": "2010 年 11 月开示 上师路过的时候， 如果你站在比上师高的地方， 要马上跑到低处，恭敬地低头，等上师走过。与上师在一起，自己的位置不能比上师高。 如果一位真正的出家人经过你身边， 你不理他， 会有损你的福报。按照藏族的习俗， 见到出家人如果戴了帽子要揭帽子； 如果没戴帽子可以欠欠身，让他过了你再走，不能并肩而行甚至越过。 拜见上师的时候， 要先问侍者， 上师是否方便， 上师同意之后才能去见， 不能不打招呼。见任何一位上师都是这样， 否则对自己的福报有损害。 进上师的门， 必须先轻轻地敲三下， 然后才可以进， 不敲门直接进是不礼貌的。 拜见上师的时候要面带笑容， 以一个恭敬和清净的心态来拜见上师。不能以痛苦或丑陋的面孔去看上师， 这对自己来世的容貌不好， 下一世可能会长得很难看。所以，尽量以笑容来见上师。 现在很多人在上师面前是两个膝盖都着地， 其实真正的跪法不是这样，应该右膝着地，然后坐在那儿，合掌恭敬。这可能跟大家习惯的不一样，但真正的跪法就是这样。 见过上师以后，先往后退三步，然后才可以转身，直接转身不好。 跟着上师走的时候， 在没有危险的情况下， 要走在上师的左后方，跟上师合影、一起坐的时候都是一样。如果上师让你坐在右边， 那没有问题，但是没有开许之前，你要在左侧。 乘电梯下楼的时候， 你要先下， 然后上师再下； 上电梯的时候， 如果前面没有危险， 上师先上， 然后你再上。上下楼梯也是一样， 不能跟上师同上同下。 不能故意踩上师的脚印和影子， 踩了的话， 九世会变成穷人。这个规矩我觉得还是懂一点好， 否则别人会说“龙洋活佛的弟子， 连这些规矩都不懂”，那就不好了。 有次我去唐山， 当时我的一个师兄， 也是一位活佛， 在他的弟子家里，打电话让我过去。过去以后， 看见他的一个弟子跟上师平起平坐， 跷着二郎腿， 抽着烟， 还说“这是我的上师”。和我一起去的一个弟子就提醒他说： “既然是你的上师， 你不可以下来吗？”他养了很大的一只狗，也跟上师并排着， 他还说“这是我的狗”。这位上师可能有点不好意思，就用藏语说： “请谅解， 他可能不太懂。”这个弟子的做法其实不太好。 上师讲经说法的时候， 你必须调整好自己的念头， 不要胡思乱想。比如去哪里做生意， 哪里的商店赚多少钱， 哪里去买个菜， 不能这样，要聚精会神地听。 拜见上师的时候不能抽烟， 不能喝酒。你要是喝了酒、抽了烟， 让这些味道熏到上师的话，你几世都会成为有体味的人。 进入佛堂、经殿， 必须得脱鞋、揭帽子， 不然的话来世会变成畜生，像牛一样，角和蹄子是取不下来的。这些微小的细节要注意。 见上师的时候身上不能有刀剑、凶器及有毒气体。如果有的话， 要放在门外，否则对自己不好。 声音小一点，不要大声地笑，也不要高声喧哗。想笑的话，最好捂着嘴，以免你的口水喷到上师。打喷嚏也要遮挡一下。 藏族人的袖子很长， 他们见到上师的时候会把袖子背在肩膀上， 然后把帽子摘下来。 如果你骑自行车， 上师从你身边路过， 你必须得下车， 把车子停放在那儿等上师过去。坐车的时候， 如果从上师身边经过， 要把车停在路边，下车等着上师先过去， 不能把车直接开过去， 不管上师。否则， 对上师没什么，但对自己的福报有损害。 见上师的时候， 穿着要整齐、得体、美观， 最好戴上一些首饰， 比如漂亮的戒指、手镯、项链、耳环， 还可以化化妆， 你不需要掏一分钱，就在上师面前做了很好的供养。荟供、念经、参加佛事活动的时候， 也要尽量打扮得漂亮一点。如果打扮得很丑， 在上师面前不修边幅、随便穿戴，可能不大好。 这些东西呢， 可能不是任何时候都有必要。比如像我们这样， 已经很熟悉了，都是一家人，也没有必要那么客气，但是最好了解一下。 像我， 在你们面前随随便便的， 但是见上师的时候肯定不会这样。袈裟都整整齐齐地穿好， 然后头发理了、指甲剪好了去见。平时我也吃葱蒜， 但见上师的时候， 我不会吃。几个小时、几天或者几个月， 凡是有臭味的东西我都不会吃。"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/依止弟子与心子", "title": "依止弟子与心子", "content": "2011 年 08 月开示 什么才是“依止弟子” 藏传佛教中皈依的概念是什么？ 皈依是一个宣誓， 宣誓皈依三宝。在这方面， 藏传佛教和汉传佛教有什么不同之处呢？汉传佛教是三皈依，藏传佛教是四皈依， 藏传佛教加一个上师。藏传佛教认为： 上师是所有佛法僧三宝的总集。所以你皈依了上师就皈依了三宝。 戒律， 我们师徒之间不是有一个戒律吗？ 皈依之后， 师徒之间就产生了皈依的戒律，但这里没有包含三昧耶戒。三昧耶戒产生的条件有三个：灌顶、窍诀、密续， 三者之中得到任意一种， 你和上师之间就产生了三昧耶戒。 上师收弟子的时候， 皈依这一步， 佛教的大门是敞开的， 有缘分的人都可以进来。但是选择“依止弟子”就不同了。“依止弟子”是什么？就是学法的人，真正学法的人。 皈依好像没什么关系， 虽然对上师来讲， 弟子多了也不是什么好事。对弟子来讲， 真正的上师、真正的大德， 多皈依几位也没什么。所以，“依止”和“皈依”的概念不大一样。 汉传佛教是很重视皈依仪式的， 皈依了以后就是他的弟子。在藏传佛教里， 可以去皈依某一位上师， 但是皈依了以后， 他不一定是你的根本上师。他只是把你领入佛门的介绍人， 是你和佛教之间的一座桥梁。进入佛门之后，你怎么选择，需要根据自己的缘分来决定。 藏传佛教中， 不太单独强调皈依的仪式。你只要认准一个上师， 传某一种法的时候你就有可能皈依了： 第一， 上师念皈依境的时候就包含皈依； 第二， 上师赐予灌顶的时候， 第一个灌顶的仪轨里面， 前几句就有皈依。所以，不一定需要专门做一个皈依的仪式。 有的人会说“我是某位上师的弟子”， 他说的其实是皈依弟子， 但藏族人一般会以为你这样说的是你的根本上师。为什么呢？ 如果是根本上师， 你在上师那肯定学了很多， 而不只是在那里瞟一眼、说几句话、皈依一下就走了。你们可以去看， 你要是说自己是一位大上师的弟子，那大家就会很敬佩你。为什么呢？ 大家知道， 这位上师不会轻易接受谁当他的弟子， 你也不可能轻易就成了他的弟子。所以你既然是他的弟子，那肯定跟他学到了东西。就好像说你是清华或者北大的学生， 那大家都会认为你的文化很高。如果你说“我是某某上师的皈依弟子”， 他们就认为你刚入门， 只上过小学一样， 但要说是你的根本上师， 那他们就觉得你是真正的弟子。这两个概念的差距是很大的。 师公是完全没有汉化的一位上师。在他的眼里， 没有什么单独的“皈依”仪怯。你们见过他专门给谁做皈依仪式吗？ 没有！ 我和他接触了那么多年， 没见过他有皈依的要求。如果有人说：“我想皈依。”师公就念几句皈依有关的经就完事儿了， 没有什么其他的了。但是我们这种人，已经汉化了。如果你说想皈依， 我就给你做皈依， 发皈依证， 按照汉传佛教皈依的套路去做。我这个皈依的程序是在显宗的基础上拿出来的。 其实皈依是什么？ 从灌顶的那一天开始， 你就皈依了佛门， 也皈依了密法， 所以这种感觉是不太一样的。我在汉地有很多弟子， 皈依弟子很多， 但真正跟我学法的人没有那么多， 我肯定不会不负责任地乱收不认真学法的弟子， 这样的话我自己业上加业。要通过考验、经过审核，经过严格的程序， 才能成为我的依止弟子。不然的话， 你连戒律的概念都没有， 我收你干什么？ 我欢迎你学佛， 欢迎你进入佛门， 这是我们学佛人一贯的态度，但是怎么学、怎么修，就要看你自己了。 总有一天，他会闪闪发光 我们传承在很多地方都有自己的道场， 有很多弟子。但我的依止弟子有哪些， 你们谁都不知道。藏传佛教就是这样。一般人看来， 在大德身边的， 谁都像心子。但是真正来讲， 到底哪一位是上师的心子， 谁都不知道。就算上师说“这是我的心子”， 也不一定真的是。比如法王如意宝， 在江玛佛学院求法的时候， 他的上师托嘎如意宝说， 和法王如意宝一样的弟子， 甚至表面上超过他的多得很。托嘎如意宝从来都没有说过法王如意宝是他的心子， 倒是每次都会赞叹某某活佛， 说他如何如何了不起，对法王如意宝的事却什么都没说。 只有一次， 大家认为法王如意宝不好好学习、不努力， 睡觉的时间太长了。大家都在学习的时候， 他还在睡觉， 大家就给上师提意见。某某堪布说： “上师， 他这样睡觉能行吗？ 他在这里不好好学习浪费时间不好吧？”那一天， 托嘎如意宝只透露了一点：“他睡， 你们不用管；他起来， 也不用管。你们自己学好， 不用管他。但是我认为， 你们要是能学到一点他睡觉的那个姿势都不错了。”除了这一句， 什么都没有说。但最后你们看看， 托嘎如意宝所有的弟子里面， 对佛教贡献最大的是法王如意宝。这个时候才知道托嘎如意宝当时那句话的含义。而他天天夸的那个活佛，十年过后就圆寂了，对佛教也没有多大贡献。 在五明佛学院， 大家都说这个是心子， 那个是心子。我在五明佛学院呆了较长的时间， 真正是在上师身边度过的。不是因为我很好， 而是我喜欢玩， 上师去的地方多， 我就跟着他跑， 所以跟上师最接近。在这段时间里面，我真的没有发现上师真正的心子是谁。 上师有时说“慈诚罗珠很好”， 有时说“丹增嘉措很好”， 有时说“索达吉很好”， 有时候说“龙多活佛很好”， 有时候说“里郎曲吉尼玛活佛很好”。但有一天， 上师说： “我的代表、我的继承人、我的心子，明天就要坐床了，要举行坐床仪怯。”大家就都期待着，推测可能是谁谁谁。结果是什么呢？ 就是一本书！ 仪式上佛教音乐吹响， 请什么什么上去，结果一看，是他自己写的一本书一一《21 世纪学佛人的 ***》。 直到现在， 我们都不知道谁是他的心子， 但相信一定会有很多心子。一个上师不可能没有心子， 为什么呢？ 因为他要把压箱底的最圆满的法传给他的心子。心子不一定只有一个， 也许为了保险， 会有两个或三个。如果只有一个， 他寿命遇到问题的话， 法脉就中断了， 所以肯定会有两三个或者是更多， 具体就不知道了。比如阿秋喇嘛， 哪个是他的心子？和他最接近的弟子， 像普巴扎西、阿松， 也许他们都不知道到底谁是阿秋喇嘛的心子。我们的师公也是一样，谁都不知道他最爱的弟子到底是谁。当今末法时代要是泄露了最爱的弟子和心子是谁， 可能会给他人带来不必要的羡慕嫉妒恨， 也有可能造成心子的弘法利生事业诸多障碍。为什么呢？ 因为人间嘛， 是一个五毒俱全的地方， 很多人都有嫉妒心， 会想方设法给他制造舆论和绯闻。还有， 在上师身边待着， 知道了谁是上师的心子， 一些有心机的人， 就会天天在上师和这位弟子之间挑拨， 给大家造成一个造业的机会。不知道是谁的话， 就没法造业了。所以谁是心子，上师知道， 心子本人知道。总有一天， 这位弟子会跟别人不一样， 像金子一样闪闪发光。看上去最有希望的，不一定是心子。 五、正确的依师之道 从外在是看不透人的 以前法王如意宝有某个弟子， 和我们在一起的时候谁都不喜欢他。 因为他不会与人相处， 说话也不怎么柔和， 大家都看不惯他， 天天都骂 他， 感觉快要打起来一样。他也像要动手一样， 感觉很粗鲁。后来有一天，上师就对这位弟子说：“你没有缘分在五明佛学院呆了。学院所有的弟子， 包括那些优秀的弟子都已经不把你当修行人了， 认为你应该离开五 明佛学院， 回家去。”他问： “上师， 这是开除我吗？给我一个机会吧。”上师说： “开除不是这样的。”他就说： “好，"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/修行程序拒绝 DIY", "title": "修行程序拒绝 DIY", "content": "2014 年 12 月开示 修行程序拒绝 DIY ▶ 播放 修行程序要靠师父 各位师兄都是学佛的， 已经把自己的身语意供养了三宝， 都一心一意追求成就。那怎样圆满自己的心愿呢？ 要遵循正规的修行程序。这个程序是什么呢？ 就是完全依靠上师！ 从藏传佛教的密法来讲， 没有上师就没有佛， 没有上师就没有佛经， 没有上师就没有你的一切， 没有上师就没有悉地的来源。 要成为一个优秀的修行人， 必须听上师的话， 严格遵守修行程序。没有修行程序的成就者从古到今都没出现过。 所以， 师兄们要努力去研究自己的修行方法， 认认真真地听上师每一次的开示。开示中可能有很多重复的内容， 但这是为了师兄们能牢牢记住。如果一次就能记住， 也没必要说那么多了， 但是我发现很多师兄好像还做不到。 比如有一些师兄， 每天都能跟上师见面、说话， 能听到上师的开示，这时他的修行会比较精进。但是两三个月见不到上师， 听不到上师的声音，好像他就会改变， 这是不应该的。上师在与不在， 见与没见， 上师的开示听没听到， 其实是一样的。 上师从来都没有离开过师兄们， 也从来没有间断过开示。 为什么这么讲呢？ 你一想到上师， 就是见到了上师； 你一想到上师的开示， 就等于上师已经开示了； 你一想到自己做功课， 那就是上师的开示； 你有一点点善心和比较完整的发心的时候， 那就是上师出现在你的心里。所以师兄们不应该有改变，但是不知道什么原因很容易改变。 就我而言， 我也有上师， 现在在世的上师就是你们的师公。我有时候两年见他一次， 有时候一年见一次， 但 我从来没有改变过对他的信心，从来没有因为见不到上师就无法可修， 或者改变一下自己的修行方法，没有过这样的想法。 所以，我不太理解师兄们怎么会有这样的变化。 但我也能谅解， 都是和我一样的众生， 都还不是成就者， 性格上总会有一些这样或那样的改变，这样想的话也可以理解。 不管怎么样， 修行的时候你的身语意一定要交给佛陀， 佛陀就是你的上师。很多佛经都讲过： 你见无数的佛不如见一次上师的功德大； 你听无数佛的开示，不如祈祷一次上师的功德大。 所以， 随时随地都要想着上师， 都要记住上师说过的话。你们的身语意交给上师以后， 就不应该有别的思维了。如果在修行程序上有别的思维， 你就欺骗了三宝， 违背了自己的信仰， 也偏离了自己最需要的成就。 为什么还要自作主张 下面讲几个师兄们当中， 除了上师开示的修行程序以外， 还存在别的想法的例子。 比如， 有的师兄一闲下来就想做点什么。 其实修行人不应该有很多空闲， 因为有自己的功课， 还有工作。 但是他自己觉得很闲， 然后就到网上去搜索一些别的修行程序， 去看里面怎么说的， 说得越厉害他就越激动，越神秘他就越好奇，看着看着就会想修这样的法。 有一次， 一个师兄跟我说：“上师， 我想修莲师传给佛母益西措嘉的这个法， 我觉得很适合我。”你这么提出来， 上师真的说不出话来，不知道该说什么，说真话怕伤害到你。 其实当时上师的想法是：“莲师传给佛母的法适合你吗？ 你是佛母吗？你是益西措嘉的转世吗？你真的有益西措嘉这么高的境界吗？” 但我要是这么直接说， 害怕打击到她， 只能说：“你想修啊？ 那就修呗。”“那上师您要教我啊。”“我不会。”只能这样！ 有的师兄会说： “上师， 我百分之百听您的话！”他真的是这么讲的，这句话现在成了很多弟子的口头禅了。“但是我听说在上海有一位伟大的上师来了， 听说是大圆满的成就者， 而且他传的都是大圆满法， 只要接触到他的法就会成就，我能不能去看看呢？” 我说过， 你想去哪儿是你的自由， 你想拜哪一位上师也是你的自由。但是你要想好， 你要见的那位上师怎么样， 适不适合你？ 你现在修的法是什么法？你要接受的新的法又是什么？你应该去研究一下。 后来他去了， 也接了法。过后， 我了解到这位上师其实也不太如法。 有的弟子会说：“上师， 我自己在念《地藏经》， 以及般若波罗什么什么经， 念了感觉对我帮助很大， 我要念！同时上师的程序我也要修，听上师的话！”这个时候也没有办法拒绝你， 这是你自己的选择， 你说的都是佛经，我只能说可以念。 其实我没有说过哪一位上师不好， 也没有说过佛经不好， 当然好！如果修什么都可以的话， 一个法门就够了。但是为什么释迦牟尼佛开取八万四千法门呢？ 因为佛看到了每一个众生的缘分， 每一个众生所需要的法， 以及每一个众生需要经过的修行程序， 才开取了这么多的法门。然后我就想：“你能知道你适合什么法吗？”其实去拜一位上师就是为了请他指导修行。我们不知道什么法适合自己，不知道修什么法才能解脱，所以才选择一位大德作为自己的上师。 你明明有这样一位上师， 为什么还要自行安排别的程序呢？ 那你不是懂了吗？ 懂了为什么还要找一位上师呢？ 还有的师兄喜欢说一些让人听不懂的话， 这可能和身体、环境有关系吧。“昨天晚上释迦牟尼佛来了， 给我传了法。释迦牟尼佛传的法，我要修吧？ ”佛陀亲自传给你的法， 我怎么敢说你不要修啊？ 其实我心里想的是：“完了， 出现幻觉了， 很快就要精神分裂了。”这是实话，我真的是这么想的。但是我没法说你快要精神分裂了， 只能说“好吧，你自己有感觉的话就修吧”。 又比如我们算卦念经， 我打卦要念的经文你可以请多智钦寺念。我是这么想的， 你是龙钦心髓的弟子， 你的传承就是多智钦寺的传承， 让这些跟你有直接缘分的僧人给你念经可能更好。但是有的师兄会说： “上师，这次您给算个卦，这个经我到别的寺院去念好吗？”我只能说：“当然，别的寺院也可以啊！”但是我想： 佛不度无缘人，你跟别的寺院有缘分吗？ 再比如你要看病， 请示上师怎么看的时候， 上师说什么你就听什么，因为你的身语意都已经交给了三宝。有的师兄去医院， 自己选择了三个医生，“上师， 这三个医生当中帮我选一个吧。”我给他算出来一个，他去了以后回来说：“这个医生感觉不是太好，上师，能不能在另外两个中选一个？”我又选出来一个。他去了， 回来又跟我讲：“上师啊，这个医生给我开的方子里有一种药我是不能用的， 继续这样吃下去不是吃死我了吗？ 我还想换两个医生。”就这么一直换下去， 自己都不知道在挑什么， 最后什么都没有选到。而他的病情没有好转的时候， 又会说： “上师， 我听了您的话， 我也去看病了， 可是还没好， 这是为什么？”其实我心里真的很郁闷，这是你选的还是我选的？ 不要做念头的奴隶 为什么要讲这些呢？师兄们容易跟着念头跑。你的修行跟着念头走，过生活、做生意都跟着自己的念头跑， 永远都是念头的奴隶， 一刹那也成不了念头的老大。从成为念头的奴隶的那一天开始， 你就不会成就，也不会有完美的修行。 修行人必须是念头的主人， 不能成为念头的奴隶。 所以， 要听上师的话。比如在座各位选择了我， 当时我也没有说自己是成就者， 也没有说自己多么多么伟大， 但是你们的缘分就在我这里，你们心底里有一个挡不住的想法： “我要选择的上师，就是龙洋活佛”。你选了，上师也接受了。在这种情况下，上师再差也是你们自己的缘分和福报感召来的，必须要听他的话，不听就没有办法成就！ 说实话，很多上师为了让你开心，为了安慰你，会说很多漂亮话，会说：“见一百位上师很好，越多越好；接的法越多越好；结的缘越多越好。” 这"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/做一个合格的密行者", "title": "做一个合格的密行者", "content": "2011 年 12 月开示 这不代表师父没有伤心过 从皈依的那一天开始， 你就成为了三宝的弟子， 把自己的身口意都供养给三宝了。我相信大家当时的决心和所说的话多半都是真的， 不会欺骗三宝， 不会欺骗自己的上师。但这一时半会儿的激情过后， 也许过段时间发现发心和生活相碰撞的时候做不到的事情还很多。所以迷茫的前提下犯一些修行人不该犯的一些错误是会有的， 这个虽然有错误但不太严重。但有些弟子如果明明知道是错误， 有时候还知道是犯戒还去做，那比较严重。 百分之七十的师兄相当好， 根本就不用担心上师是在说自己。但是另外百分之三十的师兄， 今天说的这些话可能跟他们有联系。为什么这么讲呢？ 因为每次上师说的话里面， 只要对自己有利的， 他就接纳， 也会去宣传， 还要再添加点什么。但是如果对自己不太有利， 而且发现好像是针对他的， 哪怕是犯一个比较大的过失， 不但不忏悔， 还会去掩盖。当别人问他：“为什么今天上师说这些呢？”他明明知道，但他马上就会说： “不知道哎。”然后延续自己的错误。 比如： 上师说过不能喝酒， 他找各种借口去喝酒， 而且喝得很有理的感觉； 上师也说过， 我们的修行是调整像野马一样难以调伏心态的良药，但往往他不对症自己； 上师也说过，我们永远是众生的服务员，但他始终居高不下； 上师也说过，欲望是下地狱的根源，但他偏偏播种欲望的种子； 上师也说过， 对境是你修行最好的老师， 但他偏要把它想成假想敌； 上师也说过， 戒律是师兄们的命脉， 但刺激到他的自我的时候却踩踏红线； 上师也说过， 上师是一切悉地、一切成就、一切幸福、一切财富、一切安全和一切健康的源泉， 值得珍惜， 但遇到个人利益的时候上师也成了他的利用品； 上师也说过， 上师指着东说“这是西”， 你一定认为是西。但触碰到他执着的方面的时候他可以跟上师狡辩几个小时； 上师也说过， 你承侍上师和协助弘法利生事业是为你自己成就种福田的， 但某些时候上师的语言刺激到你的嗔恨心的时候， 你却用以前做过的一些你认为是功德的事情来威胁上师： “没了我地球不转， 太阳不升，万物不长。” 你们是为了你们成为一个符合闻思的正规的沙弥或者比丘， 而不是成为一个唱歌跳舞的演员。”结果恩师安排的这些人束手无策，只能放弃。 但这些事慢慢传到恩师的耳朵里， 恩师说：“我认为演一场这样的场面很有意义， 消除众多的障碍， 如果某某堪布、某某大德觉得这没有意义， 那就算了。”上面所说的堪布和大德觉得情况不对， 很快地他们自己练习舞蹈、学习唱歌， 亲自供养给恩师看、恩师听， 来表示自己是乐意参与的。可是当初不同意自己弟子参与的那一位还没有醒悟过来，所有的师兄劝他：“你不应该这样。”但他坚持说自己没错。后来恩师都发话了：“如果不忏悔就离开圣地。”就这样， 还是认为自己没错，只做了一个形式上的忏悔， 而内心固执己见。一个月后， 恩师开启了慈悲的胸怀， 没有放弃他， 但这不代表恩师没有伤心过， 也不代表劝他的师兄们没有失望过。 讲条件，就不是好学生 我讲过什么都可以供养， 衣物、声音、容貌、金钱，还有法的供养等等， 只要自己最珍贵、最喜欢的都可以。有的人听了， 马上就会说： “上师说所有的都可以供养，身体供养也可以的是吗？”只要你发心正， 真心想供养，按法理来说没什么不可以的， 也不是什么大惊小怪的事。但传话的过程中传着传着就变为： “哦， 龙洋活佛说了，所有的弟子都可以把身体供养给他。”我觉得不太好，多半的汉族人听了会觉得接受不了， 因为藏传佛教深入到汉地的历史不是太长。 有一些涉及因果的事情， 主要看你能不能分析。不需要外人说什么， 你自己最清楚自己， 所以不要麻痹自己， 不要欺骗自己， 能做到不违背因果， 起码自己的良心过得去， 你去做。“我能做， 给自己的解脱不会带来障碍， 至少给家人和跟你有关系的人都不会带来什么不好的后果。”有这样的底气你才可以去做，这就叫有把握。 有一些请示上师的事要给上师留点权限和空间， 等你自己能确定， 如果上师说了我肯定能听上师的话， 而且有信心认为上师的决定没有丝毫的误差你才去请示上师。而不是绑架上师的思维和语言， 拽向你自己欲望的框架， 让上师做你的挡箭牌。比如： 有一些师兄请示事情的时候， 不是真想来听上师的意见， 只是想让上师同意他自己想做的事， 然后他就会跟别人讲：“这是上师同意的。”或者说：“这是上师让我做的。”遇到这种情况， 上师能不答应吗？ 一旦不满足你的欲望， 上师和弟子之间脆弱的戒律线有可能都要崩断。 天天说师兄弟之间要团结， 像亲兄弟一样， 甚至要超过亲兄弟。说过这些以后， 有的人就会说：“上师， 我有自己的原则，既不想对别人好，也不想对别人不好。”你有自己的原则的话， 还来听我的干什么呢？ 就按你的 原则做就行了呗。 修行人应该是什么样子呢？ 无条件地去修行！ 只要你还有条件， 就不是什么修行人， 而是在培养一个“自我”，培养一个让你轮回几亿年的祸根。 比如说我布置一个功课， 今天讲应该这样修， 第二天他就觉得应该按自己的方法来， 说：“这个是不是需要改一下呢？”因为他去过的地方太多， 见的师父太多，师父教的方法也太多了， 所有这些混在一起就把他搞晕了， 不知道该怎么做了。给他讲了做功课的程序， 才过十天， 我没听说过的内容他都念出来了， 然后又说： “哎哟， 我这个功课怎么办呢？ 是不是需要布置一下？”我重新布置了。过了一个月， 又返回原样了， 就像弹簧一样， 把它掰过来， 一放手就弹回去了。永远就是老样子，改变不了。 比如说有的人每天磕三个头， 上师让他只磕两个，他非得磕三个。上师让他只念一个观音心咒， 他非得加一个《地藏经》， 再加一个阿弥陀佛圣号， 后来不知在哪个地方听到一个开智慧的文殊仪轨。加来加去， 最后没有什么效果， 又说： “唉， 上师，我该怎么修呢？” 我不是说这些不好， 你念的这些都是佛法， 都很好， 但是对不对你的路子呢？ 比如说你发烧了， 医生先给你开一个退烧药， 再给你吃一个保健药， 又吃一个抗生素， 再吃一个什么东西， 全是药， 这样对你有好处吗？ 有头有尾，贵在专一 我到汉地十多年了， 从头到尾讲的都是一师一法一本尊。我的弟子可能不会这样想， 但是有的人会认为： “龙洋活佛， 你是不是想搞垄断，不让别的上师进来？ 华智仁波切有一百多位上师都可以， 而你说只能有一位上师，哪有这种说法？” 我是为了弟子们能够学到一个清净的法， 然后比较专一、有程序、有次第地去修， 我觉得这样是最好的。如果要有头有尾地修一个法， 必须得依靠一位上师。否则， 你找到第二位上师， 说：“上师， 我已经修到皈依了， 这之前的法不用给我传， 给我传后面的法就行了。”能这样吗？这就不礼貌了，他也不会这样给你传。 比如说， 我们的套路是这样的， 从金刚七句开始， 到后面修完三根本一一上师瑜伽、本尊、护法。你在我们这里修了持明总集， 又到另一位上师那里， 说： “上师， 持明总集我修过了， 你给我传一个空行的法。”可能吗？他有自己的套路，为你一个人改变所有的程序， 不可能。你永远只能原地踏步， 成了一个哪儿都跑， 哪儿都站不住脚的混社会的人。什么活佛都见了， 什么法都接了， 到最后什么都没得到，什么都没成功。死的时候想祈"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/成就的必由之路", "title": "成就的必由之路", "content": "2010 年 12 月开示 成就的必由之路 ▶ 播放 一师一法一本尊 “一师一法一本尊”已经讲过很多次了， 为了让大家更好地理解，今天再讲一下。 “一师”， 并不是说不能依止别的上师， 也不是说只允许有一位上师， 而是 建议专心依止一位上师 ， 这样可能好一点。佛教有很多修行方法，但无论哪个教派的成就者， 最终都是靠一位根本上师成就的。一百位上师一起加持成就的例子，我没听说过。 从小到大， 我都很向往依止一位上师， 忠于一位上师， 希望到老、到死都是一位上师。这是我的信念。为什么这么讲呢？ 每一位上师讲的都有道理， 但是你智慧够大吗？ 如果所有上师教的都接收， 那么多的知识你能容纳得了吗？ 我打个比方： 有的上师会讲修五加行是最好的， 必须要修五加行； 有的上师会讲念心咒是最好的， 必须念多少多少心咒；有的上师讲修本尊是最好的， 必须修本尊； 有的上师说供护法是最好的；有的上师专门推荐绿度母， 说这是最好的； 有的上师专门推荐观音； 有的上师专门推荐莲师； 有的上师专门推荐阿弥陀佛。这么多的上师， 这么多的法门， 如果你都要去修， 肯定修不过来。如果修不过来的话有可能有不听上师话的嫌疑， 那后果就更严重了。其实他们说得都对， 没有一个不好， 每个法门都有独到之处。但如前面所说， 我们的智慧是有限的。所以， 脚踏实地地去修一位上师的法门， 可能会修得稳定一点， 安全一点，专业一点，修得更专注，到最后得到的法可能更全面。 我很担心你们成为跑跑居士。现在在藏区， 每一位上师都会说“不要当跑跑居士”。 什么叫“跑跑居士”？ 就是上午在这位上师这里， 中午在那位上师那边， 下午又在别的上师那里。白教的、黄教的、宁玛的、觉囊的理论，所有的都看，觉得它们讲得都好，都想去接触一下。 打个比方， 就像吃自助餐， 可能有上百种食物， 但每个人都会挑选适合自己口味的、对身体没害处的， 这就是缘分。不可能把一百多种东西堆在一起吃， 吃了也会消化不了。所以我就说， 一位上师是最好的。这是我根据自己的修行经历来讲的， 像我这样的修行人， 可能更适合一位上师。 “一法”是什么？ 这 一位上师传授的所有的法， 都叫“一法”。 比如他传了上师瑜伽， 传了本尊、空行、护法， 只要是一位上师传的， 都叫作“一法”。不是说“一个度母修法就是一法。”这里讲的“一法”不是这个概念。但是修一门也不是不可以， 比如说持明总集法， 或者是度母法。专修一个金刚七句也可以，只要这个上师开许。 “一本尊”也就是这一位上师给你传的本尊，你自己没有挑选的余地。 不能说玛哈嘎拉不好、马头明王不好、度母不好， 每一个人有缘分的佛是不一样的。 “过来人”的修学方法 很多上师可能不会这么讲， 因为讲了这个话， 会得罪很多人。别人会骂：“你为什么把弟子控制在一个小范围里面？ 为什么不给其他上师机会， 只强调一个上师？ 为什么要这样讲？”我都接到过这样的电话， “你在新年祝词里面讲一师一法一本尊 , 是不是指只能信你一个人，其他上师都不行？”我敢保证， 我从来没这么想过。摸着良心说： 作为一个修行人， 从小到现在， 我从来没有认为自己最好， 比我好的太多太多了。我亲眼目睹的高僧大德太多了， 我算个什么东西啊！ 我怎么敢说自己最好， 除了我以外不能有别的上师？ 我能这么说吗？ 这是谤法。我再差， 还是知道该怎么修行， 什么会影响自己的修行。但是我再强调一下，修行要想成就， 而且成就得快， 我说的这个话绝对是没错的！ 哪怕一百个人不高兴， 一千个、一万个人不高兴，那也是他们的事。 如果哪位上师说：“什么都可以。你修格鲁也可以， 噶举也可以，同时一起修也可以， 你有一千位上师也可以， 怎么不可以呢？”你去问一下他：“上师， 你是怎么成就的？ 你是噶举、格鲁、宁玛、觉囊， 全部一起修成就的吗？ 你难道真的没有自己的根本上师吗？ 你真的没有依靠过一位本尊吗？你真的没有依靠过一个法吗？” 如果不需要一师一法一本尊的话， 为什么要分教派呢？ 分教派就是为了满足众生的不同需求， 让众生都有适合自己的修行平台， 否则根本就没有必要去分教派。 如果不需要一师一法一本尊的话， 释迦牟尼佛为什么要开取那么多的法门？ 一个阿弥陀佛法门就行了， 为什么还要开取八万四千法门？ 因为每一个人都有适合他的修行方法， 每一个人都有对机的法。如果可以一刀切的话，就没有必要这么麻烦。 我了解的你们的师公， 我的上师， 当今世界， 整个藏传佛教在世的大德中， 成就最高、地位最高的， 我敢保证就是他。他是怎么成就的？就是靠一个法一一龙钦心髓， 一个上师一一玉科喇嘛， 一个本尊一一华迪成就的。他可没有到格鲁去学习， 也没有到噶举、觉囊去学习。没有！ 还有， 我最珍贵的， 对我最有恩德的上师法王如意宝， 也是“一师一法一本尊”成就的。他靠的是他的上师托嘎如意宝。他会说：“我的根本上师是托嘎如意宝。”而不是说：“我的根本上师有很多。”他的法是龙钦心髓中的空行心滴， 本尊是绿度母， 智慧就靠文殊菩萨加持。大家看看，还有比他们学问更高、成就更厉害的吗？ 他们为什么不选择“很多”呢？ 为什么不满地球去求法呢？ 他们就在一个地方待着， 哪儿都不去。很多上师是因为慈悲， 不想得罪你， 所以不敢对你说真话。他觉得说了也没用， 你也不会听， 反而让你起烦恼，就会说：“都好， 都特别好， 什么都好。”好个蛋！ 这是给你们放的慈悲的烟雾弹！ 别小看师父布置的功课 所以， 每一位弟子都要认认真真地修， 不要小看上师布置的功课。这位上师既然敢给你布置功课， 他绝对比你懂得多。他为什么不选择别的法， 就让你修这个呢？ 他绝对比你高明， 所以要相信上师。 上师布置的所有功课， 不管什么心咒， 哪怕只是一个小小的观想， 让你观想十年，你也得开心地去观， 不要小看它。 只要你小看了第一步， 就会有第二步，三步四步都会小看。就像走路， 你只要一步没走踏实， 后面就很可能步步走不好。 我以前不是跟你们讲过吗？ 有一个弟子对自己的上师特别有信心，天天求上师传法， 但上师一直没给他传， 这可能有上师的密意。但弟子天天求， 后来上师烦了， 看到那个弟子的鼻子像金刚菩提， 就说了一句“金刚菩提鼻！”那个弟子认为这是上师给他传的法， 马上起来磕了三个头。 回去以后他就闭关， 天天念“金刚菩提鼻、金刚菩提鼻”， 念了一个亿。其实这句话根本就不是什么心咒， 就是笑话他的， 但是他却很有信心地去念。后来， 他用这个金刚菩提鼻“心咒”救了自己上师的命， 还得到了一个很高的法。所以， 信心才是关键。没有信心想要成就， 这是根本不可能的。 有一次，玉科喇嘛的弟子正在打坐的时候，对面的山上有一个女的唱道：“大法你们这些僧人不懂， 小法你们又瞧不起。离开这个世界的时候两手空空， 你们是这个世界上最可怜的人。”玉科喇嘛听到这句话之后奉为修行人的最高窍诀。我们很多弟子都有这个毛病。说到大圆满，大家都很期待、很渴望： “哦！大圆满！传大圆满啊！真的啊？”但是让你念一个心咒， 就不耐烦了：“又要念心咒了！ 我已经念了一百二十万遍了， 还不够吗？”这就跟那个女的唱的一样： 小的法能救你， 你不去修； 大的法你不懂， 给你讲了也没用。在中间徘徊了一辈子， 到死的时候， 什么都没"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/求学的关键问题", "title": "求学的关键问题", "content": "2010 年 11 月开示 求学的关键问题 ▶ 播放 听话的智慧 修行有很多种方法，你坐在那儿打个盘腿，不一定就是修行。 在寺院里 , 我天天看着那些工人施工、搬砖、拌水泥、卷钢筋什么的，天天跟他们吵架， 自己心里常常想：“我这个活佛到底在干什么？ 是不是在浪费时间呢？” 有一次， 师公回来了， 我就跟他说：“上师， 我是为了多智钦寺，为了您的一句话把自己的时间浪费了， 您一定要加持我啊， 我死的时候全靠您了！”“你真的是这么想的吗？”我说：“是。”“我对你太失望了！”他说，“你连自己的修行方法都没搞懂， 听上师的话难道不是修行吗？ 你跟我翻翻书， 看看除了听上师的话， 哪里还有什么别的修行方法？如果不听上师的话，你在山洞里天天闭关，会有成就吗？” 他跟我讲了这个以后， 我就放心了：“啊， 随便， 我不修也可以，我只要简单，哪怕只是做一个好的工人也行。”真的，我真的有了这种想法。 藏地的寺院， 跟汉地一样， 里面的人际关系也很复杂。比如说， 哪一位上师要灌顶了， 你不去捧一下场， 他如果不是位真正的成就者， 有可能以后会对你不好。而且， 这些人很喜欢给你写纸条：“龙洋活佛，我要灌顶了， 你要是参加的话会长寿的， 我是为了你而灌顶的。”要是不去的话， 他肯定会伤心的。但无论他们怎么说， 我得问问上师， 如果上师说：“别去！”那我肯定就不会去。 后来， 很多人对我说： “龙洋活佛， 你好像是不想在人群里混了吧，谁的面子都不给， 你真的不需要别人来帮你吗？ 你没想过有一天你也需要别人吗？”我说：“我得罪全天下的人都可以， 但是， 我不能得罪自己的上师。如果上师让我得罪全天下的人， 我开开心心地去得罪。”真的，自从那次上师说了以后，我就有了这样的信心。 从对上师的信心和听上师的话这方面来讲， 我是一个合格的修行人，这么说问心无愧。要说在山洞里闭了多久的关， 达到了什么样的一种境界， 那我很差、很差。不过， 我看过很多经典， 其实真正来说， 没有上师，所有一切的成就都不会有的！ 比如说， 别处的师兄到这边来， 这里的上师如果对他“不太好”，他就会说：“哎呀， 某位上师对我很好， 他才是我的上师。”在这里接受了多少法， 他都不会承认。但是后来， 某位上师对他也稍微不那么重视， 不怎么提他了， 在那边好像也没什么市场了， 他就又换一个地方： “我的上师是这位。”其实他前面有两三位上师， 但他永远都不提。这叫什么？这叫叛徒，甫志高。我们修行人真的不能这样！ 尽自己的能力， 把以前的上师安顿好， 把他们伺候好， 在他们开心的状态下再依止另一位上师， 这是允许的。但是有的上师， 不是成就者，就是个骗子， 为了拉拢自己的弟子， 弟子即使是真正的想修行他也不会同意， 针对这种情况， 释迦牟尼佛早就说过： “远离他， 在远处恭敬他。”我们不能舍弃他， 但是我们可以在远处恭敬他， 这是释迦牟尼佛给我们的权利。 所以， 这种修行方法大家要了解一下。你说自己不会修， 那是不可能的， 连一个观音心咒都不会念的人是没有的， 只要是听上师的话， 你念个咒也是修行。 循序渐进，切勿高攀 上师让你怎么修， 你就怎么修， 要按照程序来修， 不要过早地去要求一些后面的程序。比如， 一个弟子的前面的法修完了， 我在给他布置新功课的时候， 另外一个弟子跑过来： “上师， 我现在的功课还没做完，但是我想跟他一起接法， 我后面再完成， 可以吗？”他也是好心， 积极性倒是可以， 但是他原来的程序还没有过完。就像上学一样， 修行也要有次第， 不要像跳蚤一样去修。次第是什么呢？ 我们每个人都上过学，从小学、初中、高中、大学， 然后到硕士、博士， 是这样一步步地去学。上了一年的小学就想要当博士，那是不可能的事。 有的上师会说： “什么都不用学， 看着我。啪的！好了， 成佛了。”哪有那么简单？真的，这是不可能的事情。 然后， 有的上师把大圆满的那些灌顶、修法， 全部以集体开会的形式来传。只要是懂一点文字的人， 都可以去看看经论， 有没有这种程序？没有！ 十四条根本戒里面说了，“于未成熟有情宣说密法”是犯戒的。这是什么意思呢？ 就是说当你根本就不是这种法器的时候， 给你传一些高深的法，那就是犯戒，会构成上师和弟子一起下地狱的条件。 你自己想一下， 你一点层次都没有， 什么感觉都没有， 上师也没有感觉， 但装成有感觉的样子， 两眼一瞪， 坐在那儿不动。其实上师什么都不懂， 什么境界都没有， 弟子也没有， 但是他装成有境界的样子给弟子传法，这种人是最大的骗子。 上一次， 师公在多智钦寺的后山上作开示， 他说：“现在有一些上师不要历史、不要程序、不要戒律地去讲大圆满， 把大圆满法用开会的方法去传， 我真的想不通他们到底是不懂因果， 还是不怕因果？ 他难道不想一下这些弟子有多可怜吗？”师公说着说着就哭了。 这些上师， 他们明明知道这样做对弟子没有好处， 启发不了他们，因为时机还不成熟。你想一下， 给一个小学生讲一些博士的课程， 他能听懂吗？ 师公比喻过， 要想上三层楼， 如果不走楼梯， 从地上一跳就跳到三楼去，这可能吗？不可能的！ 所以， 修行一定要按程序来， 上师怎么安排， 你就怎么去修行。你的 上师只要是够格的， 那他绝对知道弟子的根基， 知道弟子的来历， 知道弟子前世修了多少， 这世还需要修多少， 他都知道， 所以肯定会给你安排适合的功课。 也许你只修个五加行， 然后什么都不用修， 我就直接给你传大圆满；也有的弟子， 一辈子都在五加行上打转， 那也没什么好奇怪的。当然，你看看，像法王如意宝一生都修了十遍五加行，有的还修了二十遍五加行，这些都是上师来安排的。 释迦牟尼佛之所以开取了八万四千法门， 就是为了不同根基、不同福报、不同来历的众生， 为他们开取相应的法。如果像有的人说的， 有一个大圆满法就行了， 那释迦牟尼佛何必还要辛辛苦苦地创建那么多法门呢？每个人的需求不一样！如果感冒了用头痛片， 肚子痛了用头痛片，拉肚子了还是用头痛片，这样是不行的，要对症下药。 因此， 要好好地跟随上师， 听上师的话， 以一个渴望成就的心态去修行。你可以去请法， 但上师怎么安排你都得听， 不能要求上师听你的。我们的弟子里有这种人， 我让他念莲师心咒， 他说：“上师， 我念一个观音心咒吧。”那好， 你念观音心咒。念了五六天， 他又说：“这个对我好像不好， 我就念一个百字明吧。”他自己在那儿选功课做， 自创程序。既然你都懂，那还找一个上师干什么呢？ 藏传佛教和汉传佛教不太一样， 汉传佛教也很了不起， 有适合它的那些根基的众生。比如你只要一直念阿弥陀佛， 然后自己去领悟， 就这样悟悟悟， 到最后， 什么时候能悟出来全靠你自己。但藏传佛教不一样，就像老师教学生一样去教， 不教的话你什么时候才能悟得出来呢？ 它是这样认为的。这两个概念都对， 不能说哪个不对。但是， 我觉得像我这种像笨猪一样的人， 有老师教是最好的， 要靠自己悟出来需要有很大的智慧，真的。 所以， 大家得跟随上师好好地去学， 不要浪费时间。人这一生， 时间真的很少， 很多人心里总想着：“明天再修吧； 后天再修吧； 赚了钱以后再修吧； 念经的时候再赚赚钱； 老了以后再修吧 …… ”， 你有这些个时间吗？ 肯定没有！ 你看看"}, {"slug": "上师开示/4.如何修行/4.1 正确的依师之道/至少让师父记住你", "title": "至少让师父记住你", "content": "2010 年 11 月开示 修行人要特别在乎自己的上师： 上师夸过我没有？ 上师今天是不是不开心了？ 今天我的所作所为， 上师满意吗？ 要特别关注这些方面， 就像军人在乎军令一样。 我们修行人有一个习惯， 都希望成为上师的优秀弟子， 就像我们常说的心子。就是跟上师没有误差的心心相印的弟子。这是很难做到的。第二种， 成为上师尊敬的弟子。他的闻思好、实修好、为人好， 上师就很开心， 会尊重这样的弟子。不过在末法时代， 这个也很不容易做到。但是最起码，要做到让上师认识你。 比如， 很多人都自称是法王如意宝的弟子 , 但法王如意宝并不完全认识他们。他只是心里觉得“这是我的上师”， 但三年都没有见过上师一面。成为这样的弟子很可惜。有机会的话， 比如跟上师聊聊天， 探讨一些修行的套路什么的， 都是很好的。如果没有这样的机会， 也要多在上师面前晃一晃， 天天晃一晃。为什么呢？ 如果你的上师是个大德， 只要他记住你，那你这一辈子就没有白活。 我们每个人的生命都是无常的，不知道什么时候会走。一口气呼出去，还能不能吸回来， 谁也不敢保证。谁都有可能现在还活着， 过一会儿就死了。那时候， 如果有条件， 说一声：“上师， 我不行了。”上师一想：“啊，这是我的弟子， 我知道， 我记得他。”能够这样更好。如果是突然死亡，没有这样的时间， 别的师兄跟上师说： “某某师兄死了。”上师一想： “哦，我认识他， 我记得他， 很可爱。”那也一样很有好处的。有的上师只要想一下那位弟子， 就可以立刻超度他， 他有这样的能力。昨天我讲了佐钦仁波切的故事。那个土司做了那么多的坏事， 佐钦仁波切只是想了一下， 弹指之间就把他超度了。那个土司确实是先堕入了地狱， 不去不行，因为他要承受因果， 但过程大大缩短了。所以， 让上师记住你是最重要的。 在五明佛学院的时候， 法王如意宝是我的上师。我不是上师的心子，差得太远了， 也不是上师尊重的弟子。但我敢说， 我就是让上师开心的弟子。我天天拿着一把钉子， 再拿一个钉锤， 然后到上师的房间去看，哪块地板翘起来了， 就过去敲两下。其实， 我是想去看看上师， 想让上师记住我。有时候， 穿上一些很古怪的衣服在上师面前晃一晃。“哎，你这是什么东西啊？”上师就记住我了， 然后讲一些笑话， 做一些吉祥的鬼脸， 有时候装成很可怜的样子， 有时候装成很饿的样子讨一点悉地，反正让上师记住我。我做过这样的事情。其实是我自己心虚嘛， 修行不好，闻思也不好， 只能用这种方法来让上师记住我， 就是为了让上师开心。这个我不骗你们。上师说过：“龙洋活佛在的时候是很好玩的， 他让人很开心。” 有一天上师跟我说：“我有你这样一个儿子就好了。”真的说过，我一点都不骗你们。对一个修行人来说， 一生之中， 如果被上师说过是他的儿子的话， 这是很高的荣誉。但上师这句话我是怎么得来的？ 就是在上师面前玩闹， 做一些稀奇古怪的动作， 让上师开心得来的。比如，上师喜欢看跳舞， 我小时候正好学过， 所以， 一有机会就在上师面前跳一跳， 晃一晃。上师说：“哎哟， 你这个跳得太难看了！”但是他记住我了。还有， 我小时候学过一点点武术。有一天， 上师说： “龙洋活佛，听说你打架还是很厉害的嘛， 给我露两手看看啊。”当时， 五明佛学院有个从法门寺来的和尚， 大家都知道他武艺高强。上师让他过来， 对我说： “你跟他比一比， 我看看你有多厉害。”我们俩就交上手了。结果，他把我摔在地上， 我的裤裆一下子裂开了， 没办法站起来， 只好蹲在那儿。就这件事， 上师两年都在提。其实我是很开心的， 上师记住我了， 不管以什么样的方法。 所以， 每一个弟子最好能成为上师的心子。心子是什么呢？ 就是他的修行、境界全部跟上师一模一样， 只是外表、长相不一样。内在都一样，一点区别都没有的时候， 就成为上师的心子了， 这是最好的。我们最需要追求的、首要的目标就是这个。大家不能灰心， 要对自己有信心： “我一定要当上师的心子。”应该这样想。 哪怕当不了心子， 但是我得对上师有一个回报：“我修了， 我修了一辈子， 我没有后悔。我的境界怎么样， 上师也看到了。上师在与不在的时候，我都很忠诚。我修行了，没有虚度光阴。”这也是很好的。 实在没有办法， 最差的情况， 至少也得让上师知道你。再说一遍：在上师面前晃一晃， 这是很必要的， 大家要记住这一点。哪怕你成为上师天天攻击的弟子，你只要不灰心，也很荣幸。 我们在学院的时候， 过一两个月就会问：“这段时间上师提过我没有？”如果说没提过， 那就恐惧了。我们就会想： “上师为什么不提我？哪怕骂一句也好啊！ 上师不提我， 是不是不喜欢我了？”心里就很难受了。“是不是上师心里已经放弃我了？”如果上师一年都不提起你， 那就真的有点问题了。就像做父母的， 自己的儿女做了什么， 马上就会说： “这样行， 那样不行”， 等等。但外人做了什么， 他们是不会说的。所以，就算上师对你说： “你这样不行啊， 你这么做太差了！”那也是你的荣幸，说明上师已经记住了你，把你当成自家人了，这样很好！大家得观察一下：成为上师的弟子几年了， 上师对我怎么样？ 上师还记得我吗？ 到了上师面前，上师认识我吗？这是很需要的。"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/为什么要把修行放在第一？", "title": "为什么要把修行放在第一？", "content": "2013年1月开示 为什么要把修行放在第一？ 要知道机会难得，要知道珍惜机会！ 今天我们讲一下，人身是容易得到的吗？ 我们所在的这个星球，有多少个生命？你去看看大海里有多少个动物？你去看看不经常打扫的房间里有多少个生命？你去看看树根下的蚂蚁窝里，有多少个生命？一棵树下，你能看到的生命就有一个国家人的数量。这是我们能够看见的。 看不见的，就你一个人的身上，就会有无数的生命存在。其实你的人体就是由无数的生命结合在一起的。你要是能看见，就好玩啦！你打一个喷嚏，就能吹死无数个生命；你喝一碗茶，就能冲走无数个生命；你吃一口饭，就能嚼死无数个众生。 用佛教的概念来计算的话，在这个星球上，人的比例少之又少。这么小的数量里面，完善的人身有多少？ 什么叫完善呢？眼睛没有问题的，耳朵没有问题的，五脏六腑没有问题的，脚、手都没有问题的，有多少？再往细里想一想，思想健全的，有多少？再想一想，有权力，有地位，有自由，不用惧怕的，有多少？很少！ 除开这些，暇满人身就更稀少了。有佛教缘分的人有多少？有了一点点佛教缘分，但是没有瑕疵心态的，有多少？你是有一点相信佛的感觉，但是你走到哪一个佛教圈子都会产生邪见，总觉得不适合你，不是这个问题，就是那个问题，有这种心态的，有多少？这样看来，能得到一个暇满人身，比白天的星星还要少。 就在这么少的数量里面，能够遇到佛法里精华的精华，像龙钦宁提这样的殊胜妙法，又有多少？在这个地球上，信基督教的大概有17个亿的人，信佛教的只有3个亿。这里面，修龙钦宁提的有没有1万个人呢？ 你们想过没有，你们的福报是从哪里来的，难道这只是一种巧合？ 这么多的人里面，恰恰你们遇到了这么殊胜的法，你们没有血缘关系，也没有事先安排过，但是有一种奇妙的缘起，把你们凑在了一块。你们想过没有，你们的前世在哪里？你们前世说过什么话？结过什么缘？在这么多生命里面，既然把你们凑在一块学龙钦宁提，难道只是为了吃喝拉撒睡吗？你们每一人都有自己的使命，要对得起你们缘分的安排，要知道机会难得，要知道珍惜机会！我敢说，这样的机会是十万分之一，或者说是千万分之一。你要是想下一世再得到这样的机会，做梦！真的。 你们为什么会有这么大的福报呢？那是你们前世的愿力。但是，光一个靠前世的愿力支撑现在，那也不太现实哦！你以前拥有的这些财富，你一直坐着，什么都不挣，就坐吃山空了。以前的福报全部消耗完了，你现在不增加一点点，行吗？不行。所以现在也得为下一世，多存点福报。 今生，这个人身呐，又难得，又无常，所以为了它不必要的付出是没有用的。 你想一想，你能在这个世界待多长时间呢？最多三万天！最长寿的人就是三万天。三万天里面你很安详、自由支配的时间有多少呢？小的时候不懂事，全靠别人的意念来控制你；到了中间，在学校里度过，又要听老师的；晚年，也许是听老公(妻子)的，也许是听孩子的，也许是听领导的。除去晚上睡觉的时间，就剩下五千天了。这个五千天里面，属于自己自由支配的时间有多少呢？ 今天你在这里安心地听几个小时的佛法，也是不容易的，这也是很多年前积累的福报才能有的。你想来就来了，不想来就不来了，你觉得有这么简单吗？不可能！这是几千年前已经设计好了的：到了这个时候，有这么个时间让你听一听佛法。你认为这是你推了工作，跟领导请假没去上班，才能来这里？不是！ 你没有这样的福报，你怎么“安排”、怎么“挣扎”都不会有的。 现在有的弟子认为：这有什么呢，我想来就来呗，不想来就不来了呗。但是过几年，你快要到那边去的时候，你往回一想：“啊呀，我真的是遇到了一个很好的法，遇到了一个精神上最完美的东西，但是我没有珍惜，好可惜啊！”你会想到这些，但那个时候已经晚了，再想找这样的机会，不会有的。 所以，师兄们，我们这么短暂的就像一刹那的时间（人生），利用起来修行。今生很短暂，但是生生世世是比较漫长的，所以千万千万不要错过了这样的机会。我说的是真话。 不知道什么原因，我成为了你们的上师，其实我心里很惭愧，说实话。我不是一个很优秀的上师，也不是什么具德的上师。但是这是命运的安排，让我们认识了。既然认识了，就得有个认识的价值。价值是什么呢？要学佛。佛法是什么？佛法是文化的灵魂。全人类都需要文化，但文化没有灵魂，就是个尸体。所以我们要掌握文化的灵魂。 师兄们，每时每刻，我希望你们 把修行放在第一位，生活放在第二位，朋友放在第三位。 为什么这么讲？因为佛法是你自己的，永远属于你自己，强盗抢不走，别人要不走，你送它也送不走。 生活呢，太多变了。打个比方吧，你的爱人刚开始跟你在一起的时候，好像装一个皮子装不下，装两个皮子好像离得太远。眨一个眼睫毛，都耽误看他（她），有这么个感觉。到最后，一个门缝里进去的时候，碰一下，“哎呦，不要碰我。”你值得去信任他（她）吗？有的人他（她）是十八变，但是给人的感觉是一百变都不止。 物质，值得去信任吗？今年的千万富翁，明年有可能就是乞丐。我是看见过地震的。有个人为了挣很多很多的钱，一辈子卖狗，把那个狗说成是神仙一样，欺骗大家。好像狗不像个狗，好像比豹子、狮子还厉害地那种去宣传。宣传完了以后呢，用一种商业欺诈的手段去卖这些狗。地震发生后，骗来的钱一夜之间毁于一旦。不要说钱，他的儿子，他的爸爸，他的妈妈，什么都没有了，就剩下他一个。本来他住的是1000平米的房子，一下子变成了80平米。就这么一刹那，靠得住吗？靠不住。 朋友靠得住吗？你往回一想，以前可以跟你同甘共苦，拼死拼活地，现在他跟你说话吗？以前你认为特别不好的人，现在有没有成为你的朋友？有时候你没有想到的朋友，突然会出现在你的身边帮你，但是有时候你特别想到的朋友，反而不帮你。 地位和权力也同样靠不住。 我们靠不住的东西抓在手里干什么呢？但是你的信仰，只要你有信心，它是永远不会改变的，它永远永远跟你血肉相连。所以我说修行放在第一位，是为了你好！有了精神的财富，什么都有了。没有精神的财富，一个尸体能做什么呢，什么都做不了！ 谢谢师兄们！"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/人品到底有多重要", "title": "人品到底有多重要", "content": "2013 年 01 月开示 师兄们， 今天给大家讲一下， 修行人怎么做人。其实我已经讲过很多次了，但是为了新师兄，这里再讲一次。 忠与孝，缺一不可 按照藏传佛教的规矩， 一位上师收弟子， 首先得观察他的人品， 人品要是不合格的话， 上师可能不会接受这个弟子， 因为人品牵扯到很多方面。 不好的人品就像大蒜的臭味一样， 什么香料都掩盖不了。要是人品太差了， 无论用什么样的方法来调教， 有些缺陷可能还是无法弥补。所以，要很注重人品。 人品好的主要表现是什么？ 忠和孝。忠于你所在的国家， 孝敬自己的上师、父母。 一个人要是缺少这两样，他的人品可能有一点缺陷； 要是不齐全的话，学法也会有障碍。为什么这么讲呢？ 第一， 要是不忠于你所在的国家， 不要说修行， 连生存的空间都很小。 第二， 要是不孝顺自己的父母， 别人都不会相信你是个好人。你对自己的父母都不好， 说对众生好， 对天下的父母好， 那完全是一句空话。 做个看得见摸得着的人 所以， 师兄们， 要做一个踏踏实实、实实在在、看得见摸得着、比较有安全感的人。不要像水泡一样， 看起来有， 一摸就没了。有的人说话很漂亮， 人前做事也很漂亮， 但是真正需要他的时候， 就靠不住了。需要付出的时候， 他就躲在一个角落， 把自己裹得紧紧的。把别人放在最危险、最困难、最痛苦的地方， 自己却待在比较安逸、舒适的地方，这也是人品问题。 说话也是一样。说过的话， 就像空气一样， 在这里说过的， 出门就忘了。或许没有忘， 但是他根本就没有遵守的习惯。他的承诺像空气一样，听得见，摸不着。 做事也是一样， 不踏实。今天这里做一点， 明天那里做一点， 就像小鸟挖洞一样， 到处换地方。可实际来讲， 他真正做了什么？ 只是忙了一辈子，没有做什么对自己和别人有益的事情。 跟亲人和朋友之间， 没有一点点信任， 没有一点点安全感， 这种人在佛教圈子里， 来了也是白混。他的坏习惯在什么地方都改不了， 即便是学佛，还不是那种不太负责任的、飘忽不定的态度。 打好人品的“地基” 比如说， 一个人发现佛教是比较优秀的信仰， 发现如果信佛， 对自己有好处， 然后就下定决心要修行。他刚找到上师的时候， 见到上师，就像见到释迦牟尼佛本人一样， 很冲动。然后， 说一些夸张的话， 把自己的上师赞叹得不像人， 好像真的快成佛了。其实真正按佛教来讲， 谎言或有水分的语言千万不要用来赞叹自己的上师。 但是， 他非要用夸张的语言来吹捧。比如说， 本来上师的能力就像手臂可以穿到这个袖子里来去自如一样， 但夸上师的时候就被他说成是一座山都能在这个袖子里来去自如一样。说上师是自己的再生父母、古佛再来、神通广大、飞檐走壁、稳如泰山、善良超过观音菩萨、智慧超过文殊菩萨、力量超过金刚手菩萨， 等等， 上师听了都觉得毛骨悚然。才过几天， 在大家都觉得没有理由和原因的前提下就把自己的上师说成连做人的资格都没有的那种， 更不要说视师如佛了。做事也是比从来就没有听闻过佛法的人群中品行比较差的还要差， 做出一些常人都难以接受的事。前后落差很大， 上师看了都哭笑不得。上师知道这种举动对他相当不利，但不能说，因为他很脆弱。 如果把他这五六天的所作所为录下来， 给他本人看一看， 前后变化之大， 恐怕连他自己都不认识自己了。这都是人品不好造成的。没有很好的人品做基础， 就不能成为一个很好的修行人。就像盖房子一样， 地基打不好， 上面修得再漂亮， 遇到下雨， 或者稍有一点震动就会坍塌。所以，人品的地基不好，修行可能就会有点辛苦。 人品方面的种种问题 还有， 我发现我们的一些弟子特别喜欢新鲜感。只要是新的， 不分好坏， 他都特别喜欢。而跟了你五六年、十几年的， 再好， 他都嫌弃，离你越来越远。就像衣服一样， 今天穿中怯的， 明天看到一个明星穿西怯的， 马上就脱了， 换成西怯的。第二天， 又有一个明星出来， 然后所有人的发型、穿着跟着全变了。第三天， 可能又有一个更大的明星裸体走一走， 那街上不知道会出现多少个裸体了。我觉得这也是人品造成的：你自己没有主见， 没有一个确定的想法， 没有一个规范的程序， 才会这样。 修行也是一样。皈依的时候， 你不是小到不懂事的孩子， 也没有老到老年痴呆， 是在很清醒的状态下， 跪在你最信任的上师面前， 自愿向三宝发誓：“从今天起到成佛为止， 我不杀生！”别的不说， 只说不杀生这一点。吃饭的时候， 领导说“我想吃青蛙， 点一个。”“好啊！”你点了。第二天， 领导又说“我想吃醉虾。”“好啊！”完全听领导的， 自己没有什么底线，这不是人品问题吗？ 不要说领导， 就是一个好朋友来了， 他不信佛， 在一张桌子上吃饭的时候， 他说： “你装什么装啊， 吃呗， 这是为你点的。”面子就挂不住了， “嘿嘿，好，我吃。”这也是人品问题，说明你人格不稳定。 再比如，你发誓： “我就修什么什么法门，跟随什么什么上师”。 有一天， 别人说：“我听说有个什么什么法皇， 比法王还大哦， 只要接触到他， 听到他的四句佛法， 就能立地成佛！”以前的誓言就都忘了， 扑通一下， 又跪在“法皇”面前： “上师， 从今天开始， 我就是您的弟子！”以前所做的一切，说过的一切，全都忘了，这也是人品造成的。 夫妻两人都是修行人， 因为一点点事情， 就闹得不可开交，“我要跟你离婚， 再也不跟你说话了！”但你以前不是这么说的哦，“我们是金刚师兄弟， 千万不能吵架， 一吵架就会犯戒， 要堕入地狱的。无论遇到什么困难， 我们都要团结， 要听上师的话！”“上师， 您放心， 我们两个在您的门下修行， 至少能做到团结！”就为这么鸡毛蒜皮的小事，你就做不到了。 还有的弟子， 仅仅因为别的师兄说了一句有点点不尊重他的话， 也许还不是故意的， 他一听就火冒三丈， 所有问题都算到师兄头上， 一点都不顾及戒律。把上师说过的话， 什么团结之类的， 都抛诸脑后了。给别人讲的时候头头是道， 到自己头上就忘光了。特别敏感、小气， 这也是人品问题。 为什么这么讲呢？ 第一， 你懂戒律； 第二， 你是上师的弟子， 知道上师是如何在乎弟子们团结的。就一句话的事儿， 不就是空气嘛， 又没有伤害到你一丝一毫。对你的生活和前途， 也没有什么危害。因为一句话，就可以闹翻天，这也是人品问题。 你们皈依的时候， 跟上师承诺要学佛， 功课也一一地请了， 但有的人回去以后就当成空气， 什么都不做。一遇到麻烦， 就回来了。得病了，医生没办法， 或者遇到其他难以解决的事情， 就出现了。其余的时候，上师求你，你都不来。这不是人品问题吗？ 这种只为自己活着， 不考虑别人的行为， 根本就不是修行。我们修行的宗旨是什么？ 就是利益他人， 要有利他菩提心。有一点点麻烦， 有一点点病痛的时候就来了， 健康、安逸的时候， 一切又都忘了。跟以前相比， 只是多了一个皈依的名义， 贪嗔痴慢疑一点都没有减弱， 什么改变都没有。这不是人品问题是什么呢？ 不做功课， 不在乎杀生， 不在乎因果， 什么都不在乎。只有别人问他“你有信仰吗？” 他才会取出个念珠来给别人亮一下说“噢， 我皈依过了。”仅此而已。这些都是人品问题。 师兄们， 进入佛门以后， 要调整好自己的思维， 控制好自己的身口意，要有规矩地活着。不要像摆地摊一样， 什么都是乱七八糟的，"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/修行人的行为规则", "title": "修行人的行为规则", "content": "2012 年 09 月开示 今天我们讲一下修行人的礼仪， 就是如何做一个修行人 , 修行人的行为规则。 行为规则， 有出家人的， 也有在家居士和密咒士的。有时候， 师兄们只要看到穿僧衣的人， 就以出家人的标准来衡量他的行为， 但人家未必是比丘。有时候呢， 用密咒士的行为规则来要求出家人， 也许他根本不是密咒士。密咒士是什么样的修行人呢？ 他们有妻子、有家室， 百分之六十的时间投入到修行中， 百分之四十用于寻找生活来源。密咒士不一定很有成就， 是比较低层的一种修行方法， 但他们也可以穿跟僧人差不多的衣服。区别在于， 僧人的衣服， 裙子上是有格子的， 密咒士的没有。 出家人有三样东西不能离开， 就是他的上衣、戒裙， 还有比丘的袈裟， 这三样晚上不能离开住所。密咒士， 则没有什么不允许离开的， 因为没有这条戒律。本来按规矩来讲， 密咒士的衣服、裙子应该是白色的，披单也是， 因为白色是在家人的颜色。但到了藏地以后， 很多寺院都统一穿出家人的颜色，这样比较好看。 在家居士的行为要求 那么，在家居士有什么样的行为要求呢？ 首先， 态度必须很温和， 不能傲慢。如果摆出傲慢的姿态， 周围的人看到就会想， 你怎么修成这样啊！ 这样你的外在就会引起很多人对佛教不满意。所以， 要特别温和。性情温和、做事低调是咱们居士的主要特点。 然后， 要把自己放在最低， 不能放在高处， 每时每刻都要把自己看成是最差的。一定要想， 别的修行人都比我好， 不能认为我比他们好， 否则你的想法可能有一点点问题。特别是修行刚开始的时候， 这种发心 可能有一点错误。有的上师观察弟子的时候， 会听他说什么， 听他的真 心话。如果他说：“上师， 我很差， 但是在这群弟子里面我还是比较好的。”听到这句话， 这位上师永远都不会接受他。要真心， 不能虚伪， 自己认为很好， 却说我不好， 这样也不行。确实觉得我比别人差， 我要努力， 以这种心态去说：“上师， 我可能是最差的！”如果这样， 这位上师有可能发现了一颗优秀修行人的苗子。 再者， 不能大声吵闹， 不能说一些上不了台面的话， 比如： 讽刺人。还有， 思维要向上。是什么意思呢？ 必须得看优点， 看所有人的优点， 不要看缺点。为什么呢？ 你看别人的缺点， 相当于你也有了这个缺点。因为你想过它， 在思想上也经历了一次， 相当于他做的事情你也做了，划不来。你把对方想得多么坏， 必须把他的坏处想一遍。你说他怎么怎么坏， 其实等于你也做了这些。他是想了以后才有行动的， 而你是想了以后就说出来， 这也是行动。所以， 别人犯戒的时候， 去说别人的同时自己也造业了， 这样真的很划不来。有时候他是在没有办法的情况下，或者对自己有一点利益的情况下犯了个戒， 这是真的没办法， 但你却是在对自己没有任何好处的情况下造口业，真的没有必要！以上讲的是在家修行人的行为规则。 不要诋毁成就者 大家肯定想知道： 什么是最大的业？ 在这个地球上杀人、偷东西、打父母， 等等， 无恶不作， 这里面最严重的业是什么？ 最大的业就是诽谤成就者！ 同时杀掉全世界的、整个地球的生命和说一句成就者坏话相比， 后者的罪业要严重得多！ 普通人不知道哪一个是成就者， 哪一个不是， 也许人家表面上是疯疯癫癫的， 你看他的行为不太好， 但却是真正的修行人。所以， 释迦牟尼佛说过， 只有他和像他一样的弟子才有资格说别人的过失， 其他人没有这样的权利。只要想当他的弟子就不要说别人， 因为你看到的、听到的不一定是真实的情况。所以要注意， 一个小的事情就很容易造业， 而且是造很大的业。比如上师说某某大德不太好，他怎么怎么样， 上师讲， 你听就行了， 你不要跟着上师去说： “上师说过，他肯定是坏人！”不要这样讲。上师说这个也许有他的目的。 给你们举几个例子。曾经有一个叫玉科喇嘛的成就者， 他是当时最好的大圆满上师， 是很多上师的上师， 也是咱们第四世多智钦仁波切的根本上师。他天天骂塔洛活佛的爸爸根桑尼玛， 天天骂：“什么上师， 这强盗， 遇到他的人都会下地狱的……”骂了以后， 一些跟随他的弟子，就到根桑尼玛住的地方， 把他赶走了。他们觉得他是魔， 赶走他是做了件好事儿。然后向上师禀报： “上师， 今天我们做了件好事儿。”上师问： “什么好事儿？”弟子答： “那个魔被我们赶走了。”上师接着问： “什么魔？”弟子说： “那个根桑尼玛。”上师听到这里， 一下子就东摸西摸，摸到什么就拿什么， 给那些弟子砸过去：“你们这些笨蛋， 谁让你们把他赶走的， 他走了我也没地方待了。”弟子们这下可害怕了， 赶紧跑过去把他请了回来。而根桑尼玛呢， 天天问： “今天玉科喇嘛骂我了吗？”一听说骂了就很高兴：“啊，好，这骂了我就没什么障碍了。” 还有一个就是蒋扬钦哲和多钦哲的故事， 他们两位每次遇到都会吵架， 有时候甚至发生枪战。每次讲法的时候， 两位都一样， 蒋扬钦哲在接受弟子的时候会问：“你接触过那个多钦哲没有？”如果回答“接触了”， 那他就会说：“唉， 不要来不要来， 我救不了你。”然后多钦哲 也会问： “你接触过蒋扬钦哲没有？”如果回答“接触了”， 他就会说： “唉， 我救不了你， 你已经下定地狱了， 不要来了， 你已经沾上那个魔了。”他们一直这样相互诋毁， 直到有一天早上， 蒋扬钦哲讲课的时候，在法 台上说： “师兄们， 我今天是不是更加庄严了？”大家都问： “为什么呢，上师？”他说： “那个多钦哲融入到我的心间了。”大家一听都紧张了，“啊， 那个魔怎么会融入到您的心间了？上师您是不是生病了？”他说：“不是， 他是我的化身， 现在化身融入到我的心间了， 其实我们俩是一个人。”这一说大家都后悔了， 上师说过多钦哲很多坏话， 他们也跟着讲了很多 坏话。接着他们问： “上师， 我们该怎么办呢？我们造下很多口业了。”蒋扬钦哲斥责道：“我什么时候让你们说的？ 我说是我自己有把握， 你有吗？什么时候让你们说的？活该！” 所以， 大德们的这种游戏啊， 我们众生是看不明白的， 很团结的不一定团结， 很糟糕的也不一定不好。我们该做的是什么呢？ 就是普遍地尊重他们， 只要是个出家人， 只要是个修行人， 都要恭敬， 应该这样做。 但是， 如果你要去求法， 就必须选择了， 这是释迦牟尼佛给我们的权利。你要跟随他， 要当他的弟子， 就必须得观察。成为弟子之前叫“观察”， 成为弟子之后不叫“观察”， 叫“邪见”！所以， 之前你要观察好，他的人品怎么样， 闻思怎么样， 修行怎么样， 口碑怎么样， 一定要看好，看好以后你再跟他学，不要盲目去学。这是我们需要做到的。 少沾那些坏习惯 还有， 只要是个修行人， 少沾烟、酒这些对修行不利的东西。少沾啊， 不能说完全不沾， 你还要生活、吃饭， 还要养孩子， 但是有办法的情况下尽量不要去沾。烟养活不了你， 酒也养活不了你， 但是对你的孩子、后代和你自己的身体都没有好处， 既然没有好处就尽量少沾。有时候在单位， 领导逼你， 必须得敬一杯， 不喝就是不给面子， 面临着下课，这种情况我也不说什么，没办法，但是除此之外呢，少沾。 还有一些小的细节， 比如嗑瓜子， 瓜子可以吃， 但不要天天吃， 吃了耽误你的修行。吃瓜子好还是念咒好呢？ 你有吃瓜子的时间， 拿来念咒不是很好吗？ 搓"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/如何反观与自省", "title": "如何反观与自省", "content": "2013 年 01 月开示 如何反观与自省 ▶ 播放 师兄们， 我所讲到的六道的痛苦， 不是听了以后就像看电影一样，看完了就完了。大家回去后要思考： 如果自己到了那儿（地狱、饿鬼道、阿修罗道） 怎么办？ 自己的心态， 有没有去那里的危险？ 如果有的话，该怎么办？ 晚上睡觉前， 你要反复地想： 今天做的一些事情， 有多少是对修行有利的， 有多少是对修行没有利的； 有多少是尊重因果的， 有多少是不尊重因果的。 如果今天想修行的方面多一些， 你应该为自己高兴， 可以给自己一个赞叹：“龙洋活佛， 你今天做得不错， 明天再接再厉（ 提醒自己）！” 如果发现今天一天做的事情， 都让自己恶心， 那你得忏悔： “龙洋活佛， 你不应该这样做。作为一个人， 作为一个佛弟子， 口口声声说自己是有信仰的人， 不能不尊重因果， 不能没有道德的底线。明天开始，你要重新做人， 再也不犯这些错误， 甚至一些错误的念头也不要生起。” 每天晚上，大家好好想一想，这就叫修行。 生气的时候， 你要告诉自己：“龙洋活佛， 你错了！ 因为你跟别人不一样。没有信仰的人生气是正常的， 你生气是不应该的， 是丢人的。山着火了， 有灭火器； 心着火了， 有佛法啊！”要这样去想。心里生起特别大的贪念时， 你可以这样想：“我明明知道它不好的， 为什么要明知故犯呢？”这样想，这才叫修行。 不然的话， 盲目地混日子， 过一天算一天。用自己的念头， 把死亡推得很遥远， 把金钱、地位、名声抓得很牢固。如果这样， 那你的修行就走偏了。口口声声说修行，但做的不是，这叫走火入魔。 每天没有用的念头，没有价值的念头，堕入地狱的念头显现得太多，是修偏了。 师兄们修行的主要任务是什么？ 修行就是调整自己的心， 看自己 。修行是为了修自己的心， 不是为了挑别人的毛病。 不要说： 这个有毛病，那个有毛病……不要这样讲。自己有多少毛病， 自己怎么改， 这才是修行最需要做的。 我们要祈祷上师， 祈祷三宝： 让我有一颗清净的心， 总有一天， 我会生起一个对佛、对三宝永不退转的信心。现在可能还有一点差距， 但是将来我一定会做到。"}, {"slug": "上师开示/4.如何修行/4.2 做一个靠谱的人/新年第一天的发心", "title": "新年第一天的发心", "content": "2013 年 01 月开示 新年， 对修行人来讲是一个比较恐惧的时间。我们又少了一年， 离死神又近了一步。 回顾过去的一年里， 作为一个修行人， 我们该做什么， 不该做什么，总结一下。如果我们不该做的事做多了， 新的一年一定要改正。多做应该做的事，这是我们修行人的过年方式。 新年的第一天，大家要好好发心。 只要发心正了，吃饭、睡觉、走路都是修行。发心不正，你坐在山洞里，闭关九年也没用。所以， 大家好好地发心。发心正， 我们所有的事情就有方向， 有目标。没有发心的行为和思维就没有方向， 到最后自己都不知道干的是什么，为谁干的。 刚开始， 大家都认为是为了生存： 吃个饭， 穿件衣服， 找一栋房子。 就为了这么简单的一个发心， 在这个世界上挣扎。最后， 吃的也有了，穿的也有了， 用的也有了， 什么都有了， 再进一步做些事， 就不知道是为谁干的了。 但是我们有发心就不一样了。我们是为天下的父母去做事， 为天下的父母解脱去修行， 哪怕念一个咒， 动一个善念， 就是为了他们。有这样发心，我们活得就有价值。 要是不会发心， 就想： 上师怎么发心， 我就这样发心； 十方菩萨怎么发心，我就这样发心；文殊菩萨怎么发心，我就这样发心。"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/为什么要团结", "title": "为什么要团结", "content": "2013 年 01 月开示 一位上师给一个女弟子讲课。有一天， 他讲了修行的功德， 她听了很开心。又有一天他讲了不小心的话产生的罪业，她听了痛苦得要命。 然后，上师问：“你有什么感觉啊？” 她说：“上师我能说吗？” 上师说：“可以说。” “你讲修行功德的时候， 上师你当然去净土啦！ 感觉连我都没问题去净土， 但是你讲罪业严重性的时候， 我是肯定去地狱， 但我怀疑上师你也有危险。”（注： 如果一个弟子破了三昧耶戒， 整个坛城都会被污染，会连累上师一起下地狱。） 有条狗追一头猪， 要咬它。那个狗怕得要命， 然后它就绕着白塔跑啊跑啊。尾巴上有一个白灰， 一边跑一边摇尾巴， 尾巴上的白灰就打到了白塔上去了。因为这个福报， 它死后就到了天界当天人去了。它没有什么发心，也没有做什么。 但是如果你诽谤一个成就人， 即使你修了一千年， 你的修行功德一刹那就会没了。 我们在座的这些师兄， 肯定有去净土的。我们又不知道是哪一个，要是你得罪的这个师兄恰好是去净土的，怎么办？ （ 众师兄： 所以要团结！） 对了！ 最要紧的是在座的各位都是金刚师兄弟，如果不团结，犯了戒，后果就更严重了。 你们认为上师是去净土的， 因为他是我们的上师， 不一定哦！ 也许在座的里面， 你想不到的某个人， 他已经成佛了！你修行到一定的境界，你就知道了， 哪个修行好， 哪个修行不好， 哪个的罪业很重， 哪个罪业不太重， 有感觉的， 肯定有。我不是说我有这方面的感觉， 我没有， 但是优秀的修行人讲过他们有这方面的感觉。 有一次法王如意宝见很多僧众， 就是那些修行人。他们排着队一个个走（ 过去拜见法王如意宝）。法王天天念那个加持的念诵仪轨， 但是当法王的手一放到一个人的头上， 念诵停止了， 一下子忘了一样， 一切都消失了。后来法王如意宝说： 那个僧人的修行相当不错。我经常念的仪轨都让我停顿了。 你到山上去修， 修一阵子， 修的时间比较长一点， 不接触人。你一到人群里，你就会觉得人的味道太臭了，不要说业障的味道了！ 现在可能我到的城市太多了， 麻木了。以前根本不用别人说， 我们开车走到一个地方的时候， 我马上就知道附近有一个大城市。为什么？人的味道太猛了，真的！ 听他们说， 一生当中杀过很多孩子（ 指堕胎） 的人， 在上师的手下过的时候，就会有一种整个心灵的系统都要紊乱的感觉。 很多人聚在一起， 如果说这种人多， 这个时候就会有一种乌云一样的东西， 在上空飘。这是优秀的修行人的感觉， 是他们讲出来的。我不喜欢听这些。"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/入门的学处你做到了吗", "title": "入门的学处你做到了吗", "content": "2012 年 11 月开示 今天晚上我们讲一下皈依的戒律。其实皈依戒的细节有很多， 现在只是粗略地讲一下。在场的都是皈依弟子了，大概知道一下最好。 最主要的三条要求 第一条， 不杀生， 不能故意杀害生命。第一条， 不杀生， 不能故意杀害生命。有计划和行动的杀害行为， 才叫杀生， 无意当中杀死的不算。 六、戒律，决定你的成败 比丘戒所说的杀生， 对象是指人， 而皈依戒所说的杀生， 对象包括一切有生命的动物。因此， 吃饭、走路、坐车的时候， 都要注意。比如， 吃饭的时候就很容易造成杀生。为了吃一顿好的， 就点一些鲜活的动物，使它们因你而被杀， 这是千万不能做的！ 你们想想， 自己的生命有多么尊贵，如果别人要把你杀来吃，你的心情会怎么样？虽然动物的大小不同，但感受是一样的。它们也会痛苦， 也会恐惧， 也会生气。它们会想很多，前因后果都会想：“我什么时候得罪他了？ 我做错了什么？ 这个地球是大家共同的家园， 我没有占过他的地盘， 也没有用过他的任何财产， 他为什么仗着实力来杀我？”就这样， 仇恨在它心里产生了。杀了它以后，你会产生一个很大的业障， 同时这个动物也会堕入地狱， 因为它是在仇恨中断气的。所有在仇恨中断气的生命都会堕入地狱。这一切都是你造成的，要注意！ 第二条， 遇到生命危险也不能放弃信仰。你的信仰是什么？ 佛教。 粗略地想， 大家都会认为：“遇到生命危险也不会放弃自己的信仰。”但有时候很难做到， 不要说生命危险， 就是出现一个利益上的冲突， 你 都会放弃。举个例子， 你的上师是龙洋活佛， 你的信仰是佛教， 在单位上，假如一个不信佛的领导来问你： “你信佛吗？”你肯定会说： “我不信！”这就是放弃了自己的信仰， 就这么简单。再比如， 你去一个比较隆重的 场合， 受到大家关注的时候， 你知道他们对你信佛有负面看法， 当他们 问你： “你信佛吗？”你有可能说： “我不信！”这就是利益导致的问题。所以， 师兄们要仔细想想， 你真的能做到吗？ 每一次皈依的时候， 我都会很认真地问：“你能做到吗？ ”你也会很干脆地回答：“我能， 我能做到。”说这句话之前， 你考虑过你的回答没有？ 如果有一天， 一群人 要杀你， 比如说外道， 对你说： “如果你放弃佛教， 加入我们， 就不杀你。 如果不放弃， 就杀了你。”真的要杀你的话， 你会怎么选择？ 你有可能说：“好好好。”不仅舍弃了佛教， 还会加入别的宗教。像我这样的就有可能这么做， 我很了解自己。如果生在战争年代， 我肯定是个叛徒，因为我很胆小。所以， 每时每刻都要提醒自己： 必须有一个坚定的信心，我绝对不做这种事情！就像汽车要加油一样， 我的信心每一天都要加油。上师问你会不会放弃自己信仰的时候， 你说过“我不会”， 你也想过“我不会”， 但如果从此以后就忘了， 那就没用了。每天都要想到： 我是向上师宣誓过的， 我不会放弃自己的信仰， 这一点我一定要做到！ 不过是死一次嘛， 人反正是要死的， 死的方法不同而已。当然， 并不是每个弟子都会遇到这样的情况，但随时都要有准备。 第三条， 恭敬僧众。你既然皈依了僧宝， 那么所有穿僧衣的， 不管是汉传、南传， 还是藏传的僧人， 见到了都要恭敬。你不一定要去供养他、伺候他， 但是心里要恭敬他。不要以不太好的感觉去看这些僧人， 这对你自己不好。也不要用不太好的语言去说他们， 这样会折损你的福报。 他们穿上这身衣服， 就代表了三宝。他们的内心怎么样， 是他们自己的问题， 但外在就是佛的形象。我们至少得尊重这身衣服。所以， 不能骂他们， 不能打他们， 也不能坐在他们的前面， 应该恭敬他们， 这是我们皈依的戒律。恭敬佛，就要恭敬经书，包括黄颜色都要恭敬，这是佛的颜色，不能随意去踩， 也不能随意去坐。文字是佛的化身， 只要有文字的东西，不管是汉字还是藏文， 都不能用在不干净的地方。因为这些文字， 我们懂得了佛学知识，没有文字，我们无法知道这一切。 我们的“助伴”是谁？ 是僧众。皈依的那一天， 你说过：“我不会信外道。”外道， 我们不评论他好与不好， 这个跟我们没有关系。但是，我们的戒律是什么？ 最好不要和外道的人接触， 不在一起吃饭， 不住一个房间， 不和他们多说话。戒律是这样规定的， 但现在要做到真的很难，谁知道哪个是外道？ 其实除了佛教以外， 都是外道， 我们的周围， 全是外道， 没办法不跟他们说话。只要我们不去信仰， 不相信他们的话， 就行了。千万不能有一点点觉得：“哦， 他说的有道理。”这么一想， 就犯戒了。 当你去一个地方， 路过经堂， 或者看见佛像时， 至少得作个恭敬的姿势， 因为它们是佛的代表。你皈依了佛， 如果不恭敬他的代表， 等于不恭敬佛。所以， 至少心里要恭敬， 要低个头， 这是佛弟子须要做到的。 有的人理解得很片面：“信佛的人不是讲平等吗？ 应该全都一样恭敬， 不能有分别念嘛！”因此到处跑， 见到穿僧衣的人就拜， 见到穿僧衣的人就供养， 见到穿僧衣的人就皈依。其实他理解错了， 恭敬不等于必须当他的弟子， 你得考虑自己的容量。每一位大德都很好， 每一种法门也都很好， 但是你自己的容量、时间和实力够不够？ 要考虑好， 算个账， 不要漫无边际、像疯狗一样到处乱跑。很多弟子认为， 有一百位上师， 很了不得。但你有没有想过， 这一百位上师是怎么皈依的？ 藏传佛教的皈依是四皈依， 把皈依上师放在第一位。想一想， 皈依第一位上师的时候， 你有没有说过“我把身口意供养给你”， 也就是送给你， 靠你了。说了这个话， 你再去皈依第二位上师的时候， 是舍弃了前面的， 还是欺骗了后面的？ 两种都不对吧？ 上师再多， 如果舍弃了一位， 就相当于把所有的上师都舍弃了。舍弃一位上师， 还会有第二位上师吗？ 欺骗下一位上师对你有好处吗？ 只会给你带来业障！ 简单分析就知道不对， 为什么还要找那么多上师呢？ 你是不是有点不信任前面的上师？ 你可能下意识有一点点想法， 认为： 我还需要一个上师， 可能这个上师比那个还要好。这个时候，你就放弃了上师，甚至有可能放弃了信仰。 藏传佛教中， 有的大德有多位上师， 这是为什么呢？ 有可能是在自己没有想到的情况下， 上师让他们这样做的。比如， 我推荐哪个弟子去皈依某位上师， 他本身没有这个想法， 但是为了尊重我， 为了听上师的话而去皈依。还有一种情况， 因为要研究佛学， 所以每位上师的教言都得了解， 如果没皈依， 上师不会传， 不会全部告诉我。带着这种发心去皈依的， 和你一样吗？ 你研究了什么？ 你研究佛学， 有什么著作， 别人听说过没有？ 那些有一百五十位上师的汉族弟子， 没听说他写过一本对佛教有用的书。这种弟子， 从来没有听说过他请示了前一位上师：“我要去哪里？ ”大德们是怎么做的？ 是得到开许以后才去的。我们用常理来分析一下， 就算在一所一般的学校， 你要换学校， 需不需要跟学校的领导和老师说一声？ 如果不说就换， 你的行为算什么？ 你上学的时候，同时上一百个学校， 行吗？ 有的人说：“上师越多越好。”在学校里，专心跟着一位对我们有帮助的老师学习好， 还是跟一百位老师， 今天听一位讲， 明天听另一位讲， 这样好吗？ 每位老师的思维方法不同， 角度也不一样， 会把你搞得晕头转向。这些他们为什么不考"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/如何看待      他人的 “缺点 ”", "title": "如何看待      他人的 “缺点 ”", "content": "2010 年 11 月开示 我们生活在人间， 没有一个人是没有缺点的， 如果没有缺点， 那就是佛， 不会在人间。要是在人间的话， 就是为了度化众生而来的。只要是众生， 肯定就有缺点， 缺点重重才会在六道中轮回。即便他有一点点优点， 也值得我们学习， 值得我们惊叹： “作为众生， 他们竟然有优点！”哪怕只有一两个优点，也要看成是了不起的事情。 有缺点是正常的， 不要觉得“太吓人了， 咋会这样呢？”不能这样去看， 这是在人间。释迦牟尼佛说过， 在人间连针尖那么大的幸福都没有。众生都是在痛苦中挣扎。如果没有缺点，又怎么会有痛苦呢？ 所以多想想师兄们的优点， 比如他哪一天做了一些出色的事， 讲了一些动人的话， 哪个地方师兄弟们团结搞得好， 如何关心自己的师兄弟，如何恭敬上师， 如何努力地做功课。发现他有优点， 要觉得这才是真正稀有难得的：“太了不起了，怎么这么好？” 末法时代， 优点多的人很少， 缺点肯定谁都有。要是众生没有缺点，我这种装出来的活佛不算， 那些真正的活佛到这里来干什么呢？ 正因为众生有缺点，他们才来纠正，引导众生慢慢修行成佛。 所以， 有缺点不奇怪， 不要把它当成一个大事去宣扬：“哎呀， 昨天又出了什么事， 前天谁又做了什么， 大前天又怎么怎么样了。”不要这样去讲。众生有缺点是理所当然的， 没有什么大不了。如果这样去想，我们的队伍就会成为一个很优秀的修行队伍， 而且是一个很团结、很温暖的大家庭。修行要开心、要温暖、要包容、要团结， 没有这个基础根本就修不下去。所以， 大家好好地去修， 要多想想金刚师兄的优点， 不要去想缺点。 我们的修行团体是以虹身命名的。虹身是什么概念？ 名字很伟大，我们要对得起这个名字。即使今生成不了虹身， 来世接着修， 总有一天我要修成虹身！ 要有这样的决心。为什么要虹身成就？ 因为你们的上师是持明虹身金刚， 他培养出来的汉人也是大迁转虹身成就者， 你们为什么不是呢？ 我用这个缘起来命名， 我的弟子千万不要破坏这个缘起。我希望我的弟子里面， 至少有二十五个人成就虹身， 那不是很好吗？真的！"}, {"slug": "上师开示/4.如何修行/4.3 戒律，决定你的成败/戒律，修行人最大的要害", "title": "戒律，修行人最大的要害", "content": "2012 年 09 月开示 没有戒律，根本无法修行 今天我们讲一下师兄们的戒律， 我讲了很多次， 有的人认为讲这些对修行没什么帮助，但是没有这些根本就无法修行。 有的人认为， 虽然我不会打枪、不会开车，也不会开飞机， 但我能当军人， 似乎有这种感觉， 这可能吗？同理， 没有修行人的规则和制度，你根本就不称其为修行人。有的“上师”， 动不动就讲个大圆满或者什么菩提心， 再讲一些什么法的核心， 却忽略了一些最基本的程序。所以，不要以为天天讲的戒律， 只是一些做人的道理， 对修行有用吗？ 不要这样想。首先， 人都做不好， 根本不可能成佛。人都做不好， 怎么能成佛呢？ 比如， 我们经常吃的大蒜， 它的气味就算用各种香料掩盖， 也是盖不住的。人的本质跟这个一样，如果人品不好，什么都做不成。 所以， 修行人最大的要害就是“戒律”。谁的人品好， 他的戒律就会守得严严的， 不会破犯， 因为他说话算数， 说到做到。他不是骗子，不会撒谎， 所以能成为一个很优秀的修行人。如果你的人品不好， 说得再好听， 在上师面前表演得再好看， 充其量就是个演员而已， 根本就不是什么修行人。所以，首先我们得把刚才说的戒律把持好。 戒律是什么？戒律是修行人的生命， 没有戒律就像一个没有命的人，那是什么？是尸体， 不是人。从没有戒律的那一天开始， 你就不是修行人，只有一个修行人的壳子， 所做的一切都是给别人看的， 不是自己修的。别说自己成就， 也许你的所作所为， 还会影响别人成就。所以， 整个修行的来源、根本和命脉就是戒律。 最重要的两条誓言 出家人有出家人的戒律， 密咒士有密咒士的戒律， 我们居士有居士的戒律。作为一个修行人， 要清清楚楚地知道自己该做什么， 不该做什么， 什么允许， 什么做了对自己不好。其实， 密乘戒律有十万多条， 让我们一一接触是不太可能的， 特别是现在末法时代， 人心这么浮躁的时候， 不可能去了解那么多的东西。不过， 整个戒律中的最要害， 简单来说就两条。这两条戒律做好了， 你就是一个很好的修行人。这两条做不好， 你就算把整个《大藏经》____《甘珠尔》《丹珠尔》全部背下来，也没有用。鹦鹉也会说人话， 但是它不知道它在说什么， 道理跟这个一样。 这两条戒律是什么呢？“拉米莫方喇嘛格， 华登拉米土增巴利杂威东喔荣增巴德。”这句藏语是什么意思呢？ 就是： 让上师不高兴的事，我绝对不做， 这是第一条。第二条， 我的师兄弟们， 就要像对待自己的眼珠子一样去爱护团结。这就是戒律！ 如果有了这两条， 你大摇大摆地到哪儿都可以说： “我就是修行人！”如果没有这个， 你得好好想一想， 修了十年、二十年、三十年， 都没什么进步， 到底是为什么？ 就像用竹篮打水， 能打得起来吗？ 没有戒律的修行就像竹篮子打水， 天天打， 打完就没了。很多人不明白， 修了那么 多年咋会这样呢？ 那他们得考虑一下自己有没有戒律？ 没有戒律， 当然 不会有进步了。 五条根本的律仪 详细来讲， 再展开一点， 我们龙钦心髓的弟子是密乘弟子， 而密乘的根本戒律有五条： 第一条， 我绝对不会诽谤密法， 死也不会。这是一条， 不对密法产生邪见。 第二条， 恭敬上师， 孝顺上师。孝顺不是孝敬， 两者是有区别的，孝敬是你要尊重他，但是觉得不对的时候，也可以不用听； 孝顺是什么呢？ 就是要顺从上师， 听上师的话， 哪怕失去生命也可以， 要有这样的决心。 这条戒律要做到有点难！每一个弟子都认为： “我肯定听上师的话， 不可能不听。别的话我可以不听， 但上师的话不听， 我算什么？肯定听！”他会这样说。但是仔细一想， 他绝对没听上师的。举个例子， 你从皈依 的那一天开始， 要念金刚七句七遍， 莲师心咒二百遍， 不要间断。这是 上师亲口说的， 你听了吗？ 如果你间断了， 这叫听上师的话吗？ 还有， 最麻烦的是什么？ 上师说的话符合他的口味， 相应他的思维的时候， 他觉得很好：“哎呀， 上师今天说得太好了！ ”但是， 稍微有一点点不符合他的思维逻辑， 有一点点超出他自己画下的框架的时候， 他就不听。这叫听上师的话还是听自己的话？ 我觉得这不叫听上师的话， 这就叫作让上师听你的话， 颠倒了。从来都走不出自己的框架， 这能成就吗？ 不接受自己框架以外的东西，你找一个上师做什么呢？ 所以，这一条是比较难做到的。它的要求很高，比如，上师指着东，说： “这是西。”你必须认为这就是西， 不允许有一点点的思维： “这是东，上师说错了。”不能这样想。听上师话的精确度要达到这样。如果没有听上师的话， 对于这位上师来讲可能没有什么损失， 但是对自己的修行来讲， 是最大的损失。就如同把银行卡里的钱一次性刷完一样， 不听上师的话， 你的福报就一次性刷完了， 所以得注意。不要总认为自己是完全听了上师的话， 其实没听的地方太多了。那应该怎么做呢？ 就是要细心地去想， 细心地去改进， 纠正和挽救自己的这种行为。我们如同病人，上师如同医生， 想要治病， 却不听医生的， 能治好吗？ 所以， 好好地想一下， 如果做错了， 需不需要忏悔？ 如果为了自己的面子问题不忏悔，那你根本就不适合当修行人。修行都要看面子， 那一点点执着都放不下，还修什么呢？所以，要好好听上师的话。 第三条， 如心如目般去爱护自己的金刚兄弟。 同一个上师和同一个坛城的师兄弟， 要像对待自己的眼睛和心脏一样去爱护。自己的眼珠子，你平时是怎么爱护的？ 如心如目般去爱护自己的师兄弟， 你做到了吗？ 如果做不到， 就得改正和忏悔！ 有的人不但做不到， 甚至几个月、几年都不跟自己的师兄说话， 心里已经产生了很大的一个裂=, 还若无其事得意扬扬地去修行。我觉得这种人， 有点顽固不化。上师再三再四地提醒， 他听不进去， 始终认为自己是对的。像这种人， 真正让他去辩论、谈判， 他又说不出来什么， 但在自己最亲的、生生世世都离不开的师兄弟面前， 他倒装得很顽固。其实站在师兄弟团结的立场上， 没有什么“我对”， 只有“我错了”， 不允许有“我对”， 要记住这句话！ 这个不需要到法官面前去仲裁。师兄弟不团结的那一天， 没有任何理由可讲， 双方马上赔礼道歉， 双方念百字明或者《无垢忏悔续》， 去协调各自不对的地方， 协调完了， 就跟以前一样风平浪静。但并不是说你念一个： “嗡班匝萨捶萨玛雅， 玛呢巴拉雅， 班匝萨捶得诺巴， 迪叉哲卓美巴瓦……”我给你忏悔了， 之后转过背却说：“呸！”这样行吗？ 嘴里不说， 心里这样想， 行不行？这叫忏悔吗？忏悔完了以后仍然没有变， 这叫忏悔吗？ 这叫演戏！ 所以大家得好好想一下。我说过， 没有原因， 不能讲条件， 你只要对师兄弟们讲条件的那一天， 你就不是好的修行人， 你连这一点点忍辱都修不了， 对自己的师兄弟都放不过， 那你对别人怎么修忍辱呢？你自己修行的“命”都保不住， 你还修什么行？ 所以今天又说了一次， 师兄弟们一定要团结。 第四条， 本尊心咒的念诵和观想每天不间断。 比如，莲师心咒一天不少于二百遍， 不能间断。此外， 每一天观想莲师的形象三次， 或者想上师三次。简单地讲， 你好好地、完整地， 以清净的心态去想上师三次，这也叫观想。佛的形象观不出来， 那每天想上师一次， 这个能做到吧？观想时可以念一下“上师知……上师知！"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/供养  需要注意这些", "title": "供养  需要注意这些", "content": "功德的关键在于发心 供养的功德不在于钱的数目， 而在于发心。有时候， 供养两块钱就能为自己带来很大的福报。而有的时候， 供养几千万， 甚至付出了自己的一切却白费了。所以，学佛的人应该了解一下供养的程序。 首先， 不能认为“不需要做供养”， 也不能这样讲， 否则可能会断掉别人福报的来源， 但佛教讲的“供养”， 完全是自愿、自发的。现在这个时代有很多供养的方法， 比如有的上师讲法、灌顶的时候， 或者做各种形式的火供、荟供的时候， 可能会让弟子掏一万块钱， 或者多少多少，但这样的供养有可能白费， 因为这种供养不是出于自愿，他自己没有发心。 也许是上师、师兄们说了很多， 他不得不听， 碍于面子才去供养， 这种供养就不能称为真正的供养。 还有， 现在很多朝山拜佛的地方， 门票多少钱， 进去烧一个高香多少万， 第一炷香多少万， 这种肯定是迷信。在佛的心态里， 没有这样的概念： 你给我点了很大的香我就理你， 小小的一炷香就不理你。不可能！佛的境界是什么样的？就像太阳一样。太阳自然散发热量传递到地球上，照射每一个角落。但太阳不会想：“我一定要把万物养育起来。”它没有这种心态， 没有这种念头， 但是它自然会有这样的能量发出来， 从而办成很多事情。佛的这种状态跟太阳差不多是一样的。所以， 用这样的方法去捐钱不太好。 什么人有资格接受供养 今后你们还要注意， 哪一位上师主动去掏你们的腰包， 那肯定是违背佛法的， 肯定是不符合规矩的。释迦牟尼佛很清楚地讲过， 修行人里面，谁能接受众生的供养， 谁不能接受众生的供养。第一种， 达到了像虚空一样的境界不动摇的时候， 如果别人自愿， 就算供养一座金山， 他也容 纳得了， 对自己没有任何的害处， 对别人也不会有； 第二种， 是清净的比丘， 至少没有破坏过比丘的十七条戒律， 这样的比丘， 拿当天的供养完全没有问题， 也就是今天的供养今天拿、明天的供养明天拿。除了这两种人以外， 谁拿了众生的供养， 谁就得下地狱。所以， 你们想供养的话， 必须要找准目标： 第一是成就者， 他有这个能力去接受供养； 第二，戒律清净的比丘，也可以接受你的供养。其他的人是不行的。 怎么去观察一个人是不是真正的成就者？ 他内在的境界你是看不到的， 但是有个标准：“希索索塔洛里他东塔巴”， 是说从外在来看， 他很注重戒律、很在乎戒律；“朗香秋森会森给哟”， 随时随地都有不造作的菩提心；“桑吉若阿朗朗旺杰”， 这说的是内在， 我们看不清楚，是说圆满次第和生起次第就像他的筷子一样可以运用自如， 这就叫作大成就者。那我们怎么去判断他有没有真正的、不造作的菩提心呢？比如，有人摔倒了， 他跑过去扶起来。如果这么做是为了得到别人的称赞， 说他是个好修行人， 那就不是真正的菩提心。一个人有没有慈悲心， 跟他相处时间长了就能看得出来。如果他对谁都像对待自己的亲戚朋友一样，那这种人有可能有菩提心。相反， 谁对他好， 他对谁就像亲人一样， 谁对他不好， 他对谁又像敌人一样， 态度反差很大的话， 我觉得值得怀疑。 然而， 即使像我刚才说的这种大成就者， 也不能要求“供养、供养”。供不供养取决于你们自己。上师可能会讲， 如何做有功德， 如何做对你不好， 把道理讲清楚， 至于如何选择是你自己的事。千万不要信那些天天化缘的： “今天我要修塔， 你们想不想做有福报的事？ 明天我要建经堂了， 你们做不做有福报的事情， 这个对你很好……”信这些话， 还不如把钱拿去吃得饱饱的、穿得暖暖的好呢。 一后悔，功德就没有了 还有一种情况， 有时候一冲动，“我什么都不要了， 我要学佛， 要把所有的一切供养给上师。”把所有的财产供养完以后， 过一两个月，他就后悔了， “哎呀， 我也需要钱啊， 当时为什么这样做呢？”他一后悔，供养的功德就都没有了。所以，这种一时冲动的供养千万要小心。 还有的人，供养以后还放不下他供养的东西，像间谍一样去跟踪追查： “我的东西现在在哪儿？ 又到哪儿了？ 又到哪儿了？ ”你有什么权利追查呢？你一追， 你的功德就没了。你的东西已经供养了， 就不属于你了，你有什么权利说这个话呢？ 但有的人会这样做。有的人供养了一件东西后， 就会说：“上师， 我供养给你了， 但是不允许给别人用， 不允许用到别的地方， 只能用在你的身上。”上师可能会说：“好好好， 我不会的。”就算上师答应了也是假的。上师也是无常的， 就算他不想给别人，等他圆寂了，这东西不也是别人的吗？他带得走吗？ 所以大家要好好想想。供养本身是很好的， 如果因为自己的某些做法把功德毁了， 那就不好了。比如说， 今天我有一百块钱， 想给上师供养一块钱， 对我来说不多， 对我的吃穿也没影响， 但如果供养给上师，福报就不一样了。这样供养出去后， 你也不会后悔。所以要考虑好， 我能不能做这个供养？我有没有这样的实力去供养？这是最关键的。 我的这些弟子供养后从来都没有后悔过。但我看到过别的上师的弟 子， 供养了以后， 说过很多这样的话：“哎呀， 我当时供养了很多， 可惜了， 我不应该那样。”“哎呀，我供养了多少多少钱，最后我发现他拿去买车了。”你供养上师的时候， 也没说过不能买车啊。“哎呀， 我给上师供养了多 少多少钱， 结果他拿去跟好多弟子吃饭去了。”最后后悔了， 那真的不好，还不如不供养。 供养的种类与方法 供养其实有很多种， 最好的供养是什么？ 是法的供养。法的供养是什么？ 就是好好去修行， 你的境界达到了一定的层次， 这就是上师最满意的事。法的供养是最最高的供养。第二是身体的供养， 就是把你的身口意供养给上师， 这一生由上师来做主。第三才是财产的供养。所以我觉得只要是一位好的上师，他到一个地方去弘法，发心肯定不是为了赚钱。他最主要的目的是让大家好好学佛， 学佛的人越多越好， 成就的人越多越好， 这才是他主要的工作， 不可能是为了钱。如果一位上师的言行举止、所作所为都是为了钱，那作为弟子真的需要考虑考虑。你可以从头想一下：我跟了上师多少年， 他亲口向我要过钱吗？ 如果有， 要么这位上师特别信任你，要么就不是一个好现象。所以，供养的时候千万要注意。 还有很多人会问， 加持最大的供养是什么？ 供养到哪儿最好？ 我们整个宇宙里，福报最大的供养，第一是供养给上师，第二是修建佛塔、经堂，第三是供养僧众， 供养他们能够马上用得上的东西。这些供养的福报，当场就可以实现。 还有的上师， 为了试探弟子、调教弟子， 会拿弟子很多钱。但这种上师你能看得出来，他到底有多爱钱，家里有什么东西，对钱的执着大吗？ 如果他根本就不喜欢钱，要你的钱干什么？ 比如我的一个姨妈， 她有很多钱， 牛羊也很多， 又是单身， 但她抠门得要命。吃饭的时候， 必须得去别人家里吃， 舍不得吃自己的， 真的。藏族人是很好客的， 到别人家里去， 谁都会让吃。“干吗不去吃呢， 我又不用花钱。”今天吃完这家， 晚上又想明天去哪里吃。让她供养一下，肯定不答应。只要听到哪里不用供养， 她就跑到那里去接受佛法。一旦听到哪位上师接受了弟子多少多少供养， 她就不去了， 因为舍不得供养。 我的舅舅一直劝她说：“这么多财产你一个人能用多少呢？ 你又没有后代， 死了以后， 这些财产能干什么？ 你应该供养给自己最有信心的上师。”但她不想供养， 说：“我有"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/坚固的信心从哪里来", "title": "坚固的信心从哪里来", "content": "2017 年 01 月开示 信心来自于福报 修行说复杂很复杂， 说简单也很简单。复杂就是学闻思， 这个要学很久。说简单也简单， 上师的一句话、一个眼神、一个动作， 就可能让你成就。 为什么有那么大的差距呢？ 这取决于信心和个人的根器。所以， 我希望所有的师兄都成为后者， 上师的一个眼神、一个动作就能让你成佛。我不希望师兄们学了三四十年， 甚至五十年以后， 还只是一个佛学的研究者， 这个我不希望啊。所以， 师兄们要记住， 信心是最重要的。信心来自于哪里？ 来自于福报。所以， 要积累福报， 充实自己的信心， 这是最重要的。 其实佛教修行的道理， 从玛尔巴洛扎和米拉日巴这两位祖师的历史就可以看到。不一定上师的所作所为很如法， 弟子才能成就， 也不一定弟子的行为很如法才能成就。你们可以去看他们的事迹， 这方面的内容有很多。米拉日巴和玛尔巴洛扎第一次见面的时候， 玛尔巴洛扎正在田里种地。玛尔巴问他： “你对我有信心吗？”米拉日巴说他有绝对的信心。 “如果你有信心， 就把这壶酒给我喝掉。”酒壶是牛角做的那种， 里面的酒大概有两斤。米拉日巴毫不含糊， 一下就喝完了。喝了以后， 稍微有点晕。这个时候， 玛尔巴跟米拉日巴说：“你现在的第二个任务， 是把我该种的这些田地全部种完。”米拉日巴二话没说就去把地都种完了。 其实你想一想， 按照佛教的闻思来讲， 喝酒符不符合佛法？ 显然是不符合的， 种田就更不用说了。但正是因为这样的缘起， 才产生了那么伟大的利益众生的弟子。因为第一次见面有这样好的缘起， 就有了噶举法脉这么好的一个传承。其实你看， 一个缘起，很简单的。 我这一次去了果洛州， 一路上都是雪， 天气非常寒冷， 达到零下23℃。但在这么冷的天气里， 很多藏族人， 骑着摩托， 很开心地往一个方向赶。刚开始， 我觉得这些人真的是太厉害了， 怎么不怕冷啊？ 后来我发现， 原来是他们寺院在开法会。是信仰的力量让他不觉得冷， 觉得开心。如果师兄们到现场去试一试， 就知道天气有多寒冷。但是， 寒冷的痛苦被自己的信心掩盖了。就这么一个举动， 让我都觉得：“啊， 信仰真的很伟大！”只要有了信仰和信心， 什么都能做得到。这是我这一次的发现。 积累福报的主要方法 总而言之， 再说一次， 修行人需要的是坚固的信心！ 坚固的信心来源于哪里？ 来自福报！ 我们有各种各样的方法可以积累福报： 第一个是放生， 第二个是做荟供， 第三个可以服务师兄， 第四个可以用文艺表演来供养师兄， 让他们开心。可以拜见上师， 也可以承侍上师， 还有很多法会可以参加。总之， 积累福报的方法有很多。这些修行程序都是我们做得到的，没有一样是各位做不到的，只是你愿不愿意去做而已。 师兄们一定要努力为自己积累福报。我们已经进入了佛门， 已经发誓成为三宝的弟子， 也发过愿将来一定要成为利益众生的机器人。所以，一定要坚固信心啊， 师兄们！ 我也看见过有些师兄， 今年像个佛一样，明年像个鬼一样， 不要成为这种人。这样对自己不好， 对上师没有什么，对别的师兄也没什么影响。但是， 你的行为造成了自己的堕落， 这个不是太好。 所以， 对各位再强调一次， 信心， 信心， 信心是最重要的！ 和上师成为一体， 上师在想什么， 上师在做什么， 你也能想得出来， 你也能做得出来的时候，大概你就已经快要成佛了。"}, {"slug": "上师开示/4.如何修行/4.4 处处离不开福报/如何提高供养回报率", "title": "如何提高供养回报率", "content": "2013 年 11 月开示 供养，其实是给你们机会 每一次宣传功德的时候， 很多人就会认为：“哎呀， 太烦了！ 天天说钱、钱、钱”，“这里又要捐钱， 那里又要捐钱”，“这里又要做什么事， 那里又要做什么事”。多听几次就烦了， 好像都快背叛佛教了： “我受不了了，不要在我耳边讲什么功德不功德了！”有些人会有这样的心态。其实有这种想法的人不会做什么了不得的功德， 最多为了 50 块钱就会说这些。 这些宣传功德的师兄们为什么不顾一切地去宣传这些呢？ 是为了大家能够有一个积累福报的机会。所以， 才“不要脸”地说很多次。 对于还不太了解佛法的人来说是有点“不要脸”， 但是当我们对修行有了正确的认识， 了解了佛教的一些观念以后， 就会知道他们所做的一切是为了一项很伟大的使命，没有什么“不要脸”的。 但对有些人， 根本就不敢提“功德”这两个字， 也不敢提“供养”这两个字。在他们的心目当中， 除了自己以外， 其他人， 包括他的上师，越穷越好， 穿得越破越好， 住得越烂越好， 哪怕在山洞里饿死了， 他也觉得很伟大。这种心态的人太多了。这么没有福报的弟子， 能修得出来成果吗？ 修行起码要修圆满， 身、语、意、功德、事业， 这五个不齐， 怎么能成佛呢？有的人说什么“我要成就，但是不要跟我提供养”。就像一个人，五脏六腑不全， 只能叫残疾人。“我要做人， 但是我不要眼睛”， 或者， “我要做人，但是我不要脚”，行吗？供养，其实是给你们的机会。 有好吃的，我第一个想到的是师父 我给你们讲几个自己的例子， 不带水分的。不知道为什么， 我从小很喜欢机械， 比如说车、手表、收音机、录音机、摄像机这一类的。但光喜欢没用， 那个时候买不起， 只是想想而已。我的一位上师叫色拉阳智活佛， 他可能有神通。我曾经特别想要一只手表， 有一天去了他那里，他把那块手表拿了出来， 问我：“活佛， 你喜欢这个表吗？”我很不客气地说： “很喜欢。”他一下就把手表取下来， “来， 喜欢就送给你。” 我当时不太懂。表上有三个角， 表里有三个圆圈， 都是黄色的。当时还不知道是黄金做的。我高兴极了， 就好像一刹那得到了全世界的财富一样， 高兴得不得了。回到五明佛学院， 我天天看， 晚上睡觉的时候在被窝里搭帐篷都要看， 它还是夜光的。每次大家一起修行、吃饭的时候，我总是第一个到， 因为要晒一晒手表……反正， 我从头到尾的财产里面，最喜欢的东西就是它。 有一天， 法王如意宝讲了做功德的一些伟大之处。其实我这个人是很不容易感动的， 但不知道为什么， 突然感动生起一个清净的信心， 有想哭的感觉。我就觉得，“哎呀， 法王如意宝对我们太慈悲了， 但我们却没为他做什么。”在这种感动的状态下， 我把手表摘下来，“嗒”一下子甩了上去。然后赶紧做了回向， 以免过会儿心态反悔。就这样供养给上师了。供养给上师没几天， 一直到现在， 我的手里都没有断过名表。 这是事实！我从来没有向别人要过， “给我买个好表嘛， 我很喜欢表的。 真的没说过这样的话。但时不时就有人会说： “上师， 我送您块好表吧。”现在也不想这些东西了， 不知道是生理疲劳了， 还是太多了。但是表仍然不断有人送来，没办法，已经有这个福报了，挡都挡不住，真的。 第二个例子。我从小经济条件不太好， 但是， 有了好吃的， 我第一个想到的是给上师。上师吃了以后， 要是送给我， 我才自己吃。后来，不知不觉地想吃什么就来什么， 本人的战斗力也超强， 结果一度吃成了270 斤的身体， 不过， 也是为了满愿供养者吃成这样， 算是工伤， 我喜欢。还有就是在那个时候， 羊羔皮是很稀少的， 对藏族人来说， 能够穿上羊羔皮衣服的话， 就是贵族了。当时阿克益西他们那边羊最多， 送了我一件羊羔皮的衣服，很漂亮！我当场就供养给了法王如意宝。那一年的冬天，法王如意宝穿的就是我供养的这件羊羔皮衣服， 很多照片上都有， 虽然我自己在寒冷的冬天没有保暖的衣服， 但是再冷心里都是暖暖的。从那以后我各种样怯的衣服堆成山了， 不要说穿， 送都送不完。伺候过我的弟子有目共睹。 我自己家里的一些佛像， 或者好一点的东西， 可能没有多值钱， 但是我都供养了。我裸供了五六次。现在的我， 有了这样的福报， 真的是不愁吃、不愁穿不愁花， 没有很辛苦地去找什么钱。在大德当中， 我不算超有钱， 但是都传： “龙洋活佛最有钱。”虽然现今不太适合这样的传言，但这个口碑也是福报得来的吧。在师兄们清净圆满的发心协助下， 恩师历代多智钦的驻锡地， 龙钦心髓的祖庭多智钦寺得以恢复和重建， 这个伟大而机会难得的使命降临在我的肩上陆陆续续得以完成。这些都是当时我的发心和实际行动得来的。 以前几次师公回来， 我心里想给师公订一个好的酒店， 但那时没有这么好的条件。当然， 师公也不喜欢住什么总统套房、五星级酒店。在他的心态里面， 安逸 158 和总统套房都是一样的。但是在我的心态当中不一样。所以后来我有条件的时候， 我觉得， 师兄们给我的供养， 我自己也没有什么能力来享用。如果这些钱花在师公身上， 也算对得起大家。所以， 上一次师公回来， 我就在富豪首座酒店订了三天左右的总统套房。我确实有这个发心，但资金是很多师兄帮助提供的。 你们的师公入住的时候， 一进来就说： “这么大的房间， 干什么呢？”我说：“上师， 见客人要大一点的房间， 地方小的话没办法见呐。”然 后师公问我： “多少钱一晚上？”我就说了。他一听就说： “马上退掉， 不住了， 浪费钱， 不住了！”为了珍惜这个机会我很迫切， 所以我就跟上师撒谎了， 其实这是不应该的， 我说：“我已经把钱全部打进去了，你现在走了钱也拿不回来。”师公就说： “啊？有这个道理吗？”我说： “有。”每一次客人来的时候， 师公都说：“其实我是不愿意住的， 但是钱已经打进去了。” 我就这么给师公安排了总统套房。从此以后， 去很多地方， 师兄们都请我住总统套房。当然了， 这是师兄们对我孝顺。在这之前， 我从来没住过总统套房。有很多次， 无缘无故有人请我吃饭， 还让我必须住一夜，不知怎么就开了个总统套房， 当时还不是我们的弟子。别的地方也有很多次， 莫名其妙就开了总统套房。我就想：“为什么会这样呢？”转念一想： “哦！ 是那个功德！ 给自己的上师安排了总统套房， 可能就有这样的效果。”这是我自己的亲身体会。 供养时，别夹杂太多复杂因素 师兄们， 因果不虚啊！只要发心正了， 没有任何附加条件地做供养，回报率就会这么高。但是你供养的时候， 如果夹杂了很多复杂的因素，钱可能就白费了。什么样的复杂因素呢？ 第一个， 其实你自己是不愿意的， 因为觉得不好意思， 才供养了很多。这样可能对你没有什么好处。 第二个， 你是为了办一些自己特殊的事情， 出于一个自私的想法去供养。这样的供养不能说没有好处。有，但是没有那么快。 第三个， 有的人供养时既没有什么信心， 也不了解佛法， 但是“有点喜欢你”， 就给了很多钱。这种供养不要说有功德， 可能后果还很严重。为什么？ 因为刚开始你是以喜悦的心态去供养， 到最后满足不了你的要求的时候，又会有嗔恨心。那不是毁掉了自己吗？ 所以， 供养要在自己力所能及的范围以内， 供养过后不要后悔， 不 是为了别人说你好， 也不是临时抱佛脚， 解决自己的急"}, {"slug": "上师开示/4.如何修行/4.5 修行也要有规划/做 一个真正的修行人", "title": "做 一个真正的修行人", "content": "2013 年 10 月开示 修行也要有规划 师兄们， 你们做功课要精进一点才好啊！ 到现在很多年了， 完成功课的师兄好像很少。你们的上师心很软， 给你们布置的功课比较少， 但是直到现在， 功课让我满意的， 最多只有十个人， 这方面我不会冤枉你们，甚至还有师兄从来没有向我交代过功课的情况。很多师兄没有向上师汇报过修行中的心态变化情况， 也没有告诉过上师自己将来怎么打算， 也没有告诉上师会以什么样的发心去修行， 也没有在上师面前许过愿： “我一定要做一个，起码得这样的修行人。”没有！ 每一个修行人起码得有一个自己的规划： 进入佛门后， 最低限度应 八、修行也要有规划 该做到什么样。建房子也要有规划： 房子建成什么样？ 何年何月完成？完成的时候质量怎么样？ 都要有规划。上学也是如此： 上多少年？ 上什么样的学校？ 毕业以后想做什么？ 当飞行员、当兵， 还是当官等等， 都要有自己的目标。那么我们这些修行人呢？成佛可能是大家共同的目标，这个目标对我们来说比较遥远， 但不能因为遥远就不做， 中间还有很多不同层次的修行程序， 也应该有自己的目标。比如，“作为佛教弟子，我起码得做到不撒谎”， 或者“我起码得做一个不喝酒的弟子”，“我起码得做到不杀生， 这辈子， 就算遇到生命危险也不杀！”这些只是打比方啊，对佛弟子来说，这些都是小事，必须做到。 “这一生当中， 我起码得帮三个人”，“这一生当中， 我可能不能让一个人成佛， 但起码能让一个人高兴”。还有， “其他我可能做不了，但起码我这一辈子要让上师开心”。有没有这样的决心？ 师兄们可能在心里已经默默地说了， 只是我没有发现。上师没有神通啊， 只能当面说了才记得住。有时候记性不好，当面说了还会忘呢！ 大家都要准备一下， 不然的话， 可能我们在“佛教学校”上了一辈子学， 毕业的时候却交不出答卷， 没有毕业证， 哪个净土都不收你， 因为你没有“文凭”啊！ 所以， 师兄们想要取得好的修行成绩， 必须要有自己的规划。比如阿克益西， 他跟了我二十年， 起码能做到念一个亿的心咒。别的事情他可能做不了， 比如修行很高、慈悲心很大， 这些很难。但是他能做到念一个亿的心咒， 这是他的发心。再比如阿克瑞秋，“别 的我做不了， 但是上师， 我起码一天至少得念一万遍护法。除非我生病了或者死了， 那没办法念， 但是除此之外我是会做到的。”这样就比较好， 就是要为自己定目标， 养成这样的习惯。如果你实在什么都做不了， 也可以发愿： “上师， 我什么都做不了， 但是我发誓永远不会背叛佛教。”这也是让上师开心的一件大事。我们无法预知将来会有什么降临到自己 的头上， 开心、痛苦、恐惧、饥饿等等， 喜怒哀乐什么都可能会发生， 都是无常的。但不管处于什么状态， 遇到什么不开心、纠结的事， 都不会放弃自己的信仰。有这么个坚定的信心， 也不错。我相信在座的弟子们会有这样的准备。 上师自己在佛教团体混了几十年， 什么都没做到， 只能说是混。闻思没学好， 实修也不太好。但是我发过愿， 即使做不了什么， 但我一定要让上师开心。到现在来说， 还算及格， 不敢说百分之百让上师开心了，那也做不到， 但如果打分的话， 应该能及格。如果问法王如意宝：“你的弟子龙洋怎么样？”他会说：“还是很可爱的， 嗯， 对对对。”问师公第四世多智钦：“你的弟子龙洋怎么样？”他也会说：“还可以， 还比较可爱。”会这样说。他们不会说 “很伟大、修行很高、不得了”之类的， 但是可能会说是很可爱的。所以， 师兄们也要成为这种弟子。有人问你的上师：“龙洋活佛，你的某某弟子怎么样啊？”“嗯，很可爱的。”（上师大笑） 能做到这样就不错了。师兄们要努力地去做， 不要让上师烦心，也不要让你的师兄烦心。要是师兄看到你的时候心想“哎呀， 他又来了！他怎么又出现了呢？ 讨厌！”这样的话， 你的修行是比较失败的。要是每一个师兄弟看到你的时候很开心， “啊！你来啦！大家一起去喝个茶、嗑个瓜子嘛！”能做到这样，就说明你修得还不错。 要有“一根筋”的精神 师兄们要向这个方向发展。从今天开始， 自己就要发心。其实应该发大心、发大愿， 但如果最后做不到， 也是个麻烦事。所以， 你要想一想，什么是自己能做到的。“这个我可能做得到，我一定要做到！”发了愿以后，就再也不要反悔了。我们有一个毛病是什么？就是热情一来，什么都能做，但过几天， 情绪低落的时候热情就没了。再加上上师十天不理你， 那就更没了。那是不行的。不管上师把你踩在脚下一年， 两年， 三年， 你仍然坚持， 那才是真正的修行人。不然的话， 上师天天哄着你： 渴了， 给你倒杯水； 饿了， 喂你吃口饭； 不高兴了， 上师给你说说笑笑； 你辛苦了，上师得背着你……在这种状态下你才开心， 这不是修行， 这像谈恋爱。要成为弟子， 什么样的风浪都要经得起， 什么样的坎坎坷坷都要受得住。 我讲过很多次， 以前那些老一辈的修行人， 他们经历过很多不同的考验， 很多。比如， 把一位比丘跟一个美女关在一个房间里， 美女的衣服全部脱光， 关在一起一个晚上、两个晚上。一般人肯定想，“啊， 我要还俗！ 马上还俗！”确实有这种事情。但人家想都不会想， 这就叫作信念坚定。 还有， 把一只羊捆在那儿， 有人掏出枪来指着你的头， 说： “你把那只羊杀了， 不然我就杀了你。”这不是开玩笑， 真的有过这样的事，你要是不杀的话， 就一枪把你打死。但那些修行人宁愿选择自己死， 也不杀羊，这就是坚定的信念。 以前， 我爸爸还给我讲过一件事情。他的一位弟子， 被人吊起来，手捆着， 背后还塞了很多很重的石头， 然后在他下面点火。烟熏火燎， 痛得要命， 他快要受不了。人家说“你只要说一句‘我不信佛’，就把你放下来。”但是他坚决不说。后来又吊了他两次， 第三次吊上去之前，我爸爸就对他说：“你心里不放弃就可以了， 嘴里不要这么硬撑了， 不然太痛了， 你受不了。”但是他说：“上师， 你不能这样说啊， 你教我的呀， 嘴上都不能放弃佛法。”为了这个， 他一句都不说， 最后被吊了整整三天。这就叫作信念，坚定的信念，这就叫作信仰！ 开心的时候， 吃饱穿暖的时候就有信仰， 一旦遇到麻烦的
